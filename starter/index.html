<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Submittal starter</title>
<style>
  :root{
    --ink:#0f172a; --dim:#64748b; --line:#e2e8f0; --rule:#cbd5e1; --bg:#fff;
    --band:#f8fafc; --head:#1f2a37; --headink:#fff;
    --sec:#fef3c7; --secink:#78350f; --sub:#f1f5f9; --subink:#334155;
    --ask:#fdf0d5; --askink:#854d0e; --got:#ddebfb; --gotink:#1e3a8a;
    --win:#d7f0db; --winink:#14532d; --bad:#b91c1c; --badbg:#fee2e2;
    --pick:#1d4ed8; --find:#fef08a;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font:13px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
    color:var(--ink);background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
  button{font:inherit}
  .btn{border:1px solid var(--rule);background:#fff;color:var(--ink);border-radius:6px;
    padding:4px 10px;cursor:pointer;white-space:nowrap}
  .btn:hover:not(:disabled){background:#f1f5f9}
  .btn:disabled{opacity:.4;cursor:default}
  .btn.go{background:var(--head);border-color:var(--head);color:#fff}
  .btn.go:hover{background:#334155}

  /* the two bars that stay put */
  #bar{display:flex;align-items:center;gap:8px;padding:7px 12px;background:var(--head);
    color:var(--headink);flex:0 0 auto}
  #bar b{font-size:14px}
  #bar .job{opacity:.85;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #bar .gap{flex:1}
  #bar .btn{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.25);color:#fff}
  #bar .btn:hover:not(:disabled){background:rgba(255,255,255,.2)}
  #bar .btn.go{background:#fff;border-color:#fff;color:var(--head);font-weight:600}

  #tabs{display:flex;align-items:stretch;gap:2px;padding:0 12px;background:#243041;
    flex:0 0 auto}
  .tab{border:0;background:none;color:#cbd5e1;padding:7px 15px;cursor:pointer;font-size:12.5px;
    font-weight:600;border-bottom:2px solid transparent}
  .tab:hover{color:#fff}
  .tab.on{color:#fff;border-bottom-color:#60a5fa;background:rgba(255,255,255,.06)}
  .tabsay{margin-left:auto;align-self:center;color:#94a3b8;font-size:11.5px}
  #find{display:flex;align-items:center;gap:8px;padding:6px 12px;background:#f8fafc;
    border-bottom:1px solid var(--line);flex:0 0 auto;flex-wrap:wrap}
  #find label{color:var(--dim);font-weight:600}
  #q{border:1px solid var(--rule);border-radius:6px;padding:4px 8px;width:260px;font:inherit}
  #q:focus{outline:2px solid var(--pick);outline-offset:-1px}
  #hits{color:var(--dim);min-width:92px}
  #marks{display:flex;align-items:center;gap:6px;margin-left:auto}
  #marks .lab{color:var(--dim)}

  #wrap{flex:1;overflow:auto;position:relative}
  table{border-collapse:separate;border-spacing:0;table-layout:fixed}
  th,td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);
    padding:3px 6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    vertical-align:middle;background:var(--bg)}
  thead th{position:sticky;top:0;z-index:3;background:var(--head);color:var(--headink);
    font-weight:600;text-align:center;border-right-color:#334155;cursor:default;
    user-select:none}
  thead tr.slots th{top:0;height:19px;font-size:11px;letter-spacing:.04em}
  thead tr.heads th{height:26px}
  thead tr.slots th.q{background:#2b3a4d}
  thead tr.slots th.q.qb{background:#35465c}
  thead tr.slots th.qt{background:#14532d}
  /* a quote ruled off from the one beside it, and tinted away from it */
  th.gs,td.gs{border-left:2px solid var(--rule)}
  th.ge,td.ge{border-right:2px solid var(--rule)}
  thead th.gs{border-left:2px solid #0b1220}
  thead th.ge{border-right:2px solid #0b1220}
  td.qa{background:#f7fafd}
  td.qb{background:#fdfcf7}
  td.qt{background:#f6fbf7}
  tr.odd td.qa{background:#eff5fb}
  tr.odd td.qb{background:#faf7ee}
  tr.odd td.qt{background:#edf7f0}
  thead tr.heads th.left{text-align:left}
  th .grip{position:absolute;top:0;right:-3px;width:7px;height:100%;cursor:col-resize;z-index:4}
  thead th{position:sticky}
  .froze{position:sticky;z-index:2}
  thead .froze{z-index:5}
  tr.band td{background:var(--sec);color:var(--secink);font-weight:700;font-size:13px}
  tr.says td{background:#fbfdff;white-space:normal;padding:7px 10px 8px 34px;
    border-bottom:1px solid var(--rule)}
  .said{display:flex;gap:10px;align-items:flex-start;padding:1px 0;max-width:1100px}
  .said b{flex:0 0 112px;color:var(--dim);font-weight:600;font-size:11.5px;text-transform:uppercase;
    letter-spacing:.03em;padding-top:1px}
  .said span{white-space:pre-wrap;color:var(--ink);min-width:0}
  .opener{border:0;background:none;color:var(--dim);cursor:pointer;font-size:12px;padding:0 5px 0 0;
    line-height:1}
  .opener:hover{color:var(--pick)}
  .fold{border:0;background:none;color:var(--secink);cursor:pointer;font-size:11px;
    padding:0 7px 0 0;line-height:1}
  .fold:hover{color:var(--pick)}
  .folded{margin-left:12px;font-weight:400;font-size:11.5px;opacity:.7}
  tr.sub td{background:var(--sub);color:var(--subink);font-weight:600}
  tr.odd td{background:var(--band)}
  tr.band td.froze{background:var(--sec)}
  tr.sub td.froze{background:var(--sub)}
  /* grey means not yours to type in */
  td.ro{color:#475569;background:#f1f3f6}
  tr.odd td.ro{background:#eceff4}
  td.starcell{padding:0}
  .star{border:0;background:none;cursor:pointer;color:#cbd5e1;font-size:13px;line-height:1;
    padding:2px 4px}
  .star:hover{color:#f59e0b}
  td.starcell.lit .star{color:#f59e0b}
  td.starred{font-weight:600}
  td.shutq,th.shutq{background:#eef2f7;padding:0;text-align:center}
  thead th.shutq{background:#2b3a4d}
  .qtog{border:0;background:none;color:inherit;font:inherit;cursor:pointer;padding:2px 6px;
    width:100%}
  .qtog:hover{text-decoration:underline}
  td.num{text-align:right;font-variant-numeric:tabular-nums}
  td.mid{text-align:center}
  td.on{box-shadow:inset 0 0 0 2px var(--pick);border-radius:2px}
  td.inrange{background:#eff6ff}
  tr.hit td{background:var(--find)!important}
  tr.hit td.froze{background:var(--find)!important}
  .tag{display:inline-block;max-width:100%;overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap;vertical-align:bottom}
  .dup{color:var(--bad);font-weight:700}
  td.ask{background:var(--ask)!important;color:var(--askink)}
  td.got{background:var(--got)!important;color:var(--gotink)}
  td.win{background:var(--win)!important;color:var(--winink);font-weight:600}
  .up{border:1px dashed var(--rule);border-radius:5px;background:#fff;color:var(--dim);
    padding:1px 6px;cursor:pointer;font-size:11.5px;max-width:100%;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap}
  .up:hover{border-color:var(--pick);color:var(--pick)}
  .have{display:flex;align-items:center;gap:4px;min-width:0}
  .have a{color:var(--pick);text-decoration:none;overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap;min-width:0}
  .have a:hover{text-decoration:underline}
  .have .x{border:0;background:none;color:var(--dim);cursor:pointer;padding:0 2px;font-size:13px}
  .have .x:hover{color:var(--bad)}
  .addrow{border:0;background:rgba(0,0,0,.06);border-radius:5px;color:var(--secink);
    cursor:pointer;padding:1px 8px;font-size:11.5px;font-weight:600;margin-left:10px}
  .addrow:hover{background:rgba(0,0,0,.12)}
  #edit{position:absolute;z-index:9;border:2px solid var(--pick);background:#fff;
    font:inherit;padding:2px 5px;display:none;border-radius:2px}
  #pick{position:absolute;z-index:9;border:2px solid var(--pick);background:#fff;
    font:inherit;display:none;border-radius:2px}
  #note{padding:24px;color:var(--dim);max-width:46em;line-height:1.5}
  /* the two lists that read themselves off the quote sheet */
  .pad{padding:18px 22px 60px}
  .pad h2{margin:0 0 4px;font-size:16px;color:var(--ink);font-weight:700}
  .pad h2.later{margin-top:30px}
  .pad p{margin:0 0 14px;color:var(--dim);max-width:62em;font-size:12.5px}
  table.list{border-collapse:separate;border-spacing:0;table-layout:fixed;
    border:1px solid var(--line);border-radius:7px;overflow:hidden}
  table.list th{background:var(--head);color:var(--headink);font-weight:600;font-size:11.5px;
    text-align:center;padding:6px 8px;letter-spacing:.02em;position:static}
  table.list th.left,table.list td.left{text-align:left}
  table.list td{padding:5px 8px;border-bottom:1px solid var(--line);text-align:center;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:var(--bg)}
  table.list tr.odd td{background:var(--band)}
  table.list tbody tr[data-go]{cursor:pointer}
  table.list tbody tr[data-go]:hover td{background:#eff6ff}
  table.list tr.tot td{background:var(--head);color:#fff;font-weight:700;border-bottom:0}
  table.list td i{color:var(--dim)}
  table.list td a{color:var(--pick);text-decoration:none}
  table.list td a:hover{text-decoration:underline}
  .chip{display:inline-block;padding:1px 9px;border-radius:999px;font-size:11.5px;font-weight:600}
  .chip.ask{background:var(--ask);color:var(--askink)}
  .chip.got{background:var(--got);color:var(--gotink)}
  #none{padding:26px 2px;color:var(--dim);font-size:13px}
  .firm{margin:0 0 26px}
  .firmhead{display:flex;align-items:center;gap:14px;padding:7px 12px;background:var(--head);
    color:#fff;border-radius:7px 7px 0 0}
  .firmhead b{font-size:14px}
  .firmsay{color:#cbd5e1;font-size:11.5px}
  .firmhead .btn.ask{margin-left:auto;background:rgba(255,255,255,.12);
    border-color:rgba(255,255,255,.3);color:#fff}
  .firmhead .btn.ask:hover{background:rgba(255,255,255,.22)}
  .firmsec{display:flex;align-items:center;gap:12px;padding:4px 8px 4px 12px;background:var(--sec);
    color:var(--secink);font-weight:700;font-size:12px;
    border-left:1px solid var(--line);border-right:1px solid var(--line)}
  .firmsec .btn.ask{margin-left:auto;background:rgba(0,0,0,.07);border-color:rgba(0,0,0,.18);
    color:var(--secink);font-size:11.5px;font-weight:600}
  .firmsec .btn.ask:hover{background:rgba(0,0,0,.14)}
  .howbar{display:flex;align-items:center;gap:8px;margin:0 0 12px;flex-wrap:wrap}
  .howbar .gap{flex:1}
  .how{color:var(--dim);font-size:12.5px}
  .how b{color:var(--ink)}
  .howbar .btn.on{background:var(--head);border-color:var(--head);color:#fff}
  table.list tr.lit td{box-shadow:inset 3px 0 0 -1px #f59e0b}
  table.list.tight{border-radius:0;border-top:0}
  .firm table.list.tight:last-child{border-radius:0 0 7px 7px}
  #say{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--head);
    color:#fff;padding:7px 14px;border-radius:8px;z-index:20;opacity:0;transition:opacity .15s;
    pointer-events:none;max-width:80vw}
  #say.up{opacity:1}
  #say.bad{background:var(--bad)}
</style>
</head>
<body>
<div id="bar">
  <b>Submittal starter</b>
  <span class="job" id="jobName"></span>
  <div class="gap"></div>
  <button class="btn" id="bUndo" onclick="stepBack()" title="Undo (Ctrl+Z)">↶ Undo</button>
  <button class="btn" id="bRedo" onclick="stepOn()" title="Redo (Ctrl+Y)">↷ Redo</button>
  <button class="btn" onclick="toExcel()" title="Build the same sheet as an Excel file">Excel…</button>
  <button class="btn go" onclick="leave()">✓ Done</button>
</div>
<div id="tabs">
  <button class="tab on" id="tabSheet" onclick="goTab('sheet')">Quote sheet</button>
  <button class="tab" id="tabVendors" onclick="goTab('vendors')">Vendors</button>
  <button class="tab" id="tabProgress" onclick="goTab('progress')">In progress</button>
  <span class="tabsay" id="tabSay"></span>
</div>
<div id="find">
  <label for="q">Find</label>
  <input id="q" type="search" placeholder="a mark, a section, a maker, anything on the sheet"
    autocomplete="off" oninput="runFind()" onkeydown="findKey(event)">
  <span id="hits"></span>
  <button class="btn" onclick="hop(-1)" title="Previous match (Shift+Enter)">↑</button>
  <button class="btn" onclick="hop(1)" title="Next match (Enter)">↓</button>
  <button class="btn" onclick="openAll(1)" title="Open what the spec says under every line">⊕ all</button>
  <button class="btn" onclick="openAll(0)" title="Shut them all">⊖ all</button>
  <button class="btn" onclick="foldAll(1)" title="Fold every section away">▸ sections</button>
  <button class="btn" onclick="foldAll(0)" title="Open every section">▾ sections</button>
  <div id="marks"></div>
</div>
<div id="wrap"><div id="note">Waiting for the job to come through…</div></div>
<input type="file" id="pickFile" style="display:none" accept=".pdf,.doc,.docx,.xls,.xlsx,.msg,.eml,.zip,.jpg,.jpeg,.png">
<input id="edit"><select id="pick"></select>
<div id="say"></div>
<script>
/* ──────────────────────────────────────────────────────────────────────────────
   The submittal starter, on the website.

   The same sheet everybody used to pass round as a spreadsheet, except there is
   only ever one of it and everyone is looking at the same one. It behaves like a
   spreadsheet on purpose — click a cell and type, arrow keys and tab move, copy
   and paste work, and there is an undo — because that is what the people using
   it already know how to do.

   It holds no ShareFile folder and no database of its own. The page that opened
   it does both: this one asks for a quote to be filed, or for a vendor to be
   gone with, and the Dingus does it and says what happened. That is deliberate.
   A vendor's proposal must never land anywhere near the submittal process, and
   there is one place that rule is kept.
   ────────────────────────────────────────────────────────────────────────────── */

var HOST = null;                 // the window that opened us
var JOB = { name: '', number: '' };
var LINES = [];                  // what the spec and the register came to
var ROWS = [];                   // what is drawn, a descriptor per table row
var ST = null;                   // everything anybody typed
var CAN_FILE = false;            // is a ShareFile folder loaded over there
var READY = false;

/* ── the shape of the sheet ── */
var FIX = [
  /* The star is a column of its own, the way a spreadsheet gives a row its own margin: it is the
     one thing you want to be able to hit without first landing on the line. */
  { k: 'star',   h: '\u2605',       w: 30,  star: 1 },
  { k: 'item',   h: 'Item',        w: 104, edit: 1 },
  { k: 'name',   h: 'What it is',  w: 300, edit: 1, left: 1 },
  { k: 'qty',    h: 'Qty',         w: 52,  edit: 1, num: 1 },
  /* The section a line is under is the band it sits in, said once — not repeated down a column.
     What it must meet is in what the spec says, under the line, where there is room for it. */
  { k: 'makers', h: 'Who the spec will take', w: 250, left: 1 },
  { k: 'note',   h: 'Notes',       w: 230, edit: 1, left: 1 }
];
var SLOT = [
  { k: 'v',    h: 'Vendor',     w: 150, edit: 1, left: 1 },
  { k: 'p',    h: 'Price',      w: 92,  edit: 1, num: 1 },
  { k: 'lead', h: 'Lead (wks)', w: 74,  edit: 1, num: 1 },
  { k: 'f',    h: 'Quote / submittal', w: 166, file: 1 },
  { k: 'st',   h: 'Where it stands',   w: 146, pick: 1 },
  { k: 'n',    h: 'Notes',      w: 170, edit: 1, left: 1 }
];
var TAIL = [
  { k: 'chose', h: 'Going with', w: 150 },
  { k: 'cp',    h: 'Their price', w: 92, num: 1 }
];
/* The slot columns that hold a number rather than words. */
var NUMKEY = { p: 1, lead: 1 };
var ASK = 'Request from vendor', GOT = 'Received from vendor', WIN = 'Going with this one';
var STATES = ['', ASK, GOT, WIN];
var FROZEN = 3;                  // the star, the item and what it is stay put

var COLS = [];                   // the flat column list, built once the slot count is known
/* A quote nobody is looking at takes one narrow column saying so, not six. Quote 1 is open to
   begin with and the rest are a click away, because most lines only ever go to one firm and six
   empty columns apiece is a sheet you have to scroll past rather than read. */
var SHUT_COL = { k: '_shut', h: '', w: 30, shut: 1 };
function quoteOpen(i) { return i === 0 || !!(ST && ST.qopen && ST.qopen[i]); }
function layOut(n) {
  COLS = [];
  for (var i = 0; i < FIX.length; i++) COLS.push({ c: FIX[i], fix: i });
  for (var s = 0; s < n; s++) {
    if (!quoteOpen(s)) { COLS.push({ c: SHUT_COL, slot: s, shut: 1 }); continue; }
    for (var j = 0; j < SLOT.length; j++) COLS.push({ c: SLOT[j], slot: s });
  }
  for (var t = 0; t < TAIL.length; t++) COLS.push({ c: TAIL[t], tail: t });
  for (var x = 0; x < COLS.length; x++) {
    COLS[x].at = x;
    COLS[x].w = (ST && ST.w && ST.w[x]) || COLS[x].c.w;
    /* Four columns are one quote, not four loose ones, so each is ruled off from its neighbours
       and tinted away from the one beside it. Reading across a line, you want to know whose
       number you are looking at without counting columns back to the banner. */
    var g = [];
    if (COLS[x].slot != null) {
      g.push(COLS[x].slot % 2 ? 'qb' : 'qa');
      if (COLS[x].slot !== (COLS[x - 1] || {}).slot) g.push('gs');
      if (COLS[x].slot !== (COLS[x + 1] || {}).slot) g.push('ge');
    } else if (COLS[x].tail != null) {
      g.push('qt');
      if ((COLS[x - 1] || {}).tail == null) g.push('gs');
      if (x === COLS.length - 1) g.push('ge');
    }
    COLS[x].grp = g.join(' ');
  }
}

/* ── talking to the Dingus ── */
function tell(type, more) {
  var m = { __dingus: true, type: type };
  if (more) for (var k in more) m[k] = more[k];
  try { (HOST || window.parent).postMessage(m, location.origin); } catch (e) {}
}
function say(text, bad) {
  var el = document.getElementById('say');
  el.textContent = text; el.className = 'up' + (bad ? ' bad' : '');
  clearTimeout(say._t); say._t = setTimeout(function () { el.className = ''; }, bad ? 6000 : 2600);
}
window.addEventListener('message', function (ev) {
  if (ev.origin !== location.origin) return;
  var d = ev.data; if (!d || !d.__dingus) return;
  if (d.type === 'starter-open') { HOST = ev.source || HOST; open(d); return; }
  if (d.type === 'starter-state') { camein(d.state); return; }
  if (d.type === 'starter-filed') { filed(d); return; }
  if (d.type === 'starter-picked') { picked(d); return; }
  if (d.type === 'starter-say') { say(d.text || '', !!d.bad); return; }
});

function open(d) {
  HOST = HOST || window.parent;
  JOB = d.job || JOB;
  LINES = d.lines || [];
  CAN_FILE = !!d.canFile;
  ST = fill(d.state, d.slots || 4);
  document.getElementById('jobName').textContent =
    [JOB.number ? 'Job ' + JOB.number : '', JOB.name || ''].filter(Boolean).join('  ·  ');
  READY = true;
  layOut(ST.slots);
  draw();
  say(count() + ' line' + (count() === 1 ? '' : 's') + ' to get priced');
}
/* Whatever was saved before, with everything it does not have filled in. A sheet that has lost a
   line because the spec was read again must not lose what was typed against the others. */
function fill(state, slots) {
  var s = state && typeof state === 'object' ? state : {};
  return { slots: Math.max(2, Math.min(8, s.slots || slots)), rows: s.rows || {},
    add: s.add || {}, w: s.w || {}, open: s.open || {}, shut: s.shut || {},
    qopen: s.qopen || {}, at: s.at || 0 };
}
function count() { var n = 0; for (var i = 0; i < ROWS.length; i++) if (ROWS[i].kind === 'item') n++; return n; }

/* A row the sheet has typing against, made on demand. */
function row(key) {
  if (!ST.rows[key]) ST.rows[key] = { s: [] };
  var r = ST.rows[key];
  if (!r.s) r.s = [];
  while (r.s.length < ST.slots) r.s.push({});
  return r;
}

/* ── what gets drawn ── */
function rowsOf() {
  var out = [], n = 0;
  for (var i = 0; i < LINES.length; i++) {
    var ln = LINES[i];
    if (ln.blank) continue;
    var sk = (ln.sec || {}).key || '';
    if (ln.band) { out.push({ kind: 'band', line: ln, secKey: sk, lines: 0 }); continue; }
    /* A section folded away takes its lines with it, so a sheet of forty sections is still a
       sheet you can read. The band it folds into says how many went with it. */
    var band = null;
    for (var z = out.length - 1; z >= 0; z--) if (out[z].kind === 'band') { band = out[z]; break; }
    if (band && band.secKey === sk) band.lines++;
    if (ST.shut && ST.shut[sk]) continue;
    if (ln.sub) { out.push({ kind: 'sub', line: ln, secKey: sk }); continue; }
    var key = ln.key || ('L' + i);
    out.push({ kind: 'item', line: ln, key: key, secKey: sk, odd: (n++ % 2) === 1 });
    if (ST.open && ST.open[key] && saysOf(ln).length)
      out.push({ kind: 'says', line: ln, key: key, secKey: sk });
  }
  /* And the hand-written ones, each after the last line of its section. */
  var withAdds = [];
  for (var j = 0; j < out.length; j++) {
    withAdds.push(out[j]);
    var next = out[j + 1];
    var lastOfSec = out[j].kind !== 'band' && (!next || next.kind === 'band' || next.secKey !== out[j].secKey);
    var onlyBand = out[j].kind === 'band' && (!next || next.kind === 'band');
    if (!lastOfSec && !onlyBand) continue;

  CUR = null; SEL = null;
  layOut(ST.slots);
  draw(); keep();
}
function foldOne(secKey) {
  if (!ST.shut) ST.shut = {};
  if (ST.shut[secKey]) delete ST.shut[secKey]; else ST.shut[secKey] = 1;
  CUR = null; SEL = null;
  draw(); keep();
}
function foldAll(shut) {
  ST.shut = {};
  if (shut) for (var i = 0; i < LINES.length; i++)
    if (LINES[i].band) ST.shut[(LINES[i].sec || {}).key || ''] = 1;
  CUR = null; SEL = null;
  draw(); keep();
}
function openOne(key) {
  if (!ST.open) ST.open = {};
  if (ST.open[key]) delete ST.open[key]; else ST.open[key] = 1;
  draw(); keep();
}
function openAll(on) {
  ST.open = {};
  if (on) for (var i = 0; i < ROWS.length; i++)
    if (ROWS[i].kind === 'item' && saysOf(ROWS[i].line).length) ST.open[ROWS[i].key] = 1;
  draw(); keep();
}

/* ── a line somebody puts in by hand ── */
function addLine(secKey) {
  mark();
  if (!ST.add[secKey]) ST.add[secKey] = [];
  var key = secKey + '|+' + (Date.now().toString(36)) + (ST.add[secKey].length + 1);
  ST.add[secKey].push({ key: key, item: '', name: '', qty: 1 });
  draw(); keep();
  at(key, function (i) { show(i, 0); begin(i, 0, true, ''); });
}

/* ── the vendor's quote ── */
var WANT = null;
function slotOf(tr, k) {
  var r = Number(tr.getAttribute('data-r')), col = COLS[k];
  return { r: r, d: ROWS[r], slot: col.slot };
}
function askFile(tr, k) {
  if (!CAN_FILE) { say('Load the job ShareFile folder in the Dingus first, then the quote can be filed', true); return; }
  WANT = slotOf(tr, k);
  var inp = document.getElementById('pickFile');
  inp.value = ''; inp.click();
}
document.getElementById('pickFile').addEventListener('change', function () {
  var f = this.files && this.files[0], w = WANT;
  WANT = null;
  if (!f || !w) return;
  if (f.size > 60 * 1024 * 1024) { say('That file is over 60 MB — too big to hand across', true); return; }
  var fr = new FileReader();
  fr.onload = function () {
    tell('starter-upload', { key: w.d.key, slot: w.slot, secKey: w.d.secKey,
      name: f.name, size: f.size, bytes: fr.result,
      vendor: ((ST.rows[w.d.key] || {}).s || [])[w.slot] && ST.rows[w.d.key].s[w.slot].v || '' });
    say('Filing ' + f.name + '…');
  };
  fr.onerror = function () { say('Could not read that file', true); };
  fr.readAsArrayBuffer(f);
});
function filed(d) {
  if (!d.ok) { say(d.why || 'Could not file that quote', true); return; }
  mark();
  var rec = row(d.key);
  rec.s[d.slot].f = { name: d.name, dir: d.dir, file: d.file };
  /* A quote that has come in is a quote received, unless somebody has already said more. */
  if (!rec.s[d.slot].st || rec.s[d.slot].st === ASK) rec.s[d.slot].st = GOT;
  at(d.key, function (i) { redo(i); });
  keep();
  say('Filed in ' + (d.dir || 'the vendor quotes folder'));
}
function dropFile(tr, k) {
  var w = slotOf(tr, k), rec = ST.rows[w.d.key];
  if (!rec || !rec.s || !rec.s[w.slot] || !rec.s[w.slot].f) return;
  mark();
  delete rec.s[w.slot].f;
  redo(w.r); keep();
  say('Taken off the line — the file is still in the vendor quotes folder');
}
/* Back to the line itself, with the section it is in opened if it had been folded away. */
function goLine(key) {
  for (var i = 0; i < LINES.length; i++) {
    var ln = LINES[i];
    if (ln.band || ln.sub || ln.blank) continue;
    if ((ln.key || ('L' + i)) !== key) continue;
    var sk2 = (ln.sec || {}).key || '';
    if (ST.shut && ST.shut[sk2]) delete ST.shut[sk2];
    break;
  }
  goTab('sheet');
  for (var r = 0; r < ROWS.length; r++) if (ROWS[r].key === key && ROWS[r].kind === 'item') {
    SEL = null; show(r, 0);
    var tr = TBL && TBL.tBodies[0].rows[r];
    if (tr) tr.scrollIntoView({ block: 'center' });
    return;
  }
  say('That line is not on the sheet any more', true);
}
/* A quote opened from one of the lists, where there is no row to read it off. */
function seeByKey(key, slot) {
  var rec = ST.rows[key];
  if (!rec || !rec.s) return;
  var k = slot >= 0 ? slot : rec.chose;
  var f = k != null && rec.s[k] && rec.s[k].f;
  if (!f) return;
  tell('starter-see', { dir: f.dir, file: f.file, name: f.name });
}
function seeFile(tr, k) {
  var w = slotOf(tr, k), rec = ST.rows[w.d.key];
  var f = rec && rec.s && rec.s[w.slot] && rec.s[w.slot].f;
  if (!f) return;
  tell('starter-see', { dir: f.dir, file: f.file, name: f.name });
}

/* ── find, and the jumps ── */
var HITS = [], SPOT = -1;
/* A spec section is written "23 09 13" and typed "2309", so everything is looked at twice: as it
   is, and with everything that is not a letter or a number taken out of it. */
function bare(t) { return String(t || '').toLowerCase().replace(/[^a-z0-9]+/g, ''); }
function hay(d) {
  var bits = [], ln = d.line;
  for (var k = 0; k < COLS.length; k++) {
    var col = COLS[k];
    if (col.c.star || col.c.shut) continue;
    if (col.fix != null || col.c.k === 'v') bits.push(cellText(d, col));
  }
  var sec = ln.sec || {};
  bits.push(sec.number || '', sec.title || '', ln.tag || '', ln.mark || '', ln.covers || '',
    (ln.must || {}).all || '', (ln.makers || {}).all || '');
  var all = bits.join(' · ');
  return { plain: all.toLowerCase(), bare: bare(all) };
}
function runFind(quietly) {
  var q = String(document.getElementById('q').value || '').trim().toLowerCase();
  var was = TBL && TBL.querySelectorAll('tr.hit');
  if (was) for (var i = 0; i < was.length; i++) was[i].classList.remove('hit');
  HITS = []; SPOT = -1;
  if (!q || !TBL) { document.getElementById('hits').textContent = ''; return; }
  var bands = {};
  for (var r = 0; r < ROWS.length; r++) {
    var d = ROWS[r];
    if (d.kind === 'band') { bands[d.secKey] = r; continue; }
    if (d.kind !== 'item') continue;
    var look = hay(d);
    if (look.plain.indexOf(q) < 0 && look.bare.indexOf(bare(q)) < 0) continue;
    HITS.push(r);
    var tr = TBL.tBodies[0].rows[r];
    if (tr) tr.classList.add('hit');
  }
  document.getElementById('hits').textContent = HITS.length
    ? HITS.length + ' found' : 'nothing found';
  if (!quietly && HITS.length) hop(1);
}
function findKey(e) {
  if (e.key === 'Enter') { e.preventDefault(); hop(e.shiftKey ? -1 : 1); }
  if (e.key === 'Escape') { e.preventDefault(); e.target.value = ''; runFind(true); }
}
function hop(way) {
  if (!HITS.length) return;
  SPOT = (SPOT + way + HITS.length) % HITS.length;
  var r = HITS[SPOT];
  SEL = null;
  show(r, 0);
  var tr = TBL.tBodies[0].rows[r];
  if (tr) tr.scrollIntoView({ block: 'center' });
  document.getElementById('hits').textContent = (SPOT + 1) + ' of ' + HITS.length;
}
/* Jumps to the top of each division on the sheet, because a job is nearly always two of them and
   the plumbing is a long way from the sheet metal. */
function marks() {
  var seen = {}, out = [];
  for (var r = 0; r < ROWS.length; r++) {
    if (ROWS[r].kind !== 'band') continue;
    var num = String((ROWS[r].line.sec || {}).number || (ROWS[r].line.sec || {}).key || '').trim();
    var div = (num.match(/^(\d{2})/) || [])[1];
    if (!div || seen[div]) continue;
    seen[div] = 1; out.push({ div: div, r: r });
  }
  var host = document.getElementById('marks');
  if (out.length < 2) { host.innerHTML = ''; return; }
  var h = '<span class="lab">Jump to</span>';
  for (var i = 0; i < out.length; i++)
    h += '<button class="btn" onclick="jump(' + out[i].r + ')">Div ' + out[i].div + '</button>';
  host.innerHTML = h;
}
function jump(r) {
  var tr = TBL && TBL.tBodies[0].rows[r];
  if (tr) tr.scrollIntoView({ block: 'start' });
  var f = nextItem(r, 1);
  if (f >= 0) { SEL = null; show(f, 0); }
}

function toExcel() { tell('starter-export', { state: { slots: ST.slots, rows: ST.rows, add: ST.add } }); }
/* What one firm has to come back on, as a sheet to send them: their items gathered under the spec
   section each falls in, with what that section demands of it alongside. */
function askList(vendor, secKey) {
  tell('starter-ask-list', { vendor: vendor, secKey: secKey || '',
    state: { slots: ST.slots, rows: ST.rows, add: ST.add } });
  say('Building the list for ' + vendor + '\u2026');
}
function leave() {
  clearTimeout(_save);
  tell('starter-save', { state: { slots: ST.slots, rows: ST.rows, add: ST.add, w: ST.w,
    open: ST.open, shut: ST.shut, qopen: ST.qopen }, at: Date.now(), final: true });
}

tell('starter-ready', {});
setTimeout(function () {
  if (!READY) document.getElementById('note').textContent =
    'This page is part of The Dingus — open it from the Submittals tab of a job.';
}, 2500);
</script>
</body>
</html>
