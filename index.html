    : `<div class="muted">This section has no separate submittals article in the spec.</div>`;

  const renderIncludes = inc => (inc && inc.length)
    ? `<h4 style="margin-top:14px">Section includes</h4><div class="muted" style="color:var(--text-2)">${
        inc.map(i => '• ' + esc(i)).join('<br>')}</div>` : '';

  const html = `
  <div class="scrim" onclick="closeDrawer()"></div>
  <aside class="drawer" role="dialog" aria-label="Spec section">
    <div class="drawer-head${st.id === 'na' ? ' is-na' : ''}">
      <div style="flex:1;min-width:0">
        <div class="num">Division ${esc(s.division)} · ${esc(s.number)}</div>
        <h2>${esc(s.title || '(untitled)')}</h2>
      </div>
      <button class="icon-btn" onclick="editSection('${s.key}')" title="Edit number / title">✎</button>
      <button class="icon-btn" onclick="closeDrawer()" title="Close">✕</button>
    </div>
    <div class="drawer-body">

      <div class="sec">
        <h4>Status <span class="pill" style="color:${cvar(st.color)};background:${csf(st.color)}"><i></i>${esc(st.label)}</span></h4>
        <div class="status-grid">${statusButtons}</div>
      </div>

      <div class="sec">
        <h4>Submittals <span style="display:flex;gap:6px">
          <button class="btn sm" onclick="linkModal('${s.key}','submittals',null)">+ ShareFile link</button>
          <button class="btn sm" onclick="pickFiles('${s.key}','submittals')">+ Upload PDF</button></span></h4>
        <div id="listSub">${fileList(s, 'submittals')}</div>
        <div class="drop" id="dropSub" onclick="pickFiles('${s.key}','submittals')">
          Drop submittal PDFs here<br><span class="muted">${esc(headroomNote())}</span></div>
      </div>

      <div class="sec">
        <h4>Submittal responses <span style="display:flex;gap:6px">
          <button class="btn sm" onclick="linkModal('${s.key}','responses',null)">+ ShareFile link</button>
          <button class="btn sm" onclick="pickFiles('${s.key}','responses')">+ Upload PDF</button></span></h4>
        <div id="listRes">${fileList(s, 'responses')}</div>
        <div class="drop" id="dropRes" onclick="pickFiles('${s.key}','responses')">
          Drop the returned / stamped PDFs here</div>
      </div>

      <div class="sec">
        <h4>Tags <button class="btn sm ghost" onclick="startAddTag('${s.key}')">+ Add tag</button></h4>
        <div class="tag-wrap" id="tagWrap">${tagChips(s)}</div>
        <div class="muted" style="margin-top:8px">Tags are searchable. The spec is scanned on import —
          add anything it missed.</div>
      </div>

      <div class="sec">
        <h4>Release <span class="pill" style="color:${cvar(rel.color)};background:${csf(rel.color)}"><i></i>${esc(rel.label)}</span></h4>
        <div class="seg-sm" style="margin-bottom:12px">${RELEASES.map(r => `
          <button class="${r.id === rel.id ? 'on' : ''}" style="${r.id === rel.id ? 'color:' + cvar(r.color) : ''}"
            onclick="setRelease('${s.key}','${r.id}')">${esc(r.label)}</button>`).join('')}</div>
        <div id="listRel">${releaseList(s)}</div>
        <button class="btn sm" onclick="releaseModal('${s.key}', null)">+ Record a release</button>
        ${(s.releases || []).length ? '' : `<div class="muted" style="margin-top:8px">
          A release can be the whole section or just part of it — phase 1 of the TU boxes, say.
          The expected delivery is worked out from the lead time and can be overridden.</div>`}
      </div>

      <div class="sec">
        <h4>Details</h4>
        <div class="grid2">
          <div class="field"><label class="fl">Vendor / supplier</label>
            <input class="input" value="${esc(s.vendor || '')}" oninput="setField('${s.key}','vendor',this.value)"></div>
          <div class="field"><label class="fl">Submittal no. / package</label>
            <input class="input" value="${esc(s.package || '')}" oninput="setField('${s.key}','package',this.value)"></div>
          <div class="field"><label class="fl">Sent to GC</label>
            <input class="input" type="date" value="${esc(s.submittedDate || '')}" onchange="setField('${s.key}','submittedDate',this.value)"></div>
          <div class="field"><label class="fl">Returned</label>
            <input class="input" type="date" value="${esc(s.returnedDate || '')}" onchange="setField('${s.key}','returnedDate',this.value)"></div>
          <div class="field"><label class="fl">Expected lead time (weeks)</label>
            <input class="input" value="${esc(s.leadWeeks === 0 ? '0' : (s.leadWeeks || ''))}"
              placeholder="e.g. 6 or 6-7" onchange="setField('${s.key}','leadWeeks',this.value)"></div>
          <div class="field"><label class="fl">Expected delivery</label>
            <input class="input" value="${esc(fmtWindow(expectedWindow(s)))}"
              placeholder="set when released" disabled></div>
          <div class="field"><label class="fl">Manufacturer</label>
            <input class="input" value="${esc(s.manufacturer || '')}" oninput="setField('${s.key}','manufacturer',this.value)"></div>
          <div class="field"><label class="fl">Spec</label>
            <input class="input" value="${esc(s.spec || '')}" oninput="setField('${s.key}','spec',this.value)"></div>
          <div class="field" style="grid-column:1/-1"><label class="fl">Description</label>
            <input class="input" value="${esc(s.description || '')}" oninput="setField('${s.key}','description',this.value)"></div>
        </div>
        <div class="field" style="margin-bottom:0"><label class="fl">Notes</label>
          <textarea class="input" oninput="setField('${s.key}','notes',this.value)"
            placeholder="Anything worth remembering — RFI numbers, why it was rejected, who to chase…">${esc(s.notes || '')}</textarea></div>
      </div>

      <div class="sec">
        <h4>What the spec asks for
          ${s.startPage && specFile ? `<button class="btn sm" onclick="openSpecViewer('${specFile.id}',${s.startPage})">Open spec · p. ${s.startPage}</button>` : ''}
        </h4>
        <div id="reqBlock"><div class="muted">Loading the spec text…</div></div>
        <div class="muted" style="margin-top:10px;border-top:1px solid var(--border);padding-top:8px">
          ${specFile && manySpecs ? esc(specFile.name) + ' · ' : ''}${
            s.startPage ? `pages ${s.startPage}${s.endPage && s.endPage !== s.startPage ? '–' + s.endPage : ''}`
                        : (specsOf(job).length ? 'no page reference — import the spec that covers this section' : 'no page reference')}
          ${s.titleSource ? ` · title from ${esc(s.titleSource)}` : ''}
        </div>
      </div>

      ${(s.history && s.history.length) ? `<div class="sec"><h4>History</h4>${
        s.history.slice().reverse().map(h =>
          `<div class="req-item"><span class="rl">${fmtDate(h.ts)}</span><span class="rt">${esc((ST[h.from] || {}).label || h.from)} → ${esc((ST[h.to] || {}).label || h.to)}</span></div>`
        ).join('')}</div>` : ''}

      <div style="text-align:right">
        <button class="btn danger sm" onclick="deleteSection('${s.key}')">Delete section</button>
      </div>
    </div>
  </aside>`;

  $('drawerHost').innerHTML = html;
  wireDrop($('dropSub'), s.key, 'submittals');
  wireDrop($('dropRes'), s.key, 'responses');

  // The spec text is a separate document so that opening a job stays light.
  specDataFor(s.key).then(data => {
    const host = $('reqBlock');
    if (!host || openKey !== s.key) return;      // moved on while it loaded
    host.innerHTML = renderReqs(data.requirements) + renderIncludes(data.includes);
  }).catch(() => {
    const host = $('reqBlock');
    if (host) host.innerHTML = '<div class="muted">Could not load the spec text.</div>';
  });
}

const isLink = d => d && d.type === 'link';
function linkHost(url) {
  try { return new URL(url).hostname.replace(/^www\./, ''); } catch (e) { return 'link'; }
}

function fileList(s, kind) {
  const files = s[kind] || [];
  if (!files.length) return `<div class="muted" style="margin-bottom:8px">Nothing added yet.</div>`;
  return files.map(f => isLink(f) ? `<div class="file-row">
      <span class="fi">🔗</span>
      <span class="fn"><b title="${esc(f.url)}">${esc(f.name)}</b>
        <small>${esc(linkHost(f.url))} · ${fmtDate(f.added)}${f.note ? ' · ' + esc(f.note) : ''}</small></span>
      ${f.rev ? `<span class="rev-tag">${esc(f.rev)}</span>` : ''}
      <button class="btn sm" onclick="openDocLink('${s.key}','${kind}','${f.id}')">Open</button>
      <button class="btn sm ghost" onclick="linkModal('${s.key}','${kind}','${f.id}')" title="Edit">✎</button>
      <button class="btn sm ghost" onclick="removeDoc('${s.key}','${kind}','${f.id}')" title="Remove">✕</button>
    </div>` : `<div class="file-row">
      <span class="fi">${kind === 'responses' ? '✔' : '📄'}</span>
      <span class="fn"><b title="${esc(f.name)}">${esc(f.name)}</b>
        <small>${fmtBytes(f.size || 0)} · ${fmtDate(f.uploaded)}</small></span>
      ${f.rev ? `<span class="rev-tag">${esc(f.rev)}</span>` : ''}
      <button class="btn sm" onclick="viewDoc('${s.key}','${kind}','${f.id}')">View</button>
      <button class="btn sm ghost" onclick="downloadDoc('${s.key}','${kind}','${f.id}')" title="Download">⤓</button>
      <button class="btn sm ghost" onclick="removeDoc('${s.key}','${kind}','${f.id}')" title="Remove">✕</button>
    </div>`).join('');
}

/* ── ShareFile (or any) links ─────────────────────────────────────────────
   Big vendor packages stay where the company already keeps them. The register
   holds a label and a URL, which can point at one file or a whole folder. */
function normaliseUrl(raw) {
  const t = String(raw || '').trim();
  if (!t) return null;
  const withScheme = /^https?:\/\//i.test(t) ? t : 'https://' + t;
  try {
    const u = new URL(withScheme);
    return /^https?:$/.test(u.protocol) && u.hostname.includes('.') ? u.href : null;
  } catch (e) { return null; }
}

function linkModal(key, kind, docId) {
  const s = findSection(key);
  if (!s) return;
  const existing = docId ? (s[kind] || []).find(x => x.id === docId) : null;
  const what = kind === 'responses' ? 'response' : 'submittal';
  $('modalHost').innerHTML = `
    <div class="modal-scrim" onclick="if(event.target===this)closePdf()"><div class="modal">
      <div class="modal-head"><h3>${existing ? 'Edit link' : 'Link a ' + what}</h3>
        <button class="icon-btn" onclick="closePdf()">✕</button></div>
      <div class="modal-body">
        <div class="field">
          <label class="fl">Link</label>
          <input class="input" id="lkUrl" value="${esc(existing ? existing.url : '')}"
            placeholder="https://yourcompany.sharefile.com/..." autocomplete="off">
          <div class="muted" style="margin-top:5px">Paste the ShareFile link for the file or folder.
            It opens in a new tab and uses none of the storage allowance.</div>
        </div>
        <div class="field">
          <label class="fl">Label</label>
          <input class="input" id="lkName" value="${esc(existing ? existing.name : '')}"
            placeholder="e.g. Valve submittal package" autocomplete="off">
        </div>
        <div class="field" style="margin-bottom:0">
          <label class="fl">Note (optional)</label>
          <input class="input" id="lkNote" value="${esc(existing && existing.note || '')}" autocomplete="off">
        </div>
      </div>
      <div class="modal-foot">
        <button class="btn" onclick="closePdf()">Cancel</button>
        <button class="btn primary" onclick="saveLink('${key}','${kind}',${existing ? "'" + existing.id + "'" : 'null'})">
          ${existing ? 'Save' : 'Add link'}</button>
      </div>
    </div></div>`;
  const first = $('lkUrl');
  first.focus(); first.select();
  for (const id of ['lkUrl', 'lkName', 'lkNote']) {
    $(id).addEventListener('keydown', e => {
      if (e.key === 'Enter') saveLink(key, kind, existing ? existing.id : null);
    });
  }
}

async function saveLink(key, kind, docId) {
  const s = findSection(key);
  if (!s) return;
  const url = normaliseUrl($('lkUrl').value);
  if (!url) { toast('That does not look like a link — paste the full ShareFile address', true); $('lkUrl').focus(); return; }
  const name = $('lkName').value.trim() || decodeURIComponent(url.split('/').filter(Boolean).pop() || 'ShareFile link');
  const note = $('lkNote').value.trim();

  markPending(key);
  s[kind] = s[kind] || [];
  const existing = docId ? s[kind].find(x => x.id === docId) : null;
  if (existing) {
    Object.assign(existing, { name, url, note });
  } else {
    s[kind].push({ id: uid('doc'), type: 'link', name, url, note, added: Date.now(),
      rev: kind === 'submittals' ? 'Rev ' + s[kind].filter(d => d.rev).length : '' });
    if (kind === 'submittals' && (s.status || 'not_started') === 'not_started') s.status = 'waiting_vendor';
  }
  closePdf();
  renderDrawer(); renderTable();
  try { await patchSection(key, { [kind]: s[kind], status: s.status }); }
  catch (e) { toast(writeError(e), true); return; }
  toast(existing ? 'Link updated' : 'Link added');
}

function bigUploadPrompt(key, kind, files, bytes) {
  const names = files.map(f => f.name).join(', ');
  $('modalHost').innerHTML = `
    <div class="modal-scrim" onclick="if(event.target===this)closePdf()"><div class="modal">
      <div class="modal-head"><h3>That is ${esc(fmtBytes(bytes))}</h3>
        <button class="icon-btn" onclick="closePdf()">✕</button></div>
      <div class="modal-body">
        <p class="muted" style="margin-bottom:14px">${esc(names)}</p>
        <button class="choice-btn" onclick="closePdf();linkModal('${key}','${kind}',null)">
          <b>Link it from ShareFile instead</b>
          <span>Put the file in ShareFile and paste the link here. Uses none of the
            ${esc(fmtBytes(FREE_TIER_BYTES))} allowance, and everyone opens it from where it already lives.</span>
        </button>
        <button class="choice-btn" onclick="closePdf();forceUpload('${key}','${kind}')">
          <b>Upload it anyway</b>
          <span>Stores it here so it views inline. ${esc(headroomNote())}.</span>
        </button>
      </div>
    </div></div>`;
  bigUploadPrompt._pending = { key, kind, files };
}

function forceUpload(key, kind) {
  const p = bigUploadPrompt._pending;
  if (!p || p.key !== key || p.kind !== kind) return;
  bigUploadPrompt._pending = null;
  addFiles._forced = true;
  addFiles(key, kind, p.files);
}

function openDocLink(key, kind, docId) {
  const d = docOf(key, kind, docId);
  if (d && d.url) window.open(d.url, '_blank', 'noopener');
}

/* ── tags ── */
function tagChips(s) {
  const tags = s.tags || [];
  return (tags.length
    ? tags.map(t => `<span class="tag-chip">${esc(t)}<button title="Remove"
        onclick="removeTag('${s.key}', ${JSON.stringify(t).replace(/"/g, '&quot;')})">✕</button></span>`).join('')
    : `<span class="muted">No tags yet.</span>`) +
    `<button class="tag-add" onclick="startAddTag('${s.key}')">+ tag</button>`;
}

function startAddTag(key) {
  const wrap = $('tagWrap');
  if (!wrap || $('tagInput')) { const i = $('tagInput'); if (i) i.focus(); return; }
  const el = document.createElement('input');
  el.className = 'tag-input'; el.id = 'tagInput'; el.placeholder = 'e.g. VFD';
  el.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); addTag(key, el.value); }
    if (e.key === 'Escape') { el.remove(); }
  });
  el.addEventListener('blur', () => { if (el.value.trim()) addTag(key, el.value); else el.remove(); });
  wrap.appendChild(el);
  el.focus();
}

async function addTag(key, raw) {
  const s = findSection(key);
  if (!s) return;
  const tag = String(raw || '').trim().replace(/\s+/g, ' ');
  if (!tag) return;
  s.tags = s.tags || [];
  if (s.tags.some(t => t.toLowerCase() === tag.toLowerCase())) { renderDrawer(); return; }
  markPending(key);
  s.tags.push(tag);
  renderDrawer(); renderTable();
  try { await patchSection(key, { tags: s.tags }); } catch (e) { toast(writeError(e), true); }
}

async function removeTag(key, tag) {
  const s = findSection(key);
  if (!s) return;
  markPending(key);
  s.tags = (s.tags || []).filter(t => t !== tag);
  renderDrawer(); renderTable();
  try { await patchSection(key, { tags: s.tags }); } catch (e) { toast(writeError(e), true); }
}

/* ── releases ── */
function releaseList(s) {
  const list = s.releases || [];
  if (!list.length) return `<div class="muted" style="margin-bottom:8px">Nothing released yet.</div>`;
  return list.map(r => `<div class="rel-row${r.delivered ? ' is-delivered' : ''}">
      <label class="tick" title="Tick when it arrives on site">
        <input type="checkbox" ${r.delivered ? 'checked' : ''}
          onchange="toggleDelivered('${s.key}','${r.id}', this.checked)">
      </label>
      <span class="rn"><b>${esc(r.label)}</b>
        <small>Released ${esc(r.date ? fmtDate(r.date + 'T00:00:00') : '—')}${
          r.weeks ? ' · lead time ' + esc(leadLabel(r.weeks)) : ''}${r.note ? ' · ' + esc(r.note) : ''}</small></span>
      <span class="due" style="color:${r.delivered ? cvar('green') : (r.expected ? cvar('blue') : 'var(--text-3)')}">${
        r.delivered ? 'Delivered' :
        (r.expected ? 'Due ' + esc(fmtWindow({ from: r.expected, to: r.expectedTo })) : 'no date')}</span>
      <button class="btn sm ghost" onclick="releaseModal('${s.key}','${r.id}')" title="Edit">✎</button>
      <button class="btn sm ghost" onclick="removeRelease('${s.key}','${r.id}')" title="Remove">✕</button>
    </div>`).join('');
}

async function setRelease(key, state) {
  const s = findSection(key);
  if (!s || (s.releaseState || 'not_ready') === state) return;
  markPending(key);
  s.releaseState = state;
  // Flipping straight to Released is a full release: record it, so there is a
  // date to run the lead time from instead of a blank delivery.
  if ((state === 'released' || state === 'partial') && !(s.releases || []).length) {
    const d = today();
    const e = expectedRange(d, s.leadWeeks);
    s.releases = [{
      id: uid('rel'), label: state === 'released' ? 'Full release' : 'Release 1',
      date: d, weeks: s.leadWeeks || '', expected: e.from, expectedTo: e.to, note: ''
    }];
  }
  renderDrawer(); renderTable();
  try { await patchSection(key, { releaseState: state, releases: s.releases || [] }); }
  catch (e) { toast(writeError(e), true); }
}

function releaseModal(key, relId) {
  const s = findSection(key);
  if (!s) return;
  const r = relId ? (s.releases || []).find(x => x.id === relId) : null;
  const n = (s.releases || []).length + 1;
  const date = r ? r.date : today();
  const weeks = r ? r.weeks : (s.leadWeeks || '');
  const win = r ? { from: r.expected, to: r.expectedTo } : expectedRange(date, weeks);
  $('modalHost').innerHTML = `
    <div class="modal-scrim" onclick="if(event.target===this)closePdf()"><div class="modal">
      <div class="modal-head"><h3>${r ? 'Edit release' : 'Record a release'}</h3>
        <button class="icon-btn" onclick="closePdf()">✕</button></div>
      <div class="modal-body">
        <div class="field">
          <label class="fl">What is going out</label>
          <input class="input" id="rlLabel" value="${esc(r ? r.label : 'Release ' + n)}"
            placeholder="e.g. Phase 1 — TU boxes" autocomplete="off">
        </div>
        <div class="grid2">
          <div class="field"><label class="fl">Released on</label>
            <input class="input" type="date" id="rlDate" value="${esc(date)}"></div>
          <div class="field"><label class="fl">Lead time (weeks)</label>
            <input class="input" id="rlWeeks" value="${esc(weeks === 0 ? '0' : (weeks || ''))}"
              placeholder="6 or 6-7"></div>
        </div>
        <div class="grid2">
          <div class="field"><label class="fl">Expected delivery</label>
            <input class="input" type="date" id="rlExpected" value="${esc(win.from || '')}"></div>
          <div class="field"><label class="fl">…through (range)</label>
            <input class="input" type="date" id="rlExpectedTo" value="${esc(win.to || '')}"></div>
        </div>
        <div class="muted" style="margin:-4px 0 11px">Worked out from the release date and lead time.
          A range like <b>6-7</b> gives a delivery window. Change either date if the vendor says otherwise.</div>
        <div class="field" style="margin-bottom:0">
          <label class="fl">Note (optional)</label>
          <input class="input" id="rlNote" value="${esc(r && r.note || '')}" autocomplete="off">
        </div>
        ${r ? '' : `<div class="field" style="margin-top:12px;margin-bottom:0">
          <label class="fl">Does this finish the section?</label>
          <div class="seg-sm" id="rlScope">
            <button class="on" data-scope="released" onclick="pickScope(this)">All of it</button>
            <button data-scope="partial" onclick="pickScope(this)">Only part of it</button>
          </div></div>`}
      </div>
      <div class="modal-foot">
        <button class="btn" onclick="closePdf()">Cancel</button>
        <button class="btn primary" onclick="saveRelease('${key}',${r ? "'" + r.id + "'" : 'null'})">${r ? 'Save' : 'Record release'}</button>
      </div>
    </div></div>`;
  // Keep the expected date in step until someone types their own.
  const recalc = () => {
    if ($('rlExpected').dataset.touched) return;
    const e = expectedRange($('rlDate').value, $('rlWeeks').value);
    $('rlExpected').value = e.from || '';
    $('rlExpectedTo').value = e.to || '';
  };
  $('rlDate').addEventListener('change', recalc);
  $('rlWeeks').addEventListener('input', recalc);
  for (const id of ['rlExpected', 'rlExpectedTo']) {
    $(id).addEventListener('input', () => { $('rlExpected').dataset.touched = '1'; });
  }
  $('rlLabel').focus(); $('rlLabel').select();
}

function pickScope(btn) {
  for (const b of btn.parentNode.querySelectorAll('button')) b.classList.remove('on');
  btn.classList.add('on');
}

async function saveRelease(key, relId) {
  const s = findSection(key);
  if (!s) return;
  const label = $('rlLabel').value.trim() || 'Release';
  const date = $('rlDate').value;
  const weeks = $('rlWeeks').value;
  const expected = $('rlExpected').value;
  const expectedManual = !!$('rlExpected').dataset.touched;
  // A hand-typed delivery date makes a leftover range end meaningless.
  const rawTo = $('rlExpectedTo').value;
  const expectedTo = (rawTo && expected && rawTo <= expected) ? '' : rawTo;
  const note = $('rlNote').value.trim();
  const scopeEl = $('rlScope') && $('rlScope').querySelector('button.on');
  const scope = scopeEl ? scopeEl.dataset.scope : null;

  markPending(key);
  s.releases = s.releases || [];
  const existing = relId ? s.releases.find(x => x.id === relId) : null;
  if (existing) Object.assign(existing, { label, date, weeks, expected, expectedTo, note, expectedManual });
  else {
    s.releases.push({ id: uid('rel'), label, date, weeks, expected, expectedTo, note, expectedManual });
    s.releaseState = scope === 'partial' ? 'partial' : 'released';
  }
  if (weeks && !s.leadWeeks) s.leadWeeks = weeks;
  closePdf();
  renderDrawer(); renderTable();
  try { await patchSection(key, { releases: s.releases, releaseState: s.releaseState, leadWeeks: s.leadWeeks || '' }); }
  catch (e) { toast(writeError(e), true); return; }
  toast(existing ? 'Release updated' : 'Release recorded');
}

async function removeRelease(key, relId) {
  const s = findSection(key);
  if (!s) return;
  const r = (s.releases || []).find(x => x.id === relId);
  if (!r || !confirm(`Remove "${r.label}"?`)) return;
  markPending(key);
  s.releases = s.releases.filter(x => x.id !== relId);
  if (!s.releases.length && s.releaseState === 'partial') s.releaseState = 'ready';
  renderDrawer(); renderTable();
  try { await patchSection(key, { releases: s.releases, releaseState: s.releaseState }); }
  catch (e) { toast(writeError(e), true); }
}

/* Edits are debounced, but each section keeps its own pending patch and its own
   timer — editing the title, then the spec, then the vendor in quick succession
   must not let one field's write cancel the others. */
const _fieldPatches = new Map();   // key → { field: value, … }
const _fieldTimers = new Map();    // key → timeout id
async function setField(key, field, value) {
  const s = findSection(key);
  if (!s) return;
  s[field] = value;
  markPending(key);                 // protect it across the debounce
  const patch = _fieldPatches.get(key) || {};
  patch[field] = value;

  // A lead time is often filled in after the release. Re-date anything whose
  // delivery has not been typed in by hand.
  if (field === 'leadWeeks') {
    for (const r of (s.releases || [])) {
      if (r.expectedManual) continue;
      r.weeks = value;
      const e = expectedRange(r.date, value);
      r.expected = e.from; r.expectedTo = e.to;
    }
    patch.releases = s.releases || [];
    if (openKey === key) renderDrawer();
  }
  _fieldPatches.set(key, patch);

  clearTimeout(_fieldTimers.get(key));
  _fieldTimers.set(key, setTimeout(async () => {
    _fieldTimers.delete(key);
    const p = _fieldPatches.get(key); _fieldPatches.delete(key);
    if (!p) return;
    renderTable();
    try { await patchSection(key, p); } catch (e) { toast(writeError(e), true); }
  }, 500));
}

/* ── uploads ── */
function pickFiles(key, kind) {
  const inp = document.createElement('input');
  inp.type = 'file';
  inp.accept = 'application/pdf,.pdf';
  inp.multiple = true;
  inp.onchange = () => addFiles(key, kind, Array.from(inp.files));
  inp.click();
}
function wireDrop(el, key, kind) {
  if (!el) return;
  el.addEventListener('dragover', e => { e.preventDefault(); el.classList.add('over'); });
  el.addEventListener('dragleave', () => el.classList.remove('over'));
  el.addEventListener('drop', e => {
    e.preventDefault(); el.classList.remove('over');
    addFiles(key, kind, Array.from(e.dataTransfer.files));
  });
}
async function addFiles(key, kind, files) {
  const s = findSection(key);
  if (!s || !files.length) return;
  markPending(key);                 // uploads take a while; hold the section
  const incoming = files.reduce((n, f) => n + f.size, 0);
  if (!isFolder() && usedBytes() + incoming > FREE_TIER_BYTES) {
    toast('That would go past the free Firestore allowance — link it from ShareFile instead', true);
    return;
  }
  // A big package is exactly what ShareFile is for; offer that before spending
  // a chunk of the allowance on it. (Folder mode has no such ceiling.)
  if (!isFolder() && incoming > BIG_UPLOAD && !addFiles._forced) {
    bigUploadPrompt(key, kind, files, incoming);
    return;
  }
  addFiles._forced = false;
  s[kind] = s[kind] || [];
  let added = 0;
  for (const f of files) {
    if (f.type && f.type !== 'application/pdf' && !/\.pdf$/i.test(f.name)) {
      toast(`${f.name} is not a PDF — skipped`, true);
      continue;
    }
    const docId = uid('doc');
    try {
      const fileId = await putFile(f, { jobId: job.id, sectionKey: s.key, kind },
        pct => stickyToast(`Uploading ${f.name}… ${Math.round(pct * 100)}%`));
      s[kind].push({
        id: docId, name: f.name, size: f.size, type: f.type || 'application/pdf',
        uploaded: Date.now(), fileId,
        rev: kind === 'submittals' ? 'Rev ' + s[kind].filter(d => d.rev).length : ''
      });
      added++;
    } catch (e) {
      console.error(e);
      toast(storageError(e), true);
    }
  }
  if (!added) return;
  // Uploading the first submittal on an untouched section moves it along.
  if (kind === 'submittals' && (s.status || 'not_started') === 'not_started') s.status = 'waiting_vendor';
  renderDrawer(); renderTable();
  try { await patchSection(key, { [kind]: s[kind], status: s.status }); }
  catch (e) { toast(writeError(e), true); return; }
  toast(added + ' file' + (added === 1 ? '' : 's') + ' uploaded');
}
async function removeDoc(key, kind, docId) {
  const s = findSection(key);
  const d = (s[kind] || []).find(x => x.id === docId);
  if (!d) return;
  if (!confirm(`Remove "${d.name}" for everyone?`)) return;
  markPending(key);
  if (!isLink(d)) await deleteStoredFile(d.fileId);
  s[kind] = s[kind].filter(x => x.id !== docId);
  renderDrawer(); renderTable();
  try { await patchSection(key, { [kind]: s[kind] }); } catch (e) { toast(writeError(e), true); }
}
function docOf(key, kind, docId) {
  const s = findSection(key);
  return s ? (s[kind] || []).find(x => x.id === docId) : null;
}
async function resolveDoc(key, kind, docId) {
  const d = docOf(key, kind, docId);
  if (!d) return null;
  if (d.url) return { url: d.url, name: d.name };            // pre-Firestore upload
  stickyToast(`Opening ${d.name}…`);
  const url = await fileUrl(d.fileId);
  if (!url) { toast('That file is missing', true); return null; }
  toast(' ');
  return { url, name: d.name };
}
async function viewDoc(key, kind, docId) {
  const got = await resolveDoc(key, kind, docId);
  if (got) showPdf(got.url, got.name);
}
async function downloadDoc(key, kind, docId) {
  const got = await resolveDoc(key, kind, docId);
  if (!got) return;
  const a = document.createElement('a');
  a.href = got.url; a.download = got.name; a.click();
}

/* ── manual section management ── */
async function addSectionManually() {
  if (!job) return;
  const num = prompt('Section number (e.g. 23 05 93):');
  if (!num) return;
  const key = normNum(num);
  if (!key) { toast('Use a 6-digit section number, e.g. 23 05 93', true); return; }
  if (!DIVISIONS.includes(divOf(key))) { toast('Only Divisions 22 and 23 are tracked here', true); return; }
  if (findSection(key)) { toast('That section is already in the register', true); return; }
  const title = prompt('Section title:') || '';
  const rec = newSectionRecord({
    key, number: prettyNum(key), division: divOf(key), title: title.trim(),
    manual: true, inBody: true, requirements: [], includes: []
  });
  markPending(key);
  job.sections.push(rec);
  sortSections();
  renderJob();
  openSection(key);
  try { await saveSection(rec); } catch (e) { toast(writeError(e), true); }
}
async function editSection(key) {
  const s = findSection(key);
  if (!s) return;
  const title = prompt('Section title:', s.title || '');
  if (title === null) return;
  s.title = title.trim();
  s.titleEdited = true;         // a later import must not overwrite this
  renderDrawer(); renderTable();
  try { await patchSection(key, { title: s.title, titleEdited: true }); }
  catch (e) { toast(writeError(e), true); }
}
async function deleteSection(key) {
  const s = findSection(key);
  if (!s) return;
  const files = (s.submittals || []).length + (s.responses || []).length;
  if (!confirm(`Remove ${s.number} from the register${files ? ` and delete its ${files} uploaded file(s)` : ''}?\n\nThis affects everyone on this job.`)) return;
  for (const d of (s.submittals || []).concat(s.responses || [])) {
    if (!isLink(d)) await deleteStoredFile(d.fileId);
  }
  job.sections = job.sections.filter(x => x.key !== key);
  closeDrawer(); renderJob();
  try { await FB.deleteDoc(sectionRef(job.id, key)); await saveJobMeta(); }
  catch (e) { toast(writeError(e), true); }
}
// Division first, then Not Required last inside it, then section number.
function sectionOrder(a, b) {
  if (a.division !== b.division) return String(a.division).localeCompare(String(b.division));
  const na = (a.status === 'na' ? 1 : 0) - (b.status === 'na' ? 1 : 0);
  if (na) return na;
  return String(a.key).localeCompare(String(b.key), undefined, { numeric: true });
}
function sortSections() {
  if (job && job.sections) job.sections.sort(sectionOrder);
}
function newSectionRecord(base) {
  return Object.assign({
    status: 'not_started', vendor: '', spec: '', description: '', manufacturer: '',
    package: '', submittedDate: '', returnedDate: '',
    notes: '', submittals: [], responses: [], history: [],
    tags: [], autoTags: [], leadWeeks: '', releaseState: 'not_ready', releases: []
  }, base);
}

function showPdf(url, name, page) {

    <div class="modal-scrim" onclick="if(event.target===this)closePdf()">

        <div class="modal-body flush"><iframe src="${src}"></iframe></div>
      </div>
    </div>`;
}
function closePdf() {
  $('modalHost').innerHTML = '';
}
async function openSpecViewer(specId, page) {
  const specs = specsOf(job);
  if (!specs.length) { toast('No spec PDF stored for this job', true); return; }

  let sp;
  if (specId) {
    sp = specs.find(x => x.id === specId);
    // Never silently open a different file at this file's page number.
    if (!sp) { toast('That spec file is no longer in this job', true); return; }
  } else if (specs.length === 1) {
    sp = specs[0];
  } else {
    chooseSpecModal(specs);
    return;
  }
  if (sp.url) { showPdf(sp.url, sp.name, page); return; }     // pre-Firestore upload
  stickyToast(`Opening ${sp.name}…`);
  const url = await fileUrl(sp.fileId);
  if (!url) { toast('The spec PDF is missing', true); return; }
  toast(' ');
  showPdf(url, sp.name, page);
}

function chooseSpecModal(specs) {
  $('modalHost').innerHTML = `
    <div class="modal-scrim" onclick="if(event.target===this)closePdf()"><div class="modal">
      <div class="modal-head"><h3>Which spec file?</h3>
        <button class="icon-btn" onclick="closePdf()">✕</button></div>
      <div class="modal-body">${specs.map(sp => {
        const n = sectionsFromSpec(sp.id).length;
        return `<button class="choice-btn" onclick="closePdf();openSpecViewer('${sp.id}')">
          <b>${esc(sp.name)}</b>
          <span>${sp.pages ? sp.pages + ' pages · ' : ''}${n} section${n === 1 ? '' : 's'} in the register</span>
        </button>`;
      }).join('')}</div>
    </div></div>`;
}

/* Removing a spec file: the log built against it is worth more than the PDF,
   so keeping the sections is the default and dropping them is opt-in. */
function removeSpecPrompt(specId) {
  const sp = specById(specId);
  if (!sp) return;
  const owned = sectionsFromSpec(specId);
  const files = owned.reduce((n, s) => n + (s.submittals || []).length + (s.responses || []).length, 0);
  if (!owned.length) {
    if (confirm(`Remove "${sp.name}"?\n\nNo sections came from this file.`)) removeSpec(specId, false);
    return;
  }
  $('modalHost').innerHTML = `
    <div class="modal-scrim" onclick="if(event.target===this)closePdf()"><div class="modal">
      <div class="modal-head"><h3>Remove ${esc(sp.name)}?</h3>
        <button class="icon-btn" onclick="closePdf()">✕</button></div>
      <div class="modal-body">
        <p class="muted" style="margin-bottom:14px">${owned.length} section${owned.length === 1 ? '' : 's'} in the register came from this file${
          files ? `, carrying ${files} uploaded PDF${files === 1 ? '' : 's'}` : ''}.</p>
        <button class="choice-btn" onclick="closePdf();removeSpec('${specId}', false)">
          <b>Remove the file, keep the sections</b>
          <span>Statuses, uploads and notes stay. The sections lose their page references until you import the spec again.</span>
        </button>
        <button class="choice-btn danger" onclick="closePdf();removeSpec('${specId}', true)">
          <b>Remove the file and its ${owned.length} section${owned.length === 1 ? '' : 's'}</b>
          <span>Deletes ${files ? `the ${files} uploaded PDF${files === 1 ? '' : 's'} and ` : ''}everything logged against them.</span>
        </button>
      </div>
      <div class="modal-foot"><button class="btn" onclick="closePdf()">Cancel</button></div>
    </div></div>`;
}

async function removeSpec(specId, dropSections) {
  const sp = specById(specId);
  if (!sp) return;
  beginJobEdit();
  const owned = sectionsFromSpec(specId);
  stickyToast(`Removing ${sp.name}…`);
  let keptSections = [];
  if (dropSections) {
    for (const s of owned) {
      for (const d of (s.submittals || []).concat(s.responses || [])) {
        if (!isLink(d)) await deleteStoredFile(d.fileId);
      }
    }
    const gone = new Set(owned.map(s => s.key));
    job.sections = job.sections.filter(s => !gone.has(s.key));
  } else {
    for (const s of owned) { s.specId = null; s.startPage = null; s.endPage = null; }
    keptSections = owned;
  }
  await deleteStoredFile(sp.fileId);
  job.specs = job.specs.filter(x => x.id !== specId);
  closeDrawer();
  renderJob();
  try {
    if (dropSections) await deleteSectionDocs(job.id, owned.map(s => s.key));
    else await saveSections(keptSections);
    await saveJobMeta();
  } catch (e) { toast(writeError(e), true); return; }
  finally { endJobEdit(); }
  toast(dropSections ? `Removed ${sp.name} and ${owned.length} section${owned.length === 1 ? '' : 's'}`
                     : `Removed ${sp.name}`);
}

/* ═══════════════════════════════════════════════════════════════════════════
   9. SPEC IMPORT
   ═══════════════════════════════════════════════════════════════════════════ */
/* Specs often arrive split — Division 22 in one PDF, Division 23 in another.
   Several files can be picked at once and are reviewed one after the other. */
let importQueue = [];
let importTotal = 0;

function promptImportSpec() {
  if (!job) return;
  const inp = document.createElement('input');
  inp.type = 'file';
  inp.accept = 'application/pdf,.pdf';
  inp.multiple = true;
  inp.onchange = () => {
    importQueue = Array.from(inp.files);
    importTotal = importQueue.length;
    nextImport();
  };
  inp.click();
}

function nextImport() {
  const file = importQueue.shift();
  if (file) importSpec(file);
  else { importTotal = 0; closePdf(); }
}

function cancelImport() {
  importQueue = []; importTotal = 0; pendingImport = null;
  closePdf();
}

function queueLabel() {
  if (importTotal < 2) return '';
  return ` · file ${importTotal - importQueue.length} of ${importTotal}`;
}

function importModal(inner) {
  $('modalHost').innerHTML = `<div class="modal-scrim"><div class="modal">${inner}</div></div>`;
}

async function importSpec(file) {
  importModal(`
    <div class="modal-head"><h3>Reading ${esc(file.name)}${queueLabel()}</h3></div>
    <div class="modal-body">
      <div id="impStep" class="muted">Loading the PDF engine…</div>
      <div class="progress"><div id="impBar"></div></div>
    </div>`);
  try {
    await loadPdfJs();
  } catch (e) {
    importModal(`<div class="modal-head"><h3>Could not read that PDF</h3></div>
      <div class="modal-body"><p class="muted">${esc(String(e.message || e))} — check the connection and try again.</p></div>
      <div class="modal-foot"><button class="btn" onclick="cancelImport()">Close</button></div>`);
    return;
  }

  const step = (t, pct) => {
    const a = $('impStep'), b = $('impBar');
    if (a) a.textContent = t;
    if (b) b.style.width = Math.round(pct * 100) + '%';
  };
  const yieldUi = () => new Promise(r => setTimeout(r, 0));

  try {
    const buf = await file.arrayBuffer();
    const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
    const pages = [];
    for (let i = 1; i <= pdf.numPages; i++) {
      const pg = await pdf.getPage(i);
      const tc = await pg.getTextContent();
      pages.push({ num: i, lines: pageItemsToLines(tc.items) });
      pg.cleanup();
      if (i % 15 === 0 || i === pdf.numPages) {
        step(`Reading page ${i} of ${pdf.numPages}…`, i / pdf.numPages * 0.9);
        await yieldUi();
      }
    }
    step('Splitting Divisions 22 and 23…', 0.95);
    await yieldUi();

    const result = parseSpec(pages);
    if (!result.sections.length) {
      importModal(`<div class="modal-head"><h3>No Division 22 or 23 sections found</h3></div>
        <div class="modal-body"><p>Nothing in <b>${esc(file.name)}</b> looked like a Division 22 or 23 spec section.</p>
        <p class="muted" style="margin-top:10px">If the PDF is a scan, the text has to be OCR'd first. You can also add sections by hand.</p></div>
        <div class="modal-foot"><button class="btn" onclick="nextImport()">${importQueue.length ? 'Next file' : 'Close'}</button></div>`);
      return;
    }
    showImportReview(file, pages.length, result);
  } catch (e) {
    console.error(e);
    importModal(`<div class="modal-head"><h3>Could not read that PDF</h3></div>
      <div class="modal-body"><p class="muted">${esc(String(e && e.message || e))}</p></div>
      <div class="modal-foot"><button class="btn" onclick="nextImport()">${importQueue.length ? 'Next file' : 'Close'}</button></div>`);
  }
}

let pendingImport = null;
function showImportReview(file, pageCount, result) {
  pendingImport = { file, pageCount, result };
  const existing = new Set(sectionsOf(job).map(s => s.key));
  const fresh = result.sections.filter(s => !existing.has(s.key));
  const dupes = result.sections.filter(s => existing.has(s.key));

  let rows = '';
  for (const d of DIVISIONS) {
    const list = fresh.filter(s => s.division === d);
    if (!list.length) continue;
    rows += `<div class="review-row review-head"><span class="rn">Div ${d}</span>
      <span class="rt">${esc(DIVISION_NAMES[d])} — ${list.length} section${list.length === 1 ? '' : 's'}</span></div>`;
    for (const s of list) {
      rows += `<div class="review-row">
        <input type="checkbox" checked data-key="${esc(s.key)}" data-mode="add">
        <span class="rn">${esc(s.number)}</span>
        <span class="rt">${esc(s.title || '(untitled)')}</span>
        ${s.inBody ? '' : '<span class="flag">Index only</span>'}
      </div>`;
    }
  }
  // Same section in two files — a revised issue or an addendum. Re-pointing keeps
  // the log (status, uploads, notes) and refreshes only what came from the PDF.
  if (dupes.length) {
    rows += `<div class="review-row review-head"><span class="rn">Already in</span>
      <span class="rt">the register — tick to re-point at this file</span></div>`;
    for (const s of dupes) {
      const cur = sectionsOf(job).find(x => x.key === s.key);
      const from = cur && cur.specId ? specById(cur.specId) : null;
      rows += `<div class="review-row">
        <input type="checkbox" data-key="${esc(s.key)}" data-mode="update">
        <span class="rn">${esc(s.number)}</span>
        <span class="rt">${esc(s.title || '(untitled)')}${from ? ' — now from ' + esc(from.name) : ''}</span>
      </div>`;
    }
  }

  const already = specsOf(job).length;
  const dupName = specsOf(job).find(sp => sp.name === file.name);
  importModal(`
    <div class="modal-head"><h3>Found ${result.sections.length} spec section${result.sections.length === 1 ? '' : 's'}${queueLabel()}</h3></div>
    <div class="modal-body">
      <div class="muted">${esc(file.name)} · ${pageCount} pages · ${result.diagnostics.pagesMapped} pages matched to a section${
        result.diagnostics.tocEntries ? ' · table of contents cross-checked' : ''}</div>
      ${already ? `<div class="muted" style="margin-top:5px">Adding alongside ${already} spec file${already === 1 ? '' : 's'} already in this job.</div>` : ''}
      ${dupName ? `<div class="notice" style="margin-top:10px;margin-bottom:0">
        <span>A file named <b>${esc(file.name)}</b> is already in this job. Importing again will store a second copy.</span></div>` : ''}
      <div class="review-list">${rows || '<div class="review-row"><span class="rt muted">Nothing new — every section in this file is already in the register.</span></div>'}</div>
    </div>
    <div class="modal-foot">
      <button class="btn" onclick="cancelImport()">Cancel${importQueue.length ? ' all' : ''}</button>
      <button class="btn primary" onclick="confirmImport()">${
        fresh.length ? `Add ${fresh.length} section${fresh.length === 1 ? '' : 's'}` : 'Add spec file'}${
        importQueue.length ? ' &amp; continue' : ''}</button>
    </div>`);
}

async function confirmImport() {
  if (!pendingImport) return;
  beginJobEdit();
  const { file, pageCount, result } = pendingImport;
  const ticked = Array.from(document.querySelectorAll('.review-row input[type=checkbox]')).filter(c => c.checked);
  const chosen = new Set(ticked.filter(c => c.dataset.mode === 'add').map(c => c.dataset.key));
  const relink = new Set(ticked.filter(c => c.dataset.mode === 'update').map(c => c.dataset.key));

  importModal(`<div class="modal-head"><h3>Uploading ${esc(file.name)}</h3></div>
    <div class="modal-body"><div class="muted" id="upStep">Sending the spec PDF to the shared workspace…</div>
    <div class="progress"><div id="upBar"></div></div></div>`);

  try {
    const specId = uid('spec');
    const fileId = await putFile(file, { jobId: job.id, kind: 'spec' }, pct => {
      const bar = $('upBar'), step = $('upStep');
      if (bar) bar.style.width = Math.round(pct * 100) + '%';
      if (step) step.textContent = `Uploading… ${Math.round(pct * 100)}%`;
    });
    job.specs = job.specs || [];
    job.specs.push({ id: specId, name: file.name, pages: pageCount, size: file.size,
      fileId, added: Date.now() });

    const existing = new Set(sectionsOf(job).map(s => s.key));
    const relinked = [];
    let added = 0, updated = 0;
    for (const s of result.sections) {
      if (relink.has(s.key)) {
        const cur = sectionsOf(job).find(x => x.key === s.key);
        if (cur) {
          cur.specId = specId;
          cur.startPage = s.startPage; cur.endPage = s.endPage; cur.inBody = s.inBody;
          cur.requirements = s.requirements || []; cur.includes = s.includes || [];
          const fresh = (s.autoTags || []).filter(t => !(cur.autoTags || []).includes(t));
          cur.tags = (cur.tags || []).concat(fresh.filter(t => !(cur.tags || []).includes(t)));
          cur.autoTags = (s.autoTags || []).slice();
          relinked.push(cur);
          if (!cur.titleEdited) {                       // never clobber a hand-typed title
            cur.title = s.title; cur.rawTitle = s.rawTitle; cur.titleSource = s.titleSource;
          }
          updated++;
        }
        continue;
      }
      if (!chosen.has(s.key) || existing.has(s.key)) continue;
      job.sections.push(newSectionRecord({
        key: s.key, number: s.number, division: s.division, title: s.title, rawTitle: s.rawTitle,
        titleSource: s.titleSource, specId, startPage: s.startPage, endPage: s.endPage,
        inBody: s.inBody, requirements: s.requirements || [], includes: s.includes || [],
        tags: (s.tags || []).slice(), autoTags: (s.autoTags || []).slice()
      }));
      added++;
    }
    sortSections();
    const mine = sectionsOf(job).filter(x => x.specId === specId);
    await saveSpecData(job.id, mine.concat(relinked));   // spec text first, then the log rows
    await saveSections(mine);
    await saveJobMeta();
    if (!sectionsOf(job).some(x => x.division === divFilter)) {
      divFilter = DIVISIONS.find(d => sectionsOf(job).some(x => x.division === d)) || divFilter;
    }
    renderJob();
    const bits = [];
    if (added) bits.push(`${added} section${added === 1 ? '' : 's'} imported`);
    if (updated) bits.push(`${updated} re-pointed at this file`);
    toast(bits.length ? bits.join(' · ') : `${file.name} added`);
    nextImport();                        // review the next queued file, or close
  } catch (e) {
    console.error(e);
    importModal(`<div class="modal-head"><h3>Could not save</h3></div>
      <div class="modal-body"><p>${esc(storageError(e))}</p></div>
      <div class="modal-foot"><button class="btn" onclick="cancelImport()">Close</button></div>`);
  } finally {
    pendingImport = null;
    endJobEdit();
  }
}

/* ═══════════════════════════════════════════════════════════════════════════
   10. CSV EXPORT
   ═══════════════════════════════════════════════════════════════════════════ */
function csvCell(v) {
  const s = String(v == null ? '' : v);
  return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}
function exportCsv() {
  if (!job) return;
  const head = ['Division', 'Section', 'Title', 'Description', 'Spec', 'Manufacturer', 'Status', 'Vendor', 'Package', 'Sent to GC',
    'Returned', 'Lead time (weeks)', 'Release status', 'Released on', 'Expected from', 'Expected to',
    'Delivered', 'Releases', 'Tags', 'Submittal files', 'Response files', 'Links',
    'Spec file', 'Spec pages', 'Notes'];
  const rows = sectionsOf(job).map(s => [
    s.division, s.number, s.title, s.description || '', s.spec || '', s.manufacturer || '',
    (ST[s.status || 'not_started'] || {}).label,
    s.vendor || '', s.package || '', s.submittedDate || '', s.returnedDate || '',
    s.leadWeeks === 0 ? '0' : (s.leadWeeks || ''),
    relOf(s).label,
    releasedOn(s),
    expectedWindow(s).from,
    expectedWindow(s).to || expectedWindow(s).from,
    (() => {
      const rels = s.releases || [];
      if (!rels.length) return '';
      const done = rels.filter(r => r.delivered).length;
      return done === rels.length ? 'All delivered' : done ? `${done} of ${rels.length} delivered` : 'No';
    })(),
    (s.releases || []).map(r => `${r.label} (released ${r.date || '?'}${
      r.expected ? ', due ' + r.expected + (r.expectedTo ? '–' + r.expectedTo : '') : ''}${
      r.delivered ? ', delivered' : ''})`).join(' | '),
    (s.tags || []).join(', '),
    (s.submittals || []).map(d => d.name).join(' | '),
    (s.responses || []).map(d => d.name).join(' | '),
    (s.submittals || []).concat(s.responses || []).filter(isLink).map(d => d.url).join(' | '),
    (s.specId && specById(s.specId) ? specById(s.specId).name : ''),
    s.startPage ? (s.startPage + (s.endPage && s.endPage !== s.startPage ? '-' + s.endPage : '')) : '',
    (s.notes || '').replace(/\s+/g, ' ')
  ]);
  const csv = [head, ...rows].map(r => r.map(csvCell).join(',')).join('\r\n');
  const url = URL.createObjectURL(new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8' }));
  const a = document.createElement('a');
  a.href = url;
  a.download = job.name.replace(/[^\w\- ]+/g, '').trim().replace(/\s+/g, '_') + '_submittal_register.csv';
  a.click();
  setTimeout(() => URL.revokeObjectURL(url), 20000);
}

/* ═══════════════════════════════════════════════════════════════════════════
   11. THEME + BOOT
   ═══════════════════════════════════════════════════════════════════════════ */
function applyTheme(t) {
  document.documentElement.dataset.theme = t;
  localStorage.setItem('sr_theme', t);
}
function toggleTheme() {
  applyTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');
}
applyTheme(localStorage.getItem('sr_theme') ||
  (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if ($('modalHost').innerHTML) closePdf();
    else if (openKey) { closeDrawer(); renderTable(); }
  }
});

/* ═══════════════════════════════════════════════════════════════════════════
   12. SHAREFILE-FOLDER STORAGE
   The register and its PDFs live in one ShareFile job folder:

     register.json        the whole job — meta + sections (spec text inline) + file index
     files/<fileId>.pdf   each uploaded PDF as a real file
     Open Register.url    a launcher that opens this app straight to this job

   A browser can only touch these through the File System Access API, and only
   from a hosted (https) page — never a double-clicked file:// page — which is
   why each job folder carries the launcher rather than the app itself.
   ═══════════════════════════════════════════════════════════════════════════ */
let folderHandle = null;         // FileSystemDirectoryHandle for the open job
let folderFiles = {};            // fileId -> { name, size, type, kind, ext }
let folderFlushTimer = null;
let folderDirty = false;
let pendingFolderRec = null;     // a remembered handle offered on the landing

const fsSupported = () => !!(window.showDirectoryPicker);

function setSaveState(txt, spin) {
  const el = $('saveState');
  if (!el) return;
  if (!isFolder() || !txt) { el.hidden = true; return; }
  el.hidden = false;
  el.textContent = txt;
  el.classList.toggle('spin', !!spin);
}

/* ── register.json ── */
function jobToRegister() {
  return {
    version: 1,
    job: {
      id: job.id, name: job.name, number: job.number || '', folderUrl: job.folderUrl || '',
      created: job.created, updated: job.updated, specs: job.specs || []
    },
    sections: job.sections || [],       // full records, spec text inline
    files: folderFiles
  };
}
async function folderWriteRegister() {
  if (!folderHandle || !job) return;
  job.updated = Date.now();
  const data = jobToRegister();
  const fh = await folderHandle.getFileHandle('register.json', { create: true });
  const w = await fh.createWritable();
  await w.write(new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' }));
  await w.close();
  folderDirty = false;
  setSaveState('Saved ✓', false);
}
function folderScheduleFlush() {
  if (!isFolder()) return;
  folderDirty = true;
  setSaveState('Saving…', true);
  clearTimeout(folderFlushTimer);
  folderFlushTimer = setTimeout(() => {
    folderWriteRegister().catch(e => { setSaveState('Not saved', false); toast('Could not save to the folder: ' + (e.message || e), true); });
  }, 600);
}
async function folderFlushNow() {
  clearTimeout(folderFlushTimer);
  if (folderDirty) await folderWriteRegister();
}
async function folderReadRegister() {
  try {
    const fh = await folderHandle.getFileHandle('register.json');
    const f = await fh.getFile();
    return JSON.parse(await f.text());
  } catch (e) { return null; }          // NotFoundError etc. → treat as an empty folder
}

/* ── PDFs as real files under files/ ── */
async function filesDir(create) {
  return folderHandle.getDirectoryHandle('files', { create: !!create });
}
async function folderPutFile(file, meta) {
  const id = uid('file');
  const ext = (String(file.name).match(/\.[a-z0-9]+$/i) || ['.pdf'])[0];
  const dir = await filesDir(true);
  const fh = await dir.getFileHandle(id + ext, { create: true });
  const w = await fh.createWritable();
  await w.write(file);
  await w.close();
  folderFiles[id] = { name: file.name, size: file.size, type: file.type || 'application/pdf',
    kind: (meta && meta.kind) || '', ext };
  folderScheduleFlush();
  return id;
}
async function folderReadBlob(fileId) {
  const rec = folderFiles[fileId];
  if (!rec) return null;
  try {
    const dir = await filesDir(false);
    const fh = await dir.getFileHandle(fileId + (rec.ext || '.pdf'));
    return await fh.getFile();          // a File is already a Blob
  } catch (e) { return null; }
}
async function folderDeleteFile(fileId) {
  const rec = folderFiles[fileId];
  if (!rec) return;
  try { const dir = await filesDir(false); await dir.removeEntry(fileId + (rec.ext || '.pdf')); } catch (e) {}
  delete folderFiles[fileId];
  folderScheduleFlush();
}

/* ── the launcher shortcut dropped into each job folder ── */
async function writeLauncher() {
  if (!folderHandle || !job) return;
  const base = location.origin + location.pathname;
  const url = base + '?job=' + encodeURIComponent(job.id);
  const ics = '[InternetShortcut]\r\nURL=' + url + '\r\n';
  try {
    const fh = await folderHandle.getFileHandle('Open Register.url', { create: true });
    const w = await fh.createWritable();
    await w.write(new Blob([ics], { type: 'text/plain' }));
    await w.close();
  } catch (e) { /* non-fatal: the app still opens from its URL */ }
}

/* ── remember which folder went with which job (per machine) ── */
const HANDLE_DB = 'sr_folder_handles';
function handleDb() {
  return new Promise((res, rej) => {
    let r;
    try { r = indexedDB.open(HANDLE_DB, 1); } catch (e) { return rej(e); }
    r.onupgradeneeded = () => { if (!r.result.objectStoreNames.contains('h')) r.result.createObjectStore('h'); };
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
function idbPut(db, key, val) {
  return new Promise((res) => {
    try {
      const tx = db.transaction('h', 'readwrite');
      tx.objectStore('h').put(val, key);
      tx.oncomplete = () => res(true);
      tx.onerror = () => res(false);      // mock handles aren't cloneable — non-fatal
      tx.onabort = () => res(false);
    } catch (e) { res(false); }
  });
}
function idbGet(db, key) {
  return new Promise((res) => {
    try {
      const g = db.transaction('h', 'readonly').objectStore('h').get(key);
      g.onsuccess = () => res(g.result);
      g.onerror = () => res(null);
    } catch (e) { res(null); }
  });
}
async function rememberHandle(jobId, handle) {
  try {
    const db = await handleDb();
    await idbPut(db, 'job:' + jobId, { handle, name: (job && job.name) || '' });
    await idbPut(db, 'lastJob', jobId);
  } catch (e) { /* remembering is an optimisation, never required */ }
}
async function recallHandle(jobId) {
  try {
    const db = await handleDb();
    const v = await idbGet(db, 'job:' + jobId);
    return v && v.handle ? { handle: v.handle, name: v.name, jobId } : null;
  } catch (e) { return null; }
}
async function recallLast() {
  try {
    const db = await handleDb();
    const id = await idbGet(db, 'lastJob');
    return id ? recallHandle(id) : null;
  } catch (e) { return null; }
}

/* ── open / create / reload ── */
async function ensureRW(handle) {
  const opts = { mode: 'readwrite' };
  try {
    if ((await handle.queryPermission(opts)) === 'granted') return true;
    return (await handle.requestPermission(opts)) === 'granted';
  } catch (e) { return true; }          // older shims without the permission API
}
async function pickAndOpenFolder() {
  let handle;
  try { handle = await window.showDirectoryPicker({ mode: 'readwrite' }); }
  catch (e) { return; }                 // the picker was dismissed
  await openFolderHandle(handle);
}
function reopenPending() { if (pendingFolderRec) openFolderHandle(pendingFolderRec.handle); }
async function openFolderHandle(handle) {
  if (!(await ensureRW(handle))) { toast('Folder permission is needed to open the job', true); return; }
  folderHandle = handle;
  const reg = await folderReadRegister();
  if (reg && reg.job) {
    hydrateFromRegister(reg);
    pendingFolderRec = { handle, name: job.name, jobId: job.id };
    await rememberHandle(job.id, handle);
    go('job');
    setSaveState('Saved ✓', false);
  } else {
    // an empty folder: start a new job in it
    jobFormModal(null);
  }
}
function hydrateFromRegister(reg) {
  const j = reg.job || {};
  job = { id: j.id, name: j.name, number: j.number || '', folderUrl: j.folderUrl || '',
    created: j.created, updated: j.updated, specs: j.specs || [], sections: reg.sections || [] };
  folderFiles = reg.files || {};
  jobs = [job];
  statusFilter = null; releaseFilter = null; query = ''; divPicked = false; openKey = null;
  if ($('searchBox')) $('searchBox').value = '';
  $('crumbJob').textContent = job.name;
  sortSections();
  if (!job.sections.some(x => x.division === divFilter)) {
    const f = DIVISIONS.find(d => job.sections.some(x => x.division === d));
    if (f) divFilter = f;
  }
}
async function folderReload() {
  if (!folderHandle) return;
  try { await folderFlushNow(); } catch (e) {}
  const reg = await folderReadRegister();
  if (!reg || !reg.job) { toast('register.json is missing from this folder', true); return; }
  const openWas = openKey;
  hydrateFromRegister(reg);
  renderJob();
  if (openWas && findSection(openWas)) { openKey = openWas; renderDrawer(); renderTable(); }
  setSaveState('Saved ✓', false);
  toast('Reloaded from the folder');
}

/* ── landing screen (folder mode replaces the multi-job grid) ── */
function renderFolderLanding() {
  const grid = $('jobsGrid');
  if (!grid) return;
  renderStorageNote();
  if (!fsSupported()) {
    grid.innerHTML = `<div class="empty" style="grid-column:1/-1">
      <h3>This browser can't open folders</h3>
      <p>ShareFile-folder mode needs Chrome or Edge. Open this page there, or switch to
      Firebase from the storage button in the top-right.</p></div>`;
    return;
  }
  grid.innerHTML = `<div class="folder-landing">
    <h3>Open a job from its ShareFile folder</h3>
    <p class="muted">The register and every PDF live inside the folder. Changes save as you
    make them; ShareFile syncs them to everyone.</p>
    <div class="landing-btns">
      <button class="btn primary lg" onclick="pickAndOpenFolder()">📁 Open a job folder…</button>
      ${pendingFolderRec ? `<button class="btn lg" onclick="reopenPending()">↻ Reopen “${esc(pendingFolderRec.name || 'last job')}”</button>` : ''}
    </div>
    <p class="muted sm">Pick an empty folder to start a new job in it, or a folder that already
    has a register to open it.</p>
  </div>`;
}

/* ── the storage-mode toggle ── */
function storageMenu() {
  $('modalHost').innerHTML = `<div class="modal-scrim" onclick="if(event.target===this)closePdf()"><div class="modal">
    <div class="modal-head"><h3>Where does this register save?</h3>
      <button class="icon-btn" onclick="closePdf()">✕</button></div>
    <div class="modal-body">
      <button class="choice-btn ${isFolder() ? 'sel' : ''}" onclick="chooseStorage('folder')">
        <b>ShareFile folder${isFolder() ? ' · current' : ''}</b>
        <span>Saves register.json and the PDFs into the job's folder. Chrome/Edge, one folder per job, syncs through ShareFile.</span></button>
      <button class="choice-btn ${!isFolder() ? 'sel' : ''}" onclick="chooseStorage('firebase')">
        <b>Firebase — shared cloud${!isFolder() ? ' · current' : ''}</b>
        <span>The original live-sync store. Use this to reach jobs saved before the switch to folders.</span></button>
    </div>
    <div class="modal-foot"><button class="btn" onclick="closePdf()">Close</button></div>
  </div></div>`;
}
function chooseStorage(m) {
  if (m === storageMode) { closePdf(); return; }
  localStorage.setItem('sr_storage_mode', m);
  location.reload();
}

function applyStorageModeUI() {
  const btn = $('storageBtn');
  if (btn) btn.textContent = isFolder() ? '📁 Folder' : '☁ Firebase';
  const reload = $('btnReload');
  if (reload) reload.hidden = !isFolder();
  const sub = document.querySelector('#view-jobs .page-sub');
  if (sub) sub.textContent = isFolder()
    ? 'Each job is a ShareFile folder — open it to work, and it saves back there.'
    : 'One register per project, shared with everyone on this workspace.';
  const newBtn = document.querySelector('#view-jobs .page-head .btn.primary');
  if (newBtn) newBtn.textContent = isFolder() ? '📁 Open a job folder' : '+ New job';
}

/* The Firebase bootstrap lives in a type="module" script, which runs after the
   classic script is parsed. Wait for it before asking it to connect. */
async function ensureFirebase() {
  for (let i = 0; i < 300 && !window.__initFirebase; i++) await new Promise(r => setTimeout(r, 10));
  if (!window.__initFirebase) throw new Error('the Firebase bootstrap did not load');
  return window.__initFirebase();
}

async function boot() {
  applyStorageModeUI();

  if (isFolder()) {
    jobsLoaded = true;
    go('jobs');
    if (!fsSupported()) return;
    const params = new URLSearchParams(location.search);
    const wanted = params.get('job');
    const rec = wanted ? await recallHandle(wanted) : await recallLast();
    if (rec && rec.handle) {
      pendingFolderRec = rec;
      // Reopen without a click only if the grant already stands; otherwise the
      // landing's Reopen button carries the (gesture-requiring) permission ask.
      try {
        if ((await rec.handle.queryPermission({ mode: 'readwrite' })) === 'granted') {
          await openFolderHandle(rec.handle);
          return;
        }
      } catch (e) {}
      renderFolderLanding();
    }
    return;
  }

  // Firebase mode
  go('jobs');
  let ready = null;
  try {
    ready = await Promise.race([
      ensureFirebase(),
      new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), 15000))
    ]);
  } catch (e) {
    jobsLoaded = true;
    setSync('error', ' — the Firebase library did not load. Check the connection and reload.');
    renderJobs();
    return;
  }
  FB = ready;
  watchJobs();
}

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();
</script>
