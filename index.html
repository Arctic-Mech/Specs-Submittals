<!DOCTYPE html>

<head>
<meta charset="UTF-8">

<title>Submittal Register — Divisions 22 &amp; 23</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<!-- Firebase: the register and the PDFs both live in Firestore, so every
     device on the job sees the same log. Cloud Storage is deliberately not
     used — it needs a billing account, Firestore does not. -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";
import {
  getFirestore, initializeFirestore, persistentLocalCache, persistentMultipleTabManager,
  collection, doc, getDoc, getDocs, getDocsFromCache, setDoc, updateDoc, deleteDoc,
  onSnapshot, writeBatch, query, orderBy, connectFirestoreEmulator
} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCvUzRTKkVg6uhgJ6yQcerL8OLq3OAo36g",
  authDomain: "specs-submittals.firebaseapp.com",
  projectId: "specs-submittals",
  storageBucket: "specs-submittals.firebasestorage.app",
  messagingSenderId: "391316024345",
  appId: "1:391316024345:web:6c117f5ab65c814ab5ce88"
};

const app = initializeApp(firebaseConfig);

// Cache locally so the register opens instantly and keeps working when the
// site wifi drops; writes queue and flush when the connection returns.
let db;
try {
  db = initializeFirestore(app, {
    localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() })
  });
} catch (e) {
  db = getFirestore(app);
}
// Test hook: nothing defines this in production.
if (window.__fbConnect) window.__fbConnect({ db, connectFirestoreEmulator });

window.FB = {
  db,
  collection, doc, getDoc, getDocs, getDocsFromCache, setDoc, updateDoc, deleteDoc,
  onSnapshot, writeBatch, query, orderBy
};
window.dispatchEvent(new Event('fb-ready'));
</script>
<style>

  --surface:   #ffffff;

  --surface-3: #e7eaef;

  --border-2:  #c9cfd8;
  --text:      #16191d;
  --text-2:    #5b626d;
  --text-3:    #8a919c;
  --accent:    #1f6feb;
  --accent-sf: #e8f0fe;
  --grey:      #8a919c;   --grey-sf:  #eceef1;
  --amber:     #b45309;   --amber-sf: #fdf0dc;
  --blue:      #1f6feb;   --blue-sf:  #e6effd;
  --green:     #157347;   --green-sf: #e2f4ea;

}
html[data-theme="dark"] {

  --surface:   #171b21;
  --surface-2: #1e232b;
  --surface-3: #272d36;
  --border:    #2a303a;
  --border-2:  #3a424e;
  --text:      #e6e9ee;
  --text-2:    #a3abb8;
  --text-3:    #7b8492;
  --accent:    #4d94ff;
  --accent-sf: #16243a;
  --grey:      #98a1af;   --grey-sf:  #232931;
  --amber:     #f0b429;   --amber-sf: #2e2410;
  --blue:      #4d94ff;   --blue-sf:  #12233c;
  --green:     #3fbf7f;   --green-sf: #10281d;
  --red:       #f87171;   --red-sf:   #2e1616;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 16px rgba(0,0,0,.3);
  --shadow-lg: 0 12px 40px rgba(0,0,0,.55);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;

}
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent); }

/* ── buttons ── */
.btn {

}
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--text-2); }
.btn.ghost:hover { background: var(--surface-2); color: var(--text); }
.btn.danger { color: var(--red); border-color: var(--border-2); }
.btn.danger:hover { background: var(--red-sf); border-color: var(--red); }
.btn.sm { padding: 4px 9px; font-size: 12px; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }

.input, select.input, textarea.input {

}

label.fl { display: block; font-size: 11px; font-weight: 600; letter-spacing: .04em;
  text-transform: uppercase; color: var(--text-3); margin-bottom: 5px; }

/* ── top bar ── */
header {

}
.brand { display: flex; align-items: center; gap: 9px; cursor: pointer; }
.brand-mark {

}
.brand-name { font-weight: 700; font-size: 15px; letter-spacing: -.2px; }
.brand-sub { font-size: 11px; color: var(--text-3); }
.crumb { color: var(--text-3); }
.job-title { font-weight: 600; font-size: 14px; }
.spacer { flex: 1; }
/* `hidden` must win, so the display lives in a class rather than inline. */
.job-actions { display: flex; gap: 8px; align-items: center; }
.job-actions[hidden] { display: none; }
.icon-btn {

}

.wrap { max-width: 1220px; margin: 0 auto; padding: 24px 18px 80px; }

/* ── jobs home ── */
.page-head { display: flex; align-items: flex-end; gap: 16px; margin-bottom: 20px; flex-wrap: wrap; }
.page-title { font-size: 22px; font-weight: 700; letter-spacing: -.3px;
  display: flex; align-items: center; gap: 4px; }
.page-title .icon-btn { font-size: 13px; }
.page-sub { color: var(--text-2); font-size: 13px; margin-top: 3px; }

.jobs-grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
.job-card {

.job-card:hover { border-color: var(--border-2); box-shadow: var(--shadow); }

.job-card .meta { font-size: 12px; color: var(--text-3); margin-bottom: 12px; }
.job-del {

  border: none; background: transparent; color: var(--text-3); cursor: pointer; opacity: 0; font-size: 14px;
}
.job-card:hover .job-del { opacity: 1; }
.job-del:hover { background: var(--red-sf); color: var(--red); }
.bar { height: 6px; border-radius: 3px; background: var(--surface-3); display: flex; overflow: hidden; }
.bar > span { display: block; height: 100%; }
.legend { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; font-size: 11.5px; color: var(--text-2); }
.legend i { width: 8px; height: 8px; border-radius: 2px; display: inline-block; margin-right: 5px; vertical-align: 0; }
.new-card {

}

.new-card .plus { font-size: 24px; line-height: 1; }

.empty {
  text-align: center; padding: 64px 20px; color: var(--text-3);
  border: 1px dashed var(--border-2); border-radius: var(--radius); background: var(--surface);
}
.empty h3 { font-size: 15px; color: var(--text); margin-bottom: 6px; font-weight: 600; }

/* ── job workspace ── */
.toolbar {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  margin-bottom: 14px;
}
.seg { display: flex; background: var(--surface-2); border: 1px solid var(--border); border-radius: 7px; padding: 2px; }
.seg button {
  border: none; background: transparent; padding: 5px 12px; border-radius: 5px;
  cursor: pointer; font-size: 13px; font-weight: 500; color: var(--text-2);
}
.seg button.on { background: var(--surface); color: var(--text); box-shadow: var(--shadow); font-weight: 600; }
.seg button .n { color: var(--text-3); font-size: 11.5px; margin-left: 5px; }

.search { position: relative; flex: 1; min-width: 180px; max-width: 340px; }
.search input { padding-left: 30px; }
.search::before {
  content: "⌕"; position: absolute; left: 10px; top: 50%; transform: translateY(-50%);
  color: var(--text-3); font-size: 15px; pointer-events: none;
}

/* ── spec files bar ── */
.spec-bar {
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;

}
.spec-bar-label {
  font-size: 11px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase;
  color: var(--text-3); margin-right: 2px;
}
.spec-chip {
  display: inline-flex; align-items: center; border: 1px solid var(--border);
  background: var(--surface-2); border-radius: 999px; overflow: hidden;
}
.spec-chip .open {

  padding: 5px 10px 5px 12px; cursor: pointer; font-size: 12.5px; max-width: 340px;
}
.spec-chip .open:hover { background: var(--accent-sf); color: var(--accent); }
.spec-chip .open b { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.spec-chip .open .meta { color: var(--text-3); font-size: 11.5px; white-space: nowrap; }
.spec-chip .kill {
  border: none; border-left: 1px solid var(--border); background: transparent;
  color: var(--text-3); cursor: pointer; padding: 5px 9px; font-size: 12px;
}
.spec-chip .kill:hover { background: var(--red-sf); color: var(--red); }

.choice-btn {
  display: block; width: 100%; text-align: left; border: 1px solid var(--border);

}
.choice-btn:hover { border-color: var(--accent); background: var(--accent-sf); }
.choice-btn b { display: block; font-weight: 600; font-size: 13.5px; }
.choice-btn span { color: var(--text-2); font-size: 12.5px; }
.choice-btn.danger:hover { border-color: var(--red); background: var(--red-sf); }
.choice-btn.danger b { color: var(--red); }

.chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
.chip {
  border: 1px solid var(--border); background: var(--surface); border-radius: 999px;
  padding: 4px 11px; font-size: 12px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
  color: var(--text-2);
}
.chip:hover { border-color: var(--border-2); }
.chip.on { border-color: currentColor; }
.chip i { width: 8px; height: 8px; border-radius: 2px; display: inline-block; }
.chip .n { font-variant-numeric: tabular-nums; font-weight: 600; }

/* ── table ── */
/* No overflow:hidden here — it would turn the card into a scroll container and

.table-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); }
table { width: 100%; border-collapse: collapse; }
thead th:first-child { border-top-left-radius: var(--radius); }
thead th:last-child { border-top-right-radius: var(--radius); }

tbody tr:last-child td:last-child { border-bottom-right-radius: var(--radius); }
thead th {

  color: var(--text-3); font-weight: 600; padding: 9px 12px; background: var(--surface-2);

}

.divhead td {

}
.num { text-align: center; font-variant-numeric: tabular-nums; }
.pill {
  display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border-radius: 999px;
  font-size: 11.5px; font-weight: 600; white-space: nowrap;
}
.pill i { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.dot-count { display: inline-flex; align-items: center; gap: 4px; color: var(--text-2); font-size: 12.5px; }
.dot-count.zero { color: var(--text-3); opacity: .55; }
.st-select {
  border: 1px solid var(--border); border-radius: 6px; padding: 4px 6px; font-size: 12.5px;
  background: var(--surface); cursor: pointer; max-width: 172px; font-weight: 500;
}
.flag {
  font-size: 10px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase;
  padding: 1px 5px; border-radius: 3px; background: var(--amber-sf); color: var(--amber); margin-left: 6px;
}

/* ── drawer ── */
.scrim { position: fixed; inset: 0; background: rgba(15,18,22,.42); z-index: 90; }
.drawer {
  position: fixed; top: 0; right: 0; bottom: 0; width: min(620px, 100%);
  background: var(--bg); z-index: 91; display: flex; flex-direction: column;
  box-shadow: var(--shadow-lg); animation: slide .18s ease-out;
}
@keyframes slide { from { transform: translateX(24px); opacity: .4 } to { transform: none; opacity: 1 } }
.drawer-head {
  padding: 14px 18px; border-bottom: 1px solid var(--border); background: var(--surface);
  display: flex; align-items: flex-start; gap: 12px;
}
.drawer-head .num { font-family: var(--mono); font-size: 12.5px; color: var(--text-2); text-align: left; }
.drawer-head h2 { font-size: 16px; font-weight: 650; letter-spacing: -.2px; margin-top: 2px; }
.drawer-body { flex: 1; overflow-y: auto; padding: 16px 18px 60px; }
.sec { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; margin-bottom: 14px; }
.sec h4 {
  font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--text-3);
  font-weight: 700; margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between; gap: 8px;

.status-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 7px; }
.status-opt {
  display: flex; align-items: center; gap: 8px; border: 1px solid var(--border);

}
.status-opt:hover { border-color: var(--border-2); }
.status-opt.on { border-color: currentColor; }
.status-opt i { width: 9px; height: 9px; border-radius: 50%; background: currentColor; flex: none; }
.status-opt span { color: var(--text); }
.status-opt.on span { color: currentColor; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 11px; }
.field { margin-bottom: 11px; }

.drop {
  border: 1px dashed var(--border-2); border-radius: 7px; padding: 14px; text-align: center;
  color: var(--text-2); font-size: 12.5px; cursor: pointer; background: var(--surface-2);
}
.drop:hover, .drop.over { border-color: var(--accent); color: var(--accent); background: var(--accent-sf); }

.file-row {
  display: flex; align-items: center; gap: 10px; padding: 9px 10px; border: 1px solid var(--border);
  border-radius: 7px; margin-bottom: 7px; background: var(--surface-2);
}
.file-row .fi { font-size: 17px; flex: none; }
.file-row .fn { flex: 1; min-width: 0; }
.file-row .fn b { display: block; font-weight: 550; font-size: 13px; overflow: hidden;
  text-overflow: ellipsis; white-space: nowrap; }
.file-row .fn small { color: var(--text-3); font-size: 11.5px; }
.rev-tag {
  font-family: var(--mono); font-size: 11px; background: var(--surface-3); color: var(--text-2);
  border-radius: 4px; padding: 1px 5px; flex: none;
}

.req-group { margin-bottom: 12px; }
.req-group:last-child { margin-bottom: 0; }
.req-kind {
  font-size: 11px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase;
  color: var(--accent); margin-bottom: 6px;
}
.req-item { display: flex; gap: 8px; padding: 5px 0; border-top: 1px solid var(--border); font-size: 13px; }
.req-item:first-of-type { border-top: none; }
.req-item .rl { font-weight: 600; flex: none; max-width: 46%; }
.req-item .rt { color: var(--text-2); font-size: 12.5px; }
.muted { color: var(--text-3); font-size: 12.5px; }

/* ── modal ── */
.modal-scrim { position: fixed; inset: 0; background: rgba(15,18,22,.55); z-index: 100;
  display: grid; place-items: center; padding: 20px; }
.modal {
  background: var(--surface); border-radius: 12px; box-shadow: var(--shadow-lg);
  width: min(620px, 100%); max-height: 88vh; display: flex; flex-direction: column; overflow: hidden;
}
.modal.wide { width: min(1100px, 100%); height: 90vh; }
.modal-head { padding: 14px 18px; border-bottom: 1px solid var(--border); display: flex;
  align-items: center; gap: 12px; }
.modal-head h3 { font-size: 15px; font-weight: 650; flex: 1; overflow: hidden;
  text-overflow: ellipsis; white-space: nowrap; }
.modal-body { padding: 18px; overflow-y: auto; flex: 1; }
.modal-body.flush { padding: 0; background: var(--surface-2); }
.modal-foot { padding: 12px 18px; border-top: 1px solid var(--border); display: flex;
  justify-content: flex-end; gap: 8px; }
.modal-body iframe { width: 100%; height: 100%; border: none; background: var(--surface-2); }

.progress { height: 6px; border-radius: 3px; background: var(--surface-3); overflow: hidden; margin-top: 10px; }
.progress > div { height: 100%; background: var(--accent); width: 0; transition: width .15s; }

.review-list { max-height: 46vh; overflow-y: auto; border: 1px solid var(--border);
  border-radius: 7px; margin-top: 12px; }
.review-row { display: flex; align-items: center; gap: 9px; padding: 7px 11px;
  border-bottom: 1px solid var(--border); font-size: 13px; }
.review-row:last-child { border-bottom: none; }
.review-row .rn { font-family: var(--mono); font-size: 12px; color: var(--text-2); width: 88px; flex: none; }
.review-row .rt { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.review-head { background: var(--surface-2); font-weight: 700; font-size: 11px;
  text-transform: uppercase; letter-spacing: .05em; color: var(--text-2); }

.toast {
  position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%) translateY(16px);
  background: var(--text); color: var(--bg); padding: 10px 18px; border-radius: 8px;
  font-size: 13px; font-weight: 500; opacity: 0; pointer-events: none; transition: .18s; z-index: 200;
  box-shadow: var(--shadow-lg); max-width: 90vw; text-align: center;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.toast.err { background: var(--red); color: #fff; }

/* Sections marked Not Required sink to the bottom and read as struck out. */
tbody tr.row-na td { opacity: .55; }
tbody tr.row-na .c-title > span:first-child,
tbody tr.row-na .c-num { text-decoration: line-through; }
.drawer-head.is-na h2 { text-decoration: line-through; opacity: .6; }

.banner {
  border-radius: var(--radius); padding: 12px 14px; margin-bottom: 16px;
  font-size: 13px; display: flex; gap: 12px; align-items: flex-start;
  background: var(--red-sf); color: var(--red); border: 1px solid currentColor;
}
.banner.info { background: var(--accent-sf); color: var(--accent); }
.banner > div { flex: 1; }
.banner b { display: block; margin-bottom: 3px; }
.banner code {
  font-family: var(--mono); font-size: 11.5px; background: var(--surface);
  padding: 1px 5px; border-radius: 4px; color: var(--text-2);
}
.sync-dot {
  width: 7px; height: 7px; border-radius: 50%; background: var(--green);
  display: inline-block; margin-right: 6px;

<script>
"use strict";
/* ═══════════════════════════════════════════════════════════════════════════
   SUBMITTAL REGISTER
   A local-first log for Division 22 / 23 spec sections, submittals and
   submittal responses. No server, no API keys — the PDFs and the log live in
   this browser (IndexedDB).
   ═══════════════════════════════════════════════════════════════════════════ */

const APP_VERSION = 'v2.0';
document.getElementById('verLabel').textContent = APP_VERSION;
if (window.pdfjsLib) {
  pdfjsLib.GlobalWorkerOptions.workerSrc =
    'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
}

/* ───────────────────────── statuses ───────────────────────── */
const STATUSES = [
  { id: 'not_started',     label: 'Not Started',        short: 'Not Started',    color: 'grey'  },
  { id: 'waiting_vendor',  label: 'Waiting on Vendor',  short: 'Waiting',        color: 'amber' },
  { id: 'submitted_gc',    label: 'Submitted to GC',    short: 'Submitted',      color: 'blue'  },
  { id: 'approved',        label: 'Approved',           short: 'Approved',       color: 'green' },
  { id: 'revise_resubmit', label: 'Revise & Resubmit',  short: 'Revise',         color: 'red'   },
  { id: 'na',              label: 'Not Required',       short: 'N/A',            color: 'grey'  }
];
const ST = Object.fromEntries(STATUSES.map(s => [s.id, s]));
const cvar = c => `var(--${c})`;
const csf  = c => `var(--${c}-sf)`;

const DIVISION_NAMES = { '22': 'Plumbing', '23': 'HVAC' };
const DIVISIONS = ['22', '23'];

/* ═══════════════════════════════════════════════════════════════════════════
   1. SPEC PARSER
   Three independent signals are read out of the PDF and cross-checked:
     A. running page headers/footers  "DUCT INSULATION 23 07 13 - 4"
     B. body headings                 "SECTION 23 07 13 - DUCT INSULATION"
     C. the table of contents         "Section 23 0713 Duct Insulation"
   Signal A states which section every page belongs to, which is what lets the
   parser throw out cross references such as "…comply with Section 23 21 13."
   ═══════════════════════════════════════════════════════════════════════════ */

/* --- line reconstruction: pdf.js gives positioned runs, not lines --- */
function pageItemsToLines(items) {
  const rows = [];
  for (const it of items) {
    if (!it.str || !it.str.trim()) continue;
    const x = it.transform[4], y = it.transform[5];
    const h = Math.abs(it.transform[3]) || 10;
    let row = null;
    for (const r of rows) if (Math.abs(r.y - y) <= Math.max(1.2, h * 0.2)) { row = r; break; }
    if (!row) { row = { y, items: [] }; rows.push(row); }
    row.items.push({ x, w: it.width || 0, s: it.str });
  }
  rows.sort((a, b) => b.y - a.y);
  const lines = [];
  for (const r of rows) {
    r.items.sort((a, b) => a.x - b.x || b.w - a.w);
    const kept = [];
    for (const it of r.items) {
      // Drop runs drawn on top of an already-placed run: PDFs sometimes stack a
      // stray running-title layer over the real heading.
      let covered = false;
      for (const k of kept) {
        const ov = Math.min(it.x + it.w, k.x + k.w) - Math.max(it.x, k.x);
        if (ov > 0 && (it.w === 0 || ov / Math.max(it.w, 0.01) > 0.6)) { covered = true; break; }
      }
      if (!covered) kept.push(it);
    }
    let line = '', prevEnd = null;
    for (const it of kept) {
      if (prevEnd !== null && it.x - prevEnd > 1.2) line += ' ';
      line += it.s;
      prevEnd = it.x + it.w;
    }
    line = line.replace(/\s+/g, ' ').trim();
    if (line) lines.push(line);
  }
  return lines;
}

/* --- section-number helpers --- */
const NUM_RE = '(\\d{2}\\s?\\d{2}\\s?\\d{2}(?:\\s?\\.\\s?\\d{1,3})?)';
function normNum(raw) {
  const m = String(raw).replace(/[\s ]/g, '').match(/^(\d{6})(\.\d{1,3})?$/);
  return m ? m[1] + (m[2] || '') : null;
}
function prettyNum(key) {
  if (!key) return '';
  const [base, dec] = String(key).split('.');
  return base.slice(0, 2) + ' ' + base.slice(2, 4) + ' ' + base.slice(4, 6) + (dec ? '.' + dec : '');
}
const divOf = key => key ? String(key).slice(0, 2) : null;

/* --- title helpers --- */
const ACRONYMS = new Set(('HVAC AC DC VAV VFD VFC VRF AHU RTU FCU ERV HRV DDC BAS BMS EMS PVC CPVC ABS ' +
  'HDPE PEX PP FRP GRP CPE ASME ASTM ASHRAE NFPA UL AWWA ANSI NSF IEEE NEMA SMACNA AMCA TAB LPG LP RO DI ' +
  'UV BTU CFM GPM PSI HEPA IAQ DX HW CHW DHW O&M I/O USA US TV CO2 CO VRV MERV').split(' '));
const SMALL = new Set(('a an and as at but by for from in into nor of off on onto or over per the to up ' +
  'via with within').split(' '));

function smartTitleCase(str) {
  if (!str) return '';
  if (/[a-z]/.test(str)) return str.trim();          // already cased — leave alone
  const toks = str.toLowerCase().split(/(\s+)/);
  const total = toks.filter(t => t.trim()).length;
  let i = -1;
  return toks.map(tok => {
    if (!tok.trim()) return tok;
    i++;
    const idx = i;
    return tok.split(/([-\/&,()])/).map(part => {
      if (!/[a-z]/i.test(part)) return part;
      const up = part.toUpperCase();
      if (ACRONYMS.has(up)) return up;
      if (idx !== 0 && idx !== total - 1 && SMALL.has(part)) return part;
      return part.charAt(0).toUpperCase() + part.slice(1);
    }).join('');
  }).join('');
}
const titleKey = s => String(s || '').toUpperCase().replace(/&/g, ' AND ').replace(/[^A-Z0-9]+/g, ' ').trim();
function titleSim(a, b) {
  const A = titleKey(a).split(' ').filter(Boolean), B = titleKey(b).split(' ').filter(Boolean);
  if (!A.length || !B.length) return 0;
  const bag = new Map();
  for (const t of B) bag.set(t, (bag.get(t) || 0) + 1);
  let hit = 0;
  for (const t of A) if (bag.get(t)) { hit++; bag.set(t, bag.get(t) - 1); }
  return (2 * hit) / (A.length + B.length);
}
function stripEchoTail(t) {
  if (!t) return t;
  const w = t.split(' ');
  for (let take = Math.floor(w.length / 2); take >= 2; take--) {
    const tail = w.slice(w.length - take).join(' '), head = w.slice(0, w.length - take).join(' ');
    if (titleKey(head).includes(titleKey(tail))) return head;
  }
  return t;
}
function cleanTitle(t) {
  if (!t) return '';
  return stripEchoTail(String(t).replace(/\s+/g, ' ')
    .replace(/^[\s\-–—:.,"'“”]+/, '').replace(/[\s\-–—:.,"'“”]+$/, '')
    .replace(/\s*\.{3,}\s*\d*$/, '').trim()).trim();
}

/* --- structural line tests --- */
const PART_RE = /^PART\s+\d/i;
const ART_RE  = /^\d{1,2}\.\d{1,2}\b/;
const ITEM_RE = /^[A-Z]\.\s+/;
const SUB_RE  = /^\d{1,2}\.\s+/;
const END_RE  = new RegExp('^END\\s+OF\\s+SECTION(?:\\s+' + NUM_RE + ')?\\s*$', 'i');
const isStructural = l => PART_RE.test(l) || ART_RE.test(l) || END_RE.test(l) || ITEM_RE.test(l);

/* --- signal A: running headers / footers --- */
const RUN_RE = new RegExp('^\\s*(?:(.*?)[\\s.]+)?' + NUM_RE + '\\s*[-–—]\\s*(\\d{1,3})\\s*$');
function scanRunningTitles(pages) {
  const map = new Map();
  for (const page of pages) {
    const L = page.lines, zone = [];
    for (let i = 0; i < Math.min(4, L.length); i++) zone.push(L[i]);
    for (let i = Math.max(0, L.length - 4); i < L.length; i++) zone.push(L[i]);
    const cands = [];
    for (const raw of zone) {
      const m = RUN_RE.exec((raw || '').trim());
      if (!m) continue;
      const key = normNum(m[2]);
      if (!key) continue;
      const title = cleanTitle(m[1] || '');
      if (title.length > 90 || /[;,]$/.test(title)) continue;   // that was a sentence
      cands.push({ key, title, seq: parseInt(m[3], 10) });
    }
    if (cands.length) map.set(page.num, cands.find(c => c.title) || cands[0]);
  }
  return map;
}

/* --- signal B: body headings --- */
const HEAD_RE = new RegExp('SECTION\\s+' + NUM_RE + '\\s*[-–—:]?\\s*(.*)$', 'i');
function scanHeaders(pages) {
  const out = [];
  for (const page of pages) {
    for (let i = 0; i < page.lines.length; i++) {
      const line = page.lines[i].trim();
      if (!/SECTION/i.test(line) || /^END\s+OF\s+SECTION/i.test(line)) continue;
      const m = HEAD_RE.exec(line);
      if (!m) continue;
      const key = normNum(m[1]);
      if (!key) continue;

      // Anything before "SECTION" must be a stray layer, never prose.
      const pre = line.slice(0, m.index).trim();
      if (pre && (pre.length > 60 || /[a-z]/.test(pre))) continue;

      let title = cleanTitle(m[2]);
      // Title wrapped onto the next line: "...FOR PLUMBING PIPING AND" / "EQUIPMENT"
      const next = (page.lines[i + 1] || '').trim();
      if (next && !isStructural(next) && next.length <= 70 &&
          !/[a-z]/.test(next.replace(/\(s\)/g, '')) && /[A-Z]/.test(next) &&
          (!title || /\b(AND|OR|FOR|OF|THE|WITH|&|,|-)$/i.test(title) || title.length < 12)) {
        title = cleanTitle(title + ' ' + next);
      }

      let followedByPart = false;
      for (let j = i + 1; j < Math.min(i + 6, page.lines.length); j++) {
        const l = page.lines[j].trim();
        if (PART_RE.test(l) || ART_RE.test(l)) { followedByPart = true; break; }
      }
      const shouty = /^SECTION\b/.test(line.slice(m.index));   // headings shout, references don't
      const hasTitle = title.length >= 4;
      // Cross references quote a section then carry on in prose: "Section 23 33 00
      // for dampers, sound-control devices…". A heading never opens that way, and
      // it sits at the top of its page or shouts its title in capitals.
      const leadsIntoProse = /^(for|and|or|to|of|in|on|with|as|the|that|which|shall|where|when)\b/i.test(title);
      const capsTitle = hasTitle && !/[a-z]/.test(title.replace(/\(s\)/g, ''));
      const looksPlaced = i <= 4 || capsTitle || !hasTitle;
      out.push({ key, title, page: page.num, line: i,
        confirmed: ((shouty && (hasTitle || followedByPart)) || (hasTitle && followedByPart))
          && !leadsIntoProse && looksPlaced });
    }
  }
  return out;
}

/* --- signal C: table of contents --- */
const TOC_RE = new RegExp('^(?:Section|SECTION)\\s+' + NUM_RE + '[\\s.\\-–—:]+(.+)$');
const TOC_BARE_RE = new RegExp('^' + NUM_RE + '[\\s.\\-–—:]{2,}(.+)$');
function scanToc(pages, firstBodyPage) {
  const out = new Map();
  const limit = firstBodyPage ? Math.min(firstBodyPage - 1, 60) : 60;
  for (const page of pages) {
    if (page.num > limit) break;
    const rows = [];
    for (const raw of page.lines) {
      const m = TOC_RE.exec(raw.trim());
      if (m) rows.push(m);
    }
    const looksLikeIndex = rows.length >= 2 || page.lines.some(l => /TABLE\s+OF\s+CONTENTS/i.test(l));
    if (looksLikeIndex) {
      for (const raw of page.lines) {
        const line = raw.trim();
        if (TOC_RE.test(line)) continue;
        const m = TOC_BARE_RE.exec(line);
        if (m) rows.push(m);
      }
    }
    for (const m of rows) {
      const key = normNum(m[1]);
      if (!key) continue;
      const title = cleanTitle(m[2]).replace(/\s*\d{1,4}$/, '');
      if (!title || title.length < 3) continue;
      if (/^(comply|refer|see|as specified|and )/i.test(title)) continue;
      if (!out.has(key)) out.set(key, { key, title, page: page.num });
    }
  }
  return out;
}

/* --- submittal requirements (reference list, straight from PART 1) --- */
const SUB_ART_RE = /^(\d{1,2}\.\d{1,2})\s+(.*\bSUBMITTALS?\b.*)$/i;
function classifyArticle(name) {
  const n = name.toUpperCase();
  if (n.includes('ACTION')) return 'Action';
  if (n.includes('INFORMATIONAL')) return 'Informational';
  if (n.includes('CLOSEOUT')) return 'Closeout';
  if (n.includes('MAINTENANCE')) return 'Maintenance Material';
  if (n.includes('TRAINING')) return 'Training';
  return 'Submittals';
}
function extractRequirements(lines) {
  const groups = [];
  for (let i = 0; i < lines.length; i++) {
    const m = SUB_ART_RE.exec(lines[i].trim());
    if (!m) continue;
    const heading = m[2];
    const group = { article: m[1], name: cleanTitle(heading.replace(/:.*$/, '')), kind: classifyArticle(heading), items: [] };
    // "1.03 SUBMITTALS: Comply with Section 01 30 00."
    const inline = heading.match(/:\s*(.+)$/);
    if (inline && inline[1].trim().length > 3) group.items.push({ label: '', text: inline[1].trim() });
    let cur = null;
    for (let j = i + 1; j < lines.length; j++) {
      const line = lines[j].trim();
      if (!line) continue;
      if (ART_RE.test(line) || PART_RE.test(line) || END_RE.test(line)) break;
      if (ITEM_RE.test(line)) { cur = { label: '', text: line.replace(ITEM_RE, '').trim() }; group.items.push(cur); }
      else if (cur) cur.text += (SUB_RE.test(line) ? '  ' : ' ') + line;
    }
    for (const it of group.items) {
      it.text = it.text.replace(/\s+/g, ' ').trim();
      const lead = it.text.match(/^([^:.]{2,70})[:.]\s*/);
      it.label = cleanTitle(lead ? lead[1] : it.text.slice(0, 60));
      it.detail = lead ? it.text.slice(lead[0].length).trim() : '';
    }
    if (group.items.length) groups.push(group);
  }
  return groups;
}

/* --- "Section Includes:" scope list --- */
function extractIncludes(lines) {
  const out = [];
  for (let i = 0; i < lines.length && out.length < 14; i++) {
    if (!/^\d{1,2}\.\d{1,2}\s+SUMMARY\b/i.test(lines[i].trim())) continue;
    for (let j = i + 1; j < Math.min(i + 40, lines.length); j++) {
      const line = lines[j].trim();
      if (ART_RE.test(line) || PART_RE.test(line)) break;
      if (SUB_RE.test(line)) {
        const t = cleanTitle(line.replace(SUB_RE, ''));
        if (t.length > 2 && t.length < 140) out.push(t);
      }
    }
    break;
  }
  return out;
}

/* --- repeated page furniture (project banner, sheet stamps, …) ---
   Whatever line sits at the top or bottom of most pages is boilerplate, not
   spec text. Found by counting rather than by name, so it works on any job. */
function findBoilerplate(pages) {
  const seen = new Map();
  for (const page of pages) {
    const L = page.lines, n = L.length;
    for (let i = 0; i < n; i++) {          // every line, so a mid-page use disqualifies
      const t = L[i].trim();
      if (!t || t.length > 140) continue;
      if (isStructural(t) || HEAD_RE.test(t) || RUN_RE.test(t)) continue;
      if (/[.;:]$/.test(t)) continue;      // a sentence, not a page banner
      let rec = seen.get(t);
      if (!rec) seen.set(t, rec = { n: 0, top: 0, bot: 0 });
      rec.n++;
      rec.top = Math.max(rec.top, i);
      rec.bot = Math.max(rec.bot, n - 1 - i);
    }
  }
  // Real furniture keeps the same slot on every page. A paragraph line that
  // happens to land near a page edge does not, so it survives.
  const out = new Set();
  for (const [line, r] of seen) if (r.n >= 3 && (r.top <= 1 || r.bot <= 1)) out.add(line);
  return out;
}

/* --- main parse --- */
function parseSpec(pages, wantedDivs) {
  const wanted = new Set(wantedDivs || DIVISIONS);
  const running = scanRunningTitles(pages);

  // A heading found on a page that the running titles assign to another
  // section is a cross reference inside the prose — drop it.
  const headers = scanHeaders(pages).filter(h => {
    const r = running.get(h.page);
    return !r || r.key === h.key;
  });

  const bodyHeaders = headers.filter(h => h.confirmed && wanted.has(divOf(h.key)));
  const firstBodyPage = bodyHeaders.length ? Math.min.apply(null, bodyHeaders.map(h => h.page)) : null;
  const toc = scanToc(pages, firstBodyPage);

  const pagesByKey = new Map(), runTitles = new Map();
  for (const [pnum, info] of running) {
    if (!wanted.has(divOf(info.key))) continue;
    if (!pagesByKey.has(info.key)) pagesByKey.set(info.key, []);
    pagesByKey.get(info.key).push(pnum);
    if (info.title) {
      if (!runTitles.has(info.key)) runTitles.set(info.key, new Map());
      const bag = runTitles.get(info.key);
      bag.set(info.title, (bag.get(info.title) || 0) + 1);
    }
  }

  const cand = new Map();
  const bump = (key, src, data) => {
    if (!wanted.has(divOf(key))) return;
    if (!cand.has(key)) cand.set(key, { key, headers: [], toc: null, pages: [] });
    const c = cand.get(key);
    if (src === 'header') c.headers.push(data);
    if (src === 'toc') c.toc = data;
    if (src === 'running') c.pages = data;
  };
  for (const h of headers) if (h.confirmed) bump(h.key, 'header', h);
  for (const [key, t] of toc) bump(key, 'toc', t);
  for (const [key, pgs] of pagesByKey) bump(key, 'running', pgs.sort((a, b) => a - b));

  const sections = [];
  for (const c of cand.values()) {
    const hdr = c.headers.find(h => h.confirmed) || c.headers[0] || null;
    const inBody = !!(hdr || c.pages.length);
    if (!inBody && !c.toc) continue;

    /* title vote across the three signals */
    let runTitle = null;
    if (runTitles.has(c.key)) runTitle = Array.from(runTitles.get(c.key).entries())
      .sort((a, b) => b[1] - a[1])[0][0];
    const opts = [];
    if (hdr && hdr.title) opts.push({ src: 'heading', text: hdr.title });
    if (runTitle) opts.push({ src: 'page header', text: runTitle });
    if (c.toc) opts.push({ src: 'contents', text: c.toc.title });
    let title = '', titleSrc = 'none';
    if (opts.length) {
      const weight = { 'page header': 1.02, 'heading': 1.0, 'contents': 0.98 };
      let best = null;
      for (const o of opts) {
        let s = 0;
        for (const p of opts) if (p !== o) s += titleSim(o.text, p.text);
        s = (opts.length > 1 ? s / (opts.length - 1) : 0.5) * weight[o.src];
        if (!best || s > best.s) best = { s, o };
      }
      title = best.o.text; titleSrc = best.o.src;
    }

    /* page range — longest near-consecutive run, preferring the heading's page */
    let startPage = null, endPage = null;
    if (c.pages.length) {
      const runs = [[c.pages[0]]];
      for (let i = 1; i < c.pages.length; i++) {
        if (c.pages[i] - c.pages[i - 1] <= 3) runs[runs.length - 1].push(c.pages[i]);
        else runs.push([c.pages[i]]);
      }
      const pick = (hdr && runs.find(r => hdr.page >= r[0] - 1 && hdr.page <= r[r.length - 1]))
        || runs.slice().sort((a, b) => b.length - a.length)[0];
      startPage = pick[0]; endPage = pick[pick.length - 1];
    }
    if (hdr) startPage = Math.min(startPage == null ? hdr.page : startPage, hdr.page);

    sections.push({
      key: c.key, number: prettyNum(c.key), division: divOf(c.key),
      title: smartTitleCase(title), rawTitle: title, titleSource: titleSrc,
      startPage, endPage, inBody, inToc: !!c.toc,
      confidence: (hdr && hdr.confirmed ? 1 : 0) + (c.pages.length ? 1 : 0) + (c.toc ? 1 : 0)
    });
  }
  sections.sort((a, b) => String(a.key).localeCompare(String(b.key), undefined, { numeric: true }));

  /* body-derived extras */
  const byNum = new Map(pages.map(p => [p.num, p]));
  const boiler = findBoilerplate(pages);
  const headingPages = Array.from(new Set(headers.filter(h => h.confirmed).map(h => h.page)))
    .sort((a, b) => a - b);
  for (let i = 0; i < sections.length; i++) {
    const s = sections[i];
    s.requirements = []; s.includes = [];
    if (!s.inBody || s.startPage == null) continue;
    let to = s.endPage;
    if (to == null) {
      // No running footers to bound the section — stop where the next heading
      // starts, in any division, so the last tracked section does not swallow
      // the rest of the manual.
      const nxt = sections.slice(i + 1).find(x => x.inBody && x.startPage != null);
      const nextAny = headingPages.find(p => p > s.startPage);
      to = (pages[pages.length - 1] || {}).num;
      if (nxt) to = Math.min(to, nxt.startPage - 1);
      if (nextAny) to = Math.min(to, nextAny - 1);
      to = Math.max(s.startPage, to);
      s.endPage = to;
    }
    const lines = [];
    for (let p = s.startPage; p <= to; p++) {
      const pg = byNum.get(p);
      if (!pg) continue;
      const n = pg.lines.length;
      for (let li = 0; li < n; li++) {
        const t = pg.lines[li].trim();
        if (!t) continue;
        const inZone = li < 3 || li >= n - 3;
        if (inZone && boiler.has(t)) continue;                      // page furniture
        if (t.length < 120 && RUN_RE.test(t)) continue;             // running header/footer
        if (/^Page\s+\d+\s+of\s+\d+$/i.test(t)) continue;
        lines.push(t);
      }
    }
    const hi = lines.findIndex(l => {
      const m = HEAD_RE.exec(l);
      return m && normNum(m[1]) === s.key;
    });
    if (hi > 0) lines.splice(0, hi);
    s.requirements = extractRequirements(lines);
    s.includes = extractIncludes(lines);
  }

  return {
    sections,
    diagnostics: {
      totalPages: pages.length, headings: headers.length,
      tocEntries: toc.size, pagesMapped: running.size, sections: sections.length
    }
  };
}

/* ═══════════════════════════════════════════════════════════════════════════
   2. STORAGE — Firestore for the register, Cloud Storage for the PDFs

     jobs/{jobId}                      name, number, spec files, roll-up counts
     jobs/{jobId}/sections/{sectionKey} one document per spec section

   Sections are separate documents so two people editing different sections at
   the same time cannot overwrite each other.
   ═══════════════════════════════════════════════════════════════════════════ */
let FB = null;                 // the Firebase handles, once the module has run
let syncState = 'wait';        // wait | live | error
let syncMessage = '';

function fbReady() {
  return new Promise(res => {
    if (window.FB) return res(window.FB);
    window.addEventListener('fb-ready', () => res(window.FB), { once: true });
  });
}

const jobsCol = () => FB.collection(FB.db, 'jobs');
const jobRef = id => FB.doc(FB.db, 'jobs', id);
const sectionsCol = jobId => FB.collection(FB.db, 'jobs', jobId, 'sections');
const sectionRef = (jobId, key) => FB.doc(FB.db, 'jobs', jobId, 'sections', String(key));

/* Firestore rejects undefined; strip it rather than let a write fail. */
function clean(v) {
  if (Array.isArray(v)) return v.map(clean);
  if (v && typeof v === 'object') {
    const out = {};
    for (const k of Object.keys(v)) { if (v[k] !== undefined) out[k] = clean(v[k]); }
    return out;
  }
  return v === undefined ? null : v;
}

/* ── job documents ── */
function jobSummary(j) {
  const secs = sectionsOf(j);
  const tally = {};
  STATUSES.forEach(st => tally[st.id] = 0);
  let bytes = 0;
  for (const sp of (j.specs || [])) bytes += sp.size || 0;
  for (const s of secs) {
    tally[s.status || 'not_started']++;
    for (const d of (s.submittals || []).concat(s.responses || [])) bytes += d.size || 0;
  }
  return { count: secs.length, tally, bytes };
}

/* A snapshot that was generated before a local change must not overwrite it.
   Anything mid-edit is held back until its write lands. */
let jobEditDepth = 0;
const pendingSections = new Set();
function beginJobEdit() { jobEditDepth++; }
function endJobEdit() { jobEditDepth = Math.max(0, jobEditDepth - 1); }
function markPending(key) { if (key) pendingSections.add(key); }

async function saveJobMeta(j) {
  const target = j || job;
  if (!target) return;
  target.updated = Date.now();
  target.summary = jobSummary(target);
  await FB.setDoc(jobRef(target.id), clean({
    id: target.id,
    name: target.name,
    number: target.number || '',
    created: target.created,
    updated: target.updated,
    specs: target.specs || [],
    summary: target.summary
  }));
}

async function saveSection(s) {
  if (!job || !s) return;
  markPending(s.key);
  try {
    await FB.setDoc(sectionRef(job.id, s.key), clean(s));
    await saveJobMeta();
  } finally { pendingSections.delete(s.key); }
}

async function saveSections(list) {
  if (!job || !list.length) return;
  list.forEach(s => markPending(s.key));
  try {
    for (let i = 0; i < list.length; i += 400) {         // Firestore caps a batch at 500
      const batch = FB.writeBatch(FB.db);
      for (const s of list.slice(i, i + 400)) batch.set(sectionRef(job.id, s.key), clean(s));
      await batch.commit();
    }
    await saveJobMeta();
  } finally { list.forEach(s => pendingSections.delete(s.key)); }
}

async function deleteSectionDocs(jobId, keys) {
  for (let i = 0; i < keys.length; i += 400) {
    const batch = FB.writeBatch(FB.db);
    for (const k of keys.slice(i, i + 400)) batch.delete(sectionRef(jobId, k));
    await batch.commit();
  }
}

/* ── PDFs, stored in Firestore ──────────────────────────────────────────────
   Cloud Storage needs a billing account, so files go in Firestore instead:

     files/{fileId}              name, size, type, chunk count
     files/{fileId}/chunks/{n}   ~600 KB of base64 each

   A Firestore document holds just under 1 MiB, hence the chunking. Chunks are
   written once and never change, so reads come from the local cache and cost
   nothing after the first time.
   ────────────────────────────────────────────────────────────────────────── */
const uid = p => (p || 'id') + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);

const CHUNK_CHARS = 600000;        // base64 characters per document; a multiple of 4
const FREE_TIER_BYTES = 1024 * 1024 * 1024;
const blobUrlCache = new Map();    // fileId -> object URL, for this session

const fileRef = id => FB.doc(FB.db, 'files', id);
const chunksCol = id => FB.collection(FB.db, 'files', id, 'chunks');

function fileToBase64(file) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(String(r.result).split(',')[1] || '');
    r.onerror = () => rej(r.error);
    r.readAsDataURL(file);
  });
}

async function putFile(file, meta, onProgress) {
  const id = uid('file');
  const b64 = await fileToBase64(file);
  const parts = [];
  for (let i = 0; i < b64.length; i += CHUNK_CHARS) parts.push(b64.slice(i, i + CHUNK_CHARS));

  // One document per chunk, a few at a time: a batch would blow the request
  // size limit long before it hit the 500-operation limit.
  let done = 0;
  const queue = parts.map((text, i) => async () => {
    await FB.setDoc(FB.doc(chunksCol(id), String(i).padStart(4, '0')), { i, b: text });
    if (onProgress) onProgress(++done / parts.length);
  });
  const workers = Array.from({ length: Math.min(4, queue.length) }, async () => {
    while (queue.length) await (queue.shift())();
  });
  await Promise.all(workers);

  await FB.setDoc(fileRef(id), clean(Object.assign({
    id, name: file.name, size: file.size, type: file.type || 'application/pdf',
    chunks: parts.length, created: Date.now()
  }, meta || {})));
  return id;
}

async function readFileBlob(fileId) {
  if (!fileId) return null;
  const col = chunksCol(fileId);
  let snap = null;
  // Chunks never change, so a cache hit is always correct — and free.
  try {
    snap = await FB.getDocsFromCache(col);
    if (snap.empty) snap = null;
  } catch (e) { snap = null; }
  if (!snap) snap = await FB.getDocs(col);
  if (snap.empty) return null;

  const rows = snap.docs.map(d => d.data()).sort((a, b) => (a.i || 0) - (b.i || 0));
  const parts = rows.map(r => {
    const bin = atob(r.b || '');
    const arr = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    return arr;
  });
  const meta = await FB.getDoc(fileRef(fileId));
  const type = (meta.exists() && meta.data().type) || 'application/pdf';
  return new Blob(parts, { type });
}

async function fileUrl(fileId) {
  if (!fileId) return null;
  if (blobUrlCache.has(fileId)) return blobUrlCache.get(fileId);
  const blob = await readFileBlob(fileId);
  if (!blob) return null;
  const url = URL.createObjectURL(blob);
  blobUrlCache.set(fileId, url);
  return url;
}

async function deleteStoredFile(fileId) {
  if (!fileId) return;
  if (blobUrlCache.has(fileId)) {
    URL.revokeObjectURL(blobUrlCache.get(fileId));
    blobUrlCache.delete(fileId);
  }
  try {
    const snap = await FB.getDocs(chunksCol(fileId));
    const keys = snap.docs.map(d => d.id);
    for (let i = 0; i < keys.length; i += 400) {
      const batch = FB.writeBatch(FB.db);
      for (const k of keys.slice(i, i + 400)) batch.delete(FB.doc(chunksCol(fileId), k));
      await batch.commit();
    }
    await FB.deleteDoc(fileRef(fileId));
  } catch (e) { /* already gone */ }
}

function storageError(e) {
  const code = (e && e.code) || '';
  if (code.includes('permission-denied')) return 'Firestore refused the write — paste the security rules in the Firebase console.';
  if (code.includes('resource-exhausted')) return 'This Firebase project has hit its free-tier limit for the day.';
  if (code.includes('unavailable')) return 'No connection — the upload will finish when you are back online.';
  return 'Upload failed: ' + (e && (e.message || e.code) || e);
}

function usedBytes() {
  return jobs.reduce((n, j) => n + ((j.summary && j.summary.bytes) || 0), 0);
}

/* ═══════════════════════════════════════════════════════════════════════════
   3. STATE
   ═══════════════════════════════════════════════════════════════════════════ */
let jobs = [];            // job metadata, newest first
let job = null;           // open job
let view = 'jobs';
let divFilter = '22';
let statusFilter = null;
let query = '';
let openKey = null;       // section open in the drawer
let unsubJobs = null;
let unsubSections = null;

const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmtBytes = n => n < 1024 ? n + ' B'
  : n < 1048576 ? (n / 1024).toFixed(0) + ' KB'
  : (n / 1048576).toFixed(1) + ' MB';
const fmtDate = ts => ts ? new Date(ts).toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' }) : '';

function toast(msg, err) {
  const t = $('toast');
  t.textContent = msg;
  t.className = 'toast show' + (err ? ' err' : '');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => { t.className = 'toast'; }, err ? 5200 : 2400);
}
function stickyToast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.className = 'toast show';
  clearTimeout(toast._t);
}

function sectionsOf(j) { return (j && j.sections) || []; }
function findSection(key) { return sectionsOf(job).find(s => s.key === key); }

/* ── live sync ── */
function setSync(state, message) {
  syncState = state; syncMessage = message || '';
  renderSyncBanner();
}

function renderSyncBanner() {
  const host = $('syncBanner');
  if (!host) return;
  if (syncState !== 'error') { host.innerHTML = ''; return; }
  host.innerHTML = `<div class="banner">
    <div><b>Not connected to the shared register</b>${esc(syncMessage)}</div>
  </div>`;
}

function watchJobs() {
  if (unsubJobs) unsubJobs();
  unsubJobs = FB.onSnapshot(jobsCol(),
    snap => {
      const wasEmpty = !jobs.length;
      jobs = snap.docs.map(d => Object.assign({ id: d.id }, d.data()))
        .sort((a, b) => (b.updated || b.created || 0) - (a.updated || a.created || 0));
      setSync('live');
      if (job) {
        // Someone else may have renamed the job or added a spec file. Sections
        // have their own listener, so keep those.
        const fresh = jobs.find(x => x.id === job.id);
        if (fresh) {
          const stale = (fresh.updated || 0) < (job.updated || 0);
          if (!jobEditDepth && !stale) {
            job.name = fresh.name; job.number = fresh.number;
            job.specs = fresh.specs || []; job.summary = fresh.summary; job.updated = fresh.updated;
          }
          if (view === 'job') { $('crumbJob').textContent = job.name; renderJob(); }
        } else if (view === 'job' && !jobEditDepth) {
          toast('This job was deleted', true);
          go('jobs');
        }
      }
      if (view === 'jobs') renderJobs();
      if (wasEmpty) checkLocalCarryover();
    },
    err => {
      setSync('error', err && err.code === 'permission-denied'
        ? ' — Firestore refused the read. Paste firestore.rules into the Firebase console under Firestore Database → Rules, then reload.'
        : ' — ' + (err && err.message || err));
      if (view === 'jobs') renderJobs();
    });
}

function watchSections(jobId) {
  if (unsubSections) { unsubSections(); unsubSections = null; }
  unsubSections = FB.onSnapshot(sectionsCol(jobId),
    snap => {
      if (!job || job.id !== jobId) return;
      const incoming = snap.docs.map(d => d.data());
      const seen = new Set(incoming.map(x => x.key));
      const local = job.sections || [];
      job.sections = incoming.map(x => {
        if (!pendingSections.has(x.key)) return x;
        return local.find(y => y.key === x.key) || x;      // keep the edit in progress
      });
      // A section added locally but not yet written must survive too.
      for (const y of local) if (!seen.has(y.key) && pendingSections.has(y.key)) job.sections.push(y);
      sortSections();
      if (view === 'job') {
        renderJob();
        // Re-rendering while someone is typing in the drawer would eat the caret.
        const ae = document.activeElement;
        if (openKey && !(ae && ae.closest && ae.closest('.drawer'))) renderDrawer();
      }
    },
    err => setSync('error', ' — ' + (err && err.message || err)));
}

/* ── carry-over from the browser-only version ── */
async function readLocalJobs() {
  return new Promise(resolve => {
    let req;
    try { req = indexedDB.open('submittal_register'); } catch (e) { return resolve([]); }
    req.onerror = () => resolve([]);
    req.onsuccess = () => {
      const db = req.result;
      if (!db.objectStoreNames.contains('jobs')) { db.close(); return resolve([]); }
      const tx = db.transaction('jobs', 'readonly').objectStore('jobs').getAll();
      tx.onsuccess = () => { const out = tx.result || []; db.close(); resolve(out); };
      tx.onerror = () => { db.close(); resolve([]); };
    };
  });
}

async function readLocalBlob(blobId) {
  return new Promise(resolve => {
    let req;
    try { req = indexedDB.open('submittal_register'); } catch (e) { return resolve(null); }
    req.onerror = () => resolve(null);
    req.onsuccess = () => {
      const db = req.result;
      if (!db.objectStoreNames.contains('blobs')) { db.close(); return resolve(null); }
      const g = db.transaction('blobs', 'readonly').objectStore('blobs').get(blobId);
      g.onsuccess = () => { const r = g.result; db.close(); resolve(r ? r.blob : null); };
      g.onerror = () => { db.close(); resolve(null); };
    };
  });
}

let localCarryover = [];
async function checkLocalCarryover() {
  if (localStorage.getItem('sr_carryover_done')) return;
  const local = await readLocalJobs();
  localCarryover = local.filter(j => !jobs.some(x => x.id === j.id));
  if (localCarryover.length) renderLegacyNotice();
}

async function uploadCarryover() {
  const list = localCarryover.slice();
  if (!list.length) return;
  let done = 0, files = 0;
  const total = list.reduce((n, j) => n + 1 + sectionsOf(j).length, 0);
  const step = msg => stickyToast(msg);
  try {
    for (const lj of list) {
      const prev = job;
      job = lj;                                    // saveSection/saveJobMeta act on `job`
      for (const sp of (lj.specs || [])) {
        const blob = sp.blobId ? await readLocalBlob(sp.blobId) : null;
        if (blob) {
          step(`Uploading ${sp.name}…`);
          sp.fileId = await putFile(new File([blob], sp.name, { type: 'application/pdf' }),
            { jobId: lj.id, kind: 'spec' }, pct => step(`Uploading ${sp.name}… ${Math.round(pct * 100)}%`));
          sp.size = sp.size || blob.size; files++;
        }
        delete sp.blobId;
      }
      for (const s of sectionsOf(lj)) {
        for (const kind of ['submittals', 'responses']) {
          for (const d of (s[kind] || [])) {
            const blob = d.blobId ? await readLocalBlob(d.blobId) : null;
            if (blob) {
              step(`Uploading ${d.name}…`);
              d.fileId = await putFile(new File([blob], d.name, { type: 'application/pdf' }),
                { jobId: lj.id, sectionKey: s.key, kind }, pct => step(`Uploading ${d.name}… ${Math.round(pct * 100)}%`));
              d.size = d.size || blob.size; files++;
            }
            delete d.blobId;
          }
        }
      }
      step(`Saving ${lj.name}… (${++done} of ${list.length})`);
      await saveSections(sectionsOf(lj));
      await saveJobMeta(lj);
      job = prev;
    }
    localStorage.setItem('sr_carryover_done', '1');
    localCarryover = [];
    renderLegacyNotice();
    toast(`${list.length} job${list.length === 1 ? '' : 's'} and ${files} PDF${files === 1 ? '' : 's'} uploaded`);
  } catch (e) {
    console.error(e);
    toast(storageError(e), true);
  }
}

function dismissCarryover() {
  localStorage.setItem('sr_carryover_done', '1');
  localCarryover = [];
  renderLegacyNotice();
}

/* ═══════════════════════════════════════════════════════════════════════════
   4. NAVIGATION
   ═══════════════════════════════════════════════════════════════════════════ */
function go(where, id) {
  view = where;
  $('view-jobs').hidden = where !== 'jobs';
  $('view-job').hidden  = where !== 'job';
  $('jobActions').hidden = where !== 'job';
  $('crumb').hidden = where !== 'job';
  closeDrawer();
  if (where === 'jobs') {
    if (unsubSections) { unsubSections(); unsubSections = null; }
    job = null; $('crumbJob').textContent = ''; renderJobs();
  }
  else { renderJob(); }
  window.scrollTo(0, 0);
}

async function openJob(id) {
  const j = jobs.find(x => x.id === id);
  if (!j) { toast('Job not found', true); return; }
  job = Object.assign({}, j, { sections: [] });
  statusFilter = null; query = ''; $('searchBox').value = '';
  $('crumbJob').textContent = j.name;
  go('job');
  watchSections(job.id);          // sections stream in and re-render
}

/* ═══════════════════════════════════════════════════════════════════════════
   5. JOBS HOME
   ═══════════════════════════════════════════════════════════════════════════ */
function jobTally(j) {
  const t = {}; STATUSES.forEach(s => t[s.id] = 0);
  if (j.summary && j.summary.tally) Object.assign(t, j.summary.tally);
  else for (const s of sectionsOf(j)) t[s.status || 'not_started']++;
  return t;
}
function jobCount(j) {
  return (j.summary && typeof j.summary.count === 'number') ? j.summary.count : sectionsOf(j).length;
}

function renderJobs() {
  const grid = $('jobsGrid');
  let html = '';
  for (const j of jobs) {
    const count = jobCount(j);
    const t = jobTally(j);
    const total = count || 1;
    const bars = STATUSES.filter(s => t[s.id])
      .map(s => `<span style="width:${(t[s.id] / total * 100).toFixed(2)}%;background:${cvar(s.color)}"></span>`).join('');
    const legend = STATUSES.filter(s => t[s.id] && s.id !== 'not_started')
      .map(s => `<span><i style="background:${cvar(s.color)}"></i>${t[s.id]} ${esc(s.short)}</span>`).join('');
    html += `<div class="job-card" onclick="openJob('${j.id}')">
      <button class="job-del" title="Delete job" onclick="event.stopPropagation();deleteJob('${j.id}')">✕</button>
      <h3>${esc(j.name)}</h3>
      <div class="meta">${j.number ? '<b>' + esc(j.number) + '</b> · ' : ''}${count} section${count === 1 ? '' : 's'} · ${fmtDate(j.updated || j.created)}</div>
      <div class="bar">${bars || '<span style="width:100%;background:var(--surface-3)"></span>'}</div>
      <div class="legend">${legend || '<span class="muted">Nothing logged yet</span>'}</div>
    </div>`;
  }
  html += `<div class="job-card new-card" onclick="newJob()"><span class="plus">+</span><span>New job</span></div>`;
  grid.innerHTML = html;
  renderLegacyNotice();
  renderStorageNote();
}

function renderStorageNote() {
  const host = $('storageNote');
  const state = syncState === 'live'
    ? '<span class="sync-dot"></span>Synced — everyone on this workspace sees the same register, and changes appear live.'
    : syncState === 'error'
      ? '<span class="sync-dot off"></span>Not syncing. Changes you make now are held in this browser until the connection is fixed.'
      : '<span class="sync-dot wait"></span>Connecting…';
  const used = usedBytes();
  const pct = used / FREE_TIER_BYTES * 100;
  let line = `<br>PDFs are stored in Firestore — <b>${fmtBytes(used)}</b> of the ${fmtBytes(FREE_TIER_BYTES)} free allowance`;
  line += pct > 90 ? '. <b>Almost full</b> — delete a finished job before uploading more.'
        : pct > 70 ? '. Getting full; delete finished jobs to make room.'
        : '.';
  host.innerHTML = state + line +
    ' Export a CSV from any job for a copy of the register you can keep elsewhere.';
}

function renderLegacyNotice() {
  const host = $('legacyNotice');
  if (localStorage.getItem('speccheck_jobs') || localStorage.getItem('speccheck_gemini_key')) {
    localStorage.removeItem('speccheck_jobs');
    localStorage.removeItem('speccheck_gemini_key');
  }
  if (!localCarryover.length) { host.innerHTML = ''; return; }
  const n = localCarryover.length;
  host.innerHTML = `<div class="banner info">
    <div><b>${n} job${n === 1 ? '' : 's'} still stored only in this browser</b>
      ${esc(localCarryover.map(j => j.name).join(', '))} — from before this register was shared.
      Uploading copies the log and every PDF to the shared workspace.</div>
    <button class="btn sm" onclick="uploadCarryover()">Upload</button>
    <button class="btn sm ghost" onclick="dismissCarryover()">Not now</button>
  </div>`;
}

/* ── job name + number, for both new jobs and edits ── */
function jobFormModal(existing) {
  const j = existing || {};
  $('modalHost').innerHTML = `
    <div class="modal-scrim" onclick="if(event.target===this)closePdf()"><div class="modal">
      <div class="modal-head"><h3>${existing ? 'Edit job' : 'New job'}</h3>
        <button class="icon-btn" onclick="closePdf()">✕</button></div>
      <div class="modal-body">
        <div class="field">
          <label class="fl">Job name</label>
          <input class="input" id="jfName" value="${esc(j.name || '')}"
            placeholder="Adventist Health Columbia Gorge — Energy Improvements" autocomplete="off">
        </div>
        <div class="field" style="margin-bottom:0">
          <label class="fl">Job number</label>
          <input class="input" id="jfNumber" value="${esc(j.number || '')}"
            placeholder="70-23-0002" autocomplete="off">
        </div>
      </div>
      <div class="modal-foot">
        <button class="btn" onclick="closePdf()">Cancel</button>
        <button class="btn primary" onclick="submitJobForm(${existing ? "'" + j.id + "'" : 'null'})">
          ${existing ? 'Save' : 'Create job'}</button>
      </div>
    </div></div>`;
  const name = $('jfName');
  name.focus(); name.select();
  for (const id of ['jfName', 'jfNumber']) {
    $(id).addEventListener('keydown', e => {
      if (e.key === 'Enter') submitJobForm(existing ? j.id : null);
    });
  }
}

function newJob() { jobFormModal(null); }
function editJob() { if (job) jobFormModal(job); }

async function submitJobForm(id) {
  const name = $('jfName').value.trim();
  const number = $('jfNumber').value.trim();
  if (!name) { toast('A job needs a name', true); $('jfName').focus(); return; }
  try {
    if (id) {
      const target = job && job.id === id ? job : jobs.find(x => x.id === id);
      if (!target) return;
      target.name = name; target.number = number;
      beginJobEdit();
      try { await saveJobMeta(target); } finally { endJobEdit(); }
      if (job && job.id === id) { $('crumbJob').textContent = name; renderJob(); }
      closePdf();
      toast('Job updated');
    } else {
      const j = {
        id: uid('job'), name, number, created: Date.now(), updated: Date.now(),
        specs: [], sections: []
      };
      await saveJobMeta(j);
      jobs.unshift(j);
      job = Object.assign({}, j, { sections: [] });
      $('crumbJob').textContent = name;
      closePdf();
      go('job');
      watchSections(job.id);
      promptImportSpec();
    }
  } catch (e) {
    console.error(e);
    toast(writeError(e), true);
  }
}

function writeError(e) {
  const code = (e && e.code) || '';
  if (code.includes('permission-denied')) {
    return 'Firestore refused the write — paste firestore.rules into the Firebase console.';
  }
  if (code.includes('resource-exhausted')) return 'This Firebase project has hit its free-tier limit for the day.';
  if (code.includes('unavailable')) return 'No connection — the change will sync when you are back online.';
  return 'Could not save: ' + (e && (e.message || e.code) || e);
}

async function deleteJob(id) {
  const j = jobs.find(x => x.id === id);
  if (!j) return;
  const count = jobCount(j);
  if (!confirm(`Delete "${j.name}"${count ? ` and its ${count} sections` : ''}, for everyone?\n\nEvery uploaded PDF goes with it. This cannot be undone.`)) return;
  stickyToast(`Deleting ${j.name}…`);
  try {
    // Sections carry the file paths, so read them before dropping the documents.
    const snap = await FB.getDocs(sectionsCol(id));
    const secs = snap.docs.map(d => d.data());
    for (const sp of (j.specs || [])) await deleteStoredFile(sp.fileId);
    for (const s of secs) {
      for (const d of (s.submittals || []).concat(s.responses || [])) await deleteStoredFile(d.fileId);
    }
    await deleteSectionDocs(id, secs.map(s => s.key));
    await FB.deleteDoc(jobRef(id));
    jobs = jobs.filter(x => x.id !== id);
    renderJobs();
    toast('Job deleted');
  } catch (e) {
    console.error(e);
    toast(writeError(e), true);
  }
}

/* ═══════════════════════════════════════════════════════════════════════════
   6. JOB WORKSPACE
   ═══════════════════════════════════════════════════════════════════════════ */
function visibleSections() {
  const q = query.trim().toLowerCase();
  return sectionsOf(job).slice().sort(sectionOrder).filter(s => {
    if (divFilter !== 'all' && s.division !== divFilter) return false;
    if (statusFilter && (s.status || 'not_started') !== statusFilter) return false;
    if (q) {
      const hay = (s.number + ' ' + s.key + ' ' + s.title + ' ' + (s.vendor || '') + ' ' + (s.package || '')).toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
}

/* ── spec files (a job can hold several — Div 22 and Div 23 often arrive apart) ── */
function specsOf(j) { return (j && j.specs) || []; }
function specById(id) { return specsOf(job).find(s => s.id === id) || null; }
function sectionsFromSpec(id) { return sectionsOf(job).filter(s => s.specId === id); }

function renderSpecBar() {
  const bar = $('specBar');
  const specs = specsOf(job);
  if (!specs.length) { bar.hidden = true; bar.innerHTML = ''; return; }
  bar.hidden = false;
  bar.innerHTML = `<span class="spec-bar-label">Spec file${specs.length === 1 ? '' : 's'}</span>` +
    specs.map(sp => {
      const n = sectionsFromSpec(sp.id).length;
      return `<span class="spec-chip">
        <button class="open" onclick="openSpecViewer('${sp.id}')" title="Open ${esc(sp.name)}">
          <span>📄</span><b>${esc(sp.name)}</b>
          <span class="meta">${sp.pages ? sp.pages + ' pp · ' : ''}${n} section${n === 1 ? '' : 's'}</span>
        </button>
        <button class="kill" onclick="removeSpecPrompt('${sp.id}')" title="Remove this spec file">✕</button>
      </span>`;
    }).join('') +
    `<button class="btn sm" onclick="promptImportSpec()">+ Add spec PDF</button>`;
}

function renderJob() {
  if (!job) return;
  $('jobName').textContent = job.name;
  const secs = sectionsOf(job);
  const specs = specsOf(job);
  const bits = [];
  if (job.number) bits.push('Job ' + job.number);
  bits.push(secs.length
    ? `${secs.length} spec section${secs.length === 1 ? '' : 's'} · ${specs.length} spec file${specs.length === 1 ? '' : 's'}`
    : 'No spec imported yet');
  $('jobMeta').textContent = bits.join(' · ');
  $('btnSpec').style.display = specs.length ? '' : 'none';
  renderSpecBar();

  /* division segmented control */
  const counts = {};
  DIVISIONS.forEach(d => counts[d] = secs.filter(s => s.division === d).length);
  $('divSeg').innerHTML = DIVISIONS.map(d =>
    `<button class="${divFilter === d ? 'on' : ''}" onclick="setDiv('${d}')">Div ${d} · ${DIVISION_NAMES[d]}<span class="n">${counts[d]}</span></button>`
  ).join('') + `<button class="${divFilter === 'all' ? 'on' : ''}" onclick="setDiv('all')">All<span class="n">${secs.length}</span></button>`;

  /* status filter chips */
  const scope = secs.filter(s => divFilter === 'all' || s.division === divFilter);
  const tally = {}; STATUSES.forEach(s => tally[s.id] = 0);
  scope.forEach(s => tally[s.status || 'not_started']++);
  $('statusChips').innerHTML = STATUSES.map(s =>
    `<button class="chip ${statusFilter === s.id ? 'on' : ''}" style="${statusFilter === s.id ? 'color:' + cvar(s.color) + ';background:' + csf(s.color) : ''}"
      onclick="setStatusFilter('${s.id}')"><i style="background:${cvar(s.color)}"></i>${esc(s.label)}<span class="n">${tally[s.id]}</span></button>`
  ).join('') + (statusFilter ? `<button class="chip" onclick="setStatusFilter(null)">Clear filter ✕</button>` : '');

  renderTable();
}

function setDiv(d) { divFilter = d; renderJob(); }
function setStatusFilter(s) { statusFilter = (statusFilter === s) ? null : s; renderJob(); }
$('searchBox').addEventListener('input', e => { query = e.target.value; renderTable(); $('countLabel').textContent = countLabel(); });
function countLabel() {
  const n = visibleSections().length, t = sectionsOf(job).filter(s => divFilter === 'all' || s.division === divFilter).length;
  return n === t ? `${t} sections` : `${n} of ${t} sections`;
}

function renderTable() {
  const body = $('secBody');
  const list = visibleSections();
  $('countLabel').textContent = countLabel();

  if (!sectionsOf(job).length) {
    body.innerHTML = '';
    $('jobEmpty').innerHTML = `<div class="empty" style="margin-top:14px">
      <h3>No spec imported yet</h3>
      <p>Import the project spec PDF — Divisions 22 and 23 are split into their individual sections automatically.<br>
      Import as many files as the job came in: one whole manual, or Division 22 and Division 23 separately.</p>
      <p style="margin-top:14px"><button class="btn primary" onclick="promptImportSpec()">Import spec PDF</button>
      <button class="btn" onclick="addSectionManually()">Add a section by hand</button></p></div>`;
    return;
  }
  $('jobEmpty').innerHTML = '';

  if (!list.length) {
    body.innerHTML = `<tr><td colspan="6"><div class="empty" style="border:none;background:transparent;padding:34px">
      <h3>Nothing matches</h3><p>Try a different search or clear the status filter.</p></div></td></tr>`;
    return;
  }

  let html = '', lastDiv = null;
  for (const s of list) {
    if (divFilter === 'all' && s.division !== lastDiv) {
      lastDiv = s.division;
      html += `<tr class="divhead"><td colspan="6">Division ${s.division} — ${DIVISION_NAMES[s.division] || ''}</td></tr>`;
    }
    const st = ST[s.status || 'not_started'];
    const nSub = (s.submittals || []).length, nRes = (s.responses || []).length;
    const sf = s.specId ? specById(s.specId) : null;
    const spec = s.startPage ? `p. ${s.startPage}${s.endPage && s.endPage !== s.startPage ? '–' + s.endPage : ''}` : '—';
    const specHint = sf ? `${sf.name}${s.startPage ? ', page ' + s.startPage : ''}` : 'No spec file linked';
    html += `<tr class="${openKey === s.key ? 'sel ' : ''}${st.id === 'na' ? 'row-na' : ''}" onclick="openSection('${s.key}')">
      <td class="c-num">${esc(s.number)}</td>
      <td class="c-title"><span>${esc(s.title || '(untitled)')}</span>
        ${s.manual ? '<span class="flag">Added</span>' : ''}
        ${(s.inBody === false) ? '<span class="flag">Index only</span>' : ''}
        ${s.package ? `<div class="sub">${esc(s.package)}${s.vendor ? ' · ' + esc(s.vendor) : ''}</div>`
          : (s.vendor ? `<div class="sub">${esc(s.vendor)}</div>` : '')}</td>
      <td onclick="event.stopPropagation()">
        <select class="st-select" style="color:${cvar(st.color)};background:${csf(st.color)};border-color:${cvar(st.color)}"
          onchange="setStatus('${s.key}', this.value)">
          ${STATUSES.map(o => `<option value="${o.id}" ${o.id === st.id ? 'selected' : ''}>${esc(o.label)}</option>`).join('')}
        </select></td>
      <td class="num"><span class="dot-count ${nSub ? '' : 'zero'}">📄 ${nSub}</span></td>
      <td class="num"><span class="dot-count ${nRes ? '' : 'zero'}">✔ ${nRes}</span></td>
      <td class="num hide-sm"><span class="muted" title="${esc(specHint)}">${spec}</span></td>
    </tr>`;
  }
  body.innerHTML = html;
}

async function setStatus(key, value) {
  const s = findSection(key);
  if (!s) return;
  const from = s.status || 'not_started';
  if (from === value) return;
  markPending(key);
  s.status = value;
  s.history = s.history || [];
  s.history.push({ ts: Date.now(), from, to: value });
  if (value === 'submitted_gc' && !s.submittedDate) s.submittedDate = new Date().toISOString().slice(0, 10);
  if ((value === 'approved' || value === 'revise_resubmit') && !s.returnedDate) s.returnedDate = new Date().toISOString().slice(0, 10);
  sortSections();
  renderJob();
  if (openKey === key) renderDrawer();
  try { await saveSection(s); } catch (e) { toast(writeError(e), true); }
}

/* ═══════════════════════════════════════════════════════════════════════════
   7. SECTION DRAWER
   ═══════════════════════════════════════════════════════════════════════════ */
function openSection(key) { openKey = key; renderDrawer(); renderTable(); }
function closeDrawer() { openKey = null; $('drawerHost').innerHTML = ''; }

function renderDrawer() {
  const s = findSection(openKey);
  if (!s) { closeDrawer(); return; }
  const st = ST[s.status || 'not_started'];
  // Only the file this section was actually parsed from — its page numbers mean
  // nothing in any other file.
  const specFile = s.specId ? specById(s.specId) : null;
  const manySpecs = specsOf(job).length > 1;

  const statusButtons = STATUSES.map(o => `
    <button class="status-opt ${o.id === st.id ? 'on' : ''}" style="${o.id === st.id ? 'color:' + cvar(o.color) + ';background:' + csf(o.color) : ''}"
      onclick="setStatus('${s.key}','${o.id}')"><i style="background:${cvar(o.color)}"></i><span>${esc(o.label)}</span></button>`).join('');

  const reqHtml = (s.requirements && s.requirements.length)
    ? s.requirements.map(g => `<div class="req-group">
        <div class="req-kind">${esc(g.kind)} — ${esc(g.article)} ${esc(g.name)}</div>
        ${g.items.map(it => {
          const detail = it.detail != null ? it.detail : it.text;
          return `<div class="req-item">
            ${it.label ? `<span class="rl">${esc(it.label)}</span>` : ''}
            ${detail ? `<span class="rt">${esc(detail)}</span>` : ''}</div>`;
        }).join('')}
      </div>`).join('')
    : `<div class="muted">This section has no separate submittals article in the spec.</div>`;

  const incHtml = (s.includes && s.includes.length)
    ? `<div class="sec"><h4>Section includes</h4><div class="muted" style="color:var(--text-2)">${
        s.includes.map(i => '• ' + esc(i)).join('<br>')}</div></div>` : '';

  const html = `
  <div class="scrim" onclick="closeDrawer()"></div>
  <aside class="drawer" role="dialog" aria-label="Spec section">
    <div class="drawer-head${st.id === 'na' ? ' is-na' : ''}">
      <div style="flex:1;min-width:0">
        <div class="num">Division ${esc(s.division)} · ${esc(s.number)}</div>
        <h2>${esc(s.title || '(untitled)')}</h2>
      </div>
      <button class="icon-btn" onclick="editSection('${s.key}')" title="Edit number / title">✎</button>
      <button class="icon-btn" onclick="closeDrawer()" title="Close">✕</button>
    </div>
    <div class="drawer-body">

      <div class="sec">
        <h4>Status <span class="pill" style="color:${cvar(st.color)};background:${csf(st.color)}"><i></i>${esc(st.label)}</span></h4>
        <div class="status-grid">${statusButtons}</div>
      </div>

      <div class="sec">
        <h4>Submittals <button class="btn sm" onclick="pickFiles('${s.key}','submittals')">+ Upload PDF</button></h4>
        <div id="listSub">${fileList(s, 'submittals')}</div>
        <div class="drop" id="dropSub" onclick="pickFiles('${s.key}','submittals')">Drop submittal PDFs here</div>
      </div>

      <div class="sec">
        <h4>Submittal responses <button class="btn sm" onclick="pickFiles('${s.key}','responses')">+ Upload PDF</button></h4>
        <div id="listRes">${fileList(s, 'responses')}</div>
        <div class="drop" id="dropRes" onclick="pickFiles('${s.key}','responses')">Drop the returned / stamped PDFs here</div>
      </div>

      <div class="sec">
        <h4>Details</h4>
        <div class="grid2">
          <div class="field"><label class="fl">Vendor / supplier</label>
            <input class="input" value="${esc(s.vendor || '')}" oninput="setField('${s.key}','vendor',this.value)"></div>
          <div class="field"><label class="fl">Submittal no. / package</label>
            <input class="input" value="${esc(s.package || '')}" oninput="setField('${s.key}','package',this.value)"></div>
          <div class="field"><label class="fl">Sent to GC</label>
            <input class="input" type="date" value="${esc(s.submittedDate || '')}" onchange="setField('${s.key}','submittedDate',this.value)"></div>
          <div class="field"><label class="fl">Returned</label>
            <input class="input" type="date" value="${esc(s.returnedDate || '')}" onchange="setField('${s.key}','returnedDate',this.value)"></div>
        </div>
        <div class="field" style="margin-bottom:0"><label class="fl">Notes</label>
          <textarea class="input" oninput="setField('${s.key}','notes',this.value)"
            placeholder="Anything worth remembering — RFI numbers, why it was rejected, who to chase…">${esc(s.notes || '')}</textarea></div>
      </div>

      ${incHtml}

      <div class="sec">
        <h4>What the spec asks for
          ${s.startPage && specFile ? `<button class="btn sm" onclick="openSpecViewer('${specFile.id}',${s.startPage})">Open spec · p. ${s.startPage}</button>` : ''}
        </h4>
        ${reqHtml}
        <div class="muted" style="margin-top:10px;border-top:1px solid var(--border);padding-top:8px">
          ${specFile && manySpecs ? esc(specFile.name) + ' · ' : ''}${
            s.startPage ? `pages ${s.startPage}${s.endPage && s.endPage !== s.startPage ? '–' + s.endPage : ''}`
                        : (specsOf(job).length ? 'no page reference — import the spec that covers this section' : 'no page reference')}
          ${s.titleSource ? ` · title from ${esc(s.titleSource)}` : ''}
        </div>
      </div>

      ${(s.history && s.history.length) ? `<div class="sec"><h4>History</h4>${
        s.history.slice().reverse().map(h =>
          `<div class="req-item"><span class="rl">${fmtDate(h.ts)}</span><span class="rt">${esc((ST[h.from] || {}).label || h.from)} → ${esc((ST[h.to] || {}).label || h.to)}</span></div>`
        ).join('')}</div>` : ''}

      <div style="text-align:right">
        <button class="btn danger sm" onclick="deleteSection('${s.key}')">Delete section</button>
      </div>
    </div>
  </aside>`;

  $('drawerHost').innerHTML = html;
  wireDrop($('dropSub'), s.key, 'submittals');
  wireDrop($('dropRes'), s.key, 'responses');
}

function fileList(s, kind) {
  const files = s[kind] || [];
  if (!files.length) return `<div class="muted" style="margin-bottom:8px">Nothing uploaded yet.</div>`;
  return files.map(f => `<div class="file-row">
      <span class="fi">${kind === 'responses' ? '✔' : '📄'}</span>
      <span class="fn"><b title="${esc(f.name)}">${esc(f.name)}</b>
        <small>${fmtBytes(f.size || 0)} · ${fmtDate(f.uploaded)}</small></span>
      ${f.rev ? `<span class="rev-tag">${esc(f.rev)}</span>` : ''}
      <button class="btn sm" onclick="viewDoc('${s.key}','${kind}','${f.id}')">View</button>
      <button class="btn sm ghost" onclick="downloadDoc('${s.key}','${kind}','${f.id}')" title="Download">⤓</button>
      <button class="btn sm ghost" onclick="removeDoc('${s.key}','${kind}','${f.id}')" title="Remove">✕</button>
    </div>`).join('');
}

async function setField(key, field, value) {
  const s = findSection(key);
  if (!s) return;
  s[field] = value;
  markPending(key);                 // protect it across the debounce
  clearTimeout(setField._t);
  setField._t = setTimeout(async () => {
    renderTable();
    try { await saveSection(s); } catch (e) { toast(writeError(e), true); }
  }, 500);
}

/* ── uploads ── */
function pickFiles(key, kind) {
  const inp = document.createElement('input');
  inp.type = 'file';
  inp.accept = 'application/pdf,.pdf';
  inp.multiple = true;
  inp.onchange = () => addFiles(key, kind, Array.from(inp.files));
  inp.click();
}
function wireDrop(el, key, kind) {
  if (!el) return;
  el.addEventListener('dragover', e => { e.preventDefault(); el.classList.add('over'); });
  el.addEventListener('dragleave', () => el.classList.remove('over'));
  el.addEventListener('drop', e => {
    e.preventDefault(); el.classList.remove('over');
    addFiles(key, kind, Array.from(e.dataTransfer.files));
  });
}
async function addFiles(key, kind, files) {
  const s = findSection(key);
  if (!s || !files.length) return;
  markPending(key);                 // uploads take a while; hold the section
  const incoming = files.reduce((n, f) => n + f.size, 0);
  if (usedBytes() + incoming > FREE_TIER_BYTES) {
    toast('That would go past the free Firestore allowance — delete a finished job first', true);
    return;
  }
  s[kind] = s[kind] || [];
  let added = 0;
  for (const f of files) {
    if (f.type && f.type !== 'application/pdf' && !/\.pdf$/i.test(f.name)) {
      toast(`${f.name} is not a PDF — skipped`, true);
      continue;
    }
    const docId = uid('doc');
    try {
      const fileId = await putFile(f, { jobId: job.id, sectionKey: s.key, kind },
        pct => stickyToast(`Uploading ${f.name}… ${Math.round(pct * 100)}%`));
      s[kind].push({
        id: docId, name: f.name, size: f.size, type: f.type || 'application/pdf',
        uploaded: Date.now(), fileId,
        rev: kind === 'submittals' ? 'Rev ' + s[kind].filter(d => d.rev).length : ''
      });
      added++;
    } catch (e) {
      console.error(e);
      toast(storageError(e), true);
    }
  }
  if (!added) return;
  // Uploading the first submittal on an untouched section moves it along.
  if (kind === 'submittals' && (s.status || 'not_started') === 'not_started') s.status = 'waiting_vendor';
  renderDrawer(); renderTable();
  try { await saveSection(s); } catch (e) { toast(writeError(e), true); return; }
  toast(added + ' file' + (added === 1 ? '' : 's') + ' uploaded');
}
async function removeDoc(key, kind, docId) {
  const s = findSection(key);
  const d = (s[kind] || []).find(x => x.id === docId);
  if (!d) return;
  if (!confirm(`Remove "${d.name}" for everyone?`)) return;
  markPending(key);
  await deleteStoredFile(d.fileId);
