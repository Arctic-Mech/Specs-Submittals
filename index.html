async function deleteStoredDoc(doc) {
  if (!doc) return;
  if (blobUrlCache.has(doc.id)) { URL.revokeObjectURL(blobUrlCache.get(doc.id)); blobUrlCache.delete(doc.id); }
  if (!jobFolder) return;               // not loaded → the file stays in ShareFile
  try {
    const filesRoot = await jobFolder.getDirectoryHandle('files');
    if (doc.dir && doc.file) {
      const dirHandle = await walkDir(filesRoot, doc.dir);
      await dirHandle.removeEntry(doc.file);
    } else if (doc.fileId) {
      await filesRoot.removeEntry(doc.fileId + '.pdf');
    }
  } catch (e) {}
}

function watchJobs() {
  if (unsubJobs) unsubJobs();

    snap => {
      const wasEmpty = !jobs.length;
      jobs = snap.docs.map(d => Object.assign({ id: d.id }, d.data()))
        .sort((a, b) => (b.updated || b.created || 0) - (a.updated || a.created || 0));
      jobsLoaded = true;
      setSync('live');
      if (!_deepLinkDone && jobs.length) {          // "Open The Dingus" launcher deep-links via ?job=<id>
        _deepLinkDone = true;
        try {
          const want = new URLSearchParams(location.search).get('job');
          if (want && view === 'jobs' && jobs.some(x => x.id === want)) openJob(want);
        } catch (e) {}
      }
      if (job) {
        // Someone else may have renamed the job or added a spec file. Sections
        // have their own listener, so keep those.
        const fresh = jobs.find(x => x.id === job.id);
        if (fresh) {
          const stale = (fresh.updated || 0) < (job.updated || 0);
          if (!jobEditDepth && !stale) {
            job.name = fresh.name; job.number = fresh.number; job.folderUrl = fresh.folderUrl;
            job.sfFolderName = fresh.sfFolderName || '';
            job.ignoredFiles = fresh.ignoredFiles || [];
            job.contractAmount = fresh.contractAmount || '';
            job.specs = fresh.specs || []; job.summary = fresh.summary; job.updated = fresh.updated;
          }
          if (view === 'job') { $('crumbJob').textContent = job.name; renderJob(); }
          if (jobFolder) scheduleFolderSave();   // job name/number feed the folder snapshot
        } else if (view === 'job' && !jobEditDepth) {
          toast('This job was deleted', true);
          go('jobs');
        }
      }
      if (view === 'jobs') renderJobs();
      if (wasEmpty) checkLocalCarryover();
    },
    err => {
      jobsLoaded = true;
      setSync('error', err && err.code === 'permission-denied'
        ? ' — Firestore refused the read. Paste firestore.rules into the Firebase console under Firestore Database → Rules, then reload.'
        : ' — ' + (err && err.message || err));
      if (view === 'jobs') renderJobs();
    });

function watchSections(jobId) {
  if (unsubSections) { unsubSections(); unsubSections = null; }
  unsubSections = FB.onSnapshot(sectionsCol(jobId),
    snap => {
      if (!job || job.id !== jobId) return;
      const incoming = snap.docs.map(d => d.data());
      const seen = new Set(incoming.map(x => x.key));
      const local = job.sections || [];
      job.sections = incoming.map(x => {
        if (!pendingSections.has(x.key)) return x;
        return local.find(y => y.key === x.key) || x;      // keep the edit in progress
      });
      // A section added locally but not yet written must survive too.
      for (const y of local) if (!seen.has(y.key) && pendingSections.has(y.key)) job.sections.push(y);
      sortSections();
      // Sections arrive after the view opens, so the first tab can only be
      // chosen now — landing on an empty Division 22 hides a Div 23-only job.
      if (!divPicked && job.sections.length) {
        divPicked = true;
        if (divFilter !== 'all' && !job.sections.some(x => x.division === divFilter)) {
          const first = jobDivisions()[0];
          if (first) divFilter = first;
        }
      }
      migrateSpecData(jobId, job.sections);
      if (view === 'job') {
        renderJob();
        // Re-rendering while someone is typing in the drawer would eat the caret.
        const ae = document.activeElement;
        if (openKey && !(ae && ae.closest && ae.closest('.drawer'))) renderDrawer();

      if (jobFolder) { maybeAutoOrganize(); fileStagedUploads(); scheduleFolderSave(); }   // sections arrived / changed after the folder loaded
    },
    err => setSync('error', ' — ' + (err && err.message || err)));

/* ── carry-over from the browser-only version ── */
const LOCAL_DB = 'submittal_register';

/* Opening a database that does not exist creates an empty one, so ask first
   where the browser supports it. Most people never had local data. */
async function localDbExists() {
  try {
    if (!indexedDB.databases) return true;            // Firefox: just try the open
    const list = await indexedDB.databases();
    return list.some(d => d && d.name === LOCAL_DB);
  } catch (e) { return true; }
}

async function readLocalJobs() {
  if (!(await localDbExists())) return [];
  return new Promise(resolve => {
    let req;
    try { req = indexedDB.open(LOCAL_DB); } catch (e) { return resolve([]); }
    req.onerror = () => resolve([]);
    req.onsuccess = () => {
      const db = req.result;
      if (!db.objectStoreNames.contains('jobs')) { db.close(); return resolve([]); }
      const tx = db.transaction('jobs', 'readonly').objectStore('jobs').getAll();
      tx.onsuccess = () => { const out = tx.result || []; db.close(); resolve(out); };
      tx.onerror = () => { db.close(); resolve([]); };
    };
  });
}

async function readLocalBlob(blobId) {
  if (!(await localDbExists())) return null;
  return new Promise(resolve => {
    let req;
    try { req = indexedDB.open(LOCAL_DB); } catch (e) { return resolve(null); }
    req.onerror = () => resolve(null);
    req.onsuccess = () => {
      const db = req.result;
      if (!db.objectStoreNames.contains('blobs')) { db.close(); return resolve(null); }
      const g = db.transaction('blobs', 'readonly').objectStore('blobs').get(blobId);
      g.onsuccess = () => { const r = g.result; db.close(); resolve(r ? r.blob : null); };
      g.onerror = () => { db.close(); resolve(null); };
    };
  });
}

let localCarryover = [];
async function checkLocalCarryover() {
  if (localStorage.getItem('sr_carryover_done')) return;
  const local = await readLocalJobs();
  localCarryover = local.filter(j => !jobs.some(x => x.id === j.id));
  if (localCarryover.length) renderLegacyNotice();
}

async function uploadCarryover() {
  const list = localCarryover.slice();
  if (!list.length) return;
  let done = 0, files = 0;
  const total = list.reduce((n, j) => n + 1 + sectionsOf(j).length, 0);
  const step = msg => stickyToast(msg);
  try {
    for (const lj of list) {
      const prev = job;
      job = lj;                                    // saveSection/saveJobMeta act on `job`
      // Only the log carries over — old browser-stored PDFs can't move into a
      // ShareFile folder automatically. Their records drop their local blob ids.
      for (const sp of (lj.specs || [])) delete sp.blobId;
      for (const s of sectionsOf(lj)) {
        for (const kind of ['submittals', 'responses']) {
          for (const d of (s[kind] || [])) delete d.blobId;
        }
      }
      step(`Saving ${lj.name}… (${++done} of ${list.length})`);
      await saveSections(sectionsOf(lj));
      await saveJobMeta(lj);
      job = prev;
    }
    localStorage.setItem('sr_carryover_done', '1');
    localCarryover = [];
    renderLegacyNotice();
    toast(`${list.length} job${list.length === 1 ? '' : 's'} carried over`);
  } catch (e) {
    console.error(e);
    toast(storageError(e), true);
  }
}

function dismissCarryover() {
  localStorage.setItem('sr_carryover_done', '1');
  localCarryover = [];
  renderLegacyNotice();
}

function go(where, id) {

async function openJob(id) {

/* ═══════════════════════════════════════════════════════════════════════════
   5. JOBS HOME
   ═══════════════════════════════════════════════════════════════════════════ */
function jobTally(j) {
  const t = {}; STATUSES.forEach(s => t[s.id] = 0);
  if (j.summary && j.summary.tally) Object.assign(t, j.summary.tally);
  else for (const s of sectionsOf(j)) t[s.status || 'not_started']++;
  return t;
}
function jobCount(j) {
  return (j.summary && typeof j.summary.count === 'number') ? j.summary.count : sectionsOf(j).length;
}

function renderJobs() {
  const grid = $('jobsGrid');
  if (!jobsLoaded) {
    grid.innerHTML = `<div class="job-card loading-card"><span class="muted">Loading jobs…</span></div>`;
    renderLegacyNotice();
    renderStorageNote();
    return;
  }
  let html = '';
  for (const j of jobs) {
    const count = jobCount(j);
    const t = jobTally(j);
    const total = count || 1;
    const bars = STATUSES.filter(s => t[s.id])
      .map(s => `<span style="width:${(t[s.id] / total * 100).toFixed(2)}%;background:${cvar(s.color)}"></span>`).join('');
    const legend = STATUSES.filter(s => t[s.id] && s.id !== 'not_started')
      .map(s => `<span><i style="background:${cvar(s.color)}"></i>${t[s.id]} ${esc(s.short)}</span>`).join('');
    html += `<div class="job-card" onclick="openJob('${j.id}')">
      <button class="job-del" title="Delete job" onclick="event.stopPropagation();deleteJob('${j.id}')">✕</button>
      <h3>${esc(j.name)}</h3>
      <div class="meta">${j.number ? '<b>' + esc(j.number) + '</b> · ' : ''}${count} section${count === 1 ? '' : 's'} · ${fmtDate(j.updated || j.created)}</div>
      <div class="bar">${bars || '<span style="width:100%;background:var(--surface-3)"></span>'}</div>
      <div class="legend">${legend || '<span class="muted">Nothing logged yet</span>'}</div>
    </div>`;
  }
  html += `<div class="job-card new-card" onclick="newJob()"><span class="plus">+</span><span>New job</span></div>`;
  grid.innerHTML = html;
  renderLegacyNotice();
  renderStorageNote();
}

function renderStorageNote() {
  const host = $('storageNote');
  if (!host) return;
  const state = syncState === 'live'
    ? '<span class="sync-dot"></span>The register is shared live — everyone sees the same statuses, and changes appear as they happen.'
    : syncState === 'error'

      : '<span class="sync-dot wait"></span>Connecting…';

function renderLegacyNotice() {

function newJob() { jobFormModal(null); }
function editJob() { if (job) jobFormModal(job); }

async function submitJobForm(id) {
  const name = $('jfName').value.trim();
  const number = $('jfNumber').value.trim();
  const rawFolder = $('jfFolder').value.trim();
  const folderUrl = rawFolder ? normaliseUrl(rawFolder) : '';
  if (!name) { toast('A job needs a name', true); $('jfName').focus(); return; }
  if (rawFolder && !folderUrl) { toast('That ShareFile folder does not look like a link', true); $('jfFolder').focus(); return; }
  try {
    if (id) {
      const target = job && job.id === id ? job : jobs.find(x => x.id === id);
      if (!target) return;
      target.name = name; target.number = number; target.folderUrl = folderUrl;
      beginJobEdit();
      try { await saveJobMeta(target); } finally { endJobEdit(); }
      if (job && job.id === id) { $('crumbJob').textContent = name; renderJob(); }
      closePdf();
      toast('Job updated');
    } else {
      const j = {
        id: uid('job'), name, number, folderUrl, created: Date.now(), updated: Date.now(),
        specs: [], sections: []
      };
      await saveJobMeta(j);
      jobs.unshift(j);
      job = Object.assign({}, j, { sections: [] });
      divPicked = false;
      $('crumbJob').textContent = name;
      closePdf();
      go('job');
      watchSections(job.id);
      promptImportSpec();
    }
  } catch (e) {
    console.error(e);
    toast(writeError(e), true);
  }
}

function writeError(e) {
  const code = (e && e.code) || '';
  if (code.includes('permission-denied')) {
    return 'Firestore refused the write — paste firestore.rules into the Firebase console.';
  }
  if (code.includes('resource-exhausted')) return 'This Firebase project has hit its free-tier limit for the day.';
  if (code.includes('unavailable')) return 'No connection — the change will sync when you are back online.';
  return 'Could not save: ' + (e && (e.message || e.code) || e);
}

async function deleteJob(id) {
  const j = jobs.find(x => x.id === id);
  if (!j) return;
  const count = jobCount(j);
  if (!confirm(`Delete "${j.name}"${count ? ` and its ${count} sections` : ''} from the register, for everyone?\n\nThis removes the log. The PDFs in this job's ShareFile folder are left untouched — delete that folder in ShareFile if you want them gone. This cannot be undone.`)) return;
  stickyToast(`Deleting ${j.name}…`);
  try {
    const snap = await FB.getDocs(sectionsCol(id));
    const secs = snap.docs.map(d => d.data());
    await deleteSectionDocs(id, secs.map(s => s.key));
    await FB.deleteDoc(jobRef(id));
    jobs = jobs.filter(x => x.id !== id);
    renderJobs();
    toast('Job deleted from the register');
  } catch (e) {
    console.error(e);
    toast(writeError(e), true);
  }
}

/* ═══════════════════════════════════════════════════════════════════════════
   6. JOB WORKSPACE
   ═══════════════════════════════════════════════════════════════════════════ */
/* Everything worth finding a section by, tags included. */
function searchHay(s) {
  return [s.number, s.key, s.title, s.vendor, s.spec, s.description, s.manufacturer, s.package, s.notes,
    (s.tags || []).join(' '),
    (s.releases || []).map(r => r.label + ' ' + (r.note || '')).join(' '),
    (s.submittals || []).concat(s.responses || []).map(d => d.name).join(' ')
  ].filter(Boolean).join(' ').toLowerCase();
}
/* Which tag matched, so the row can say why it is in the results. */
function matchedTag(s, q) {
  if (!q) return null;
  return (s.tags || []).find(t => t.toLowerCase().includes(q)) || null;
}

/* When the most recent response for a section came back — the newest response
   PDF's upload time, else the typed "Returned" date. */
function latestResponseTs(s) {
  let t = 0;
  for (const d of (s.responses || [])) { const dt = d.uploaded || 0; if (dt > t) t = dt; }
  if (!t && s.returnedDate) t = new Date(s.returnedDate + 'T00:00:00').getTime() || 0;
  return t;
}
/* Date of the latest STATUS or RELEASE change only — general edits (notes,
   pin, vendor, tags, dates) do not count. Status changes are recorded in
   history with a timestamp; release-category changes stamp releaseChangedAt. */
function sectionChangeTs(s) {
  let t = 0;
  for (const h of (s.history || [])) if ((h.ts || 0) > t) t = h.ts;          // status changes
  if (s.releaseChangedAt && s.releaseChangedAt > t) t = s.releaseChangedAt;   // release-category changes
  for (const r of (s.releases || [])) if (r.date) {                          // fallback for pre-existing releases
    const ms = new Date(r.date + 'T00:00:00').getTime(); if (ms > t) t = ms;
  }
  return t;
}
function visibleSections() {
  const q = query.trim().toLowerCase();
  const list = sectionsOf(job).filter(s => {
    if (divFilter !== 'all' && s.division !== divFilter) return false;
    if (statusFilter && (s.status || 'not_started') !== statusFilter) return false;
    if (releaseFilter && (s.releaseState || 'not_ready') !== releaseFilter) return false;
    if (q && !searchHay(s).includes(q)) return false;
    return true;
  });
  if (submSort === 'response') list.sort((a, b) => latestResponseTs(b) - latestResponseTs(a) || sectionOrder(a, b));
  else list.sort(sectionOrder);
  return list;
}

/* ── spec files (a job can hold several — Div 22 and Div 23 often arrive apart) ── */
function specsOf(j) { return (j && j.specs) || []; }
function specById(id) { return specsOf(job).find(s => s.id === id) || null; }
function sectionsFromSpec(id) { return sectionsOf(job).filter(s => s.specId === id); }

/* The spec files are reached from the top-right "Spec" button only; there is no
   bar above the division selector. */
function renderSpecBar() {
  const bar = $('specBar');
  if (bar) { bar.hidden = true; bar.innerHTML = ''; }
}

function renderJob() {
  if (!job) return;
  $('jobName').textContent = job.name;
  const secs = sectionsOf(job);
  const specs = specsOf(job);
  const bits = [];
  if (job.number) bits.push('Job ' + job.number);
  if (jobTab === 'submittals') bits.push(secs.length
    ? `${secs.length} spec section${secs.length === 1 ? '' : 's'} · ${specs.length} spec file${specs.length === 1 ? '' : 's'}`
    : 'No spec imported yet');
  else if (jobTab === 'rfis') bits.push(`${rfis.length} RFI${rfis.length === 1 ? '' : 's'}`);
  else if (jobTab === 'changeorders') bits.push(`${cos.length} change order${cos.length === 1 ? '' : 's'}`);
  else if (jobTab === 'quotes') bits.push(`${litems('quotes').length} vendor quote${litems('quotes').length === 1 ? '' : 's'}`);
  else if (jobTab === 'pos') bits.push(`${litems('pos').length} PO${litems('pos').length === 1 ? '' : 's'}`);
  else if (jobTab === 'contracts') bits.push(`${(contracts || []).length} contract${(contracts || []).length === 1 ? '' : 's'}`);
  else if (jobTab === 'tracking') bits.push(`${tracking.length} categor${tracking.length === 1 ? 'y' : 'ies'}`);
  else if (jobTab === 'billing') bits.push('Billing');
  $('jobMeta').textContent = bits.join(' · ');
  updateFolderBar();
  renderJobTabs();
  applyTabVisibility();
  if (jobTab === 'rfis') { renderRfis(); return; }
  if (jobTab === 'changeorders') { renderCos(); return; }
  if (jobTab === 'quotes') { renderLedger('quotes'); return; }
  if (jobTab === 'pos') { renderLedger('pos'); return; }
  if (jobTab === 'contracts') { renderContracts(); return; }
  if (jobTab === 'tracking') { renderTracking(); return; }
  if (jobTab === 'billing') { renderBilling(); return; }

  $('btnSpec').style.display = specs.length ? '' : 'none';

  /* division segmented control — a tab per division actually in this job */
  const divs = jobDivisions();
  const counts = {};
  divs.forEach(d => counts[d] = secs.filter(s => s.division === d).length);
  $('divSeg').innerHTML = `<button class="${divFilter === 'all' ? 'on' : ''}" onclick="setDiv('all')">All<span class="n">${secs.length}</span></button>` +
    divs.map(d =>
      `<button class="${divFilter === d ? 'on' : ''}" onclick="setDiv('${d}')">Div ${d}${DIVISION_NAMES[d] ? ' · ' + DIVISION_NAMES[d] : ''}<span class="n">${counts[d]}</span></button>`
    ).join('');

  /* status filter chips */
  const scope = secs.filter(s => divFilter === 'all' || s.division === divFilter);
  const tally = {}; STATUSES.forEach(s => tally[s.id] = 0);
  scope.forEach(s => tally[s.status || 'not_started']++);
  $('statusChips').innerHTML = STATUSES.map(s =>
    `<button class="chip ${statusFilter === s.id ? 'on' : ''}" style="${statusFilter === s.id ? 'color:' + cvar(s.color) + ';background:' + csf(s.color) : ''}"
      onclick="setStatusFilter('${s.id}')"><i style="background:${cvar(s.color)}"></i>${esc(s.label)}<span class="n">${tally[s.id]}</span></button>`
  ).join('') + (statusFilter ? `<button class="chip" onclick="setStatusFilter(null)">Clear ✕</button>` : '');

  const rtally = {}; RELEASES.forEach(r => rtally[r.id] = 0);
  scope.forEach(x => rtally[x.releaseState || 'not_ready']++);
  $('releaseChips').innerHTML =
    `<span class="chip-label">Release</span>` +
    RELEASES.filter(r => r.id !== 'not_ready' || rtally.not_ready < scope.length).map(r =>
      `<button class="chip ${releaseFilter === r.id ? 'on' : ''}" style="${releaseFilter === r.id ? 'color:' + cvar(r.color) + ';background:' + csf(r.color) : ''}"
        onclick="setReleaseFilter('${r.id}')"><i style="background:${cvar(r.color)}"></i>${esc(r.label)}<span class="n">${rtally[r.id]}</span></button>`
    ).join('') + (releaseFilter ? `<button class="chip" onclick="setReleaseFilter(null)">Clear ✕</button>` : '');

  renderTable();
}

function setDiv(d) { divFilter = d; renderJob(); }
function setStatusFilter(s) { statusFilter = (statusFilter === s) ? null : s; renderJob(); }
function setReleaseFilter(r) { releaseFilter = (releaseFilter === r) ? null : r; renderJob(); }
$('searchBox').addEventListener('input', e => { query = e.target.value; renderTable(); $('countLabel').textContent = countLabel(); });
$('rfiSearch').addEventListener('input', e => { rfiQuery = e.target.value; renderRfis(); });
$('coSearch').addEventListener('input', e => { coQuery = e.target.value; renderCos(); });
function countLabel() {
  const n = visibleSections().length, t = sectionsOf(job).filter(s => divFilter === 'all' || s.division === divFilter).length;
  return n === t ? `${t} sections` : `${n} of ${t} sections`;
}

/* ═══════════════════════════════════════════════════════════════════════════
   6a. JOB TABS  —  Submittals · RFIs · Job Tracking
   ═══════════════════════════════════════════════════════════════════════════ */
function renderJobTabs() {

  ).join('');

const TAB_ACTIONS = {
  submittals:   '+ Add section',
  rfis:         '+ New RFI',

  quotes:       '+ New quote',
  pos:          '+ New PO',

};
function applyTabVisibility() {

function setJobTab(t) {

function tabAction() {

/* ═══════════════════════════════════════════════════════════════════════════
   6b. RFIs  —  a lightweight register of RFI questions and their answers
   ═══════════════════════════════════════════════════════════════════════════ */
function rfiById(id) { return rfis.find(r => r.id === id); }
function rsOf(r) { return RS[r.status || 'open'] || RS.open; }
function nextRfiNumber() {
  let max = 0;
  for (const r of rfis) { const m = String(r.number || '').match(/(\d+)/); if (m) max = Math.max(max, parseInt(m[1], 10)); }
  return String(max + 1).padStart(3, '0');
}
async function saveRfi(r) {
  r.updated = Date.now();
  try { await FB.setDoc(rfiRef(job.id, r.id), clean(r)); }
  catch (e) { toast(writeError(e), true); }
}

function matchRfi(r, q) {
  if (!q) return true;
  const hay = [r.number, r.gcNumber, r.subject, r.notes, r.questionText, r.answerText,
    ...(r.docs || []).map(d => d.name)].join(' ').toLowerCase();
  return hay.includes(q.toLowerCase());
}
/* When an RFI was last answered — its answered date, else the newest answer PDF. */
function rfiResponseTs(r) {
  if (r.dateAnswered) return new Date(r.dateAnswered + 'T00:00:00').getTime() || 0;
  let t = 0; for (const d of (r.docs || [])) if (d.kind === 'answer' && (d.added || 0) > t) t = d.added;
  return t;
}
function visibleRfis() {
  const list = rfis.filter(r => (!rfiStatusFilter || (r.status || 'open') === rfiStatusFilter) && matchRfi(r, rfiQuery));
  if (rfiSort === 'response') list.sort((a, b) => rfiResponseTs(b) - rfiResponseTs(a)
    || String(b.number || '').localeCompare(String(a.number || ''), undefined, { numeric: true }));
  return list;                                   // else keep the by-number order from watchRfis
}
function setRfiFilter(id) { rfiStatusFilter = (rfiStatusFilter === id) ? null : id; renderRfis(); }

function renderRfis() {
  if (!job) return;
  const tally = {}; RFI_STATUSES.forEach(s => tally[s.id] = 0);
  rfis.forEach(r => tally[r.status || 'open']++);
  $('rfiChips').innerHTML = RFI_STATUSES.map(s =>
    `<button class="chip ${rfiStatusFilter === s.id ? 'on' : ''}" style="${rfiStatusFilter === s.id ? 'color:' + cvar(s.color) + ';background:' + csf(s.color) : ''}"
      onclick="setRfiFilter('${s.id}')"><i style="background:${cvar(s.color)}"></i>${esc(s.label)}<span class="n">${tally[s.id]}</span></button>`
  ).join('') + (rfiStatusFilter ? `<button class="chip" onclick="setRfiFilter(null)">Clear ✕</button>` : '');

  const list = visibleRfis();
  $('rfiCount').textContent = list.length === rfis.length ? `${rfis.length} RFI${rfis.length === 1 ? '' : 's'}` : `${list.length} of ${rfis.length}`;
  $('rfiBody').innerHTML = list.map(rfiRowHtml).join('');
  $('rfiEmpty').innerHTML = rfis.length ? (list.length ? '' :
      `<div class="empty">No RFIs match. <button class="btn sm ghost" onclick="rfiQuery='';rfiStatusFilter=null;$('rfiSearch').value='';renderRfis()">Clear</button></div>`)
    : `<div class="empty"><b>No RFIs yet.</b><br><span class="muted">Track RFI questions and the answers that come back. Each RFI holds the question and response PDFs, filed into this job’s ShareFile folder.</span><br><br>
        <button class="btn primary" onclick="newRfi()">+ New RFI</button></div>`;
}
function rfiRowHtml(r) {
  const st = rsOf(r);
  const openAc = (r.checklist || []).filter(i => !i.done).length;
  const docNote = openAc ? `<small>☐ ${openAc} action item${openAc === 1 ? '' : 's'}</small>` : '';
  const noteLine = (r.showNote && r.notes) ? `<div class="rfi-note">📌 ${esc(r.notes)}</div>` : '';
  const dates = [];
  if (r.dateSent) dates.push('Sent ' + fmtShort(r.dateSent));
  if (r.dateDue) dates.push('Due ' + fmtShort(r.dateDue));
  if (r.dateAnswered) dates.push('Answered ' + fmtShort(r.dateAnswered));
  return `<tr onclick="openRfiDrawer('${r.id}')">
    <td class="c-rfinum" data-label="RFI"><b>${esc(r.number || '—')}</b></td>
    <td class="c-rfisubj" data-label="Subject">${esc(r.subject || '(no subject)')}${docNote}${noteLine}</td>
    <td class="c-rfigc${r.gcNumber ? '' : ' is-empty'}" data-label="GC #">${r.gcNumber ? esc(r.gcNumber) : '<span class="muted">—</span>'}</td>
    <td class="c-rfistatus" data-label="Status"><span class="pill" style="color:${cvar(st.color)};background:${csf(st.color)}"><i></i>${esc(st.label)}</span></td>
    <td class="c-rfidates${dates.length ? '' : ' is-empty'}" data-label="Dates">${dates.length ? '<small>' + dates.map(esc).join('<br>') + '</small>' : '<span class="muted">—</span>'}</td>
  </tr>`;
}
function newRfi() {
  if (!job) return;
  const r = { id: uid('rfi'), number: nextRfiNumber(), gcNumber: '', subject: '',
    status: 'open', dateSent: today(), dateDue: '', dateAnswered: '', questionText: '', answerText: '',
    notes: '', showNote: false, docs: [], checklist: [],
    created: Date.now(), updated: Date.now() };
  rfis.unshift(r);
  openRfi = r.id;
  renderRfis(); renderRfiDrawer();
  saveRfi(r);
}
async function patchRfi(id, fields) {
  const r = rfiById(id); if (!r) return;
  Object.assign(r, fields);
  renderRfis();
  await saveRfi(r);
  // Number/subject drive the RFI's folder name — move its PDFs and tidy the old folder.
  if (jobFolder && ('number' in fields || 'subject' in fields)) maybeAutoOrganize();
}
function setRfiStatus(id, statusId) {
  const r = rfiById(id); if (!r) return;
  const fields = { status: statusId };
  if (statusId === 'answered' && !r.dateAnswered) fields.dateAnswered = today();
  patchRfi(id, fields);
  renderRfiDrawer();
}
async function deleteRfi(id) {
  const r = rfiById(id); if (!r) return;
  if (!confirm(`Delete RFI ${r.number || ''}? This removes the record for everyone. The PDFs stay in the ShareFile folder.`)) return;
  rfis = rfis.filter(x => x.id !== id);
  if (openRfi === id) closeRfiDrawer();
  renderRfis();
  try { await FB.deleteDoc(rfiRef(job.id, id)); await saveJobMeta(); } catch (e) { toast(writeError(e), true); }
  if (jobFolder) syncRfiFolders().catch(() => {});   // remove the RFI's folder if it's now empty (PDFs, if any, stay)
}

/* ── RFI PDFs (question / answer) into files/RFI Questions|Answers/ ── */
async function pickRfiFiles(id, kind) {
  if (!jobFolder) { if (!(await loadJobFolder())) return; }
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = 'application/pdf,.pdf'; inp.multiple = true;
  inp.onchange = () => addRfiFiles(id, kind, Array.from(inp.files));
  inp.click();
}
async function addRfiFiles(id, kind, all) {
  if (!rfiById(id) || !all.length) return;
  if (!jobFolder) { if (!(await loadJobFolder())) return; }
  const files = all.filter(f => /\.pdf$/i.test(f.name) || f.type === 'application/pdf');
  if (files.length < all.length) toast('Non-PDF files were skipped', true);
  if (!files.length) return;
  const newDocs = [];
  for (const f of files) {
    try {
      stickyToast(`Saving ${f.name}…`);
      const { dir, file } = await putRfiFile(f, kind, rfiById(id));
      newDocs.push({ id: uid('doc'), name: f.name, size: f.size, kind, dir, file, added: Date.now() });
    } catch (e) { console.error(e); toast(storageError(e), true); }
  }
  if (!newDocs.length) return;
  // Re-read the record after the file writes: a live snapshot may have replaced
  // it meanwhile, so append onto the latest copy rather than a stale one.
  const r = rfiById(id);
  if (!r) { toast('That RFI is no longer available', true); noteFolderChanged(); return; }
  r.docs = (r.docs || []).concat(newDocs);
  if (kind === 'answer' && r.status !== 'closed') { r.status = 'answered'; if (!r.dateAnswered) r.dateAnswered = today(); }
  else if (kind === 'question' && r.status === 'open') { r.status = 'submitted'; if (!r.dateSent) r.dateSent = today(); }
  renderRfis(); if (openRfi === id) renderRfiDrawer();
  await saveRfi(r);
  syncRfiFolders().catch(() => {});   // ensure this RFI's folder + Question/Answered subfolders exist
  noteFolderChanged();
  toast(`${newDocs.length} PDF${newDocs.length === 1 ? '' : 's'} added`);
}
async function removeRfiDoc(id, docId) {
  const r = rfiById(id); if (!r) return;
  const d = (r.docs || []).find(x => x.id === docId); if (!d) return;
  if (!confirm(`Remove "${d.name}" for everyone?`)) return;
  await deleteStoredDoc(d);
  r.docs = r.docs.filter(x => x.id !== docId);
  renderRfiDrawer(); renderRfis();
  await saveRfi(r);
  syncRfiFolders().catch(() => {});   // tidy the subfolder if it's now empty
  noteFolderChanged();
}
async function viewRfiDoc(id, docId) {
  const r = rfiById(id); if (!r) return;
  const d = (r.docs || []).find(x => x.id === docId);
  if (d) openStoredDoc(d);
}

/* A file stored in the ShareFile folder — open a PDF in the viewer, an email
   (.msg/.eml) in the in-app email viewer, and download anything else. */
async function openStoredDoc(doc) {
  if (!doc) return;
  if (!jobFolder) { if (!(await loadJobFolder())) { toast('Load this job’s ShareFile folder to open files', true); return; } }
  stickyToast(`Opening ${doc.name}…`);
  if (isEmailName(doc.name)) {                 // emails get the in-app viewer, never Bluebeam/download
    const blob = await readDocBlob(doc);
    if (!blob) { toast(await docReadError(doc), true); return; }
    toast(' ');
    return openEmailBlob(blob, doc.name);
  }
  const url = await docUrl(doc);
  if (!url) { toast(await docReadError(doc), true); return; }
  toast(' ');
  if (/\.pdf$/i.test(doc.name)) showPdf(url, doc.name);
  else { const a = document.createElement('a'); a.href = url; a.download = doc.name; a.click(); }
}

function closeRfiDrawer() { openRfi = null; $('drawerHost').innerHTML = ''; }
function openRfiDrawer(id) { openRfi = id; openKey = null; renderRfiDrawer(); }
function rfiDocList(r, kind) {
  const docs = (r.docs || []).filter(d => d.kind === kind);

  return `<div class="file-list">` + docs.map(d => `

      <span class="fn"><b>${esc(d.name)}</b><small>${d.size ? fmtBytes(d.size) : ''}</small></span>
      <button class="btn sm" onclick="viewRfiDoc('${r.id}','${d.id}')">${bluebeamMode ? 'Bluebeam' : 'Open'}</button>

}

        <div class="status-grid">${statusButtons}</div>

      <div class="sec">

      <div class="sec">

          <input class="input" id="rfiCheckInput" placeholder="Add an action item (e.g. cost impact, schedule impact)…"
            onkeydown="if(event.key==='Enter')acAdd('rfi','${r.id}','rfiCheckInput')">

/* ═══════════════════════════════════════════════════════════════════════════
   6c. JOB TRACKING  —  user-made categories holding emails, notes, checklists
   ═══════════════════════════════════════════════════════════════════════════ */
function catById(id) { return tracking.find(c => c.id === id); }
async function saveTrackCat(c) {
  c.updated = Date.now();
  try { await FB.setDoc(trackingRef(job.id, c.id), clean(c)); }
  catch (e) { toast(writeError(e), true); }
}
function newTrackCategory() {
  if (!job) return;
  const name = prompt('Category name (e.g. Change Orders, Scheduling, Owner correspondence):');
  if (!name || !name.trim()) return;
  const c = { id: uid('cat'), name: name.trim(), order: tracking.length,
    files: [], notes: [], checklist: [], created: Date.now(), updated: Date.now() };
  tracking.push(c);
  trackCat = c.id;
  renderTracking();
  saveTrackCat(c);
}
function selectTrackCat(id) { trackCat = id; renderTracking(); }
async function renameTrackCat(id) {
  const c = catById(id); if (!c) return;
  const name = prompt('Category name:', c.name || '');
  if (name === null || !name.trim()) return;
  c.name = name.trim();
  renderTracking();
  await saveTrackCat(c);
}
async function deleteTrackCat(id) {
  const c = catById(id); if (!c) return;
  if (!confirm(`Delete category "${c.name}"? Its notes and checklist go too. The uploaded files stay in the ShareFile folder.`)) return;
  tracking = tracking.filter(x => x.id !== id);
  if (trackCat === id) trackCat = tracking.length ? tracking[0].id : null;
  renderTracking();
  try { await FB.deleteDoc(trackingRef(job.id, id)); } catch (e) { toast(writeError(e), true); }
}

function renderTracking() {
  if (!job) return;
  if (trackCat && !catById(trackCat)) trackCat = null;
  if (!trackCat && tracking.length) trackCat = tracking[0].id;
  $('trackCats').innerHTML = tracking.map(c => {
    const nf = (c.files || []).length, na = (c.checklist || []).filter(i => !i.done).length;
    const bits = [];
    if (nf) bits.push(nf + ' file' + (nf === 1 ? '' : 's'));
    if (na) bits.push(na + ' to do');
    return `<button class="track-cat ${trackCat === c.id ? 'on' : ''}" onclick="selectTrackCat('${c.id}')">
       <span class="tc-name">${esc(c.name)}</span>
       <span class="tc-sub">${bits.join(' · ') || 'empty'}</span>
     </button>`;
  }).join('') +
    `<button class="track-cat add" onclick="newTrackCategory()">+ New category</button>`;

  const c = catById(trackCat);
  if (!c) {
    $('trackPanel').innerHTML = `<div class="empty"><b>No categories yet.</b><br>
      <span class="muted">Make categories for anything on the job — change orders, scheduling, owner emails — then drop the email conversations, notes and action items into each.</span><br><br>
      <button class="btn primary" onclick="newTrackCategory()">+ New category</button></div>`;
    return;
  }
  const files = c.files || [], notes = c.notes || [], checklist = c.checklist || [];
  $('trackPanel').innerHTML = `
    <div class="track-head">
      <h3>${esc(c.name)}</h3>
      <div class="spacer"></div>
      <button class="btn sm ghost" onclick="renameTrackCat('${c.id}')">Rename</button>
      <button class="btn sm ghost" onclick="deleteTrackCat('${c.id}')">Delete</button>
    </div>

    <div class="track-body">
      <div class="track-col">
        <div class="track-sec">
          <h4>Emails &amp; files <span class="spacer"></span><button class="btn sm" onclick="pickEmailFiles('${c.id}')">+ Add</button></h4>
          ${files.length ? `<div class="file-list">` + files.map(f => `
            <div class="file-row"><span class="fi">${/\.(msg|eml)$/i.test(f.name) ? '✉️' : '📄'}</span>
              <span class="fn"><b>${esc(f.name)}</b><small>${f.added ? fmtDate(f.added) : ''}${f.size ? ' · ' + fmtBytes(f.size) : ''}</small></span>
              <button class="btn sm" onclick="viewEmailDoc('${c.id}','${f.id}')">Open</button>
              <button class="btn sm ghost" title="Rename" onclick="renameEmailDoc('${c.id}','${f.id}')">✎</button>
              <button class="icon-btn" title="Remove" onclick="removeEmailDoc('${c.id}','${f.id}')">🗑</button>
            </div>`).join('') + `</div>` : `<div class="muted" style="font-size:13px">No emails or files yet.</div>`}
          <div class="email-drop" id="emailDrop">Drop emails or files here, or click to choose <span class="muted">· .msg, .eml, PDF</span></div>
        </div>
      </div>
      <div class="track-col">
        <div class="track-sec">
          <h4>Action items ${acCountLabel(checklist)}</h4>
          <div class="add-row">
            <input class="input" id="checkInput" placeholder="Add an action item…" onkeydown="if(event.key==='Enter')acAdd('cat','${c.id}','checkInput')">
            <button class="btn sm" onclick="acAdd('cat','${c.id}','checkInput')">Add</button>
          </div>
          ${checklist.length ? checklistHtml('cat', c.id, checklist) + `<div class="muted" style="margin-top:6px">Click an item to add details.</div>` : `<div class="muted" style="font-size:13px">No action items.</div>`}
        </div>
        <div class="track-sec">
          <h4>Notes</h4>
          <div class="add-row">
            <input class="input" id="noteInput" placeholder="Add a note…" onkeydown="if(event.key==='Enter')addNote('${c.id}')">
            <button class="btn sm" onclick="addNote('${c.id}')">Add</button>
          </div>
          ${notes.map(n => `
            <div class="note-item">
              <div class="nt">${esc(n.text).replace(/\n/g, '<br>')}</div>
              <div class="nm"><small class="muted">${n.created ? fmtDate(n.created) : ''}</small>
                <button class="x" title="Remove" onclick="deleteNote('${c.id}','${n.id}')">✕</button></div>
            </div>`).join('') || '<div class="muted" style="font-size:13px">No notes yet.</div>'}
        </div>
      </div>
    </div>`;

  const drop = $('emailDrop');
  if (drop) {
    drop.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('over'); });
    drop.addEventListener('dragleave', () => drop.classList.remove('over'));
    drop.addEventListener('drop', e => {
      e.preventDefault(); drop.classList.remove('over');
      addEmailFiles(c.id, Array.from(e.dataTransfer.files));
    });
    drop.addEventListener('click', () => pickEmailFiles(c.id));
  }
}

async function pickEmailFiles(catId) {
  if (!jobFolder) { if (!(await loadJobFolder())) return; }
  const inp = document.createElement('input');
  inp.type = 'file'; inp.multiple = true;
  inp.accept = '.msg,.eml,.pdf,application/pdf,message/rfc822';
  inp.onchange = () => addEmailFiles(catId, Array.from(inp.files));
  inp.click();
}
async function addEmailFiles(catId, files) {
  const start = catById(catId); if (!start || !files.length) return;
  if (!jobFolder) { if (!(await loadJobFolder())) return; }
  const catName = start.name;                 // fix the folder path for this upload
  const newFiles = [];
  for (const f of files) {
    try {
      stickyToast(`Saving ${f.name}…`);
      const { dir, file } = await putEmailFile(f, catName);
      newFiles.push({ id: uid('doc'), name: f.name, size: f.size, dir, file, added: Date.now() });
    } catch (e) { console.error(e); toast(storageError(e), true); }
  }
  if (!newFiles.length) return;
  // Re-read after the writes so a snapshot that landed mid-upload isn't clobbered.
  const c = catById(catId);
  if (!c) { toast('That category is no longer available', true); noteFolderChanged(); return; }
  c.files = (c.files || []).concat(newFiles);
  renderTracking();
  await saveTrackCat(c);
  noteFolderChanged();
  toast(`${newFiles.length} file${newFiles.length === 1 ? '' : 's'} added to ${c.name}`);
}
async function removeEmailDoc(catId, fileId) {
  const c = catById(catId); if (!c) return;
  const d = (c.files || []).find(x => x.id === fileId); if (!d) return;
  if (!confirm(`Remove "${d.name}" for everyone?`)) return;
  await deleteStoredDoc(d);
  c.files = c.files.filter(x => x.id !== fileId);
  renderTracking();
  await saveTrackCat(c);
  noteFolderChanged();
}
async function viewEmailDoc(catId, fileId) {
  const c = catById(catId); if (!c) return;
  const d = (c.files || []).find(x => x.id === fileId);
  if (d) openStoredDoc(d);
}
/* ── action items, shared by RFIs and tracking categories ──
   An owner is an RFI ('rfi') or a tracking category ('cat'); both keep a
   `checklist` array of { id, text, detail, due, done, created }. */
function acOwner(type, id) {
  return type === 'rfi' ? rfiById(id) : type === 'co' ? coById(id) : catById(id);
}
function acSave(type, o) {

}

}

function acAdd(type, id, inputId) {

}
function acToggle(type, id, itemId, done) {
  const o = acOwner(type, id); if (!o) return;
  const it = (o.checklist || []).find(x => x.id === itemId); if (!it) return;
  it.done = done;
  acRerender(type); acSave(type, o);
  if (acModal && acModal.itemId === itemId) renderActionModal();
}
function acDelete(type, id, itemId) {

  acRerender(type); acSave(type, o);
}

/* The detail editor — a modal stacked over whatever tab/drawer opened it. */
let acModal = null;   // { type, id, itemId }

function closeActionModal() { acModal = null; $('modalHost').innerHTML = ''; }
/* A live snapshot may delete or change the item under an open detail modal.

function refreshActionModalIfSafe() {

/* ═══════════════════════════════════════════════════════════════════════════
   6d. CHANGE ORDERS  —  a log with a paid check-off, mirroring the RFI log
   ═══════════════════════════════════════════════════════════════════════════ */
function coById(id) { return cos.find(c => c.id === id); }
function csOf(c) { return CS[c.status || 'pending'] || CS.pending; }
function nextCoNumber() {
  let max = 0;
  for (const c of cos) { const m = String(c.number || '').match(/(\d+)/); if (m) max = Math.max(max, parseInt(m[1], 10)); }
  return String(max + 1).padStart(2, '0');
}
async function saveCo(c) {
  c.updated = Date.now();
  try { await FB.setDoc(coRef(job.id, c.id), clean(c)); }
  catch (e) { toast(writeError(e), true); }
}
function matchCo(c, q) {
  if (!q) return true;
  const hay = [c.number, c.description, c.notes, c.amount,
    ...(c.docs || []).map(d => d.name), ...(c.emails || []).map(d => d.name)].join(' ').toLowerCase();
  return hay.includes(q.toLowerCase());
}
function visibleCos() {
  return cos.filter(c => (!coStatusFilter || (coStatusFilter === 'paid' ? c.paid : (c.status || 'pending') === coStatusFilter)) && matchCo(c, coQuery));
}
function setCoFilter(id) { coStatusFilter = (coStatusFilter === id) ? null : id; renderCos(); }
function setContractAmount(v) {
  if (!job) return;
  const n = parseFloat(String(v || '').replace(/[^0-9.\-]/g, ''));
  job.contractAmount = isFinite(n) ? n : '';
  saveJobMeta().catch(() => {});
}

function renderCos() {
  if (!job) return;
  const tally = {}; CO_STATUSES.forEach(s => tally[s.id] = 0);
  let paidN = 0, pendingTotal = 0, approvedTotal = 0, paidAmt = 0;
  cos.forEach(c => {
    const st = c.status || 'pending';
    tally[st]++;
    if (c.paid) paidN++;
    const n = parseFloat(String(c.amount).replace(/[^0-9.-]/g, ''));   // deducts (negatives) subtract
    if (isFinite(n)) {
      if (st === 'approved') approvedTotal += n;
      else if (st === 'pending' || st === 'submitted') pendingTotal += n;
      if (c.paid) paidAmt += n;
    }
  });
  $('coChips').innerHTML = CO_STATUSES.map(s =>
    `<button class="chip ${coStatusFilter === s.id ? 'on' : ''}" style="${coStatusFilter === s.id ? 'color:' + cvar(s.color) + ';background:' + csf(s.color) : ''}"
      onclick="setCoFilter('${s.id}')"><i style="background:${cvar(s.color)}"></i>${esc(s.label)}<span class="n">${tally[s.id]}</span></button>`
  ).join('') +
    `<button class="chip ${coStatusFilter === 'paid' ? 'on' : ''}" style="${coStatusFilter === 'paid' ? 'color:' + cvar('green') + ';background:' + csf('green') : ''}"
      onclick="setCoFilter('paid')"><i style="background:${cvar('green')}"></i>Paid<span class="n">${paidN}</span></button>` +
    (coStatusFilter ? `<button class="chip" onclick="setCoFilter(null)">Clear ✕</button>` : '');

  const cc = $('coContract');
  if (cc && document.activeElement !== cc) cc.value = (job.contractAmount || job.contractAmount === 0) ? fmtAmountInput(String(job.contractAmount)) : '';
  const list = visibleCos();
  const tp = [];
  if (pendingTotal) tp.push('Pending ' + fmtMoney(pendingTotal));
  if (approvedTotal) tp.push('Approved ' + fmtMoney(approvedTotal));
  if (paidAmt) tp.push('Paid ' + fmtMoney(paidAmt));
  const totLabel = tp.length ? ' · ' + tp.join('  ·  ') : '';
  $('coCount').textContent = (list.length === cos.length ? `${cos.length} change order${cos.length === 1 ? '' : 's'}` : `${list.length} of ${cos.length}`) + totLabel;
  $('coBody').innerHTML = list.map(coRowHtml).join('');
  $('coEmpty').innerHTML = cos.length ? (list.length ? '' :
      `<div class="empty">No change orders match. <button class="btn sm ghost" onclick="coQuery='';coStatusFilter=null;$('coSearch').value='';renderCos()">Clear</button></div>`)
    : `<div class="empty"><b>No change orders yet.</b><br><span class="muted">Log each change order with its amount and status, attach the CO PDF, and tick it off once it’s paid.</span><br><br>
        <button class="btn primary" onclick="newChangeOrder()">+ New change order</button></div>`;
}
function coRowHtml(c) {
  const st = csOf(c);

  const sub = openAc ? `<small>☐ ${openAc} action item${openAc === 1 ? '' : 's'}</small>` : '';
  return `<tr onclick="openCoDrawer('${c.id}')">
    <td class="c-conum" data-label="CO #"><b>${esc(c.number || '—')}</b></td>
    <td class="c-codesc" data-label="Description">${esc(c.description || '(no description)')}${sub}</td>
    <td class="c-coamt${c.amount ? '' : ' is-empty'}" data-label="Amount">${c.amount ? esc(fmtMoney(c.amount) || c.amount) : '<span class="muted">—</span>'}</td>
    <td class="c-costatus" data-label="Status"><span class="pill" style="color:${cvar(st.color)};background:${csf(st.color)}"><i></i>${esc(st.label)}</span></td>
    <td class="c-copaid" data-label="Paid">

function newChangeOrder() {
  if (!job) return;
  const c = { id: uid('co'), number: nextCoNumber(), description: '', amount: '',
    status: 'pending', paid: false, paidDate: '', dateSubmitted: today(), dateApproved: '',
    notes: '', docs: [], checklist: [], created: Date.now(), updated: Date.now() };

async function patchCo(id, fields) {

  try { await FB.deleteDoc(coRef(job.id, id)); await saveJobMeta(); } catch (e) { toast(writeError(e), true); }
  if (jobFolder) syncCoFolders().catch(() => {});   // remove the CO's folder if it's now empty (files, if any, stay)

/* CO PDFs into files/Change Orders/ */
async function pickCoFiles(id) {
  if (!jobFolder) { if (!(await loadJobFolder())) return; }
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = 'application/pdf,.pdf'; inp.multiple = true;
  inp.onchange = () => addCoFiles(id, Array.from(inp.files));

}
async function addCoFiles(id, all) {
  if (!coById(id) || !all.length) return;
  if (!jobFolder) { if (!(await loadJobFolder())) return; }
  const files = all.filter(f => /\.pdf$/i.test(f.name) || f.type === 'application/pdf');
  if (files.length < all.length) toast('Non-PDF files were skipped', true);
  if (!files.length) return;
  const newDocs = [];
  for (const f of files) {
    try {
      stickyToast(`Saving ${f.name}…`);
      const { dir, file } = await putFileInDir(f, coDocDir(coById(id)), sanitizeFileName(f.name));
      newDocs.push({ id: uid('doc'), name: f.name, size: f.size, dir, file, added: Date.now() });
    } catch (e) { console.error(e); toast(storageError(e), true); }
  }
  if (!newDocs.length) return;
  const c = coById(id);
  if (!c) { toast('That change order is no longer available', true); noteFolderChanged(); return; }
  c.docs = (c.docs || []).concat(newDocs);
  renderCos(); if (openCo === id) renderCoDrawer();
  await saveCo(c);
  syncCoFolders().catch(() => {});   // ensure this CO's folder exists
  noteFolderChanged();
  toast(`${newDocs.length} PDF${newDocs.length === 1 ? '' : 's'} added`);
}

    const root = await walkDirCreate(filesRoot, lcfg(lk).dir);

    for (const it of litems(lk)) {

      const name = ledgerFolderName(lk, it); want.add(name);
      try { await root.getDirectoryHandle(name, { create: true }); } catch (e) {}
    }
    for await (const e of root.values()) {
      if (e.kind !== 'directory' || want.has(e.name)) continue;

let _reconcilingLedgers = false;

  if (!jobFolder || _reconcilingLedgers) return;

    const moves = [], dirty = new Map();

      for (const d of (it.docs || [])) if (!isLink(d) && !d.staged) { const m = await planRefile(filesRoot, d, ledgerDocDir(lk, it)); if (m) { moves.push(m); dirty.set(lk + '|' + it.id, { lk, it }); } }

    }
    if (moves.length) {
      for (const m of moves) { m.doc.dir = m.newDir; m.doc.file = m.newFile; }
      for (const { lk, it } of dirty.values()) { try { await saveLedger(lk, it); } catch (e) {} }
      for (const m of moves) { try { const od = m.oldDir ? await walkDir(filesRoot, m.oldDir) : filesRoot; await od.removeEntry(m.oldFile); } catch (e) {} if (blobUrlCache.has(m.doc.id)) { URL.revokeObjectURL(blobUrlCache.get(m.doc.id)); blobUrlCache.delete(m.doc.id); } }

function releaseCell(s, rl) {
  if (rl.id === 'not_ready') return '<span class="muted">—</span>';
  if (rl.id === 'na') return '<span class="pill" style="color:var(--text-3);background:var(--surface-2)"><i></i>N/A</span>';
  const pill = `<span class="pill" style="color:${cvar(rl.color)};background:${csf(rl.color)}"><i></i>${esc(rl.label)}</span>`;
  const lead = leadLabel(s.leadWeeks);
  const head = pill + (lead ? `<span class="lead-tag">Lead time ${esc(lead)}</span>` : '');
  if (rl.id === 'ready') return head;

  // Every release shows on the main page — a partially-released section can hold
  // several, and the row grows to fit them all.
  const lines = (s.releases || []).map(r => {
    const when = r.date ? 'Released ' + fmtShort(r.date) : 'Release date not set';
    const arrival = r.delivered
      ? '<b class="delivered-tag">Delivered</b>'
      : (r.expected ? 'arrives ' + esc(fmtWindow({ from: r.expected, to: r.expectedTo })) : 'no delivery date');
    return `<div class="rel-line">
      <label class="tick" title="Tick when it arrives on site" onclick="event.stopPropagation()">
        <input type="checkbox" ${r.delivered ? 'checked' : ''}

      <span class="rel-of">
        <b>${esc(r.label)}</b>
        <small>${esc(when)} · ${arrival}</small>

    </div>`;
  }).join('');
  return head + `<div class="rel-cell">${lines}</div>`;
}

      <h3>Nothing matches</h3><p>Try a different search or clear the status filter.</p></div></td></tr>`;
    return;
  }

  let html = '', lastDiv = null;
  for (const s of list) {
    if (divFilter === 'all' && submSort !== 'response' && s.division !== lastDiv) {
      lastDiv = s.division;
      html += `<tr class="divhead"><td colspan="6">Division ${s.division}${DIVISION_NAMES[s.division] ? ' — ' + DIVISION_NAMES[s.division] : ''}</td></tr>`;
    }
    html += secRowHtml(s);
  }
  // Re-rendering the table (a debounced save, or a live snapshot from another
  // browser) must not yank the caret out of an input someone is typing in.
  const focus = captureCellFocus(body);
  body.innerHTML = html;
  restoreCellFocus(body, focus);
}

/* A row is read-only by default — clicking it opens the section. The small
   pencil turns that one row into inline inputs; the tick puts it back. */
function secRowHtml(s) {
  const st = ST[s.status || 'not_started'];
  const rl = relOf(s);
  const mfrVal = s.manufacturer || s.spec || '';   // Manufacturer column; falls back to the old Spec value
  const changeTs = sectionChangeTs(s);
  const hitTag = matchedTag(s, query.trim().toLowerCase());
  const editing = editRow === s.key;
  const tags = `${hitTag ? `<span class="row-tag">${esc(hitTag)}</span>` : ''}${(s.inBody === false) ? '<span class="flag">Index only</span>' : ''}`;
  const pencil = editing
    ? `<button class="row-pencil on" title="Done editing" onclick="event.stopPropagation();toggleRowEdit(null)">✓</button>`
    : `<button class="row-pencil" title="Edit this row" onclick="event.stopPropagation();toggleRowEdit('${s.key}')">✎</button>`;

  let title, spec, vendor;
  if (editing) {
    title = `<input class="cell-in cell-title" data-key="${s.key}" data-field="title"
        value="${esc(s.title || '')}" placeholder="(untitled)"
        onpointerdown="event.stopPropagation()" oninput="setField('${s.key}','title',this.value)">`;
    spec = `<input class="cell-in" data-key="${s.key}" data-field="manufacturer"
        value="${esc(mfrVal)}" placeholder="—"
        onpointerdown="event.stopPropagation()" oninput="setField('${s.key}','manufacturer',this.value)">`;
    vendor = `<input class="cell-in" data-key="${s.key}" data-field="vendor"
        value="${esc(s.vendor || '')}" placeholder="—"
        onpointerdown="event.stopPropagation()" oninput="setField('${s.key}','vendor',this.value)">`;
  } else {
    title = `<span class="cell-title">${esc(s.title || '(untitled)')}</span>`;
    spec = `<span class="cell-ro">${mfrVal ? esc(mfrVal) : '<span class="muted">—</span>'}</span>`;
    vendor = `<span class="cell-ro">${s.vendor ? esc(s.vendor) : '<span class="muted">—</span>'}</span>`;
  }
  const desc = editing
    ? `<input class="cell-in cell-desc" data-key="${s.key}" data-field="description"
        value="${esc(s.description || '')}" placeholder="Add a description…"
        onpointerdown="event.stopPropagation()" oninput="setField('${s.key}','description',this.value)">`
    : (s.description ? `<div class="sub cell-desc">${esc(s.description)}</div>` : '');

  const rowOpen = editing ? '' : ` onclick="openSection('${s.key}')"`;
  const specEmpty = !editing && !mfrVal, vendorEmpty = !editing && !s.vendor;
  const noteLine = (s.showNote && s.notes) ? `<div class="pin-note">📌 ${esc(s.notes)}</div>` : '';
  return `<tr class="${openKey === s.key ? 'sel ' : ''}${editing ? 'row-edit ' : ''}${st.id === 'na' ? 'row-na' : ''}"${rowOpen}>
      <td class="c-num">${esc(s.number)}</td>
      <td class="c-title">
        <div class="t-line">${title}${pencil}</div>
        ${tags}${desc}${noteLine}</td>
      <td class="c-spec${specEmpty ? ' is-empty' : ''}" data-label="Manufacturer">${spec}</td>
      <td class="c-vendor${vendorEmpty ? ' is-empty' : ''}" data-label="Vendor">${vendor}</td>
      <td class="c-status" data-label="Status" onclick="event.stopPropagation()">
        <select class="st-select" style="color:${cvar(st.color)};background:${csf(st.color)};border-color:${cvar(st.color)}"
          onchange="setStatus('${s.key}', this.value)">
          ${STATUSES.map(o => `<option value="${o.id}" ${o.id === st.id ? 'selected' : ''}>${esc(o.label)}</option>`).join('')}
        </select>
        ${changeTs ? `<div class="changed" title="When this submittal's status or release last changed">changed ${fmtDate(changeTs)}</div>` : ''}</td>
      <td class="c-rel${rl.id === 'not_ready' ? ' is-empty' : ''}" data-label="Release">${releaseCell(s, rl)}</td>
    </tr>`;
}

/* Toggle inline editing for one row, then focus its title. */
function toggleRowEdit(key) {
  editRow = key;
  renderTable();
  if (key) {
    const el = $('secBody').querySelector(`.cell-in[data-key="${key}"][data-field="title"]`);
    if (el) { el.focus(); el.select(); }
  }
}

function captureCellFocus(body) {
  const el = document.activeElement;
  if (!el || !body.contains(el) || !el.classList.contains('cell-in')) return null;
  return { key: el.getAttribute('data-key'), field: el.getAttribute('data-field'),
    start: el.selectionStart, end: el.selectionEnd };
}
function restoreCellFocus(body, f) {
  if (!f) return;
  const el = body.querySelector(`.cell-in[data-key="${f.key}"][data-field="${f.field}"]`);
  if (!el) return;
  el.focus();
  try { el.setSelectionRange(f.start, f.end); } catch (_) {}
}

/* Move a section to a status, recording the transition and its side effects.
   Returns true if the status actually changed. Shared by the dropdown and by
   a PDF upload (which files itself under the status it represents). */
function applyStatus(s, value) {
  const from = s.status || 'not_started';
  s.history = s.history || [];
  if (from !== value) s.history.push({ ts: Date.now(), from, to: value });
  s.status = value;
  if (value === 'submitted_gc' && !s.submittedDate) s.submittedDate = today();
  if ((value === 'approved' || value === 'partial_approval' || value === 'revise_resubmit') && !s.returnedDate) {
    s.returnedDate = today();
  }
  // Once it is approved it is ready to go out, unless a release already happened.
  if (value === 'approved' && (s.releaseState || 'not_ready') === 'not_ready') s.releaseState = 'ready';
  return from !== value;
}
async function setStatus(key, value) {
  const s = findSection(key);
  if (!s) return;
  if ((s.status || 'not_started') === value) return;
  markPending(key);
  applyStatus(s, value);
  sortSections();
  renderJob();
  if (openKey === key) renderDrawer();
  try {
    await patchSection(key, {
      status: s.status, history: s.history || [],
      submittedDate: s.submittedDate || '', returnedDate: s.returnedDate || '',
      releaseState: s.releaseState || 'not_ready'
    });
  } catch (e) { toast(writeError(e), true); }
}

function autosizeAll(host) { (host || document).querySelectorAll('textarea.autosize').forEach(autosize); }

const isLink = d => d && d.type === 'link';
function linkHost(url) {
  try { return new URL(url).hostname.replace(/^www\./, ''); } catch (e) { return 'link'; }
}

/* ── rename a filed PDF (display name + on-disk file) ── */
async function copyRenamed(doc, rawName) {
  const raw = (rawName || '').trim(); if (!raw) return null;
  const keepPdf = /\.pdf$/i.test(doc.file || doc.name || '');
  const cleanName = keepPdf ? sanitizeFileName(raw) : sanitizeAnyName(raw, doc.file);
  const filesRoot = await jobFolder.getDirectoryHandle('files');
  const dh = doc.dir ? await walkDir(filesRoot, doc.dir) : filesRoot;
  const blob = await (await dh.getFileHandle(doc.file)).getFile();
  const newFile = await uniqueFileName(dh, cleanName);
  const fh = await dh.getFileHandle(newFile, { create: true });
  const w = await fh.createWritable(); await w.write(blob); await w.close();
  return { newFile, cleanName };
}
async function looseParentHandle(dir) {
  const filesRoot = await jobFolder.getDirectoryHandle('files');
  return dir ? walkDir(filesRoot, dir) : filesRoot;
}
/* Shared rename: `persist` writes the owning record (must throw on failure);
   `rerender` redraws. Copies to the new name, persists, then deletes the old. */
async function renameDoc(doc, persist, rerender) {
  if (!doc) return;
  const raw = prompt('Rename file:', doc.name || doc.file || '');
  if (raw === null) return;
  const name = raw.trim(); if (!name) return;
  if (isLink(doc)) { doc.name = name; rerender(); try { await persist(); } catch (e) { toast(writeError(e), true); } return; }
  if (!jobFolder) { toast('Load the ShareFile folder first to rename the file', true); return; }
  stickyToast('Renaming…');
  let copied;
  try { copied = await copyRenamed(doc, name); }
  catch (e) { toast('Could not read the file to rename — make the folder available offline in ShareFile', true); return; }
  if (!copied) { toast(' '); return; }
  const oldFile = doc.file, oldName = doc.name;
  doc.file = copied.newFile; doc.name = copied.cleanName;
  rerender();
  try { await persist(); }
  catch (e) {                                   // undo: restore record, drop the new copy
    doc.file = oldFile; doc.name = oldName;
    try { const dh = await looseParentHandle(doc.dir); await dh.removeEntry(copied.newFile); } catch (_) {}
    rerender(); toast(writeError(e), true); return;
  }
  if (copied.newFile !== oldFile) { try { const dh = await looseParentHandle(doc.dir); await dh.removeEntry(oldFile); } catch (e) {} }
  if (blobUrlCache.has(doc.id)) { URL.revokeObjectURL(blobUrlCache.get(doc.id)); blobUrlCache.delete(doc.id); }
  toast(`Renamed to “${copied.cleanName}”`);
}
function renameSectionDoc(key, kind, docId) {
  const s = findSection(key); const d = (s && (s[kind] || []).find(x => x.id === docId));
  if (!d) return;
  renameDoc(d, () => patchSection(key, { [kind]: s[kind] }), () => {
    if (openKey === key) renderDrawer(); renderTable();
    syncAllSubmittals().catch(() => {});
  });
}
function renameRfiDoc(id, docId) {
  const r = rfiById(id); const d = (r && (r.docs || []).find(x => x.id === docId));
  if (!d) return;
  renameDoc(d, () => { r.updated = Date.now(); return FB.setDoc(rfiRef(job.id, r.id), clean(r)); }, () => { if (openRfi === id) renderRfiDrawer(); renderRfis(); });
}
function renameCoDoc(id, docId) {
  const c = coById(id); const d = (c && (c.docs || []).find(x => x.id === docId));
  if (!d) return;
  renameDoc(d, () => { c.updated = Date.now(); return FB.setDoc(coRef(job.id, c.id), clean(c)); }, () => { if (openCo === id) renderCoDrawer(); renderCos(); });

function renameEmailDoc(catId, fileId) {
  const c = catById(catId); const d = (c && (c.files || []).find(x => x.id === fileId));
  if (!d) return;
  renameDoc(d, () => { c.updated = Date.now(); return FB.setDoc(trackingRef(job.id, c.id), clean(c)); }, () => renderTracking());
}

/* ── ShareFile (or any) links ─────────────────────────────────────────────
   Big vendor packages stay where the company already keeps them. The register
   holds a label and a URL, which can point at one file or a whole folder. */
function normaliseUrl(raw) {
  const t = String(raw || '').trim();
  if (!t) return null;
  const withScheme = /^https?:\/\//i.test(t) ? t : 'https://' + t;
  try {
    const u = new URL(withScheme);
    return /^https?:$/.test(u.protocol) && u.hostname.includes('.') ? u.href : null;
  } catch (e) { return null; }
}

async function saveRelease(key, relId) {
  const s = findSection(key);
  if (!s) return;
  const label = $('rlLabel').value.trim() || 'Release';
  const date = $('rlDate').value;
  const weeks = $('rlWeeks').value;
  const expected = $('rlExpected').value;
  const expectedManual = !!$('rlExpected').dataset.touched;
  // A hand-typed delivery date makes a leftover range end meaningless.
  const rawTo = $('rlExpectedTo').value;
  const expectedTo = (rawTo && expected && rawTo <= expected) ? '' : rawTo;
  const note = $('rlNote').value.trim();
  const scopeEl = $('rlScope') && $('rlScope').querySelector('button.on');
  const scope = scopeEl ? scopeEl.dataset.scope : null;

  markPending(key);
  s.releases = s.releases || [];
  const existing = relId ? s.releases.find(x => x.id === relId) : null;
  if (existing) Object.assign(existing, { label, date, weeks, expected, expectedTo, note, expectedManual });
  else {
    s.releases.push({ id: uid('rel'), label, date, weeks, expected, expectedTo, note, expectedManual });
    s.releaseState = scope === 'partial' ? 'partial' : 'released';
  }
  if (weeks && !s.leadWeeks) s.leadWeeks = weeks;
  s.releaseChangedAt = Date.now();       // recording/editing a release counts as a change
  closePdf();
  renderDrawer(); renderTable();
  try { await patchSection(key, { releases: s.releases, releaseState: s.releaseState, leadWeeks: s.leadWeeks || '', releaseChangedAt: s.releaseChangedAt }); }
  catch (e) { toast(writeError(e), true); return; }
  toast(existing ? 'Release updated' : 'Release recorded');
}

/* Type the arrival date straight into the Details field (single-release case);

  const s = findSection(key);
  if (!s) return;
  const rels = s.releases || [];
  if (rels.length !== 1) return;
  markPending(key);
  rels[0].expected = val || '';
  rels[0].expectedTo = '';                 // a hand-typed date has no range end
  rels[0].expectedManual = true;
  renderTable();
  if (openKey === key) renderDrawer();
  try { await patchSection(key, { releases: rels }); } catch (e) { toast(writeError(e), true); }
}

async function removeRelease(key, relId) {
  const s = findSection(key);
  if (!s) return;
  const r = (s.releases || []).find(x => x.id === relId);
  if (!r || !confirm(`Remove "${r.label}"?`)) return;
  markPending(key);
  s.releases = s.releases.filter(x => x.id !== relId);
  if (!s.releases.length && s.releaseState === 'partial') s.releaseState = 'ready';
  s.releaseChangedAt = Date.now();
  renderDrawer(); renderTable();
  try { await patchSection(key, { releases: s.releases, releaseState: s.releaseState, releaseChangedAt: s.releaseChangedAt }); }
  catch (e) { toast(writeError(e), true); }
}

/* Edits are debounced, but each section keeps its own pending patch and its own
   timer — editing the title, then the spec, then the vendor in quick succession
   must not let one field's write cancel the others. */
const _fieldPatches = new Map();   // key → { field: value, … }
const _fieldTimers = new Map();    // key → timeout id
async function setField(key, field, value) {
  const s = findSection(key);
  if (!s) return;
  s[field] = value;
  markPending(key);                 // protect it across the debounce
  const patch = _fieldPatches.get(key) || {};
  patch[field] = value;

  // A lead time is often filled in after the release. Re-date anything whose
  // delivery has not been typed in by hand.
  if (field === 'leadWeeks') {
    for (const r of (s.releases || [])) {
      if (r.expectedManual) continue;
      r.weeks = value;
      const e = expectedRange(r.date, value);
      r.expected = e.from; r.expectedTo = e.to;
    }
    patch.releases = s.releases || [];
    if (openKey === key) renderDrawer();
  }
  _fieldPatches.set(key, patch);

  clearTimeout(_fieldTimers.get(key));
  _fieldTimers.set(key, setTimeout(async () => {
    _fieldTimers.delete(key);
    const p = _fieldPatches.get(key); _fieldPatches.delete(key);
    if (!p) return;
    renderTable();
    try { await patchSection(key, p); } catch (e) { toast(writeError(e), true); }
  }, 500));
}

/* ── uploads ── */
async function pickFiles(key, kind) {
  // On desktop, load the folder first (this click is a clean gesture for the picker)
  // so the PDF has somewhere to go. On a phone there's no folder — it stages to Firebase.
  if (fsSupported() && !jobFolder) { if (!(await loadJobFolder())) return; }
  const inp = document.createElement('input');
  inp.type = 'file';
  inp.accept = 'application/pdf,.pdf';
  inp.multiple = true;
  inp.onchange = () => addFiles(key, kind, Array.from(inp.files));
  inp.click();
}
function wireDrop(el, key, kind) {
  wireDropZone(el, files => addFiles(key, kind, files));
}
/* Generic drag-and-drop wiring: highlight on hover, hand the dropped files to a
   callback. Shared by submittals, RFIs and job-tracking drop zones. */
function wireDropZone(el, onFiles) {
  if (!el) return;
  el.addEventListener('dragover', e => { e.preventDefault(); el.classList.add('over'); });
  el.addEventListener('dragleave', () => el.classList.remove('over'));
  el.addEventListener('drop', e => {
    e.preventDefault(); el.classList.remove('over');
    onFiles(Array.from((e.dataTransfer && e.dataTransfer.files) || []));
  });
}
/* The statuses a PDF can be filed under — the outgoing package and the ways it
   comes back. Picking one is required on every upload. */
const DOC_STATUSES = ['submitted_gc', 'partial_approval', 'approved', 'revise_resubmit', 'revision_requested', 'revision_sent'];
let _uploadStatusResolve = null;
function pickUploadStatus(kind) {
  return new Promise(resolve => {
    _uploadStatusResolve = resolve;
    const def = kind === 'responses' ? 'approved' : 'submitted_gc';
    const what = kind === 'responses' ? 'response' : 'submittal';
    $('modalHost').innerHTML = `<div class="modal-scrim" onclick="if(event.target===this)chooseUploadStatus(null)"><div class="modal">
      <div class="modal-head"><h3>File this ${what} under…</h3>
        <button class="icon-btn" onclick="chooseUploadStatus(null)">✕</button></div>
      <div class="modal-body">
        <p class="muted" style="margin-bottom:12px">Pick the status this PDF represents. It becomes the section's current status (the newest one always shows on the main page), and the file is saved in a ShareFile subfolder named for it.</p>
        <div class="status-grid">${DOC_STATUSES.map(id => { const st = ST[id]; return `
          <button class="status-opt ${id === def ? 'on' : ''}" style="${id === def ? 'color:' + cvar(st.color) + ';background:' + csf(st.color) : ''}"
            onclick="chooseUploadStatus('${id}')"><i style="background:${cvar(st.color)}"></i><span>${esc(st.label)}</span></button>`; }).join('')}</div>
      </div></div></div>`;
  });
}
function chooseUploadStatus(id) {
  const r = _uploadStatusResolve; _uploadStatusResolve = null;
  closePdf();
  if (r) r(id);
}
/* Retire a superseded PDF: flag it archived, prefix its name with "OLD - " so it's
   obviously not the current revision, and move the file into the Submittals/Archive
   folder (out of the live status folders). Idempotent. */
async function prefixOld(doc) {
  if (!doc || isLink(doc)) return;
  if (doc.archived === true && doc.dir === ARCHIVE_DIR && /^OLD\s*-\s*/i.test(doc.name || '')) return;   // fully archived
  doc.archived = true;
  const already = /^OLD\s*-\s*/i.test(doc.name || '');
  const newName = already ? (doc.name || doc.file) : 'OLD - ' + (doc.name || doc.file || 'document.pdf');
  if (!doc.file || !jobFolder) { doc.name = newName; doc.dir = ARCHIVE_DIR; return; }   // no readable file → flag the record only
  try {
    const filesRoot = await jobFolder.getDirectoryHandle('files');
    const srcDh = doc.dir ? await walkDir(filesRoot, doc.dir) : filesRoot;
    const blob = await (await srcDh.getFileHandle(doc.file)).getFile();
    const destDh = await walkDirCreate(filesRoot, ARCHIVE_DIR);
    const target = await uniqueFileName(destDh, sanitizeFileName(newName));
    const fh = await destDh.getFileHandle(target, { create: true });
    const w = await fh.createWritable(); await w.write(blob); await w.close();
    if (!(doc.dir === ARCHIVE_DIR && target === doc.file)) { try { await srcDh.removeEntry(doc.file); } catch (e) {} }
    if (blobUrlCache.has(doc.id)) { URL.revokeObjectURL(blobUrlCache.get(doc.id)); blobUrlCache.delete(doc.id); }
    doc.name = target; doc.file = target; doc.dir = ARCHIVE_DIR;
  } catch (e) { doc.name = newName; doc.dir = ARCHIVE_DIR; }
}
async function markPriorOld(s, kind, priorIds) {
  for (const d of (s[kind] || [])) if (priorIds.has(d.id) && !isLink(d)) await prefixOld(d);
}
async function addFiles(key, kind, files) {
  const s = findSection(key);
  if (!s || !files.length) return;
  const pdfs = files.filter(f => !(f.type && f.type !== 'application/pdf' && !/\.pdf$/i.test(f.name)));
  if (pdfs.length < files.length) toast('Non-PDF files were skipped', true);
  if (!pdfs.length) return;
  // On a phone the ShareFile folder can't be written — stage the PDF in Firebase
  // and let a computer file it. On desktop, load the folder and file it directly.
  if (!jobFolder) {
    if (fsSupported()) { if (!(await ensureJobFolder())) return; }
    else return stageSectionPdfs(key, kind, pdfs);
  }
  // A status must be chosen for the upload — this is what tracks history.
  const status = await pickUploadStatus(kind);
  if (!status) return;
  markPending(key);
  s[kind] = s[kind] || [];
  const priorIds = new Set(s[kind].map(d => d.id));   // the docs this upload supersedes
  let added = 0;
  for (const f of pdfs) {
    const docId = uid('doc');
    try {
      stickyToast(`Saving ${f.name}…`);
      const { dir, file } = await putFile(f, status);
      s[kind].push({
        id: docId, name: f.name, size: f.size, status, uploaded: Date.now(), dir, file,
        rev: kind === 'submittals' ? 'Rev ' + s[kind].filter(d => d.rev).length : ''
      });
      added++;
    } catch (e) {
      console.error(e);
      toast(storageError(e), true);
    }
  }
  if (!added) return;
  await markPriorOld(s, kind, priorIds);   // the previous PDFs are now superseded → "OLD - …"
  applyStatus(s, status);           // the section's status becomes the newest upload's
  sortSections(); renderJob();
  if (openKey === key) renderDrawer();
  try {
    await patchSection(key, {
      [kind]: s[kind], status: s.status, history: s.history || [],
      submittedDate: s.submittedDate || '', returnedDate: s.returnedDate || '',
      releaseState: s.releaseState || 'not_ready'
    });
  } catch (e) { toast(writeError(e), true); return; }
  noteFolderChanged();
  syncAllSubmittals().catch(() => {});
  toast(`${added} PDF${added === 1 ? '' : 's'} filed under ${ST[status].label}`);
}
/* Phone path: no ShareFile folder here, so stage the PDF(s) in Firebase against the
   section. A computer with the folder loaded files them in automatically. */
async function stageSectionPdfs(key, kind, pdfs) {
  const s = findSection(key); if (!s) return;
  const big = pdfs.find(f => f.size > STAGE_MAX);
  if (big) { toast(`"${big.name}" is too big to upload from a phone (25 MB max)`, true); pdfs = pdfs.filter(f => f.size <= STAGE_MAX); }
  if (!pdfs.length) return;
  const status = await pickUploadStatus(kind);
  if (!status) return;
  s[kind] = s[kind] || [];
  let added = 0;
  for (const f of pdfs) {
    try {
      stickyToast(`Uploading ${f.name}…`);
      const stagedId = await stageBlob(f, f.name);
      s[kind].push({ id: uid('doc'), name: f.name, size: f.size, status, uploaded: Date.now(), staged: true, stagedId,
        rev: kind === 'submittals' ? 'Rev ' + s[kind].filter(d => d.rev).length : '' });
      added++;
    } catch (e) { console.error(e); toast('Upload failed: ' + (e.message || e), true); }
  }
  if (!added) { toast(' '); return; }
  applyStatus(s, status);
  sortSections(); renderJob(); if (openKey === key) renderDrawer();
  try { await patchSection(key, { [kind]: s[kind], status: s.status, history: s.history || [], submittedDate: s.submittedDate || '', returnedDate: s.returnedDate || '', releaseState: s.releaseState || 'not_ready' }); }
  catch (e) { toast(writeError(e), true); return; }
  toast(`${added} PDF${added === 1 ? '' : 's'} uploaded — a computer will file ${added === 1 ? 'it' : 'them'} into ShareFile`);
}
/* On a computer with the folder loaded, pull any phone-staged PDFs out of Firebase,

        </button>
