      <div class="sec">
        <div class="grid3">
          <div class="field"><label class="fl">Date sent</label>
            <input class="input" type="date" value="${esc(r.dateSent || '')}" onchange="patchRfi('${r.id}',{dateSent:this.value})"></div>
          <div class="field"><label class="fl">Response due</label>
            <input class="input" type="date" value="${esc(r.dateDue || '')}" onchange="patchRfi('${r.id}',{dateDue:this.value})"></div>
          <div class="field"><label class="fl">Answered</label>
            <input class="input" type="date" value="${esc(r.dateAnswered || '')}" onchange="patchRfi('${r.id}',{dateAnswered:this.value})"></div>
        </div>
      </div>

      <div class="sec">
        <h4>RFI question <button class="btn sm" onclick="pickRfiFiles('${r.id}','question')">+ Upload PDF</button></h4>
        ${rfiDocList(r, 'question')}
        <div class="drop" id="rfiDropQ" onclick="pickRfiFiles('${r.id}','question')">
          Drop the RFI question PDF here<br><span class="muted">The RFI as sent out — saved to this job’s ShareFile folder</span></div>
        <textarea class="input no-caps autosize" rows="3" style="margin-top:8px" placeholder="…or type the RFI question here, if you don’t have a PDF"
          onchange="patchRfi('${r.id}',{questionText:this.value})">${esc(r.questionText || '')}</textarea>
      </div>

      <div class="sec">
        <h4>RFI response <button class="btn sm" onclick="pickRfiFiles('${r.id}','answer')">+ Upload PDF</button></h4>
        ${rfiDocList(r, 'answer')}
        <div class="drop" id="rfiDropA" onclick="pickRfiFiles('${r.id}','answer')">
          Drop the returned / stamped response PDF here</div>
        <textarea class="input no-caps autosize" rows="3" style="margin-top:8px" placeholder="…or type the response here, if you don’t have a PDF"
          onchange="patchRfi('${r.id}',{answerText:this.value})">${esc(r.answerText || '')}</textarea>
      </div>

      <div class="sec">
        <h4>Action items ${acCountLabel(r.checklist)}</h4>
        <div class="add-row">
          <input class="input" id="rfiCheckInput" placeholder="Add an action item (e.g. cost impact, schedule impact)…"
            onkeydown="if(event.key==='Enter')acAdd('rfi','${r.id}','rfiCheckInput')">
          <button class="btn sm" onclick="acAdd('rfi','${r.id}','rfiCheckInput')">Add</button>
        </div>
        ${checklistHtml('rfi', r.id, r.checklist)}
        <div class="muted" style="margin-top:6px">Click an item to add details — cost, schedule impact, who owns it.</div>
      </div>

      <div class="sec">
        <h4>Notes</h4>
        <textarea class="input autosize" rows="4" placeholder="Anything worth remembering about this RFI"
          onchange="patchRfi('${r.id}',{notes:this.value})">${esc(r.notes || '')}</textarea>
        <label class="note-show"><input type="checkbox" ${r.showNote ? 'checked' : ''}
          onchange="patchRfi('${r.id}',{showNote:this.checked})"> Show this note on the RFI log</label>
      </div>
    </div>
  </aside>`;

  wireDropZone($('rfiDropQ'), files => addRfiFiles(r.id, 'question', files));
  wireDropZone($('rfiDropA'), files => addRfiFiles(r.id, 'answer', files));
  autosizeAll($('drawerHost'));
}

/* ═══════════════════════════════════════════════════════════════════════════
   6c. JOB TRACKING  —  user-made categories holding emails, notes, checklists
   ═══════════════════════════════════════════════════════════════════════════ */
function catById(id) { return tracking.find(c => c.id === id); }
async function saveTrackCat(c) {
  c.updated = Date.now();
  try { await FB.setDoc(trackingRef(job.id, c.id), clean(c)); }
  catch (e) { toast(writeError(e), true); }
}
function newTrackCategory() {
  if (!job) return;
  const name = prompt('Category name (e.g. Change Orders, Scheduling, Owner correspondence):');
  if (!name || !name.trim()) return;
  const c = { id: uid('cat'), name: name.trim(), order: tracking.length,
    files: [], notes: [], checklist: [], created: Date.now(), updated: Date.now() };
  tracking.push(c);
  trackCat = c.id;
  renderTracking();
  saveTrackCat(c);
}
function selectTrackCat(id) { trackCat = id; renderTracking(); }
async function renameTrackCat(id) {
  const c = catById(id); if (!c) return;
  const name = prompt('Category name:', c.name || '');
  if (name === null || !name.trim()) return;
  c.name = name.trim();
  renderTracking();
  await saveTrackCat(c);
}
async function deleteTrackCat(id) {
  const c = catById(id); if (!c) return;
  if (!confirm(`Delete category "${c.name}"? Its notes and checklist go too. The uploaded files stay in the ShareFile folder.`)) return;
  tracking = tracking.filter(x => x.id !== id);
  if (trackCat === id) trackCat = tracking.length ? tracking[0].id : null;
  renderTracking();
  try { await FB.deleteDoc(trackingRef(job.id, id)); } catch (e) { toast(writeError(e), true); }
}

function renderTracking() {
  if (!job) return;
  if (trackCat && !catById(trackCat)) trackCat = null;
  if (!trackCat && tracking.length) trackCat = tracking[0].id;
  $('trackCats').innerHTML = tracking.map(c => {
    const nf = (c.files || []).length, na = (c.checklist || []).filter(i => !i.done).length;
    const bits = [];
    if (nf) bits.push(nf + ' file' + (nf === 1 ? '' : 's'));
    if (na) bits.push(na + ' to do');
    return `<button class="track-cat ${trackCat === c.id ? 'on' : ''}" onclick="selectTrackCat('${c.id}')">
       <span class="tc-name">${esc(c.name)}</span>
       <span class="tc-sub">${bits.join(' · ') || 'empty'}</span>
     </button>`;
  }).join('') +
    `<button class="track-cat add" onclick="newTrackCategory()">+ New category</button>`;

  const c = catById(trackCat);
  if (!c) {
    $('trackPanel').innerHTML = `<div class="empty"><b>No categories yet.</b><br>
      <span class="muted">Make categories for anything on the job — change orders, scheduling, owner emails — then drop the email conversations, notes and action items into each.</span><br><br>
      <button class="btn primary" onclick="newTrackCategory()">+ New category</button></div>`;
    return;
  }
  const files = c.files || [], notes = c.notes || [], checklist = c.checklist || [];
  $('trackPanel').innerHTML = `
    <div class="track-head">
      <h3>${esc(c.name)}</h3>
      <div class="spacer"></div>
      <button class="btn sm ghost" onclick="renameTrackCat('${c.id}')">Rename</button>
      <button class="btn sm ghost" onclick="deleteTrackCat('${c.id}')">Delete</button>
    </div>

    <div class="track-body">
      <div class="track-col">
        <div class="track-sec">
          <h4>Emails &amp; files <span class="spacer"></span><button class="btn sm" onclick="pickEmailFiles('${c.id}')">+ Add</button></h4>
          ${files.length ? `<div class="file-list">` + files.map(f => `
            <div class="file-row"><span class="fi">${/\.(msg|eml)$/i.test(f.name) ? '✉️' : '📄'}</span>
              <span class="fn"><b>${esc(f.name)}</b><small>${f.added ? fmtDate(f.added) : ''}${f.size ? ' · ' + fmtBytes(f.size) : ''}</small></span>
              <button class="btn sm" onclick="viewEmailDoc('${c.id}','${f.id}')">Open</button>
              <button class="btn sm ghost" title="Rename" onclick="renameEmailDoc('${c.id}','${f.id}')">✎</button>
              <button class="icon-btn" title="Remove" onclick="removeEmailDoc('${c.id}','${f.id}')">🗑</button>
            </div>`).join('') + `</div>` : `<div class="muted" style="font-size:13px">No emails or files yet.</div>`}
          <div class="email-drop" id="emailDrop">Drop emails or files here, or click to choose <span class="muted">· .msg, .eml, PDF</span></div>
        </div>
      </div>
      <div class="track-col">
        <div class="track-sec">
          <h4>Action items ${acCountLabel(checklist)}</h4>
          <div class="add-row">
            <input class="input" id="checkInput" placeholder="Add an action item…" onkeydown="if(event.key==='Enter')acAdd('cat','${c.id}','checkInput')">
            <button class="btn sm" onclick="acAdd('cat','${c.id}','checkInput')">Add</button>
          </div>
          ${checklist.length ? checklistHtml('cat', c.id, checklist) + `<div class="muted" style="margin-top:6px">Click an item to add details.</div>` : `<div class="muted" style="font-size:13px">No action items.</div>`}
        </div>
        <div class="track-sec">
          <h4>Notes</h4>
          <div class="add-row">
            <input class="input" id="noteInput" placeholder="Add a note…" onkeydown="if(event.key==='Enter')addNote('${c.id}')">
            <button class="btn sm" onclick="addNote('${c.id}')">Add</button>
          </div>
          ${notes.map(n => `
            <div class="note-item">
              <div class="nt">${esc(n.text).replace(/\n/g, '<br>')}</div>
              <div class="nm"><small class="muted">${n.created ? fmtDate(n.created) : ''}</small>
                <button class="x" title="Remove" onclick="deleteNote('${c.id}','${n.id}')">✕</button></div>
            </div>`).join('') || '<div class="muted" style="font-size:13px">No notes yet.</div>'}
        </div>
      </div>
    </div>`;

  const drop = $('emailDrop');
  if (drop) {
    drop.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('over'); });
    drop.addEventListener('dragleave', () => drop.classList.remove('over'));
    drop.addEventListener('drop', e => {
      e.preventDefault(); drop.classList.remove('over');
      addEmailFiles(c.id, Array.from(e.dataTransfer.files));
    });
    drop.addEventListener('click', () => pickEmailFiles(c.id));
  }
}

async function pickEmailFiles(catId) {
  if (!jobFolder) { if (!(await loadJobFolder())) return; }
  const inp = document.createElement('input');
  inp.type = 'file'; inp.multiple = true;
  inp.accept = '.msg,.eml,.pdf,application/pdf,message/rfc822';
  inp.onchange = () => addEmailFiles(catId, Array.from(inp.files));
  inp.click();
}
async function addEmailFiles(catId, files) {
  const start = catById(catId); if (!start || !files.length) return;
  if (!jobFolder) { if (!(await loadJobFolder())) return; }
  const catName = start.name;                 // fix the folder path for this upload
  const newFiles = [];
  for (const f of files) {
    try {
      stickyToast(`Saving ${f.name}…`);
      const { dir, file } = await putEmailFile(f, catName);
      newFiles.push({ id: uid('doc'), name: f.name, size: f.size, dir, file, added: Date.now() });
    } catch (e) { console.error(e); toast(storageError(e), true); }
  }
  if (!newFiles.length) return;
  // Re-read after the writes so a snapshot that landed mid-upload isn't clobbered.
  const c = catById(catId);
  if (!c) { toast('That category is no longer available', true); noteFolderChanged(); return; }
  c.files = (c.files || []).concat(newFiles);
  renderTracking();
  await saveTrackCat(c);
  noteFolderChanged();
  toast(`${newFiles.length} file${newFiles.length === 1 ? '' : 's'} added to ${c.name}`);
}
async function removeEmailDoc(catId, fileId) {
  const c = catById(catId); if (!c) return;
  const d = (c.files || []).find(x => x.id === fileId); if (!d) return;
  if (!confirm(`Remove "${d.name}" for everyone?`)) return;
  await deleteStoredDoc(d);
  c.files = c.files.filter(x => x.id !== fileId);
  renderTracking();
  await saveTrackCat(c);
  noteFolderChanged();
}
async function viewEmailDoc(catId, fileId) {
  const c = catById(catId); if (!c) return;
  const d = (c.files || []).find(x => x.id === fileId);
  if (d) openStoredDoc(d);
}
/* ── action items, shared by RFIs and tracking categories ──
   An owner is an RFI ('rfi') or a tracking category ('cat'); both keep a
   `checklist` array of { id, text, detail, due, done, created }. */
function acOwner(type, id) {
  return type === 'rfi' ? rfiById(id) : type === 'co' ? coById(id) : catById(id);
}
function acSave(type, o) {
  return type === 'rfi' ? saveRfi(o) : type === 'co' ? saveCo(o) : saveTrackCat(o);
}
function acRerender(type) {
  if (type === 'rfi') { renderRfis(); if (openRfi) renderRfiDrawer(); }
  else if (type === 'co') { renderCos(); if (openCo) renderCoDrawer(); }
  else renderTracking();
}
function acCountLabel(list) {
  const total = (list || []).length; if (!total) return '';
  const done = list.filter(i => i.done).length;
  return `<span class="muted" style="font-weight:400">${done}/${total} done</span>`;
}
function acDueClass(due) {
  if (!due) return '';
  return due < today() ? 'overdue' : (due === today() ? 'today' : '');
}
function checklistHtml(type, id, list) {
  return (list || []).map(i => `
    <div class="check-row ${i.done ? 'done' : ''}">
      <label class="tick"><input type="checkbox" ${i.done ? 'checked' : ''} onchange="acToggle('${type}','${id}','${i.id}',this.checked)"></label>
      <button class="ct-btn" onclick="openActionItem('${type}','${id}','${i.id}')" title="Open to add details">
        <span class="ct">${esc(i.text)}</span>
        ${i.due ? `<span class="ac-due ${acDueClass(i.due)}">${fmtShort(i.due)}</span>` : ''}
        ${i.detail ? '<span class="ac-has" title="Has details">📝</span>' : ''}
      </button>
      <button class="x" title="Remove" onclick="acDelete('${type}','${id}','${i.id}')">✕</button>
    </div>`).join('') || '<div class="muted">No action items yet.</div>';
}
function acAdd(type, id, inputId) {
  const o = acOwner(type, id); if (!o) return;
  const el = $(inputId); const text = (el && el.value || '').trim();
  if (!text) return;
  o.checklist = o.checklist || [];
  o.checklist.push({ id: uid('chk'), text, detail: '', due: '', done: false, created: Date.now() });
  acRerender(type); acSave(type, o);
  const ne = $(inputId); if (ne) { ne.value = ''; ne.focus(); }
}
function acToggle(type, id, itemId, done) {
  const o = acOwner(type, id); if (!o) return;
  const it = (o.checklist || []).find(x => x.id === itemId); if (!it) return;
  it.done = done;
  acRerender(type); acSave(type, o);
  if (acModal && acModal.itemId === itemId) renderActionModal();
}
function acDelete(type, id, itemId) {
  const o = acOwner(type, id); if (!o) return;
  o.checklist = (o.checklist || []).filter(x => x.id !== itemId);
  if (acModal && acModal.itemId === itemId) closeActionModal();
  acRerender(type); acSave(type, o);
}
function acPatch(type, id, itemId, fields) {
  const o = acOwner(type, id); if (!o) return;
  const it = (o.checklist || []).find(x => x.id === itemId); if (!it) return;
  Object.assign(it, fields);
  acRerender(type); acSave(type, o);
}
/* The detail editor — a modal stacked over whatever tab/drawer opened it. */
let acModal = null;   // { type, id, itemId }
function openActionItem(type, id, itemId) { acModal = { type, id, itemId }; renderActionModal(); }
function closeActionModal() { acModal = null; $('modalHost').innerHTML = ''; }
/* A live snapshot may delete or change the item under an open detail modal.
   Re-render it (which self-closes if the item is gone) — but never while the
   user is typing in it, or we'd steal the caret. */
function refreshActionModalIfSafe() {
  if (!acModal) return;
  const ae = document.activeElement;
  if (ae && ae.closest && ae.closest('#modalHost')) return;
  renderActionModal();
}
function renderActionModal() {
  const m = acModal; if (!m) return;
  const o = acOwner(m.type, m.id);
  const it = o && (o.checklist || []).find(x => x.id === m.itemId);
  if (!it) { closeActionModal(); return; }
  const ownerLabel = m.type === 'rfi' ? ('RFI ' + (o.number || '')) : (o.name || '');
  const args = `'${m.type}','${m.id}','${m.itemId}'`;
  $('modalHost').innerHTML = `<div class="modal-scrim" onclick="if(event.target===this)closeActionModal()"><div class="modal">
    <div class="modal-head"><h3>Action item</h3><button class="icon-btn" onclick="closeActionModal()">✕</button></div>
    <div class="modal-body">
      <div class="muted" style="margin-bottom:12px">${esc(ownerLabel)}</div>
      <div class="field"><label class="fl">Action item</label>
        <input class="input" value="${esc(it.text)}" onchange="acPatch(${args},{text:this.value.trim()})"></div>
      <div class="grid2">
        <div class="field"><label class="fl">Due date</label>
          <input class="input" type="date" value="${esc(it.due || '')}" onchange="acPatch(${args},{due:this.value})"></div>
        <div class="field"><label class="fl">Status</label>
          <label class="ac-done"><input type="checkbox" ${it.done ? 'checked' : ''} onchange="acToggle(${args},this.checked)"> <span>Done</span></label></div>
      </div>
      <div class="field"><label class="fl">Details</label>
        <textarea class="input autosize" rows="6" placeholder="Cost impact, schedule impact, who owns it, what’s blocking it…"
          onchange="acPatch(${args},{detail:this.value})">${esc(it.detail || '')}</textarea></div>
    </div>
    <div class="modal-foot">
      <button class="btn ghost" onclick="acDelete(${args})">Delete</button>
      <div class="spacer" style="flex:1"></div>
      <button class="btn primary" onclick="closeActionModal()">Done</button>
    </div></div></div>`;
  autosizeAll($('modalHost'));
}
function addNote(catId) {
  const c = catById(catId); if (!c) return;
  const el = $('noteInput'); const text = (el.value || '').trim();
  if (!text) return;
  c.notes = c.notes || [];
  c.notes.unshift({ id: uid('note'), text, created: Date.now() });
  renderTracking();
  saveTrackCat(c);
  const ne = $('noteInput'); if (ne) ne.focus();
}
function deleteNote(catId, noteId) {
  const c = catById(catId); if (!c) return;
  c.notes = (c.notes || []).filter(x => x.id !== noteId);
  renderTracking();
  saveTrackCat(c);
}

/* ═══════════════════════════════════════════════════════════════════════════
   6d. CHANGE ORDERS  —  a log with a paid check-off, mirroring the RFI log
   ═══════════════════════════════════════════════════════════════════════════ */
function coById(id) { return cos.find(c => c.id === id); }
function csOf(c) { return CS[c.status || 'pending'] || CS.pending; }
function nextCoNumber() {
  let max = 0;
  for (const c of cos) { const m = String(c.number || '').match(/(\d+)/); if (m) max = Math.max(max, parseInt(m[1], 10)); }
  return String(max + 1).padStart(2, '0');
}
async function saveCo(c) {
  c.updated = Date.now();
  try { await FB.setDoc(coRef(job.id, c.id), clean(c)); }
  catch (e) { toast(writeError(e), true); }
  if (c.est && typeof scheduleCoFileFlush === 'function') scheduleCoFileFlush(c);   // mirror the change proposal to Excel
}
function matchCo(c, q) {
  if (!q) return true;
  const hay = [c.number, c.description, c.notes, c.amount,
    ...(c.docs || []).map(d => d.name), ...(c.emails || []).map(d => d.name)].join(' ').toLowerCase();
  return hay.includes(q.toLowerCase());
}
function visibleCos() {
  return cos.filter(c => (!coStatusFilter || (coStatusFilter === 'paid' ? c.paid : (c.status || 'pending') === coStatusFilter)) && matchCo(c, coQuery));
}
function setCoFilter(id) { coStatusFilter = (coStatusFilter === id) ? null : id; renderCos(); }
function setContractAmount(v) {
  if (!job) return;
  const n = parseFloat(String(v || '').replace(/[^0-9.\-]/g, ''));
  job.contractAmount = isFinite(n) ? n : '';
  saveJobMeta().catch(() => {});
}

function renderCos() {
  if (!job) return;
  const tally = {}; CO_STATUSES.forEach(s => tally[s.id] = 0);
  let paidN = 0, pendingTotal = 0, approvedTotal = 0, paidAmt = 0;
  cos.forEach(c => {
    const st = c.status || 'pending';
    tally[st]++;
    if (c.paid) paidN++;
    const n = parseFloat(String(c.amount).replace(/[^0-9.-]/g, ''));   // deducts (negatives) subtract
    if (isFinite(n)) {
      if (st === 'approved') approvedTotal += n;
      else if (st === 'pending' || st === 'submitted') pendingTotal += n;
      if (c.paid) paidAmt += n;
    }
  });
  $('coChips').innerHTML = CO_STATUSES.map(s =>
    `<button class="chip ${coStatusFilter === s.id ? 'on' : ''}" style="${coStatusFilter === s.id ? 'color:' + cvar(s.color) + ';background:' + csf(s.color) : ''}"
      onclick="setCoFilter('${s.id}')"><i style="background:${cvar(s.color)}"></i>${esc(s.label)}<span class="n">${tally[s.id]}</span></button>`
  ).join('') +
    `<button class="chip ${coStatusFilter === 'paid' ? 'on' : ''}" style="${coStatusFilter === 'paid' ? 'color:' + cvar('green') + ';background:' + csf('green') : ''}"
      onclick="setCoFilter('paid')"><i style="background:${cvar('green')}"></i>Paid<span class="n">${paidN}</span></button>` +
    (coStatusFilter ? `<button class="chip" onclick="setCoFilter(null)">Clear ✕</button>` : '');

  const cc = $('coContract');
  if (cc && document.activeElement !== cc) cc.value = (job.contractAmount || job.contractAmount === 0) ? fmtAmountInput(String(job.contractAmount)) : '';
  const list = visibleCos();
  const tp = [];
  if (pendingTotal) tp.push('Pending ' + fmtMoney(pendingTotal));
  if (approvedTotal) tp.push('Approved ' + fmtMoney(approvedTotal));
  if (paidAmt) tp.push('Paid ' + fmtMoney(paidAmt));
  const totLabel = tp.length ? ' · ' + tp.join('  ·  ') : '';
  $('coCount').textContent = (list.length === cos.length ? `${cos.length} change order${cos.length === 1 ? '' : 's'}` : `${list.length} of ${cos.length}`) + totLabel;
  $('coBody').innerHTML = list.map(coRowHtml).join('');
  $('coEmpty').innerHTML = cos.length ? (list.length ? '' :
      `<div class="empty">No change orders match. <button class="btn sm ghost" onclick="coQuery='';coStatusFilter=null;$('coSearch').value='';renderCos()">Clear</button></div>`)
    : `<div class="empty"><b>No change orders yet.</b><br><span class="muted">Log each change order with its amount and status, attach the CO PDF, and tick it off once it’s paid.</span><br><br>
        <button class="btn primary" onclick="newChangeOrder()">+ New change order</button></div>`;
}
function coRowHtml(c) {
  const st = csOf(c);
  const openAc = (c.checklist || []).filter(i => !i.done).length;
  const sub = openAc ? `<small>☐ ${openAc} action item${openAc === 1 ? '' : 's'}</small>` : '';
  return `<tr onclick="openCoDrawer('${c.id}')">
    <td class="c-conum" data-label="CO #"><b>${esc(c.number || '—')}</b></td>
    <td class="c-codesc" data-label="Description">${esc(c.description || '(no description)')}${sub}</td>
    <td class="c-coamt${c.amount ? '' : ' is-empty'}" data-label="Amount">${c.amount ? esc(fmtMoney(c.amount) || c.amount) : '<span class="muted">—</span>'}</td>
    <td class="c-costatus" data-label="Status"><span class="pill" style="color:${cvar(st.color)};background:${csf(st.color)}"><i></i>${esc(st.label)}</span></td>
    <td class="c-copaid" data-label="Paid">
      <label class="tick" title="Tick when this change order is paid" onclick="event.stopPropagation()">

/* ═══════════════════════════════════════════════════════════════════════════
   6d1b. CHANGE-ORDER ESTIMATOR  —  a full change-proposal builder per CO,
   faithful to the Arctic "Change Proposal Backup" spreadsheet. Material,
   equipment/vendor pricing, a full labor table (trades × classes × ST/OT/DT/
   shift), subcontractors, tools/indirects, then total costs → markup → bond /
   OCIP / contingency / tax / round-to-nearest → total bid. Labor rates come
   from a per-job rate table you can populate by uploading your rate PDF.
   ═══════════════════════════════════════════════════════════════════════════ */
const EST_TRADES = [
  { key: 'plumb', label: 'Plumbing',            field: true  },
  { key: 'pipe',  label: 'Piping',              field: true  },
  { key: 'smf',   label: 'Sheet Metal — Field', field: true  },
  { key: 'sms',   label: 'Sheet Metal — Shop',  field: false },
];
const EST_CLASSES = [ { key: 'gf', label: 'General Foreman' }, { key: 'frmn', label: 'Foreman' }, { key: 'jrny', label: 'Journeyman' }, { key: 'app', label: 'Apprentice' } ];
const EST_INDIRECT = [ { key: 'pm', label: 'Project Manager' }, { key: 'pe', label: 'Project Engineer' }, { key: 'bim', label: 'BIM / Coordination' } ];
const EST_CUSTOM   = [ { key: 'custom1', label: 'Custom 1' }, { key: 'custom2', label: 'Custom 2' }, { key: 'custom3', label: 'Custom 3' } ];
const EST_TAXES = [
  { id: 'oregon_cat',    label: 'Oregon CAT (0.55%)',        rate: 0.0055 },
  { id: 'washington_bo', label: 'Washington B&O (0.59%)',    rate: 0.0059 },
  { id: 'none',          label: 'No state gross-receipts tax', rate: 0 },
];
function estTaxRate(id) { const t = EST_TAXES.find(x => x.id === id); return t ? t.rate : 0; }
/* Ordered labor rows: field/shop trades × classes, then indirect + custom. */
function estLaborRows() {
  const rows = [];
  EST_TRADES.forEach(t => EST_CLASSES.forEach(cl => rows.push({ key: t.key + '_' + cl.key, label: t.label + ' ' + cl.label, group: t.label, field: t.field })));
  EST_INDIRECT.forEach(i => rows.push({ key: i.key, label: i.label, group: 'Indirect labor', field: false }));
  EST_CUSTOM.forEach(i => rows.push({ key: i.key, label: i.label, group: 'Custom labor', field: false }));
  return rows;
}
/* Default markups (from the rate PDF) and default labor rates seeded from Arctic's
   current prevailing-wage sheet, so estimates work before any PDF is uploaded.
   Each rate is the fully-burdened hourly cost for ST / OT / DT. */
const DEFAULT_MARKUP = { material: 15, equipment: 15, labor: 15, subs: 10 };
const SHOP_BURDEN_DEFAULT = 17.75;   // added $/hr for fab-shop equipment & consumables
function _rt(st, ot, dt) { return { st, ot, dt, shift: 0 }; }
function defaultLaborRates() {
  const f = {
    plumb_gf: _rt(164.56, 226.30, 288.04), plumb_frmn: _rt(149.33, 203.45, 257.58), plumb_jrny: _rt(134.10, 180.61, 227.12), plumb_app: _rt(122.73, 164.59, 206.45),
    pipe_gf:  _rt(164.56, 226.30, 288.04), pipe_frmn:  _rt(149.33, 203.45, 257.58), pipe_jrny:  _rt(134.10, 180.61, 227.12), pipe_app:  _rt(122.73, 164.59, 206.45),
    smf_gf:   _rt(138.61, 189.96, 241.30), smf_frmn:   _rt(134.41, 183.65, 232.89), smf_jrny:   _rt(121.80, 164.73, 207.67), smf_app:   _rt(108.89, 147.53, 186.18),
    pm: _rt(143.92, 177.00, 222.83), pe: _rt(118.81, 109.58, 135.71), bim: _rt(144.61, 160.91, 202.57),
    custom1: _rt(0, 0, 0), custom2: _rt(0, 0, 0), custom3: _rt(0, 0, 0),
  };
  // Shop = field + shop burden on every rate.
  EST_CLASSES.forEach(cl => { const s = f['smf_' + cl.key]; f['sms_' + cl.key] = { st: round2(s.st + SHOP_BURDEN_DEFAULT), ot: round2(s.ot + SHOP_BURDEN_DEFAULT), dt: round2(s.dt + SHOP_BURDEN_DEFAULT), shift: 0 }; });
  return { rates: f, markup: Object.assign({}, DEFAULT_MARKUP), shopBurden: SHOP_BURDEN_DEFAULT, source: '', updated: 0 };
}
function jobLaborRates() {
  if (job && job.laborRates && job.laborRates.rates) return job.laborRates;
  return defaultLaborRates();
}
function jobMarkup() { const lr = jobLaborRates(); return Object.assign({}, DEFAULT_MARKUP, lr.markup || {}); }
async function saveLaborRates(lr) { if (!job) return; job.laborRates = lr; try { await saveJobMeta(); } catch (e) { toast(writeError(e), true); } }

/* ── the calculation engine — a pure function, unit-tested against the sheet ── */
function estNum(v) { if (typeof v === 'number') return isFinite(v) ? v : 0; const n = parseFloat(String(v == null ? '' : v).replace(/[^0-9.\-]/g, '')); return isFinite(n) ? n : 0; }
function round2(n) { return Math.round((n + (n >= 0 ? 1e-9 : -1e-9)) * 100) / 100; }
function estMround(x, m) { if (!m) return x; return Math.round(x / m) * m; }
function defaultEstimate() {
  const mk = jobMarkup();
  return {
    material:  { takeoff: '', lines: [], markupPct: mk.material },
    equipment: { lines: [], markupPct: mk.equipment },
    labor:     { rows: {}, perDiemPerDay: '', markupPct: mk.labor },
    subs:      { lines: [], markupPct: mk.subs },
    indirects: { smallToolsPct: 2.5, consumablesPct: 2.5, siteIndirectsPct: 0, deliveryCost: 150, deliveryQty: '', safetyPct: 2.5, permits: '', rentals: '', markupPct: 0 },
    totals:    { totalMarkupPct: 0, bond: '', ocip: '', contingency: '', taxType: 'oregon_cat', roundTo: 5 },
  };
}
function computeEstimate(est, laborRates) {
  est = est || {};
  const rates = (laborRates && laborRates.rates) ? laborRates.rates : defaultLaborRates().rates;
  const M = est.material || {}, E = est.equipment || {}, L = est.labor || {}, S = est.subs || {}, I = est.indirects || {}, T = est.totals || {};
  // Material
  const matTakeoff = estNum(M.takeoff);
  const matLines = (M.lines || []).reduce((s, l) => s + estNum(l.cost), 0);
  const matSub = round2(matTakeoff + matLines);
  const matMk = round2(matSub * estNum(M.markupPct) / 100);
  const matTotal = round2(matSub + matMk);
  // Equipment & vendor pricing (deducts are negative lines)
  const eqSub = round2((E.lines || []).reduce((s, l) => s + estNum(l.cost), 0));
  const eqMk = round2(eqSub * estNum(E.markupPct) / 100);
  const eqTotal = round2(eqSub + eqMk);
  // Labor
  const rows = estLaborRows();
  const hrsBy = L.rows || {};
  const perRow = {}; let laborSub = 0, fieldCost = 0, fieldHrs = 0, totalHrs = 0;
  rows.forEach(r => {
    const h = hrsBy[r.key] || {}, rt = rates[r.key] || {};
    const st = estNum(h.st), ot = estNum(h.ot), dt = estNum(h.dt), sh = estNum(h.shift);
    const cost = round2(st * estNum(rt.st) + ot * estNum(rt.ot) + dt * estNum(rt.dt) + sh * estNum(rt.shift));
    const hrs = st + ot + dt + sh;
    perRow[r.key] = { st, ot, dt, sh, hrs, cost, rate: rt };
    laborSub += cost; totalHrs += hrs;
    if (r.field) { fieldCost += cost; fieldHrs += st + ot + dt; }
  });
  laborSub = round2(laborSub); fieldCost = round2(fieldCost);
  const perDiem = round2((fieldHrs / 8) * estNum(L.perDiemPerDay));

/* ═══════════════════════════════════════════════════════════════════════════
   6d1c. PROJECT ESTIMATES  —  full MCAA-style bid estimates, faithful to the
   "MCAA RECAP" master sheet. Multiple named estimates per job; each can be
   LOCKED (read-only snapshot so edits can't override it); COMPARE lays them
   side by side. The engine computeProjectEstimate() reproduces the recap total.
   ═══════════════════════════════════════════════════════════════════════════ */
let estimates = [];
let openEstimate = null;    // id being edited
let _unsubEstimates = null;

let _estSaveT2 = null;

function estShortDate(ms) { try { return new Date(ms).toLocaleDateString([], { month: 'numeric', day: 'numeric', year: '2-digit' }); } catch (e) { return ''; } }
const estimateRef = (jobId, id) => FB.doc(FB.db, 'jobs', jobId, 'estimates', String(id));
const estById = id => (estimates || []).find(e => e.id === id);
const ESTIMATE_DIR = 'Estimates';

const EST_SCHEDULES = [
  { id: "5 8's",    lop: 0,    blend: (st, ot) => st },
  { id: "5 10's",   lop: 0.15, blend: (st, ot) => (4 * st + ot) / 5 },
  { id: "6 10's",   lop: 0.25, blend: (st, ot) => (4 * st + 2 * ot) / 6 },
  { id: "60/60/50", lop: 0.25, blend: (st, ot) => (12 * st + 5 * ot) / 17 },
];
const estSched = id => EST_SCHEDULES.find(s => s.id === id) || EST_SCHEDULES[0];
const PROJ_TAXES = [
  { id: 'oregon_cat',    label: 'Oregon CAT (0.55%)',      rate: 0.004 + 0.0015 },
  { id: 'washington_bo', label: 'Washington B&O (0.634%)', rate: 0.00484 + 0.0015 },
  { id: 'none',          label: 'None',                    rate: 0 },
];
const projTaxRate = id => { const t = PROJ_TAXES.find(x => x.id === id); return t ? t.rate : 0; };
// field trades feed field-labor-based indirects; smShop is separate
const EST_FIELD_TRADES = ['plumb', 'pipe', 'smField'];
const EST_TRADE_META = [
  { key: 'plumb',   label: 'Plumbing' },
  { key: 'pipe',    label: 'Piping' },
  { key: 'smField', label: 'Sheet Metal — Field' },
  { key: 'smShop',  label: 'Sheet Metal — Shop' },
];
const EST_ADDERS = [
  { key: 'detailing', label: 'Detailing', plumb: 0.16, pipe: 0.16, smField: 0.16, smShop: 0 },
  { key: 'testing',   label: 'Testing',   plumb: 0.04, pipe: 0.09, smField: 0.01, smShop: 0 },
  { key: 'safety',    label: 'Safety',    plumb: 0.02, pipe: 0.02, smField: 0.02, smShop: 0 },
  { key: 'qc',        label: 'QC',        plumb: 0.05, pipe: 0.05, smField: 0,    smShop: 0 },
  { key: 'matlhand',  label: 'Material Handling', plumb: 0.10, pipe: 0.10, smField: 0.10, smShop: 0 },
];

function estRoundUp(x, d) { const m = Math.pow(10, d || 0); const s = x < 0 ? -1 : 1; return s * Math.ceil(Math.abs(x) * m - 1e-9) / m; }
function estRound(x, d) { const m = Math.pow(10, d || 0); return Math.round(x * m + (x >= 0 ? 1e-9 : -1e-9)) / m; }

  const B = [[500000, 14.4], [2000000, 8.7], [2500000, 6.9], [2500000, 6.3], [Infinity, 5.76]];
  let rem = sell, amt = 0;
  for (const [w, rate] of B) { if (rem <= 0) break; const chunk = Math.min(rem, w); amt += estRoundUp(chunk / 1000 * rate, 0); rem -= chunk; }
  return amt;
}
/* Pure engine — unit-tested against the ENFRA workbook ($2,055,185). */
function computeProjectEstimate(e) {
  e = e || {};
  const sch = estSched(e.scheduleType);
  const trades = e.trades || {}, mat = e.material || {}, sup = e.supervision || {};
  const adders = e.adders || EST_ADDERS;
  // 1. adder hours per field trade (each adder + LOP row rounded to 2, per RECAP)
  const hrs = {};
  EST_FIELD_TRADES.forEach(t => {
    const base = estNum((trades[t] || {}).hours);
    let add = 0; adders.forEach(a => { add += estRound(base * estNum(a[t]), 2); });
    hrs[t] = base + add + estRound(base * sch.lop, 2);
  });
  const shopBase = estNum((trades.smShop || {}).hours);
  let shopAdd = 0; adders.forEach(a => { shopAdd += estRound(shopBase * estNum(a.smShop), 2); });
  hrs.smShop = shopBase + shopAdd;
  // 2. blended rate per trade
  const rates = e.rates || {}, rate = {};
  ['plumb', 'pipe', 'smField'].forEach(t => { const rr = rates[t] || {}; rate[t] = sch.blend(estNum(rr.st), estNum(rr.ot)); });
  rate.smShop = estNum((rates.smShop || {}).st);
  // 3. labor value
  const laborVal = { plumb: rate.plumb * hrs.plumb, pipe: rate.pipe * hrs.pipe, smField: rate.smField * hrs.smField, smShop: rate.smShop * hrs.smShop };
  const subtotalLabor = laborVal.plumb + laborVal.pipe + laborVal.smField + laborVal.smShop;
  const ocip = e.ocip || {};
  const ocipDeduct = (e.ocipDeduct !== undefined && e.ocipDeduct !== '') ? estNum(e.ocipDeduct)
    : ((ocip.mode && ocip.mode !== 'none') ? -Math.abs(estNum(ocip.deduct)) : 0);
  const totalLabor = subtotalLabor + ocipDeduct;
  // 4. material
  const totalMaterial = estNum(mat.plumb) + estNum(mat.pipe) + estNum(mat.sm);
  // 5. subs
  const totalSubs = (e.subs || []).reduce((a, s) => a + estNum(s.value), 0);
  // 6. other costs / supervision
  const allHrs = hrs.plumb + hrs.pipe + hrs.smField + hrs.smShop;
  const pmCost = estRoundUp(estRound(allHrs * estNum(sup.pmPct), 2) * estNum(sup.pmRate), 2);
  const smFieldSupCost = estRound(estNum(sup.smFieldSupPct) * hrs.smField, 2) * estNum(sup.smFieldSupRate);
  const plumbSupCost = estRound(estNum(sup.plumbSupPct) * hrs.plumb, 2) * estNum(sup.plumbSupRate);
  const pipeSupCost = estRound(estNum(sup.pipeSupPct) * hrs.pipe, 2) * estNum(sup.pipeSupRate);
  const smallTools = estRound(estNum(e.smallToolsPct) * subtotalLabor, 2);
  const gcLines = (e.gcs || []).reduce((a, g) => a + estRound(estNum(g.qty) * estNum(g.rate), 2), 0);
  const otherGC = smallTools + gcLines;
  const equipRental = (e.equipment || []).reduce((a, q) => a + estRound(estNum(q.qty) * estNum(q.duration) * estNum(q.rate), 2), 0);
  const totalOther = pmCost + plumbSupCost + pipeSupCost + smFieldSupCost + equipRental + otherGC;
  // 7. total direct costs
  const directCosts = totalOther + totalSubs + totalLabor + totalMaterial;
  // 8. markups
  const subMarkup = estRoundUp(estNum(e.subMarkupPct) * totalSubs, 0);
  const equipMarkup = estNum(e.equipMarkup);
  const oANDp = estRoundUp(estNum(e.oANDpPct) * (directCosts - totalSubs) - estNum(e.emoReduce), 0);
  const projectSubtotal = directCosts + subMarkup + equipMarkup + oANDp;
  // 9. recovery, misc, bond, permits
  const marketRecovery = (e.marketRecovery !== undefined && e.marketRecovery !== '') ? estNum(e.marketRecovery)
    : -(e.workRecovery || []).reduce((a, w) => { const b = estNum(w.hours), mx = estNum(w.maxHours); return a + estRound(estNum(w.ratePerHr) * (mx > 0 && mx < b ? mx : b), 0); }, 0);
  const misc = estNum(e.misc);
  const permits = e.permits ? ['plumbing', 'hvac', 'medGas', 'boiler', 'specialInsp'].reduce((a, k) => a + estNum(e.permits[k]), 0) : 0;
  const sellBeforeBond = projectSubtotal + marketRecovery + misc + permits;
  const bond = (e.bond && e.bond.required) ? estBondAmount(sellBeforeBond) : 0;

  const taxRate = projTaxRate(e.taxType);

  const tax = taxBase * taxRate;

  const preLevel = projectSubtotal + marketRecovery + misc + bond + permits + tax;
  const roundTo = estNum(e.levelerRound) || 5;
  const leveler = (estRoundUp(preLevel / roundTo, 0) * roundTo) - preLevel + estNum(e.levelerAddDeduct);
  const totalBid = estRound(preLevel + leveler, 2);
  return { hrs, rate, laborVal, subtotalLabor, ocipDeduct, totalLabor, totalMaterial, totalSubs,
    pmCost, smFieldSupCost, plumbSupCost, pipeSupCost, smallTools, otherGC, equipRental, totalOther,
    directCosts, subMarkup, equipMarkup, oANDp, projectSubtotal, marketRecovery, misc, bond, permits,
    taxRate, tax, preLevel, leveler, totalBid, totalFieldHours: hrs.plumb + hrs.pipe + hrs.smField, allHrs };
}

/* ── compare view ── */
function renderEstimateCompare() {
  const list = estCompare.map(estById).filter(Boolean);
  if (list.length < 2) { toast('Pick at least two estimates', true); return; }
  const results = list.map(e => ({ e, r: computeProjectEstimate(e) }));
  const rows = [
    ['Total field hours', r => Math.round(r.totalFieldHours), false],
    ['Labor', r => r.subtotalLabor, true],
    ['Material', r => r.totalMaterial, true],
    ['Subcontractors', r => r.totalSubs, true],
    ['Other / supervision / GCs', r => r.totalOther, true],
    ['Total direct costs', r => r.directCosts, true],
    ['O&P + markups', r => r.subMarkup + r.equipMarkup + r.oANDp, true],
    ['Project subtotal', r => r.projectSubtotal, true],
    ['Bond', r => r.bond, true],
    ['Permits', r => r.permits, true],
    ['Tax', r => r.tax, true],
    ['TOTAL BID', r => r.totalBid, true],
  ];
  const base = results[0].r;
  const body = rows.map(([label, fn, money]) => {
    const cells = results.map((x, i) => {
      const v = fn(x.r);
      const disp = money ? (fmtMoney(round2(v)) || '$0') : v;
      let delta = '';
      if (i > 0) { const d = v - fn(base); if (Math.abs(d) > 0.5) delta = `<span class="cmp-delta ${d > 0 ? 'up' : 'down'}">${d > 0 ? '+' : ''}${money ? (fmtMoney(round2(d)) || '$0') : Math.round(d)}</span>`; }
      return `<td class="cmp-v ${label === 'TOTAL BID' ? 'tot' : ''}">${disp}${delta}</td>`;
    }).join('');
    return `<tr class="${label === 'TOTAL BID' ? 'cmp-total' : ''}"><td class="cmp-l">${esc(label)}</td>${cells}</tr>`;
  }).join('');
  const heads = results.map(x => `<th>${esc(x.e.name || 'Estimate')}${x.e.locked ? ' 🔒' : ''}</th>`).join('');
  $('modalHost').innerHTML = `<div class="modal-scrim" onclick="if(event.target===this)closeModalHost()"><div class="modal wide">
    <div class="modal-head"><h3>Compare estimates <span class="muted" style="font-weight:400">— deltas vs. “${esc(results[0].e.name || '')}”</span></h3><button class="icon-btn" onclick="closeModalHost()">✕</button></div>
    <div class="modal-body">
      <div style="overflow-x:auto"><table class="cmp-table">
        <thead><tr><th class="cmp-l"></th>${heads}</tr></thead>
        <tbody>${body}</tbody>
      </table></div>
    </div>
    <div class="modal-foot"><button class="btn ghost" onclick="closeModalHost()">Close</button></div>
  </div></div>`;
}

function releaseCell(s, rl) {
  if (rl.id === 'not_ready') return '<span class="muted">—</span>';
  if (rl.id === 'na') return '<span class="pill" style="color:var(--text-3);background:var(--surface-2)"><i></i>N/A</span>';
  const pill = `<span class="pill" style="color:${cvar(rl.color)};background:${csf(rl.color)}"><i></i>${esc(rl.label)}</span>`;
  const lead = leadLabel(s.leadWeeks);
  const head = pill + (lead ? `<span class="lead-tag">Lead time ${esc(lead)}</span>` : '');
  if (rl.id === 'ready') return head;

  // Every release shows on the main page — a partially-released section can hold
  // several, and the row grows to fit them all.
  const lines = (s.releases || []).map(r => {
    const when = r.date ? 'Released ' + fmtShort(r.date) : 'Release date not set';
    const arrival = r.delivered
      ? '<b class="delivered-tag">Delivered</b>'
      : (r.expected ? 'arrives ' + esc(fmtWindow({ from: r.expected, to: r.expectedTo })) : 'no delivery date');
    return `<div class="rel-line">
      <label class="tick" title="Tick when it arrives on site" onclick="event.stopPropagation()">
        <input type="checkbox" ${r.delivered ? 'checked' : ''}
          onchange="toggleDelivered('${s.key}','${r.id}', this.checked)">
      </label>
      <span class="rel-of">
        <b>${esc(r.label)}</b>
        <small>${esc(when)} · ${arrival}</small>
      </span>
    </div>`;
  }).join('');
  return head + `<div class="rel-cell">${lines}</div>`;
}

async function toggleDelivered(key, relId, on) {
  const s = findSection(key);
  if (!s) return;
  const r = (s.releases || []).find(x => x.id === relId);
  if (!r) return;
  markPending(key);
  r.delivered = !!on;          // just a tick — no date is recorded or invented
  renderTable();
  if (openKey === key) renderDrawer();
  try { await patchSection(key, { releases: s.releases }); } catch (e) { toast(writeError(e), true); }
}

function renderTable() {
  const body = $('secBody');
  const list = visibleSections();
  $('countLabel').textContent = countLabel();

  if (!sectionsOf(job).length) {
    body.innerHTML = '';
    $('jobEmpty').innerHTML = `<div class="empty" style="margin-top:14px">
      <h3>No spec imported yet</h3>
      <p>Import the project spec PDF — Divisions 22 and 23 are split into their individual sections automatically.<br>
      Import as many files as the job came in: one whole manual, or Division 22 and Division 23 separately.</p>
      <p style="margin-top:14px"><button class="btn primary" onclick="promptImportSpec()">Import spec PDF</button>
      <button class="btn" onclick="addSectionManually()">Add a section by hand</button></p></div>`;
    return;
  }
  $('jobEmpty').innerHTML = '';

  if (!list.length) {
    body.innerHTML = `<tr><td colspan="6"><div class="empty" style="border:none;background:transparent;padding:34px">
      <h3>Nothing matches</h3><p>Try a different search or clear the status filter.</p></div></td></tr>`;
    return;
  }

  let html = '', lastDiv = null;
  for (const s of list) {
    if (divFilter === 'all' && submSort !== 'response' && s.division !== lastDiv) {
      lastDiv = s.division;
      html += `<tr class="divhead"><td colspan="6">Division ${s.division}${DIVISION_NAMES[s.division] ? ' — ' + DIVISION_NAMES[s.division] : ''}</td></tr>`;
    }
    html += secRowHtml(s);
  }
  // Re-rendering the table (a debounced save, or a live snapshot from another
  // browser) must not yank the caret out of an input someone is typing in.
  const focus = captureCellFocus(body);
  body.innerHTML = html;
  restoreCellFocus(body, focus);
}

/* A row is read-only by default — clicking it opens the section. The small
   pencil turns that one row into inline inputs; the tick puts it back. */
function secRowHtml(s) {
  const st = ST[s.status || 'not_started'];
  const rl = relOf(s);
  const mfrVal = s.manufacturer || s.spec || '';   // Manufacturer column; falls back to the old Spec value
  const changeTs = sectionChangeTs(s);
  const hitTag = matchedTag(s, query.trim().toLowerCase());
  const editing = editRow === s.key;
  const tags = `${hitTag ? `<span class="row-tag">${esc(hitTag)}</span>` : ''}${(s.inBody === false) ? '<span class="flag">Index only</span>' : ''}`;
  const pencil = editing
    ? `<button class="row-pencil on" title="Done editing" onclick="event.stopPropagation();toggleRowEdit(null)">✓</button>`
    : `<button class="row-pencil" title="Edit this row" onclick="event.stopPropagation();toggleRowEdit('${s.key}')">✎</button>`;

  let title, spec, vendor;
  if (editing) {
    title = `<input class="cell-in cell-title" data-key="${s.key}" data-field="title"
        value="${esc(s.title || '')}" placeholder="(untitled)"
        onpointerdown="event.stopPropagation()" oninput="setField('${s.key}','title',this.value)">`;
    spec = `<input class="cell-in" data-key="${s.key}" data-field="manufacturer"
        value="${esc(mfrVal)}" placeholder="—"
        onpointerdown="event.stopPropagation()" oninput="setField('${s.key}','manufacturer',this.value)">`;
    vendor = `<input class="cell-in" data-key="${s.key}" data-field="vendor"
        value="${esc(s.vendor || '')}" placeholder="—"
        onpointerdown="event.stopPropagation()" oninput="setField('${s.key}','vendor',this.value)">`;
  } else {
    title = `<span class="cell-title">${esc(s.title || '(untitled)')}</span>`;
    spec = `<span class="cell-ro">${mfrVal ? esc(mfrVal) : '<span class="muted">—</span>'}</span>`;
    vendor = `<span class="cell-ro">${s.vendor ? esc(s.vendor) : '<span class="muted">—</span>'}</span>`;
  }
  const desc = editing
    ? `<input class="cell-in cell-desc" data-key="${s.key}" data-field="description"
        value="${esc(s.description || '')}" placeholder="Add a description…"
        onpointerdown="event.stopPropagation()" oninput="setField('${s.key}','description',this.value)">`
    : (s.description ? `<div class="sub cell-desc">${esc(s.description)}</div>` : '');

  const rowOpen = editing ? '' : ` onclick="openSection('${s.key}')"`;
  const specEmpty = !editing && !mfrVal, vendorEmpty = !editing && !s.vendor;
  const noteLine = (s.showNote && s.notes) ? `<div class="pin-note">📌 ${esc(s.notes)}</div>` : '';
  return `<tr class="${openKey === s.key ? 'sel ' : ''}${editing ? 'row-edit ' : ''}${st.id === 'na' ? 'row-na' : ''}"${rowOpen}>
      <td class="c-num">${esc(s.number)}</td>
      <td class="c-title">
        <div class="t-line">${title}${pencil}</div>
        ${tags}${desc}${noteLine}</td>
      <td class="c-spec${specEmpty ? ' is-empty' : ''}" data-label="Manufacturer">${spec}</td>
      <td class="c-vendor${vendorEmpty ? ' is-empty' : ''}" data-label="Vendor">${vendor}</td>
      <td class="c-status" data-label="Status" onclick="event.stopPropagation()">
        <select class="st-select" style="color:${cvar(st.color)};background:${csf(st.color)};border-color:${cvar(st.color)}"
          onchange="setStatus('${s.key}', this.value)">
          ${STATUSES.map(o => `<option value="${o.id}" ${o.id === st.id ? 'selected' : ''}>${esc(o.label)}</option>`).join('')}
        </select>
        ${changeTs ? `<div class="changed" title="When this submittal's status or release last changed">changed ${fmtDate(changeTs)}</div>` : ''}</td>
      <td class="c-rel${rl.id === 'not_ready' ? ' is-empty' : ''}" data-label="Release">${releaseCell(s, rl)}</td>
    </tr>`;
}

/* Toggle inline editing for one row, then focus its title. */
function toggleRowEdit(key) {
  editRow = key;
  renderTable();
  if (key) {
    const el = $('secBody').querySelector(`.cell-in[data-key="${key}"][data-field="title"]`);
    if (el) { el.focus(); el.select(); }
  }
}

function captureCellFocus(body) {
  const el = document.activeElement;
  if (!el || !body.contains(el) || !el.classList.contains('cell-in')) return null;
  return { key: el.getAttribute('data-key'), field: el.getAttribute('data-field'),
    start: el.selectionStart, end: el.selectionEnd };
}
function restoreCellFocus(body, f) {
  if (!f) return;
  const el = body.querySelector(`.cell-in[data-key="${f.key}"][data-field="${f.field}"]`);
  if (!el) return;
  el.focus();
  try { el.setSelectionRange(f.start, f.end); } catch (_) {}
}

/* Move a section to a status, recording the transition and its side effects.
   Returns true if the status actually changed. Shared by the dropdown and by
   a PDF upload (which files itself under the status it represents). */
function applyStatus(s, value) {
  const from = s.status || 'not_started';
  s.history = s.history || [];
  if (from !== value) s.history.push({ ts: Date.now(), from, to: value });
  s.status = value;
  if (value === 'submitted_gc' && !s.submittedDate) s.submittedDate = today();
  if ((value === 'approved' || value === 'partial_approval' || value === 'revise_resubmit') && !s.returnedDate) {
    s.returnedDate = today();
  }
  // Once it is approved it is ready to go out, unless a release already happened.
  if (value === 'approved' && (s.releaseState || 'not_ready') === 'not_ready') s.releaseState = 'ready';
  return from !== value;
}
async function setStatus(key, value) {
  const s = findSection(key);
  if (!s) return;
  if ((s.status || 'not_started') === value) return;
  markPending(key);
  applyStatus(s, value);
  sortSections();
  renderJob();
  if (openKey === key) renderDrawer();
  try {
    await patchSection(key, {
      status: s.status, history: s.history || [],
      submittedDate: s.submittedDate || '', returnedDate: s.returnedDate || '',
      releaseState: s.releaseState || 'not_ready'
    });
  } catch (e) { toast(writeError(e), true); }
}

function openSection(key) { openKey = key; renderDrawer(); renderTable(); }

function autosizeAll(host) { (host || document).querySelectorAll('textarea.autosize').forEach(autosize); }

const isLink = d => d && d.type === 'link';
function linkHost(url) {
  try { return new URL(url).hostname.replace(/^www\./, ''); } catch (e) { return 'link'; }
}

/* ── rename a filed PDF (display name + on-disk file) ── */
async function copyRenamed(doc, rawName) {
  const raw = (rawName || '').trim(); if (!raw) return null;
  const keepPdf = /\.pdf$/i.test(doc.file || doc.name || '');
  const cleanName = keepPdf ? sanitizeFileName(raw) : sanitizeAnyName(raw, doc.file);
  const filesRoot = await jobFolder.getDirectoryHandle(DOCS_DIR);
  const dh = doc.dir ? await walkDir(filesRoot, doc.dir) : filesRoot;
  const blob = await (await dh.getFileHandle(doc.file)).getFile();
  const newFile = await uniqueFileName(dh, cleanName);
  const fh = await dh.getFileHandle(newFile, { create: true });
  const w = await fh.createWritable(); await w.write(blob); await w.close();
  return { newFile, cleanName };
}
async function looseParentHandle(dir) {
  const filesRoot = await jobFolder.getDirectoryHandle(DOCS_DIR);
  return dir ? walkDir(filesRoot, dir) : filesRoot;
}
/* Shared rename: `persist` writes the owning record (must throw on failure);
   `rerender` redraws. Copies to the new name, persists, then deletes the old. */
async function renameDoc(doc, persist, rerender) {
  if (!doc) return;
  const raw = prompt('Rename file:', doc.name || doc.file || '');
  if (raw === null) return;
  const name = raw.trim(); if (!name) return;
  if (isLink(doc)) { doc.name = name; rerender(); try { await persist(); } catch (e) { toast(writeError(e), true); } return; }
  if (!jobFolder) { toast('Load the ShareFile folder first to rename the file', true); return; }
  stickyToast('Renaming…');
  let copied;
  try { copied = await copyRenamed(doc, name); }
  catch (e) { toast('Could not read the file to rename — make the folder available offline in ShareFile', true); return; }
  if (!copied) { toast(' '); return; }
  const oldFile = doc.file, oldName = doc.name;
  doc.file = copied.newFile; doc.name = copied.cleanName;
  rerender();
  try { await persist(); }
  catch (e) {                                   // undo: restore record, drop the new copy
    doc.file = oldFile; doc.name = oldName;
    try { const dh = await looseParentHandle(doc.dir); await dh.removeEntry(copied.newFile); } catch (_) {}
    rerender(); toast(writeError(e), true); return;
  }
  if (copied.newFile !== oldFile) { try { const dh = await looseParentHandle(doc.dir); await dh.removeEntry(oldFile); } catch (e) {} }
  if (blobUrlCache.has(doc.id)) { URL.revokeObjectURL(blobUrlCache.get(doc.id)); blobUrlCache.delete(doc.id); }
  toast(`Renamed to “${copied.cleanName}”`);
}
function renameSectionDoc(key, kind, docId) {
  const s = findSection(key); const d = (s && (s[kind] || []).find(x => x.id === docId));
  if (!d) return;
  renameDoc(d, () => patchSection(key, { [kind]: s[kind] }), () => {
    if (openKey === key) renderDrawer(); renderTable();
    syncAllSubmittals().catch(() => {});
  });
}
function renameRfiDoc(id, docId) {
  const r = rfiById(id); const d = (r && (r.docs || []).find(x => x.id === docId));
  if (!d) return;
  renameDoc(d, () => { r.updated = Date.now(); return FB.setDoc(rfiRef(job.id, r.id), clean(r)); }, () => { if (openRfi === id) renderRfiDrawer(); renderRfis(); });
}
function renameCoDoc(id, docId) {
  const c = coById(id); const d = (c && (c.docs || []).find(x => x.id === docId));
  if (!d) return;
  renameDoc(d, () => { c.updated = Date.now(); return FB.setDoc(coRef(job.id, c.id), clean(c)); }, () => { if (openCo === id) renderCoDrawer(); renderCos(); });
}
function renameEmailDoc(catId, fileId) {
  const c = catById(catId); const d = (c && (c.files || []).find(x => x.id === fileId));
  if (!d) return;
  renameDoc(d, () => { c.updated = Date.now(); return FB.setDoc(trackingRef(job.id, c.id), clean(c)); }, () => renderTracking());
}

function fileList(s, kind) {

/* ── ShareFile (or any) links ─────────────────────────────────────────────
   Big vendor packages stay where the company already keeps them. The register
   holds a label and a URL, which can point at one file or a whole folder. */
function normaliseUrl(raw) {
  const t = String(raw || '').trim();
  if (!t) return null;
  const withScheme = /^https?:\/\//i.test(t) ? t : 'https://' + t;
  try {
    const u = new URL(withScheme);
    return /^https?:$/.test(u.protocol) && u.hostname.includes('.') ? u.href : null;
  } catch (e) { return null; }
}

async function saveLink(key, kind, docId) {
  const s = findSection(key);
  if (!s) return;
  const url = normaliseUrl($('lkUrl').value);
  if (!url) { toast('That does not look like a link — paste the full ShareFile address', true); $('lkUrl').focus(); return; }
  const name = $('lkName').value.trim() || decodeURIComponent(url.split('/').filter(Boolean).pop() || 'ShareFile link');
  const note = $('lkNote').value.trim();

  markPending(key);
  s[kind] = s[kind] || [];
  const existing = docId ? s[kind].find(x => x.id === docId) : null;
  if (existing) {
    Object.assign(existing, { name, url, note });
  } else {
    s[kind].push({ id: uid('doc'), type: 'link', name, url, note, added: Date.now(),
      rev: kind === 'submittals' ? 'Rev ' + s[kind].filter(d => d.rev).length : '' });

  toast(existing ? 'Link updated' : 'Link added');
}

function startAddTag(key) {
  const wrap = $('tagWrap');
  if (!wrap || $('tagInput')) { const i = $('tagInput'); if (i) i.focus(); return; }

  s.tags.push(tag);

  try { await patchSection(key, { tags: s.tags }); } catch (e) { toast(writeError(e), true); }
}

  if ((state === 'released' || state === 'partial') && !(s.releases || []).length) {

function pickScope(btn) {

async function saveRelease(key, relId) {
  const s = findSection(key);
  if (!s) return;
  const label = $('rlLabel').value.trim() || 'Release';
  const date = $('rlDate').value;
  const weeks = $('rlWeeks').value;
  const expected = $('rlExpected').value;
  const expectedManual = !!$('rlExpected').dataset.touched;
  // A hand-typed delivery date makes a leftover range end meaningless.
  const rawTo = $('rlExpectedTo').value;
  const expectedTo = (rawTo && expected && rawTo <= expected) ? '' : rawTo;
  const note = $('rlNote').value.trim();
  const scopeEl = $('rlScope') && $('rlScope').querySelector('button.on');
  const scope = scopeEl ? scopeEl.dataset.scope : null;

  markPending(key);
  s.releases = s.releases || [];
  const existing = relId ? s.releases.find(x => x.id === relId) : null;
  if (existing) Object.assign(existing, { label, date, weeks, expected, expectedTo, note, expectedManual });
  else {
    s.releases.push({ id: uid('rel'), label, date, weeks, expected, expectedTo, note, expectedManual });
    s.releaseState = scope === 'partial' ? 'partial' : 'released';
  }
  if (weeks && !s.leadWeeks) s.leadWeeks = weeks;
  s.releaseChangedAt = Date.now();       // recording/editing a release counts as a change
  closePdf();
  renderDrawer(); renderTable();
  try { await patchSection(key, { releases: s.releases, releaseState: s.releaseState, leadWeeks: s.leadWeeks || '', releaseChangedAt: s.releaseChangedAt }); }
  catch (e) { toast(writeError(e), true); return; }
  toast(existing ? 'Release updated' : 'Release recorded');
}

/* Type the arrival date straight into the Details field (single-release case);
   it counts as a manual override so the lead time never re-dates it. */
async function setExpected(key, val) {
  const s = findSection(key);
  if (!s) return;
  const rels = s.releases || [];
  if (rels.length !== 1) return;
  markPending(key);
  rels[0].expected = val || '';
  rels[0].expectedTo = '';                 // a hand-typed date has no range end
  rels[0].expectedManual = true;
  renderTable();
  if (openKey === key) renderDrawer();
  try { await patchSection(key, { releases: rels }); } catch (e) { toast(writeError(e), true); }
}

async function removeRelease(key, relId) {
  const s = findSection(key);
  if (!s) return;
  const r = (s.releases || []).find(x => x.id === relId);
  if (!r || !confirm(`Remove "${r.label}"?`)) return;
  markPending(key);
  s.releases = s.releases.filter(x => x.id !== relId);
  if (!s.releases.length && s.releaseState === 'partial') s.releaseState = 'ready';
  s.releaseChangedAt = Date.now();
  renderDrawer(); renderTable();
  try { await patchSection(key, { releases: s.releases, releaseState: s.releaseState, releaseChangedAt: s.releaseChangedAt }); }
  catch (e) { toast(writeError(e), true); }
}

/* Edits are debounced, but each section keeps its own pending patch and its own
   timer — editing the title, then the spec, then the vendor in quick succession
   must not let one field's write cancel the others. */
const _fieldPatches = new Map();   // key → { field: value, … }
const _fieldTimers = new Map();    // key → timeout id
async function setField(key, field, value) {
  const s = findSection(key);
  if (!s) return;
  s[field] = value;
  markPending(key);                 // protect it across the debounce
  const patch = _fieldPatches.get(key) || {};
  patch[field] = value;

  // A lead time is often filled in after the release. Re-date anything whose
  // delivery has not been typed in by hand.
  if (field === 'leadWeeks') {
    for (const r of (s.releases || [])) {
      if (r.expectedManual) continue;
      r.weeks = value;
      const e = expectedRange(r.date, value);
      r.expected = e.from; r.expectedTo = e.to;
    }
    patch.releases = s.releases || [];
    if (openKey === key) renderDrawer();
  }
  _fieldPatches.set(key, patch);

  clearTimeout(_fieldTimers.get(key));
  _fieldTimers.set(key, setTimeout(async () => {
    _fieldTimers.delete(key);
    const p = _fieldPatches.get(key); _fieldPatches.delete(key);
    if (!p) return;
    renderTable();
    try { await patchSection(key, p); } catch (e) { toast(writeError(e), true); }
  }, 500));
}

/* ── uploads ── */
async function pickFiles(key, kind) {
  // On desktop, load the folder first (this click is a clean gesture for the picker)
  // so the PDF has somewhere to go. On a phone there's no folder — it stages to Firebase.
  if (fsSupported() && !jobFolder) { if (!(await loadJobFolder())) return; }
  const inp = document.createElement('input');
  inp.type = 'file';
  inp.accept = 'application/pdf,.pdf';
  inp.multiple = true;
  inp.onchange = () => addFiles(key, kind, Array.from(inp.files));
  inp.click();
}
function wireDrop(el, key, kind) {
  wireDropZone(el, files => addFiles(key, kind, files));
}
/* Generic drag-and-drop wiring: highlight on hover, hand the dropped files to a
   callback. Shared by submittals, RFIs and job-tracking drop zones. */
function wireDropZone(el, onFiles) {
  if (!el) return;
  el.addEventListener('dragover', e => { e.preventDefault(); el.classList.add('over'); });
  el.addEventListener('dragleave', () => el.classList.remove('over'));
  el.addEventListener('drop', e => {
    e.preventDefault(); el.classList.remove('over');
    onFiles(Array.from((e.dataTransfer && e.dataTransfer.files) || []));
  });
}
/* The statuses a PDF can be filed under — the outgoing package and the ways it
   comes back. Picking one is required on every upload. */
const DOC_STATUSES = ['submitted_gc', 'partial_approval', 'approved', 'revise_resubmit', 'revision_requested', 'revision_sent'];
let _uploadStatusResolve = null;
function pickUploadStatus(kind) {
  return new Promise(resolve => {
    _uploadStatusResolve = resolve;
    const def = kind === 'responses' ? 'approved' : 'submitted_gc';
    const what = kind === 'responses' ? 'response' : 'submittal';
    $('modalHost').innerHTML = `<div class="modal-scrim" onclick="if(event.target===this)chooseUploadStatus(null)"><div class="modal">
      <div class="modal-head"><h3>File this ${what} under…</h3>
        <button class="icon-btn" onclick="chooseUploadStatus(null)">✕</button></div>
      <div class="modal-body">
        <p class="muted" style="margin-bottom:12px">Pick the status this PDF represents. It becomes the section's current status (the newest one always shows on the main page), and the file is saved in a ShareFile subfolder named for it.</p>
        <div class="status-grid">${DOC_STATUSES.map(id => { const st = ST[id]; return `
          <button class="status-opt ${id === def ? 'on' : ''}" style="${id === def ? 'color:' + cvar(st.color) + ';background:' + csf(st.color) : ''}"
            onclick="chooseUploadStatus('${id}')"><i style="background:${cvar(st.color)}"></i><span>${esc(st.label)}</span></button>`; }).join('')}</div>
      </div></div></div>`;
  });
}
function chooseUploadStatus(id) {
  const r = _uploadStatusResolve; _uploadStatusResolve = null;
  closePdf();
  if (r) r(id);
}
/* Retire a superseded PDF: flag it archived, prefix its name with "OLD - " so it's
   obviously not the current revision, and move the file into the Submittals/Archive
   folder (out of the live status folders). Idempotent. */
async function prefixOld(doc) {
  if (!doc || isLink(doc)) return;
  if (doc.archived === true && doc.dir === ARCHIVE_DIR && /^OLD\s*-\s*/i.test(doc.name || '')) return;   // fully archived
  doc.archived = true;
  const already = /^OLD\s*-\s*/i.test(doc.name || '');
  const newName = already ? (doc.name || doc.file) : 'OLD - ' + (doc.name || doc.file || 'document.pdf');
  if (!doc.file || !jobFolder) { doc.name = newName; doc.dir = ARCHIVE_DIR; return; }   // no readable file → flag the record only
  try {
    const filesRoot = await jobFolder.getDirectoryHandle(DOCS_DIR);
    const srcDh = doc.dir ? await walkDir(filesRoot, doc.dir) : filesRoot;
    const blob = await (await srcDh.getFileHandle(doc.file)).getFile();
    const destDh = await walkDirCreate(filesRoot, ARCHIVE_DIR);
    const target = await uniqueFileName(destDh, sanitizeFileName(newName));
    const fh = await destDh.getFileHandle(target, { create: true });
    const w = await fh.createWritable(); await w.write(blob); await w.close();
    if (!(doc.dir === ARCHIVE_DIR && target === doc.file)) { try { await srcDh.removeEntry(doc.file); } catch (e) {} }
    if (blobUrlCache.has(doc.id)) { URL.revokeObjectURL(blobUrlCache.get(doc.id)); blobUrlCache.delete(doc.id); }
    doc.name = target; doc.file = target; doc.dir = ARCHIVE_DIR;
  } catch (e) { doc.name = newName; doc.dir = ARCHIVE_DIR; }
}
async function markPriorOld(s, kind, priorIds) {
  for (const d of (s[kind] || [])) if (priorIds.has(d.id) && !isLink(d)) await prefixOld(d);
}
async function addFiles(key, kind, files) {
  const s = findSection(key);
  if (!s || !files.length) return;
  const pdfs = files.filter(f => !(f.type && f.type !== 'application/pdf' && !/\.pdf$/i.test(f.name)));
  if (pdfs.length < files.length) toast('Non-PDF files were skipped', true);
  if (!pdfs.length) return;
  // On a phone the ShareFile folder can't be written — stage the PDF in Firebase
  // and let a computer file it. On desktop, load the folder and file it directly.
  if (!jobFolder) {
    if (fsSupported()) { if (!(await ensureJobFolder())) return; }
    else return stageSectionPdfs(key, kind, pdfs);
  }
  // A status must be chosen for the upload — this is what tracks history.
  const status = await pickUploadStatus(kind);
  if (!status) return;
  markPending(key);
  s[kind] = s[kind] || [];
  const priorIds = new Set(s[kind].map(d => d.id));   // the docs this upload supersedes
  let added = 0;
  for (const f of pdfs) {
    const docId = uid('doc');
    try {
      stickyToast(`Saving ${f.name}…`);
      const { dir, file } = await putFile(f, status);
      s[kind].push({
        id: docId, name: f.name, size: f.size, status, uploaded: Date.now(), dir, file,
