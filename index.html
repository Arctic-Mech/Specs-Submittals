<title>The Dingus</title>
<!-- Firebase: the register and the PDFs both live in Firestore, so every
     device on the job sees the same log. Cloud Storage is deliberately not
     used — it needs a billing account, Firestore does not. -->
<script type="module">
/* Firebase is now one of two storage backends, and it is off by default. The
   SDK is imported only when the app actually asks for it — in ShareFile-folder
   mode nothing here runs and no Firebase code is fetched at all. */
window.__initFirebase = async function () {
  if (window.FB) return window.FB;
  const { initializeApp } = await import("https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js");
  const {
    getFirestore, initializeFirestore, persistentLocalCache, persistentMultipleTabManager,
    collection, doc, getDoc, getDocFromServer, getDocs, getDocsFromCache, setDoc, updateDoc,
    deleteDoc, deleteField, onSnapshot, writeBatch, query, orderBy, connectFirestoreEmulator
  } = await import("https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js");

  const firebaseConfig = {
    apiKey: "AIzaSyCvUzRTKkVg6uhgJ6yQcerL8OLq3OAo36g",
    authDomain: "specs-submittals.firebaseapp.com",
    projectId: "specs-submittals",
    storageBucket: "specs-submittals.firebasestorage.app",
    messagingSenderId: "391316024345",
    appId: "1:391316024345:web:6c117f5ab65c814ab5ce88"
  };

  const app = initializeApp(firebaseConfig);

  // Cache locally so the register opens instantly and keeps working when the
  // site wifi drops; writes queue and flush when the connection returns.
  let db;
  try {
    db = initializeFirestore(app, {
      localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() })
    });
  } catch (e) {
    db = getFirestore(app);
  }
  // Test hook: nothing defines this in production.
  if (window.__fbConnect) window.__fbConnect({ db, connectFirestoreEmulator });

  window.FB = {
    db,
    collection, doc, getDoc, getDocFromServer, getDocs, getDocsFromCache, setDoc, updateDoc,
    deleteDoc, deleteField, onSnapshot, writeBatch, query, orderBy
  };
  window.dispatchEvent(new Event('fb-ready'));
  return window.FB;
};
</script>

.folder-landing p.sm { font-size: 12px; margin-top: 14px; }
.landing-btns { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin: 22px 0 4px; }

.chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; align-items: center; }
.chip-label { font-size: 11px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase;
  color: var(--text-3); margin-right: 2px; }
.chip {
  border: 1px solid var(--border); background: var(--surface); border-radius: 999px;
  padding: 4px 11px; font-size: 12px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
  color: var(--text-2);
}
.chip:hover { border-color: var(--border-2); }
.chip.on { border-color: currentColor; }
.chip i { width: 8px; height: 8px; border-radius: 2px; display: inline-block; }
.chip .n { font-variant-numeric: tabular-nums; font-weight: 600; }

/* ── table ── */
/* No overflow:hidden here — it would turn the card into a scroll container and
   silently break the sticky column headers. */
.table-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); }
table { width: 100%; border-collapse: collapse; }
thead th:first-child { border-top-left-radius: var(--radius); }
thead th:last-child { border-top-right-radius: var(--radius); }
tbody tr:last-child td:first-child { border-bottom-left-radius: var(--radius); }
tbody tr:last-child td:last-child { border-bottom-right-radius: var(--radius); }
thead th {
  text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .05em;
  color: var(--text-3); font-weight: 600; padding: 9px 12px; background: var(--surface-2);
  border-bottom: 1px solid var(--border); white-space: nowrap; position: sticky; top: 56px; z-index: 10;
}
tbody td { padding: 9px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; }
tbody tr:last-child td { border-bottom: none; }
tbody tr { cursor: pointer; }
tbody tr:hover td { background: var(--surface-2); }
tbody tr.sel td { background: var(--accent-sf); }
.c-num { font-family: var(--mono); font-size: 12.5px; white-space: nowrap; color: var(--text-2); }
.c-title { font-weight: 500; }
.c-title .sub { font-size: 11.5px; color: var(--text-3); font-weight: 400; }
tbody td .sub { font-size: 11.5px; color: var(--text-3); margin-top: 2px; line-height: 1.35; }
.lead-tag { font-size: 11.5px; color: var(--text-3); margin-left: 8px; white-space: nowrap; }
.rel-line { display: flex; align-items: flex-start; gap: 7px; margin-top: 5px; }
.rel-line .tick { display: flex; align-items: center; padding-top: 1px; cursor: pointer; }
.rel-line .tick input { cursor: pointer; margin: 0; }
.rel-of { min-width: 0; line-height: 1.35; }
.rel-of > b { display: block; font-size: 12px; font-weight: 600; }
.rel-of small { display: block; font-size: 11.5px; color: var(--text-3); }
.delivered-tag { color: var(--green); font-weight: 700; }
.c-copaid .tick { display: inline-flex; align-items: center; gap: 7px; cursor: pointer; }
.c-copaid .tick input { cursor: pointer; margin: 0; }
.paid-tag { font-size: 12px; color: var(--text-3); }
.check-row.done .c-copaid, .c-copaid .paid-tag { white-space: nowrap; }
tr:has(.c-copaid input:checked) .paid-tag { color: var(--green); font-weight: 600; }
/* Rows are a comfortable minimum height; one with several releases grows to show
   them all rather than clipping. */
#secBody td { height: 62px; }
#secBody tr.divhead td { height: auto; }
.c-num { font-family: var(--mono); }
.c-rel { vertical-align: top; padding-top: 10px; }
.rel-cell { display: flex; flex-direction: column; gap: 2px; }
/* A row opens the section on click; the pencil turns it into inline inputs. */
.t-line { display: flex; align-items: center; gap: 6px; }
.cell-ro { display: inline-block; padding: 4px 0; }
.row-pencil {
  border: none; background: none; cursor: pointer; color: var(--text-3); font-size: 13px;
  padding: 2px 5px; border-radius: 5px; opacity: .3; transition: opacity .12s; flex: none;
}
tbody tr:hover .row-pencil { opacity: .65; }
.row-pencil:hover { background: var(--surface-3); color: var(--accent); opacity: 1; }
.row-pencil.on { opacity: 1; color: var(--green); }
tbody tr.row-edit td { background: var(--accent-sf); cursor: default; }
.cell-in {
  width: 100%; border: 1px solid var(--border); background: var(--surface); border-radius: 6px;
  padding: 4px 6px; font: inherit; color: inherit; box-sizing: border-box;
}
.cell-in::placeholder { color: var(--text-3); opacity: .7; }
.cell-in:focus { outline: none; border-color: var(--accent); }
.cell-title { font-weight: 500; }
.cell-desc { font-size: 11.5px; color: var(--text-3); margin-top: 2px; }
.divhead td {
  background: var(--surface-3) !important; font-size: 11px; font-weight: 700;
  text-transform: uppercase; letter-spacing: .06em; color: var(--text-2); padding: 7px 12px;
}
.num { text-align: center; font-variant-numeric: tabular-nums; }
.pill {
  display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border-radius: 999px;
  font-size: 11.5px; font-weight: 600; white-space: nowrap;
}
.pill i { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.dot-count { display: inline-flex; align-items: center; gap: 4px; color: var(--text-2); font-size: 12.5px; }
.dot-count.zero { color: var(--text-3); opacity: .55; }
.st-select {
  border: 1px solid var(--border); border-radius: 6px; padding: 4px 6px; font-size: 12.5px;
  background: var(--surface); cursor: pointer; max-width: 172px; font-weight: 500;
}
.changed { font-size: 10.5px; color: var(--text-3); margin-top: 4px; }
.flag {
  font-size: 10px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase;
  padding: 1px 5px; border-radius: 3px; background: var(--amber-sf); color: var(--amber); margin-left: 6px;
}

/* ── drawer ── */
.scrim { position: fixed; inset: 0; background: rgba(15,18,22,.42); z-index: 90; }
.drawer {
  position: fixed; top: 0; right: 0; bottom: 0; width: min(620px, 100%);
  background: var(--bg); z-index: 91; display: flex; flex-direction: column;
  box-shadow: var(--shadow-lg); animation: slide .18s ease-out;
}
@keyframes slide { from { transform: translateX(24px); opacity: .4 } to { transform: none; opacity: 1 } }
.drawer-head {
  padding: 14px 18px; border-bottom: 1px solid var(--border); background: var(--surface);
  display: flex; align-items: flex-start; gap: 12px;
}
.drawer-head .num { font-family: var(--mono); font-size: 12.5px; color: var(--text-2); text-align: left; }
.drawer-head h2 { font-size: 16px; font-weight: 650; letter-spacing: -.2px; margin-top: 2px; }
.drawer-body { flex: 1; overflow-y: auto; padding: 16px 18px 60px; }
.sec { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; margin-bottom: 14px; }
.sec h4 {
  font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--text-3);
  font-weight: 700; margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between; gap: 8px;
}
.status-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 7px; }
.status-opt {
  display: flex; align-items: center; gap: 8px; border: 1px solid var(--border);
  border-radius: 7px; padding: 9px 11px; cursor: pointer; font-size: 13px; font-weight: 500;
  background: var(--surface); text-align: left;
}
.status-opt:hover { border-color: var(--border-2); }
.status-opt.on { border-color: currentColor; }
.status-opt i { width: 9px; height: 9px; border-radius: 50%; background: currentColor; flex: none; }
.status-opt span { color: var(--text); }
.status-opt.on span { color: currentColor; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 11px; }
.field { margin-bottom: 11px; }

.drop {
  border: 1px dashed var(--border-2); border-radius: 7px; padding: 14px; text-align: center;
  color: var(--text-2); font-size: 12.5px; cursor: pointer; background: var(--surface-2);
}
.drop:hover, .drop.over { border-color: var(--accent); color: var(--accent); background: var(--accent-sf); }

.file-row {
  display: flex; align-items: center; gap: 10px; padding: 9px 10px; border: 1px solid var(--border);
  border-radius: 7px; margin-bottom: 7px; background: var(--surface-2);
}
.file-row .fi { font-size: 17px; flex: none; }
.file-row .fn { flex: 1; min-width: 0; }
.file-row .fn b { display: block; font-weight: 550; font-size: 13px; overflow: hidden;
  text-overflow: ellipsis; white-space: nowrap; }
.file-row .fn small { color: var(--text-3); font-size: 11.5px; }
.rev-tag {
  font-family: var(--mono); font-size: 11px; background: var(--surface-3); color: var(--text-2);
  border-radius: 4px; padding: 1px 5px; flex: none;
}

.tag-wrap { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.tag-chip {
  display: inline-flex; align-items: center; gap: 5px; font-size: 12px;
  background: var(--accent-sf); color: var(--accent); border: 1px solid transparent;
  border-radius: 999px; padding: 3px 5px 3px 10px; white-space: nowrap;
}
.tag-chip button {
  border: none; background: transparent; color: inherit; cursor: pointer;
  font-size: 12px; line-height: 1; padding: 1px 3px; border-radius: 50%; opacity: .6;
}
.tag-chip button:hover { opacity: 1; background: rgba(0,0,0,.08); }
.tag-add {
  border: 1px dashed var(--border-2); background: transparent; border-radius: 999px;
  padding: 3px 11px; font-size: 12px; color: var(--text-2); cursor: pointer;
}
.tag-add:hover { border-color: var(--accent); color: var(--accent); }
.tag-input {
  border: 1px solid var(--accent); border-radius: 999px; padding: 3px 11px;
  font-size: 12px; background: var(--surface); outline: none; width: 150px;
}
.row-tag {
  display: inline-block; font-size: 10.5px; font-weight: 600; background: var(--accent-sf);
  color: var(--accent); border-radius: 3px; padding: 1px 5px; margin-left: 6px; vertical-align: 1px;
}

.rel-row {
  display: flex; align-items: center; gap: 10px; padding: 9px 10px; border: 1px solid var(--border);
  border-radius: 7px; margin-bottom: 7px; background: var(--surface-2);
}
.rel-row .rn { flex: 1; min-width: 0; }
.rel-row .rn b { display: block; font-weight: 600; font-size: 13px; }
.rel-row .rn small { color: var(--text-3); font-size: 11.5px; }
.rel-row .due { font-size: 12px; font-weight: 600; white-space: nowrap; }
.rel-row .tick { display: flex; align-items: center; cursor: pointer; }
.rel-row .tick input { cursor: pointer; margin: 0; }
.rel-row.is-delivered { border-color: var(--green); background: var(--green-sf); }
.seg-sm { display: flex; background: var(--surface-2); border: 1px solid var(--border);
  border-radius: 7px; padding: 2px; flex-wrap: wrap; }
.seg-sm button { border: none; background: transparent; padding: 5px 10px; border-radius: 5px;
  cursor: pointer; font-size: 12.5px; font-weight: 500; color: var(--text-2); }
.seg-sm button.on { background: var(--surface); box-shadow: var(--shadow); font-weight: 650; }

.req-group { margin-bottom: 12px; }
.req-group:last-child { margin-bottom: 0; }
.req-kind {
  font-size: 11px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase;
  color: var(--accent); margin-bottom: 6px;
}
.req-item { display: flex; gap: 8px; padding: 5px 0; border-top: 1px solid var(--border); font-size: 13px; }
.req-item:first-of-type { border-top: none; }
.req-item .rl { font-weight: 600; flex: none; max-width: 46%; }
.req-item .rt { color: var(--text-2); font-size: 12.5px; }
.muted { color: var(--text-3); font-size: 12.5px; }

/* ── modal ── */
.modal-scrim { position: fixed; inset: 0; background: rgba(15,18,22,.55); z-index: 100;
  display: grid; place-items: center; padding: 20px; }
.modal {
  background: var(--surface); border-radius: 12px; box-shadow: var(--shadow-lg);
  width: min(620px, 100%); max-height: 88vh; display: flex; flex-direction: column; overflow: hidden;
}
.modal.wide { width: min(1100px, 100%); height: 90vh; }
.modal-head { padding: 14px 18px; border-bottom: 1px solid var(--border); display: flex;
  align-items: center; gap: 12px; }
.modal-head h3 { font-size: 15px; font-weight: 650; flex: 1; overflow: hidden;
  text-overflow: ellipsis; white-space: nowrap; }
.modal-body { padding: 18px; overflow-y: auto; flex: 1; }
.modal-body.flush { padding: 0; background: var(--surface-2); }
.modal-foot { padding: 12px 18px; border-top: 1px solid var(--border); display: flex;
  justify-content: flex-end; gap: 8px; }
.modal-body iframe { width: 100%; height: 100%; border: none; background: var(--surface-2); }
.em-hdrs { padding: 4px 2px 12px; border-bottom: 1px solid var(--border); margin-bottom: 12px; }
.em-hdr { display: flex; gap: 10px; padding: 2px 0; font-size: 13px; }
.em-hl { color: var(--text-3); font-weight: 600; min-width: 54px; flex: none; }
.em-hdr span:last-child { word-break: break-word; }
.em-body { width: 100%; height: 58vh; border: 1px solid var(--border); border-radius: 8px; background: #fff; }
.em-body-text { white-space: pre-wrap; word-break: break-word; font: 13px/1.55 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; padding: 14px; margin: 0; max-height: 58vh; overflow: auto; }

.progress { height: 6px; border-radius: 3px; background: var(--surface-3); overflow: hidden; margin-top: 10px; }
.progress > div { height: 100%; background: var(--accent); width: 0; transition: width .15s; }

.review-list { max-height: 46vh; overflow-y: auto; border: 1px solid var(--border);
  border-radius: 7px; margin-top: 12px; }
.review-row { display: flex; align-items: center; gap: 9px; padding: 7px 11px;
  border-bottom: 1px solid var(--border); font-size: 13px; }
.review-row:last-child { border-bottom: none; }
.review-row .rn { font-family: var(--mono); font-size: 12px; color: var(--text-2); width: 88px; flex: none; }
.review-row .rt { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.review-head { background: var(--surface-2); font-weight: 700; font-size: 11px;
  text-transform: uppercase; letter-spacing: .05em; color: var(--text-2); }

.toast {
  position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%) translateY(16px);
  background: var(--text); color: var(--bg); padding: 10px 18px; border-radius: 8px;
  font-size: 13px; font-weight: 500; opacity: 0; pointer-events: none; transition: .18s; z-index: 200;
  box-shadow: var(--shadow-lg); max-width: 90vw; text-align: center;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.toast.err { background: var(--red); color: #fff; }

/* Sections marked Not Required sink to the bottom and read as struck out. */
tbody tr.row-na td { opacity: .55; }
tbody tr.row-na .cell-title,
tbody tr.row-na .c-num { text-decoration: line-through; }
.drawer-head.is-na h2 { text-decoration: line-through; opacity: .6; }

.banner {
  border-radius: var(--radius); padding: 12px 14px; margin-bottom: 16px;
  font-size: 13px; display: flex; gap: 12px; align-items: flex-start;
  background: var(--red-sf); color: var(--red); border: 1px solid currentColor;
}
.banner.info { background: var(--accent-sf); color: var(--accent); }
.banner > div { flex: 1; }
.banner b { display: block; margin-bottom: 3px; }
.banner code {
  font-family: var(--mono); font-size: 11.5px; background: var(--surface);
  padding: 1px 5px; border-radius: 4px; color: var(--text-2);
}
.sync-dot {
  width: 7px; height: 7px; border-radius: 50%; background: var(--green);
  display: inline-block; margin-right: 6px;
}
.sync-dot.off { background: var(--red); }
.sync-dot.wait { background: var(--amber); }

.storage-note { margin-top: 22px; font-size: 12px; color: var(--text-3); line-height: 1.7; }
.storage-note b { color: var(--text-2); font-weight: 600; }
.notice {
  background: var(--amber-sf); color: var(--amber); border: 1px solid currentColor;
  border-radius: 7px; padding: 10px 13px; font-size: 12.5px; margin-bottom: 14px;
  display: flex; align-items: center; gap: 10px;
}
.notice span { flex: 1; }

@media (max-width: 720px) {
  .wrap { padding: 14px 10px 60px; }
  .hide-sm { display: none; }
  .grid2, .status-grid { grid-template-columns: 1fr; }

  /* ── compact header: SR mark + icon actions only ── */
  header { gap: 6px; padding: 0 10px; }
  .brand-name, .brand-sub, .crumb, .job-title { display: none; }
  .job-actions { gap: 3px; }
  .job-actions .lbl { display: none; }
  .job-actions .btn { padding: 6px 8px; font-size: 15px; }

  /* ── toolbar: division tabs scroll, search drops to its own line ── */
  .toolbar { flex-wrap: wrap; gap: 8px; }
  .seg { overflow-x: auto; max-width: 100%; -webkit-overflow-scrolling: touch; }
  .seg button { white-space: nowrap; }
  .search { flex: 1 1 100%; order: 3; }
  #countLabel { order: 2; }

  /* ── the register table becomes stacked cards ── */
  .table-card { border: none; background: transparent; }
  table, tbody, tr { display: block; width: 100%; }
  thead { display: none; }
  #secBody tr {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 11px 13px; margin-bottom: 10px; height: auto;
  }
  #secBody tr.sel { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  #secBody tr:hover td, tbody tr:hover td { background: transparent; }
  #secBody tr.divhead { background: transparent !important; border: none; padding: 12px 2px 2px; margin: 0; }
  #secBody tr.divhead td { padding: 0; height: auto; }
  #secBody td { display: block; height: auto; border: none; padding: 2px 0; }
  tbody tr:last-child td { border-bottom: none; }
  #secBody td.is-empty { display: none; }         /* hide empty spec / vendor / release */
  #secBody td[data-label]::before {
    content: attr(data-label); display: block;
    font-size: 10px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase;
    color: var(--text-3); margin: 8px 0 3px;
  }
  .c-num { font-family: var(--mono); font-size: 12px; color: var(--text-3); }
  .c-title, .cell-title { font-size: 15px; }
  .st-select { width: 100%; max-width: none; padding: 8px; font-size: 13.5px; }
  .c-rel { padding-top: 0; }
  .cell-in { font-size: 15px; }

  /* ── RFI table also becomes stacked cards ── */
  #rfiBody tr {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 11px 13px; margin-bottom: 10px; height: auto; display: block;
  }
  #rfiBody td { display: block; height: auto; border: none; padding: 2px 0; }
  #rfiBody td.is-empty { display: none; }
  #rfiBody td[data-label]::before {
    content: attr(data-label); display: block;
    font-size: 10px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase;
    color: var(--text-3); margin: 8px 0 3px;
  }
  .c-rfinum { font-family: var(--mono); font-size: 12px; color: var(--text-3); }
  .c-rfisubj { font-size: 15px; }

  /* ── change-order table also becomes stacked cards ── */
  #coBody tr {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 11px 13px; margin-bottom: 10px; height: auto; display: block;
  }
  #coBody td { display: block; height: auto; border: none; padding: 2px 0; }
  #coBody td.is-empty { display: none; }
  #coBody td[data-label]::before {
    content: attr(data-label); display: block;
    font-size: 10px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase;
    color: var(--text-3); margin: 8px 0 3px;
  }
  .c-conum { font-family: var(--mono); font-size: 12px; color: var(--text-3); }
  .c-codesc { font-size: 15px; }

  /* ── job tracking stacks: categories above the panel ── */
  .track-wrap { grid-template-columns: 1fr; }
  .track-cats { flex-direction: row; flex-wrap: wrap; }
  .track-cat { flex: 0 0 auto; }
  .track-body { grid-template-columns: 1fr; }
  .grid3 { grid-template-columns: 1fr; }
  .job-tabs { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .job-tabs button { white-space: nowrap; }
}
@media print {
  header, .toolbar, .chips, .btn, .icon-btn, .scrim, .drawer, .modal-scrim { display: none !important; }
  body { background: #fff; }
  .table-card { border: none; }
  thead th { position: static; }
}
</style>
</head>
<body>

<header>
  <div class="brand" onclick="go('jobs')">
    <img class="brand-mark" id="brandLogo" alt="Arctic Mechanical" src="">
    <div>
      <div class="brand-name">The Dingus</div>
      <div class="brand-sub">Arctic Mechanical · <span id="verLabel"></span></div>
    </div>
  </div>
  <span class="crumb" id="crumb" hidden>›</span>
  <span class="job-title" id="crumbJob"></span>
  <div class="spacer"></div>
  <div id="jobActions" class="job-actions" hidden>
    <span id="folderSaveStatus" class="save-status" hidden onclick="saveNow()"></span>
    <button class="btn ghost" onclick="openSpecMenu()" id="btnSpec" title="Spec files — view, import or remove">📄 <span class="lbl">Spec</span></button>
    <button class="btn ghost" onclick="openExportMenu()" title="Export the submittal register (PDF or CSV)">⤓ <span class="lbl">Export</span></button>
  </div>
  <button class="icon-btn" id="themeBtn" onclick="toggleTheme()" title="Light / dark">◐</button>
</header>

<main class="wrap">
  <!-- JOBS -->
  <section id="view-jobs">
    <div class="page-head">
      <div>
        <div class="page-title">Jobs</div>
        <div class="page-sub">One register per project, shared live with everyone. Each job's PDFs live in its ShareFile folder.</div>

<script>

/* which subfolder (under files/RFIs/) an RFI PDF is filed in */

/* Change-order workflow. "Paid" is tracked separately as its own tick, because
   a CO can be approved long before it is actually paid. */
const CO_STATUSES = [
  { id: 'pending',   label: 'Pending',   short: 'Pending',   color: 'grey'  },
  { id: 'submitted', label: 'Submitted', short: 'Submitted', color: 'blue'  },
  { id: 'approved',  label: 'Approved',  short: 'Approved',  color: 'green' },
  { id: 'rejected',  label: 'Rejected',  short: 'Rejected',  color: 'red'   }
];

const CO_DOC_DIR = 'Change Orders';
const CO_EMAIL_DIR = 'Change Orders/Emails';   // legacy shared CO-email bucket (now per-CO: coEmailDir)

const today = () => new Date().toISOString().slice(0, 10);
const fmtMoney = v => {
  const n = typeof v === 'number' ? v : parseFloat(String(v).replace(/[^0-9.-]/g, ''));
  if (!isFinite(n)) return '';
  return '$' + n.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
};
/* Comma-group a money input's text, keeping decimals only if the user typed them. */
function fmtAmountInput(v) {
  const raw = String(v == null ? '' : v).trim();
  if (!raw) return '';
  const n = parseFloat(raw.replace(/[^0-9.\-]/g, ''));
  if (!isFinite(n)) return raw;
  return n.toLocaleString('en-US', /\.\d/.test(raw) ? { minimumFractionDigits: 2, maximumFractionDigits: 2 } : { maximumFractionDigits: 0 });
}

function addWeeks(dateStr, weeks) {
  const w = parseFloat(weeks);
  if (!dateStr || !isFinite(w)) return '';
  const d = new Date(dateStr + 'T00:00:00');
  if (isNaN(d)) return '';
  d.setDate(d.getDate() + Math.round(w * 7));
  return d.toISOString().slice(0, 10);
}

/* Lead times get quoted as a range as often as a single number: "6", "6-7",
   "6 to 7 weeks". Both ends are kept so the delivery window is a range too. */
function parseLead(raw) {
  const t = String(raw == null ? '' : raw).trim().replace(/\s*(?:weeks?|wks?)\.?$/i, '').trim();
  if (!t) return null;
  const range = t.match(/^(\d+(?:\.\d+)?)\s*(?:[-–—]|to)\s*(\d+(?:\.\d+)?)$/i);
  if (range) {
    const a = parseFloat(range[1]), b = parseFloat(range[2]);
    return { min: Math.min(a, b), max: Math.max(a, b) };
  }
  const one = t.match(/^(\d+(?:\.\d+)?)$/);
  return one ? { min: parseFloat(one[1]), max: parseFloat(one[1]) } : null;
}
function leadLabel(raw) {
  const L = parseLead(raw);
  if (!L) return String(raw || '').trim();
  const n = L.min === L.max ? String(L.min) : L.min + '–' + L.max;
  return n + (L.max === 1 ? ' week' : ' weeks');
}
function expectedRange(dateStr, leadRaw) {
  const L = parseLead(leadRaw);
  if (!dateStr || !L) return { from: '', to: '' };
  return { from: addWeeks(dateStr, L.min), to: L.max !== L.min ? addWeeks(dateStr, L.max) : '' };
}

/* The delivery window across every release on a section. */
function expectedWindow(s) {
  const rels = (s.releases || []).filter(r => r.expected);
  if (!rels.length) return { from: '', to: '' };
  const from = rels.map(r => r.expected).sort()[0];
  const to = rels.map(r => r.expectedTo || r.expected).sort().slice(-1)[0];
  return { from, to: to > from ? to : '' };
}
const nextExpected = s => expectedWindow(s).from;

/* The Details "Expected delivery" field. With one release it is a plain date you
   can type straight into; with several, each release carries its own date so the
   field just shows the window. */
function expectedField(s) {
  const rels = s.releases || [];
  if (rels.length === 1) {
    return `<div class="field"><label class="fl">Expected delivery${rels[0].expectedManual ? ' <span class="fl-tag">by hand</span>' : ''}</label>
      <input class="input" type="date" value="${esc(rels[0].expected || '')}"
        onchange="setExpected('${s.key}', this.value)"></div>`;
  }
  if (rels.length > 1) {
    return `<div class="field"><label class="fl">Expected delivery</label>
      <input class="input" value="${esc(fmtWindow(expectedWindow(s)))}" placeholder="—" disabled
        title="Several releases — set each one's date in its release"></div>`;
  }
  return `<div class="field"><label class="fl">Expected delivery</label>
    <input class="input" value="" placeholder="set when released" disabled></div>`;
}

function fmtShort(d) {
  if (!d) return '';
  return new Date(d + 'T00:00:00').toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
}
function fmtWindow(w) {
  if (!w.from) return '';
  return (w.to && w.to > w.from) ? fmtShort(w.from) + ' – ' + fmtShort(w.to)
                                 : fmtDate(w.from + 'T00:00:00');
}
/* Earliest release date on a section, and how many there are. */
function releasedOn(s) {
  const dates = (s.releases || []).map(r => r.date).filter(Boolean).sort();
  return dates[0] || '';
}
const cvar = c => `var(--${c})`;
const csf  = c => `var(--${c}-sf)`;

const DIVISION_NAMES = {
  '07': 'Thermal & Moisture Protection', '21': 'Fire Suppression',
  '22': 'Plumbing', '23': 'HVAC', '25': 'Integrated Automation', '26': 'Electrical', '33': 'Utilities'
};
const DIVISIONS = ['22', '23'];        // the divisions a spec import splits into
/* Divisions actually present in the open job (so a manually-added Div 07 section
   gets its own tab), newest number order. */
function jobDivisions() {
  const set = new Set(sectionsOf(job).map(s => s.division).filter(Boolean));
  return [...set].sort((a, b) => String(a).localeCompare(String(b), undefined, { numeric: true }));
}

/* ═══════════════════════════════════════════════════════════════════════════
   1. SPEC PARSER
   Three independent signals are read out of the PDF and cross-checked:
     A. running page headers/footers  "DUCT INSULATION 23 07 13 - 4"
     B. body headings                 "SECTION 23 07 13 - DUCT INSULATION"
     C. the table of contents         "Section 23 0713 Duct Insulation"
   Signal A states which section every page belongs to, which is what lets the
   parser throw out cross references such as "…comply with Section 23 21 13."
   ═══════════════════════════════════════════════════════════════════════════ */

/* --- line reconstruction: pdf.js gives positioned runs, not lines --- */
function pageItemsToLines(items) {
  const rows = [];
  for (const it of items) {
    if (!it.str || !it.str.trim()) continue;
    const x = it.transform[4], y = it.transform[5];
    const h = Math.abs(it.transform[3]) || 10;
    let row = null;
    for (const r of rows) if (Math.abs(r.y - y) <= Math.max(1.2, h * 0.2)) { row = r; break; }
    if (!row) { row = { y, items: [] }; rows.push(row); }
    row.items.push({ x, w: it.width || 0, s: it.str });
  }
  rows.sort((a, b) => b.y - a.y);
  const lines = [];
  for (const r of rows) {
    r.items.sort((a, b) => a.x - b.x || b.w - a.w);
    const kept = [];
    for (const it of r.items) {
      // Drop runs drawn on top of an already-placed run: PDFs sometimes stack a
      // stray running-title layer over the real heading.
      let covered = false;
      for (const k of kept) {
        const ov = Math.min(it.x + it.w, k.x + k.w) - Math.max(it.x, k.x);
        if (ov > 0 && (it.w === 0 || ov / Math.max(it.w, 0.01) > 0.6)) { covered = true; break; }
      }
      if (!covered) kept.push(it);
    }
    let line = '', prevEnd = null;
    for (const it of kept) {
      if (prevEnd !== null && it.x - prevEnd > 1.2) line += ' ';
      line += it.s;
      prevEnd = it.x + it.w;
    }
    line = line.replace(/\s+/g, ' ').trim();
    if (line) lines.push(line);
  }
  return lines;
}

/* --- section-number helpers --- */
const NUM_RE = '(\\d{2}\\s?\\d{2}\\s?\\d{2}(?:\\s?\\.\\s?\\d{1,3})?)';
function normNum(raw) {
  const m = String(raw).replace(/[\s ]/g, '').match(/^(\d{6})(\.\d{1,3})?$/);
  return m ? m[1] + (m[2] || '') : null;
}
function prettyNum(key) {
  if (!key) return '';
  const [base, dec] = String(key).split('.');
  return base.slice(0, 2) + ' ' + base.slice(2, 4) + ' ' + base.slice(4, 6) + (dec ? '.' + dec : '');
}
const divOf = key => key ? String(key).slice(0, 2) : null;

/* --- title helpers --- */
const ACRONYMS = new Set(('HVAC AC DC VAV VFD VFC VRF AHU RTU FCU ERV HRV DDC BAS BMS EMS PVC CPVC ABS ' +
  'HDPE PEX PP FRP GRP CPE ASME ASTM ASHRAE NFPA UL AWWA ANSI NSF IEEE NEMA SMACNA AMCA TAB LPG LP RO DI ' +
  'UV BTU CFM GPM PSI HEPA IAQ DX HW CHW DHW O&M I/O USA US TV CO2 CO VRV MERV').split(' '));
const SMALL = new Set(('a an and as at but by for from in into nor of off on onto or over per the to up ' +
  'via with within').split(' '));

function smartTitleCase(str) {
  if (!str) return '';
  if (/[a-z]/.test(str)) return str.trim();          // already cased — leave alone
  const toks = str.toLowerCase().split(/(\s+)/);
  const total = toks.filter(t => t.trim()).length;
  let i = -1;
  return toks.map(tok => {
    if (!tok.trim()) return tok;
    i++;
    const idx = i;
    return tok.split(/([-\/&,()])/).map(part => {
      if (!/[a-z]/i.test(part)) return part;
      const up = part.toUpperCase();
      if (ACRONYMS.has(up)) return up;
      if (idx !== 0 && idx !== total - 1 && SMALL.has(part)) return part;
      return part.charAt(0).toUpperCase() + part.slice(1);
    }).join('');
  }).join('');
}
const titleKey = s => String(s || '').toUpperCase().replace(/&/g, ' AND ').replace(/[^A-Z0-9]+/g, ' ').trim();
function titleSim(a, b) {
  const A = titleKey(a).split(' ').filter(Boolean), B = titleKey(b).split(' ').filter(Boolean);
  if (!A.length || !B.length) return 0;
  const bag = new Map();
  for (const t of B) bag.set(t, (bag.get(t) || 0) + 1);
  let hit = 0;
  for (const t of A) if (bag.get(t)) { hit++; bag.set(t, bag.get(t) - 1); }
  return (2 * hit) / (A.length + B.length);
}
function stripEchoTail(t) {
  if (!t) return t;
  const w = t.split(' ');
  for (let take = Math.floor(w.length / 2); take >= 2; take--) {
    const tail = w.slice(w.length - take).join(' '), head = w.slice(0, w.length - take).join(' ');
    if (titleKey(head).includes(titleKey(tail))) return head;
  }
  return t;
}
function cleanTitle(t) {
  if (!t) return '';
  return stripEchoTail(String(t).replace(/\s+/g, ' ')
    .replace(/^[\s\-–—:.,"'“”]+/, '').replace(/[\s\-–—:.,"'“”]+$/, '')
    .replace(/\s*\.{3,}\s*\d*$/, '').trim()).trim();
}

/* --- structural line tests --- */
const PART_RE = /^PART\s+\d/i;
const ART_RE  = /^\d{1,2}\.\d{1,2}\b/;
const ITEM_RE = /^[A-Z]\.\s+/;
const SUB_RE  = /^\d{1,2}\.\s+/;
const END_RE  = new RegExp('^END\\s+OF\\s+SECTION(?:\\s+' + NUM_RE + ')?\\s*$', 'i');
const isStructural = l => PART_RE.test(l) || ART_RE.test(l) || END_RE.test(l) || ITEM_RE.test(l);

/* --- signal A: running headers / footers --- */
const RUN_RE = new RegExp('^\\s*(?:(.*?)[\\s.]+)?' + NUM_RE + '\\s*[-–—]\\s*(\\d{1,3})\\s*$');
function scanRunningTitles(pages) {
  const map = new Map();
  for (const page of pages) {
    const L = page.lines, zone = [];
    for (let i = 0; i < Math.min(4, L.length); i++) zone.push(L[i]);
    for (let i = Math.max(0, L.length - 4); i < L.length; i++) zone.push(L[i]);
    const cands = [];
    for (const raw of zone) {
      const m = RUN_RE.exec((raw || '').trim());
      if (!m) continue;
      const key = normNum(m[2]);
      if (!key) continue;
      const title = cleanTitle(m[1] || '');
      if (title.length > 90 || /[;,]$/.test(title)) continue;   // that was a sentence
      cands.push({ key, title, seq: parseInt(m[3], 10) });
    }
    if (cands.length) map.set(page.num, cands.find(c => c.title) || cands[0]);
  }
  return map;
}

/* --- signal B: body headings --- */
const HEAD_RE = new RegExp('SECTION\\s+' + NUM_RE + '\\s*[-–—:]?\\s*(.*)$', 'i');
function scanHeaders(pages) {
  const out = [];
  for (const page of pages) {
    for (let i = 0; i < page.lines.length; i++) {
      const line = page.lines[i].trim();
      if (!/SECTION/i.test(line) || /^END\s+OF\s+SECTION/i.test(line)) continue;
      const m = HEAD_RE.exec(line);
      if (!m) continue;
      const key = normNum(m[1]);
      if (!key) continue;

      // Anything before "SECTION" must be a stray layer, never prose.
      const pre = line.slice(0, m.index).trim();
      if (pre && (pre.length > 60 || /[a-z]/.test(pre))) continue;

      let title = cleanTitle(m[2]);
      // Title wrapped onto the next line: "...FOR PLUMBING PIPING AND" / "EQUIPMENT"
      const next = (page.lines[i + 1] || '').trim();
      if (next && !isStructural(next) && next.length <= 70 &&
          !/[a-z]/.test(next.replace(/\(s\)/g, '')) && /[A-Z]/.test(next) &&
          (!title || /\b(AND|OR|FOR|OF|THE|WITH|&|,|-)$/i.test(title) || title.length < 12)) {
        title = cleanTitle(title + ' ' + next);
      }

      let followedByPart = false;
      for (let j = i + 1; j < Math.min(i + 6, page.lines.length); j++) {
        const l = page.lines[j].trim();
        if (PART_RE.test(l) || ART_RE.test(l)) { followedByPart = true; break; }
      }
      const shouty = /^SECTION\b/.test(line.slice(m.index));   // headings shout, references don't
      const hasTitle = title.length >= 4;
      // Cross references quote a section then carry on in prose: "Section 23 33 00
      // for dampers, sound-control devices…". A heading never opens that way, and
      // it sits at the top of its page or shouts its title in capitals.
      const leadsIntoProse = /^(for|and|or|to|of|in|on|with|as|the|that|which|shall|where|when)\b/i.test(title);
      const capsTitle = hasTitle && !/[a-z]/.test(title.replace(/\(s\)/g, ''));
      const looksPlaced = i <= 4 || capsTitle || !hasTitle;
      out.push({ key, title, page: page.num, line: i,
        confirmed: ((shouty && (hasTitle || followedByPart)) || (hasTitle && followedByPart))
          && !leadsIntoProse && looksPlaced });
    }
  }
  return out;
}

/* --- signal C: table of contents --- */
const TOC_RE = new RegExp('^(?:Section|SECTION)\\s+' + NUM_RE + '[\\s.\\-–—:]+(.+)$');
const TOC_BARE_RE = new RegExp('^' + NUM_RE + '[\\s.\\-–—:]{2,}(.+)$');
function scanToc(pages, firstBodyPage) {
  const out = new Map();
  const limit = firstBodyPage ? Math.min(firstBodyPage - 1, 60) : 60;
  for (const page of pages) {
    if (page.num > limit) break;
    const rows = [];
    for (const raw of page.lines) {
      const m = TOC_RE.exec(raw.trim());
      if (m) rows.push(m);
    }
    const looksLikeIndex = rows.length >= 2 || page.lines.some(l => /TABLE\s+OF\s+CONTENTS/i.test(l));
    if (looksLikeIndex) {
      for (const raw of page.lines) {
        const line = raw.trim();
        if (TOC_RE.test(line)) continue;
        const m = TOC_BARE_RE.exec(line);
        if (m) rows.push(m);
      }
    }
    for (const m of rows) {
      const key = normNum(m[1]);
      if (!key) continue;
      const title = cleanTitle(m[2]).replace(/\s*\d{1,4}$/, '');
      if (!title || title.length < 3) continue;
      if (/^(comply|refer|see|as specified|and )/i.test(title)) continue;
      if (!out.has(key)) out.set(key, { key, title, page: page.num });
    }
  }
  return out;
}

/* --- submittal requirements (reference list, straight from PART 1) --- */
const SUB_ART_RE = /^(\d{1,2}\.\d{1,2})\s+(.*\bSUBMITTALS?\b.*)$/i;
function classifyArticle(name) {
  const n = name.toUpperCase();
  if (n.includes('ACTION')) return 'Action';
  if (n.includes('INFORMATIONAL')) return 'Informational';
  if (n.includes('CLOSEOUT')) return 'Closeout';
  if (n.includes('MAINTENANCE')) return 'Maintenance Material';
  if (n.includes('TRAINING')) return 'Training';
  return 'Submittals';
}
function extractRequirements(lines) {
  const groups = [];
  for (let i = 0; i < lines.length; i++) {
    const m = SUB_ART_RE.exec(lines[i].trim());
    if (!m) continue;
    const heading = m[2];
    const group = { article: m[1], name: cleanTitle(heading.replace(/:.*$/, '')), kind: classifyArticle(heading), items: [] };
    // "1.03 SUBMITTALS: Comply with Section 01 30 00."
    const inline = heading.match(/:\s*(.+)$/);
    if (inline && inline[1].trim().length > 3) group.items.push({ label: '', text: inline[1].trim() });
    let cur = null;
    for (let j = i + 1; j < lines.length; j++) {
      const line = lines[j].trim();
      if (!line) continue;
      if (ART_RE.test(line) || PART_RE.test(line) || END_RE.test(line)) break;
      if (ITEM_RE.test(line)) { cur = { label: '', text: line.replace(ITEM_RE, '').trim() }; group.items.push(cur); }
      else if (cur) cur.text += (SUB_RE.test(line) ? '  ' : ' ') + line;
    }
    for (const it of group.items) {
      it.text = it.text.replace(/\s+/g, ' ').trim();
      const lead = it.text.match(/^([^:.]{2,70})[:.]\s*/);
      it.label = cleanTitle(lead ? lead[1] : it.text.slice(0, 60));
      it.detail = lead ? it.text.slice(lead[0].length).trim() : '';
    }
    if (group.items.length) groups.push(group);
  }
  return groups;
}

/* Keyword rules for auto-tagging spec sections.
   `min` is how many times the term must appear in the body before it counts as
   what the section is *about* rather than a passing mention. A hit in the title
   or in "Section Includes" always counts. */
const TAG_RULES = [
  // ── equipment ──
  ['VFD',                 /\bVFDs?\b|\bVFCs?\b|variable[-\s]frequency|variable[-\s]speed\s+drive|adjustable[-\s]frequency\s+drive/i, 2],
  ['Chiller',             /\bchillers?\b/i, 2],
  ['Cooling Tower',       /cooling\s+towers?\b/i, 2],
  ['Boiler',              /\bboilers?\b/i, 3],
  ['Pump',                /\bpumps?\b/i, 4],
  ['Booster Pump',        /booster\s+pumps?\b/i, 2],
  ['Air Handling Unit',   /air[-\s]handling\s+units?\b|\bAHUs?\b/i, 2],
  ['Fan Coil',            /fan[-\s]coil|blower[-\s]coil/i, 2],
  ['Terminal Unit',       /air\s+terminal\s+units?\b|\bVAV\b|variable[-\s]air[-\s]volume|terminal\s+units?\b/i, 2],
  ['Fan',                 /\bfans?\b/i, 5],
  ['Power Ventilator',    /power\s+ventilators?|gravity\s+ventilators?/i, 2],
  ['Humidifier',          /humidifiers?\b/i, 2],
  ['Heat Exchanger',      /heat\s+exchangers?\b/i, 2],
  ['Expansion Tank',      /expansion\s+tanks?\b/i, 2],
  ['Water Heater',        /water\s+heaters?\b/i, 2],
  ['Motor',               /\bmotors?\b/i, 5],
  ['Coil',                /\bcoils?\b/i, 4],
  ['Filter',              /\bfilters?\b/i, 4],

  // ── distribution ──
  ['Ductwork',            /\bducts?\b|ductwork/i, 4],
  ['Duct Accessories',    /duct\s+accessories|access\s+doors?\b/i, 2],
  ['Damper',              /\bdampers?\b/i, 3],
  ['Fire Damper',         /fire\s+dampers?|smoke\s+dampers?/i, 2],
  ['Piping',              /\bpiping\b/i, 6],
  ['Valve',               /\bvalves?\b/i, 6],
  ['Strainer',            /\bstrainers?\b/i, 2],
  ['Hanger & Support',    /hangers?\s+and\s+supports?|pipe\s+hangers?/i, 2],
  ['Sleeve',              /\bsleeves?\b/i, 3],
  ['Escutcheon',          /escutcheons?\b/i, 2],
  ['Expansion Fitting',   /expansion\s+(?:fittings?|joints?|loops?)/i, 2],
  ['Insulation',          /insulation\b/i, 4],
  ['Heat Trace',          /heat[-\s]tracing|heating\s+cable/i, 2],

  // ── systems ──
  ['Hydronic',            /hydronic/i, 2],
  ['Steam',               /\bsteam\b/i, 3],
  ['Condensate',          /condensate\b/i, 3],
  ['Natural Gas',         /natural[-\s]gas|fuel\s+gas/i, 2],
  ['Domestic Water',      /domestic[-\s]water/i, 2],
  ['Sanitary Waste',      /sanitary\s+waste|waste\s+and\s+vent/i, 2],
  ['Storm Drain',         /storm\s+drain/i, 2],
  ['Compressed Air',      /compressed[-\s]air/i, 2],
  ['Refrigerant',         /refrigerants?\b/i, 3],
  ['Water Treatment',     /water\s+treatment/i, 2],
  ['Plumbing Fixture',    /plumbing\s+fixtures?|lavator|water\s+closet/i, 2],
  ['Emergency Fixture',   /emergency\s+(?:shower|eyewash)|eyewash/i, 2],
  ['Floor Drain',         /floor\s+drains?|cleanouts?\b/i, 2],

  // ── controls & instruments ──
  ['Controls',            /\bDDC\b|direct\s+digital\s+control|building\s+automation|\bBAS\b|control\s+system/i, 2],
  ['Thermostat',          /thermostats?\b/i, 2],
  ['Sensor',              /\bsensors?\b/i, 3],
  ['Actuator',            /actuators?\b/i, 3],
  ['Gauge',               /\bgauges?\b|\bgages?\b|thermometers?\b/i, 3],
  ['Meter',               /flow\s+meters?|\bmeters\b/i, 3],

  // ── work types ──
  ['Seismic',             /seismic/i, 3],
  ['Vibration Isolation', /vibration\s+(?:isolation|control)|isolators?\b/i, 2],
  ['Testing & Balancing', /testing,?\s+adjusting,?\s+and\s+balancing|\bTAB\b/i, 2],
  ['Commissioning',       /commissioning/i, 3],
  ['Identification',      /identification|nameplates?\b|labels?\b/i, 3],
  ['Cleaning & Flushing', /flushing|disinfect/i, 2],
];

const MAX_TAGS = 14;

function extractTags(lines, title, includes) {
  const body = lines.join('\n');
  const head = (title || '') + ' ' + (includes || []).join(' ');
  const scored = [];
  for (const [tag, re, min] of TAG_RULES) {
    const inHead = re.test(head);
    const hits = (body.match(new RegExp(re.source, 'gi')) || []).length;
    if (!inHead && hits < min) continue;
    // What the section is named after wins; otherwise favour terms that are
    // specific over ones every piping section happens to mention.
    scored.push({ tag, score: (inHead ? 1000 : 0) + hits / min });
  }
  return scored.sort((a, b) => b.score - a.score).slice(0, MAX_TAGS).map(x => x.tag);
}

/* --- "Section Includes:" scope list --- */
function extractIncludes(lines) {
  const out = [];
  for (let i = 0; i < lines.length && out.length < 14; i++) {
    if (!/^\d{1,2}\.\d{1,2}\s+SUMMARY\b/i.test(lines[i].trim())) continue;
    for (let j = i + 1; j < Math.min(i + 40, lines.length); j++) {
      const line = lines[j].trim();
      if (ART_RE.test(line) || PART_RE.test(line)) break;
      if (SUB_RE.test(line)) {
        const t = cleanTitle(line.replace(SUB_RE, ''));
        if (t.length > 2 && t.length < 140) out.push(t);
      }
    }
    break;
  }
  return out;
}

/* --- repeated page furniture (project banner, sheet stamps, …) ---
   Whatever line sits at the top or bottom of most pages is boilerplate, not
   spec text. Found by counting rather than by name, so it works on any job. */
function findBoilerplate(pages) {
  const seen = new Map();
  for (const page of pages) {
    const L = page.lines, n = L.length;
    for (let i = 0; i < n; i++) {          // every line, so a mid-page use disqualifies
      const t = L[i].trim();
      if (!t || t.length > 140) continue;
      if (isStructural(t) || HEAD_RE.test(t) || RUN_RE.test(t)) continue;
      if (/[.;:]$/.test(t)) continue;      // a sentence, not a page banner
      let rec = seen.get(t);
      if (!rec) seen.set(t, rec = { n: 0, top: 0, bot: 0 });
      rec.n++;
      rec.top = Math.max(rec.top, i);
      rec.bot = Math.max(rec.bot, n - 1 - i);
    }
  }
  // Real furniture keeps the same slot on every page. A paragraph line that
  // happens to land near a page edge does not, so it survives.
  const out = new Set();
  for (const [line, r] of seen) if (r.n >= 3 && (r.top <= 1 || r.bot <= 1)) out.add(line);
  return out;
}

/* --- main parse --- */
function parseSpec(pages, wantedDivs) {
  const wanted = new Set(wantedDivs || DIVISIONS);
  const running = scanRunningTitles(pages);

  // A heading found on a page that the running titles assign to another
  // section is a cross reference inside the prose — drop it.
  const headers = scanHeaders(pages).filter(h => {
    const r = running.get(h.page);
    return !r || r.key === h.key;
  });

  const bodyHeaders = headers.filter(h => h.confirmed && wanted.has(divOf(h.key)));
  const firstBodyPage = bodyHeaders.length ? Math.min.apply(null, bodyHeaders.map(h => h.page)) : null;
  const toc = scanToc(pages, firstBodyPage);

  const pagesByKey = new Map(), runTitles = new Map();
  for (const [pnum, info] of running) {
    if (!wanted.has(divOf(info.key))) continue;
    if (!pagesByKey.has(info.key)) pagesByKey.set(info.key, []);
    pagesByKey.get(info.key).push(pnum);
    if (info.title) {
      if (!runTitles.has(info.key)) runTitles.set(info.key, new Map());
      const bag = runTitles.get(info.key);
      bag.set(info.title, (bag.get(info.title) || 0) + 1);
    }
  }

  const cand = new Map();
  const bump = (key, src, data) => {
    if (!wanted.has(divOf(key))) return;
    if (!cand.has(key)) cand.set(key, { key, headers: [], toc: null, pages: [] });
    const c = cand.get(key);
    if (src === 'header') c.headers.push(data);
    if (src === 'toc') c.toc = data;
    if (src === 'running') c.pages = data;
  };
  for (const h of headers) if (h.confirmed) bump(h.key, 'header', h);
  for (const [key, t] of toc) bump(key, 'toc', t);
  for (const [key, pgs] of pagesByKey) bump(key, 'running', pgs.sort((a, b) => a - b));

  const sections = [];
  for (const c of cand.values()) {
    const hdr = c.headers.find(h => h.confirmed) || c.headers[0] || null;
    const inBody = !!(hdr || c.pages.length);
    if (!inBody && !c.toc) continue;

    /* title vote across the three signals */
    let runTitle = null;
    if (runTitles.has(c.key)) runTitle = Array.from(runTitles.get(c.key).entries())
      .sort((a, b) => b[1] - a[1])[0][0];
    const opts = [];
    if (hdr && hdr.title) opts.push({ src: 'heading', text: hdr.title });
    if (runTitle) opts.push({ src: 'page header', text: runTitle });
    if (c.toc) opts.push({ src: 'contents', text: c.toc.title });
    let title = '', titleSrc = 'none';
    if (opts.length) {
      const weight = { 'page header': 1.02, 'heading': 1.0, 'contents': 0.98 };
      let best = null;
      for (const o of opts) {
        let s = 0;
        for (const p of opts) if (p !== o) s += titleSim(o.text, p.text);
        s = (opts.length > 1 ? s / (opts.length - 1) : 0.5) * weight[o.src];
        if (!best || s > best.s) best = { s, o };
      }
      title = best.o.text; titleSrc = best.o.src;
    }

    /* page range — longest near-consecutive run, preferring the heading's page */
    let startPage = null, endPage = null;
    if (c.pages.length) {
      const runs = [[c.pages[0]]];
      for (let i = 1; i < c.pages.length; i++) {
        if (c.pages[i] - c.pages[i - 1] <= 3) runs[runs.length - 1].push(c.pages[i]);
        else runs.push([c.pages[i]]);
      }
      const pick = (hdr && runs.find(r => hdr.page >= r[0] - 1 && hdr.page <= r[r.length - 1]))
        || runs.slice().sort((a, b) => b.length - a.length)[0];
      startPage = pick[0]; endPage = pick[pick.length - 1];
    }
    if (hdr) startPage = Math.min(startPage == null ? hdr.page : startPage, hdr.page);

    sections.push({
      key: c.key, number: prettyNum(c.key), division: divOf(c.key),
      title: smartTitleCase(title), rawTitle: title, titleSource: titleSrc,
      startPage, endPage, inBody, inToc: !!c.toc,
      confidence: (hdr && hdr.confirmed ? 1 : 0) + (c.pages.length ? 1 : 0) + (c.toc ? 1 : 0)
    });
  }
  sections.sort((a, b) => String(a.key).localeCompare(String(b.key), undefined, { numeric: true }));

  /* body-derived extras */
  const byNum = new Map(pages.map(p => [p.num, p]));
  const boiler = findBoilerplate(pages);
  const headingPages = Array.from(new Set(headers.filter(h => h.confirmed).map(h => h.page)))
    .sort((a, b) => a - b);
  for (let i = 0; i < sections.length; i++) {
    const s = sections[i];
    s.requirements = []; s.includes = []; s.tags = []; s.autoTags = [];
    if (!s.inBody || s.startPage == null) continue;
    let to = s.endPage;
    if (to == null) {
      // No running footers to bound the section — stop where the next heading
      // starts, in any division, so the last tracked section does not swallow
      // the rest of the manual.
      const nxt = sections.slice(i + 1).find(x => x.inBody && x.startPage != null);
      const nextAny = headingPages.find(p => p > s.startPage);
      to = (pages[pages.length - 1] || {}).num;
      if (nxt) to = Math.min(to, nxt.startPage - 1);
      if (nextAny) to = Math.min(to, nextAny - 1);
      to = Math.max(s.startPage, to);
      s.endPage = to;
    }
    const lines = [];
    for (let p = s.startPage; p <= to; p++) {
      const pg = byNum.get(p);
      if (!pg) continue;
      const n = pg.lines.length;
      for (let li = 0; li < n; li++) {
        const t = pg.lines[li].trim();
        if (!t) continue;
        const inZone = li < 3 || li >= n - 3;
        if (inZone && boiler.has(t)) continue;                      // page furniture
        if (t.length < 120 && RUN_RE.test(t)) continue;             // running header/footer
        if (/^Page\s+\d+\s+of\s+\d+$/i.test(t)) continue;
        lines.push(t);
      }
    }
    const hi = lines.findIndex(l => {
      const m = HEAD_RE.exec(l);
      return m && normNum(m[1]) === s.key;
    });
    if (hi > 0) lines.splice(0, hi);
    s.requirements = extractRequirements(lines);
    s.includes = extractIncludes(lines);
    // Searchable keywords, so "VFD" finds the controls section that only ever
    // says "variable frequency".
    s.autoTags = extractTags(lines, s.title, s.includes);
    s.tags = s.autoTags.slice();
  }

  return {
    sections,
    diagnostics: {
      totalPages: pages.length, headings: headers.length,
      tocEntries: toc.size, pagesMapped: running.size, sections: sections.length
    }
  };
}

/* ═══════════════════════════════════════════════════════════════════════════
   2. STORAGE — Firestore for the register, Cloud Storage for the PDFs

     jobs/{jobId}                      name, number, spec files, roll-up counts
     jobs/{jobId}/sections/{sectionKey} one document per spec section

   Sections are separate documents so two people editing different sections at
   the same time cannot overwrite each other.
   ═══════════════════════════════════════════════════════════════════════════ */
let FB = null;                 // the Firebase handles, once the module has run
let syncState = 'wait';        // wait | live | error
let syncMessage = '';

function fbReady() {
  return new Promise(res => {
    if (window.FB) return res(window.FB);
    window.addEventListener('fb-ready', () => res(window.FB), { once: true });
  });
}

const jobsCol = () => FB.collection(FB.db, 'jobs');
const jobRef = id => FB.doc(FB.db, 'jobs', id);
const sectionsCol = jobId => FB.collection(FB.db, 'jobs', jobId, 'sections');
const sectionRef = (jobId, key) => FB.doc(FB.db, 'jobs', jobId, 'sections', String(key));
const specDataRef = (jobId, key) => FB.doc(FB.db, 'jobs', jobId, 'specdata', String(key));
const rfisCol = jobId => FB.collection(FB.db, 'jobs', jobId, 'rfis');
const rfiRef = (jobId, id) => FB.doc(FB.db, 'jobs', jobId, 'rfis', String(id));
const trackingCol = jobId => FB.collection(FB.db, 'jobs', jobId, 'tracking');
const trackingRef = (jobId, id) => FB.doc(FB.db, 'jobs', jobId, 'tracking', String(id));
const coCol = jobId => FB.collection(FB.db, 'jobs', jobId, 'changeorders');
const coRef = (jobId, id) => FB.doc(FB.db, 'jobs', jobId, 'changeorders', String(id));

/* Firestore rejects undefined; strip it rather than let a write fail. */
function clean(v) {
  if (Array.isArray(v)) return v.map(clean);
  if (v && typeof v === 'object') {
    const out = {};
    for (const k of Object.keys(v)) { if (v[k] !== undefined) out[k] = clean(v[k]); }
    return out;
  }
  return v === undefined ? null : v;
}

/* ── job documents ── */
function jobSummary(j) {
  const secs = sectionsOf(j);
  const tally = {};
  STATUSES.forEach(st => tally[st.id] = 0);
  let bytes = 0;
  for (const sp of (j.specs || [])) bytes += sp.size || 0;
  for (const s of secs) {
    tally[s.status || 'not_started']++;
    for (const d of (s.submittals || []).concat(s.responses || [])) {
      if (!isLink(d)) bytes += d.size || 0;
    }
  }
  return { count: secs.length, tally, bytes };
}

/* A snapshot that was generated before a local change must not overwrite it.
   Anything mid-edit is held back until its write lands. */
let jobEditDepth = 0;
const pendingSections = new Set();
function beginJobEdit() { jobEditDepth++; }
function endJobEdit() { jobEditDepth = Math.max(0, jobEditDepth - 1); }
function markPending(key) { if (key) pendingSections.add(key); }

async function saveJobMeta(j) {
  const target = j || job;
  if (!target) return;
  target.updated = Date.now();
  target.summary = jobSummary(target);
  await FB.setDoc(jobRef(target.id), clean({
    id: target.id,
    name: target.name,
    number: target.number || '',
    folderUrl: target.folderUrl || '',
    sfFolderName: target.sfFolderName || '',
    ignoredFiles: target.ignoredFiles || [],
    contractAmount: target.contractAmount || '',
    created: target.created,
    updated: target.updated,
    specs: target.specs || [],
    summary: target.summary
  }));
}

async function saveSection(s) {
  if (!job || !s) return;
  markPending(s.key);
  try {
    await FB.setDoc(sectionRef(job.id, s.key), clean(logFields(s)));
    await saveJobMeta();
  } finally { pendingSections.delete(s.key); }
}

/* Write just what changed. A full setDoc of a section re-sends every field to
   every connected browser, which for the heaviest sections is tens of KB. */
async function patchSection(key, fields) {
  if (!job) return;
  markPending(key);
  try {
    await FB.updateDoc(sectionRef(job.id, key), clean(fields));
    await saveJobMeta();
  } catch (e) {
    if (String((e && e.code) || '').includes('not-found')) {
      const s = findSection(key);
      if (s) { await FB.setDoc(sectionRef(job.id, key), clean(logFields(s))); await saveJobMeta(); }
    } else throw e;
  } finally { pendingSections.delete(key); }
}

/* The spec text lives in its own document, so it never rides along on a save. */
const SPEC_FIELDS = ['requirements', 'includes'];
function logFields(s) {
  const out = {};
  for (const k of Object.keys(s)) if (!SPEC_FIELDS.includes(k)) out[k] = s[k];
  return out;
}

async function saveSections(list) {
  if (!job || !list.length) return;
  list.forEach(s => markPending(s.key));
  try {
    for (let i = 0; i < list.length; i += 400) {         // Firestore caps a batch at 500
      const batch = FB.writeBatch(FB.db);
      for (const s of list.slice(i, i + 400)) batch.set(sectionRef(job.id, s.key), clean(logFields(s)));
      await batch.commit();
    }
    await saveJobMeta();
  } finally { list.forEach(s => pendingSections.delete(s.key)); }
}

async function deleteSectionDocs(jobId, keys) {
  for (let i = 0; i < keys.length; i += 400) {
    const batch = FB.writeBatch(FB.db);
    for (const k of keys.slice(i, i + 400)) {
      batch.delete(sectionRef(jobId, k));
      batch.delete(specDataRef(jobId, k));
    }
    await batch.commit();
  }
  for (const k of keys) specDataCache.delete(jobId + ':' + k);
}

/* ── the spec text for a section, fetched only when its panel opens ── */
const specDataCache = new Map();          // `${jobId}:${key}` -> { requirements, includes }

async function saveSpecData(jobId, list) {
  for (let i = 0; i < list.length; i += 400) {
    const batch = FB.writeBatch(FB.db);
    for (const s of list.slice(i, i + 400)) {
      batch.set(specDataRef(jobId, s.key), clean({
        key: s.key, requirements: s.requirements || [], includes: s.includes || []
      }));
    }
    await batch.commit();
  }
  for (const s of list) {
    specDataCache.set(jobId + ':' + s.key,
      { requirements: s.requirements || [], includes: s.includes || [] });
  }
}

async function specDataFor(key) {
  const s = findSection(key);
  // Written inline by an earlier version, or still in memory straight from an
  // import — either way there is nothing to fetch.
  if (s && (Array.isArray(s.requirements) || Array.isArray(s.includes))) {
    return { requirements: s.requirements || [], includes: s.includes || [] };
  }
  const id = job.id + ':' + key;
  if (specDataCache.has(id)) return specDataCache.get(id);
  let data = { requirements: [], includes: [] };
  try {
    const snap = await FB.getDoc(specDataRef(job.id, key));
    if (snap.exists()) {
      const d = snap.data();
      data = { requirements: d.requirements || [], includes: d.includes || [] };
    }
  } catch (e) { /* offline: fall through to an empty block */ }
  specDataCache.set(id, data);
  return data;
}

/* Sections written by an earlier version carry their spec text inline, which is
   what makes opening a job heavy. Copy it out, confirm the copy landed on the
   server, and only then drop the inline fields. Nothing is removed until its
   replacement is verified, so an interrupted run leaves the data intact. */
const specDataMigrated = new Set();
async function migrateSpecData(jobId, sections) {
  if (specDataMigrated.has(jobId)) return;
  const stale = sections.filter(s =>
    (Array.isArray(s.requirements) && s.requirements.length) ||
    (Array.isArray(s.includes) && s.includes.length));
  if (!stale.length) { specDataMigrated.add(jobId); return; }
  specDataMigrated.add(jobId);
  try {
    await saveSpecData(jobId, stale);
    for (const s of stale) {
      const check = await FB.getDocFromServer(specDataRef(jobId, s.key));
      const ok = check.exists() &&
        (check.data().requirements || []).length === (s.requirements || []).length &&
        (check.data().includes || []).length === (s.includes || []).length;
      if (!ok) continue;                       // leave this one exactly as it was
      await FB.updateDoc(sectionRef(jobId, s.key), {
        requirements: FB.deleteField(), includes: FB.deleteField()
      });
    }
  } catch (e) {
    console.warn('spec text left in place:', e);
    specDataMigrated.delete(jobId);           // try again next time
  }
}

/* ── PDFs live in each job's ShareFile folder ───────────────────────────────
   The register (statuses, vendors, sections) lives in the cloud and is shared
   live, but the PDFs are never uploaded there — each job keeps them in a
   ShareFile folder you load:

     <job folder>/job.json        marks which job the folder belongs to
     <job folder>/files/<id>.pdf  one file per submittal / response / spec

   The folder handle is remembered per machine; the first time on a machine you
   pick it once, then it opens with a single permission click. To view or add a
   job's PDFs, its folder has to be loaded.
   ────────────────────────────────────────────────────────────────────────── */
const uid = p => (p || 'id') + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const blobUrlCache = new Map();    // fileId -> object URL, for this session
let jobFolder = null;              // the open job's ShareFile folder, or null if not loaded
let folderRemembered = null;      // a known handle from a past session, awaiting a one-click reconnect
let jobFolderCount = null;         // how many PDFs the loaded folder actually holds (null = unknown)
let jobUnassigned = [];            // PDFs found in the folder that no section references yet

/* PDFs are filed under files/<status>/, keeping their original name, so the
   ShareFile folder is organised by what each PDF is. The section keeps a doc
   record { id, name, size, status, uploaded, dir, file } that points at it.
   'spec' files go under files/Specs/. */
/* Files are organised under feature parent folders inside files/:
     Submittals/<status> (+ Submittals/Specs)   RFIs/Questions · RFIs/Answers
     Change Orders/                              Emails/<category>              */
const SUBMITTALS_DIR = 'Submittals';
const STATUS_DIR = {
  submitted_gc:     'Submittals/Submitted to GC',
  partial_approval: 'Submittals/Partial Approval',
  approved:         'Submittals/Approved',
  revise_resubmit:  'Submittals/Revise and Resubmit',
  revision_requested: 'Submittals/Revision Requested',
  revision_sent:    'Submittals/Revision Sent',
  waiting_vendor:   'Submittals/Waiting on Vendor',
  na:               'Submittals/Not Required',
  spec:             'Submittals/Specs'
};
function statusDirName(id) { return STATUS_DIR[id] || (SUBMITTALS_DIR + '/Filed'); }
const EMAIL_DIR = 'Emails';
const ALL_SUBMITTALS_NAME = 'All Submittals';
const ALL_SUBMITTALS_DIR = 'Submittals/All Submittals';   // mirror of each section's current submittal
const ARCHIVE_NAME = 'Archive';
const ARCHIVE_DIR  = 'Submittals/Archive';   // superseded / replaced / no-longer-relevant PDFs live here
/* A doc is archived if it's flagged, or its name still carries the legacy "OLD - "
   prefix (so pre-Archive folders migrate in on the next organise). Links never
   archive — there's no file to move. */
function isArchived(d) { return !!d && !isLink(d) && (d.archived === true || /^OLD\s*-\s*/i.test(d.name || '')); }
const stripOldPrefix = n => (n || '').replace(/^OLD\s*-\s*/i, '');   // "OLD - Valve.pdf" → "Valve.pdf"
/* RFI PDFs live in a per-RFI folder named by its number + subject, with a
   "Question" and an "Answered" subfolder (Answered stays empty until a response
   comes back). RFI_DOC_KINDS (above) now names only the legacy flat locations. */
const RFI_DIR = 'RFIs';
const RFI_SUBDIR = { question: 'Question', answer: 'Answered' };
function rfiFolderName(r) {
  const num = ((r && r.number) || '').trim(), subj = ((r && r.subject) || '').trim();
  const base = (num + (num && subj ? ' - ' : '') + subj).trim() || ('RFI ' + ((r && r.id) || ''));
  return sanitizeAnyName(base.slice(0, 90), 'RFI');
}
function rfiDocDir(r, kind) { return RFI_DIR + '/' + rfiFolderName(r) + '/' + (RFI_SUBDIR[kind] || RFI_SUBDIR.question); }
/* Change-order files live in a per-CO folder named "CO <number> - <description>",
   with the CO PDFs at its top and an "Emails" subfolder for CO emails.
   CO_DOC_DIR (above) is now the parent; CO_EMAIL_DIR names the legacy shared bucket. */
function coFolderName(c) {
  const num = ((c && c.number) || '').trim(), desc = ((c && c.description) || '').trim();
  const label = num ? 'CO ' + num : '';
  const base = (label + (label && desc ? ' - ' : '') + desc).trim() || ('CO ' + ((c && c.id) || ''));
  return sanitizeAnyName(base.slice(0, 90), 'CO');
}
function coDocDir(c) { return CO_DOC_DIR + '/' + coFolderName(c); }
function coEmailDir(c) { return coDocDir(c) + '/Emails'; }
/* Old flat folder names from before the reorg — used to detect and clean up the
   pre-nesting layout. */
const OLD_FLAT_DIRS = ['Submitted to GC', 'Partial Approval', 'Approved', 'Revise and Resubmit',
  'Waiting on Vendor', 'Not Required', 'Specs', 'RFI Questions', 'RFI Answers'];
const OLD_FLAT_SET = new Set(OLD_FLAT_DIRS);
function sanitizeFileName(name) {
  let n = String(name || 'document.pdf').replace(/[\/\\:*?"<>|\x00-\x1f]+/g, '_').trim();
  if (!/\.pdf$/i.test(n)) n += '.pdf';
  return n || 'document.pdf';
}
/* Like sanitizeFileName but keeps whatever extension the file has (emails come
   in as .msg/.eml/.pdf, RFI packages as .pdf). */
function sanitizeAnyName(name, fallback) {
  let n = String(name || fallback || 'file').replace(/[\/\\:*?"<>|\x00-\x1f]+/g, '_').trim();
  return n || fallback || 'file';
}
async function uniqueFileName(dirHandle, name) {
  const dot = name.lastIndexOf('.');
  const base = dot > 0 ? name.slice(0, dot) : name;
  const ext = dot > 0 ? name.slice(dot) : '.pdf';
  let candidate = name, n = 2;
  for (;;) {
    try { await dirHandle.getFileHandle(candidate); candidate = `${base} (${n++})${ext}`; }
    catch (e) { return candidate; }     // NotFound → the name is free
  }
}
/* Write a file into files/<relDir>/, keeping its name; returns { dir, file }.
   relDir may be nested (e.g. "Emails/RFI Answers"); each level is created. */
async function putFileInDir(file, relDir, cleanName) {
  if (!jobFolder) throw new Error('The ShareFile folder for this job is not loaded.');
  let dirHandle = await jobFolder.getDirectoryHandle('files', { create: true });
  for (const part of relDir.split('/').filter(Boolean)) {
    dirHandle = await dirHandle.getDirectoryHandle(part, { create: true });
  }
  const fname = await uniqueFileName(dirHandle, cleanName);
  const fh = await dirHandle.getFileHandle(fname, { create: true });
  const w = await fh.createWritable();
  await w.write(file);
  await w.close();
  return { dir: relDir, file: fname };
}
/* Write a PDF into files/<statusDir>/, keeping its name; returns { dir, file }. */
async function putFile(file, statusId) {
  return putFileInDir(file, statusDirName(statusId), sanitizeFileName(file.name));
}
/* RFI PDFs live under files/RFIs/<RFI# - Subject>/Question|Answered/. */
async function putRfiFile(file, docKind, r) {
  return putFileInDir(file, rfiDocDir(r, docKind), sanitizeFileName(file.name));
}
/* Tracking files (emails, attachments) live under files/Emails/<category>/. */
async function putEmailFile(file, catName) {
  const dir = EMAIL_DIR + '/' + sanitizeAnyName(catName, 'Uncategorised');
  return putFileInDir(file, dir, sanitizeAnyName(file.name, 'email'));
}
async function walkDir(root, relDir) {
  let dh = root;
  for (const part of String(relDir).split('/').filter(Boolean)) dh = await dh.getDirectoryHandle(part);
  return dh;
}
async function walkDirCreate(root, relDir) {
  let dh = root;
  for (const part of String(relDir).split('/').filter(Boolean)) dh = await dh.getDirectoryHandle(part, { create: true });
  return dh;
}
async function readDocBlob(doc) {
  if (!doc) return null;
  if (doc.staged && doc.stagedId) return readStagedBlob(doc.stagedId).catch(() => null);   // phone upload held in Firebase
  if (!jobFolder) return null;
  try {
    const filesRoot = await jobFolder.getDirectoryHandle('files');
    if (doc.dir && doc.file) {
      const dirHandle = await walkDir(filesRoot, doc.dir);
      return await (await dirHandle.getFileHandle(doc.file)).getFile();
    }
    if (doc.fileId) return await (await filesRoot.getFileHandle(doc.fileId + '.pdf')).getFile();
  } catch (e) {}
  return null;
}
/* ── Phone uploads: hold a PDF in Firestore (chunked base64) until a computer with
   the ShareFile folder loaded files it in. iPhones/iPads can't write the folder
   (the File System Access API is desktop-only), so this is how they add PDFs. ── */
const STAGE_MAX = 25 * 1024 * 1024;      // 25 MB cap on a phone upload
const STAGE_PART = 500000;               // base64 chars per chunk doc (well under Firestore's 1 MB doc limit)
function bytesToB64(bytes) { let s = ''; const C = 0x8000; for (let i = 0; i < bytes.length; i += C) s += String.fromCharCode.apply(null, bytes.subarray(i, i + C)); return btoa(s); }
const stagedRef  = (jobId, id) => FB.doc(FB.db, 'jobs', jobId, 'staged', id);
const stagedPart = (jobId, id, i) => FB.doc(FB.db, 'jobs', jobId, 'staged', id, 'parts', String(i));
async function stageBlob(blob, name) {
  const b64 = bytesToB64(new Uint8Array(await blob.arrayBuffer()));
  const id = uid('stg'), parts = Math.ceil(b64.length / STAGE_PART) || 1;
  await FB.setDoc(stagedRef(job.id, id), { n: parts, name: name || 'file.pdf', size: blob.size, type: blob.type || 'application/pdf', added: Date.now() });
  for (let i = 0; i < parts; i++) await FB.setDoc(stagedPart(job.id, id, i), { d: b64.slice(i * STAGE_PART, (i + 1) * STAGE_PART) });
  return id;
}
async function readStagedBlob(id) {
  const meta = (await FB.getDoc(stagedRef(job.id, id))).data(); if (!meta) return null;
  let b64 = ''; for (let i = 0; i < (meta.n || 0); i++) b64 += ((await FB.getDoc(stagedPart(job.id, id, i))).data() || {}).d || '';
  return new Blob([b64ToBytes(b64)], { type: meta.type || 'application/pdf' });
}
async function deleteStaged(id) {
  try { const meta = (await FB.getDoc(stagedRef(job.id, id))).data() || {}; for (let i = 0; i < (meta.n || 0); i++) { try { await FB.deleteDoc(stagedPart(job.id, id, i)); } catch (e) {} } await FB.deleteDoc(stagedRef(job.id, id)); } catch (e) {}
}
async function docUrl(doc) {
  if (!doc) return null;
  if (blobUrlCache.has(doc.id)) return blobUrlCache.get(doc.id);
  const blob = await readDocBlob(doc);
  if (!blob) return null;
  const url = URL.createObjectURL(blob);
  blobUrlCache.set(doc.id, url);
  return url;
}
/* Why a PDF wouldn't open, in plain terms the user can act on. */
async function docReadError(doc) {
  if (!jobFolder) return 'Load this job’s ShareFile folder first.';
  let filesRoot;
  try { filesRoot = await jobFolder.getDirectoryHandle('files'); }
  catch (e) { return 'The loaded folder has no “files” folder in it — it’s probably the wrong folder, or the PDFs haven’t downloaded from ShareFile yet. Try “Change folder…” and pick the exact job folder.'; }
  const dir = doc.dir, file = doc.file || (doc.fileId ? doc.fileId + '.pdf' : null);
  if (!file) return 'This document has no stored file (it may have been added on an old version that kept PDFs in the cloud).';
  try {
    const dh = dir ? await walkDir(filesRoot, dir) : filesRoot;
    await dh.getFileHandle(file);
    return 'The PDF is in the folder but couldn’t be read — in ShareFile, make the folder “available offline” so it fully downloads, then try again.';
  } catch (e) {
    return `“${esc(doc.name || file)}” isn’t in this folder yet${dir ? ` (looked in files/${esc(dir)})` : ''}. It may still be syncing from ShareFile, or it was uploaded to a different folder.`;
  }
}
/* Count the PDFs actually present in files/ so the bar can say how many are
   readable — 0 immediately reveals a wrong or unsynced folder. */
async function refreshFolderCount() {
  jobFolderCount = null;
  if (!jobFolder) return;
  try {
    const filesRoot = await jobFolder.getDirectoryHandle('files');
    let n = 0;
    const walk = async dh => {                 // PDFs now live under parent folders — count at any depth
      for await (const e of dh.values()) {
        if (e.kind === 'file') { if (/\.pdf$/i.test(e.name)) n++; }
        else if (e.kind === 'directory' && e.name !== ALL_SUBMITTALS_NAME) await walk(e);   // don't double-count mirror copies
      }
    };
    await walk(filesRoot);
    jobFolderCount = n;
  } catch (e) { jobFolderCount = 0; }   // no files/ folder → nothing readable here
}
/* Recompute the PDF count + look for unassigned PDFs, then refresh the bar. */
async function noteFolderChanged() {
  if (!jobFolder) return;
  await refreshFolderCount();
  jobUnassigned = await scanUnassignedFiles();
  updateFolderBar();
}

/* Which on-disk PDF paths the register already knows about. */
function trackedPaths() {
  const set = new Set();
  const add = d => {
    if (!d || isLink(d)) return;
    if (d.dir && d.file) set.add('files/' + d.dir + '/' + d.file);
    else if (d.fileId) set.add('files/' + d.fileId + '.pdf');
  };
  for (const s of sectionsOf(job)) { (s.submittals || []).forEach(add); (s.responses || []).forEach(add); }
  (job.specs || []).forEach(add);
  for (const r of rfis) { (r.docs || []).forEach(add); }
  for (const c of tracking) { (c.files || []).forEach(add); }
  for (const c of cos) { (c.docs || []).forEach(add); (c.emails || []).forEach(add); }
  for (const lk of ['quotes', 'pos']) for (const it of litems(lk)) { (it.docs || []).forEach(add); (it.emails || []).forEach(add); }
  for (const ct of (contracts || [])) { (ct.docs || []).forEach(add); (ct.emails || []).forEach(add); (ct.changes || []).forEach(ch => (ch.docs || []).forEach(add)); }
  return set;
}
/* Files sitting in the ShareFile folder that the register doesn't reference —
   someone dropped them in directly. Walks the whole files/ tree (now that files
   live under parent folders) plus the job-folder root; anything the register
   already knows, or that was ignored, is skipped. */
async function scanUnassignedFiles() {
  if (!jobFolder) return [];
  const tracked = trackedPaths();
  const ignored = new Set(job.ignoredFiles || []);
  const found = [];
  const consider = (path, name, loc) => {
    const isPdf = /\.pdf$/i.test(name);
    const isEmail = /\.(msg|eml)$/i.test(name);
    if (!isPdf && !isEmail) return;
    if (tracked.has(path) || ignored.has(path)) return;
    if (/^register\.(json|csv)$/i.test(name) || /^job\.json$/i.test(name)) return;
    found.push(Object.assign({ path, name, type: isPdf ? 'pdf' : 'email' }, loc));
  };
  try {                                   // loose files at the job-folder root
    for await (const e of jobFolder.values()) {
      if (e.kind === 'file') consider(e.name, e.name, { at: 'root', dir: '', file: e.name });
    }
  } catch (e) {}
  try {                                   // anything under files/, at any depth
    const filesRoot = await jobFolder.getDirectoryHandle('files');
    const walk = async (dh, rel) => {
      for await (const e of dh.values()) {
        if (e.kind === 'file') consider('files/' + (rel ? rel + '/' : '') + e.name, e.name, { at: 'files', dir: rel, file: e.name });
        else if (e.kind === 'directory') {
          const child = rel ? rel + '/' + e.name : e.name;
          if (child === ALL_SUBMITTALS_DIR) continue;   // mirror copies aren't loose files
          await walk(e, child);
        }
      }
    };
    await walk(filesRoot, '');
  } catch (e) {}
  return found;
}
/* The directory handle that holds a loose item (item.dir is the path under
   files/, '' for directly inside files/). */
async function looseHandleFor(item) {
  if (item.at === 'root') return jobFolder;
  const filesRoot = await jobFolder.getDirectoryHandle('files');
  return item.dir ? await walkDir(filesRoot, item.dir) : filesRoot;
}
async function readLooseBlob(item) {
  try { const dh = await looseHandleFor(item); return await (await dh.getFileHandle(item.file)).getFile(); }
  catch (e) { return null; }
}
async function deleteLoose(item) {
  try { const dh = await looseHandleFor(item); await dh.removeEntry(item.file); } catch (e) {}
}

/* ── assign loose PDFs, one at a time ── */
function specSectionOptions(selected) {
  return jobDivisions().map(div => {
    const secs = sectionsOf(job).filter(s => s.division === div).sort(sectionOrder);
    if (!secs.length) return '';
    return `<optgroup label="Division ${div}${DIVISION_NAMES[div] ? ' — ' + DIVISION_NAMES[div] : ''}">${
      secs.map(s => `<option value="${esc(s.key)}" ${s.key === selected ? 'selected' : ''}>${esc(s.number)} — ${esc(s.title || 'untitled')}</option>`).join('')
    }</optgroup>`;
  }).join('');
}
let _assignQueue = [];
function startAssignUnassigned() {
  _assignQueue = jobUnassigned.slice();
  assignModal(0);
}

  const item = _assignQueue[i];

  $('modalHost').innerHTML = `<div class="modal-scrim"><div class="modal">

        <button class="btn sm" onclick="viewLoose(${i})">View</button></div>
      <div class="field"><label class="fl">Assign to</label>

              <option value="responses">Response (came back)</option>
            </select></div>
          <div class="field"><label class="fl">Status</label>

        </div>

      </div>
      <div id="asgRfiFields" hidden>
        ${rfis.length ? `
        <div class="field"><label class="fl">RFI</label>

        <div class="field"><label class="fl">What is it</label>

    <div class="modal-foot">

      <button class="btn" onclick="assignModal(${i + 1})">Skip</button>
      <button class="btn primary" onclick="assignPdf(${i})">Assign &amp; file</button>
    </div></div></div>`;
  const destSel = document.getElementById('asgDest');
  destSel.onchange = () => {
    document.getElementById('asgSubmittalFields').hidden = destSel.value !== 'submittal';
    document.getElementById('asgRfiFields').hidden = destSel.value !== 'rfi';
  };
  // default the status to match the kind

  stSel.value = 'submitted_gc';
}
function assignPdf(i) {
  const dest = (document.getElementById('asgDest') || {}).value;
  return dest === 'rfi' ? assignPdfToRfi(i) : assignUnassigned(i);
}
async function assignPdfToRfi(i) {
  const item = _assignQueue[i];
  if (!item) return;
  const rsel = document.getElementById('asgRfi');
  if (!rsel) { toast('No RFIs yet — create one on the RFIs tab first', true); return; }
  const r = rfiById(rsel.value);
  if (!r) { toast('Pick an RFI', true); return; }
  const kind = document.getElementById('asgRfiKind').value;   // 'question' | 'answer'
  stickyToast(`Filing ${item.name}…`);
  try {
    const blob = await readLooseBlob(item);
    if (!blob) { toast('Could not read that PDF — make the folder available offline in ShareFile', true); return; }
    const wantDir = rfiDocDir(r, kind);
