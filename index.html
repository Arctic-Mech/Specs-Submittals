  s[kind] = s[kind].filter(x => x.id !== docId);
  renderDrawer(); renderTable();
  try { await saveSection(s); } catch (e) { toast(writeError(e), true); }
}
function docOf(key, kind, docId) {
  const s = findSection(key);
  return s ? (s[kind] || []).find(x => x.id === docId) : null;
}
async function resolveDoc(key, kind, docId) {
  const d = docOf(key, kind, docId);
  if (!d) return null;
  if (d.url) return { url: d.url, name: d.name };            // pre-Firestore upload
  stickyToast(`Opening ${d.name}…`);
  const url = await fileUrl(d.fileId);
  if (!url) { toast('That file is missing', true); return null; }
  toast(' ');
  return { url, name: d.name };
}
async function viewDoc(key, kind, docId) {
  const got = await resolveDoc(key, kind, docId);
  if (got) showPdf(got.url, got.name);
}
async function downloadDoc(key, kind, docId) {
  const got = await resolveDoc(key, kind, docId);
  if (!got) return;
  const a = document.createElement('a');
  a.href = got.url; a.download = got.name; a.click();
}

/* ── manual section management ── */
async function addSectionManually() {
  if (!job) return;
  const num = prompt('Section number (e.g. 23 05 93):');
  if (!num) return;
  const key = normNum(num);
  if (!key) { toast('Use a 6-digit section number, e.g. 23 05 93', true); return; }
  if (!DIVISIONS.includes(divOf(key))) { toast('Only Divisions 22 and 23 are tracked here', true); return; }
  if (findSection(key)) { toast('That section is already in the register', true); return; }
  const title = prompt('Section title:') || '';
  const rec = newSectionRecord({
    key, number: prettyNum(key), division: divOf(key), title: title.trim(),
    manual: true, inBody: true, requirements: [], includes: []
  });
  markPending(key);
  job.sections.push(rec);
  sortSections();
  renderJob();
  openSection(key);
  try { await saveSection(rec); } catch (e) { toast(writeError(e), true); }
}
async function editSection(key) {
  const s = findSection(key);
  if (!s) return;
  const title = prompt('Section title:', s.title || '');
  if (title === null) return;
  s.title = title.trim();
  s.titleEdited = true;         // a later import must not overwrite this
  renderDrawer(); renderTable();
  try { await saveSection(s); } catch (e) { toast(writeError(e), true); }
}
async function deleteSection(key) {
  const s = findSection(key);
  if (!s) return;
  const files = (s.submittals || []).length + (s.responses || []).length;
  if (!confirm(`Remove ${s.number} from the register${files ? ` and delete its ${files} uploaded file(s)` : ''}?\n\nThis affects everyone on this job.`)) return;
  for (const d of (s.submittals || []).concat(s.responses || [])) await deleteStoredFile(d.fileId);
  job.sections = job.sections.filter(x => x.key !== key);
  closeDrawer(); renderJob();
  try { await FB.deleteDoc(sectionRef(job.id, key)); await saveJobMeta(); }
  catch (e) { toast(writeError(e), true); }
}
// Division first, then Not Required last inside it, then section number.
function sectionOrder(a, b) {
  if (a.division !== b.division) return String(a.division).localeCompare(String(b.division));
  const na = (a.status === 'na' ? 1 : 0) - (b.status === 'na' ? 1 : 0);
  if (na) return na;
  return String(a.key).localeCompare(String(b.key), undefined, { numeric: true });
}
function sortSections() {
  if (job && job.sections) job.sections.sort(sectionOrder);
}
function newSectionRecord(base) {
  return Object.assign({
    status: 'not_started', vendor: '', package: '', submittedDate: '', returnedDate: '',
    notes: '', submittals: [], responses: [], history: []
  }, base);
}

/* ═══════════════════════════════════════════════════════════════════════════
   8. PDF VIEWER
   ═══════════════════════════════════════════════════════════════════════════ */
function showPdf(url, name, page) {
  const src = url + (page ? '#page=' + page : '');
  $('modalHost').innerHTML = `
    <div class="modal-scrim" onclick="if(event.target===this)closePdf()">
      <div class="modal wide">
        <div class="modal-head">
          <h3>${esc(name)}${page ? ' · page ' + page : ''}</h3>
          <button class="btn sm" onclick="window.open('${src}','_blank')">Open in tab</button>
          <button class="icon-btn" onclick="closePdf()">✕</button>
        </div>
        <div class="modal-body flush"><iframe src="${src}"></iframe></div>
      </div>
    </div>`;
}
function closePdf() {
  $('modalHost').innerHTML = '';
}
async function openSpecViewer(specId, page) {
  const specs = specsOf(job);
  if (!specs.length) { toast('No spec PDF stored for this job', true); return; }

  let sp;
  if (specId) {
    sp = specs.find(x => x.id === specId);
    // Never silently open a different file at this file's page number.
    if (!sp) { toast('That spec file is no longer in this job', true); return; }
  } else if (specs.length === 1) {
    sp = specs[0];
  } else {
    chooseSpecModal(specs);
    return;
  }
  if (sp.url) { showPdf(sp.url, sp.name, page); return; }     // pre-Firestore upload
  stickyToast(`Opening ${sp.name}…`);
  const url = await fileUrl(sp.fileId);
  if (!url) { toast('The spec PDF is missing', true); return; }
  toast(' ');
  showPdf(url, sp.name, page);
}

function chooseSpecModal(specs) {
  $('modalHost').innerHTML = `
    <div class="modal-scrim" onclick="if(event.target===this)closePdf()"><div class="modal">
      <div class="modal-head"><h3>Which spec file?</h3>
        <button class="icon-btn" onclick="closePdf()">✕</button></div>
      <div class="modal-body">${specs.map(sp => {
        const n = sectionsFromSpec(sp.id).length;
        return `<button class="choice-btn" onclick="closePdf();openSpecViewer('${sp.id}')">
          <b>${esc(sp.name)}</b>
          <span>${sp.pages ? sp.pages + ' pages · ' : ''}${n} section${n === 1 ? '' : 's'} in the register</span>
        </button>`;
      }).join('')}</div>
    </div></div>`;
}

/* Removing a spec file: the log built against it is worth more than the PDF,
   so keeping the sections is the default and dropping them is opt-in. */
function removeSpecPrompt(specId) {
  const sp = specById(specId);
  if (!sp) return;
  const owned = sectionsFromSpec(specId);
  const files = owned.reduce((n, s) => n + (s.submittals || []).length + (s.responses || []).length, 0);
  if (!owned.length) {
    if (confirm(`Remove "${sp.name}"?\n\nNo sections came from this file.`)) removeSpec(specId, false);
    return;
  }
  $('modalHost').innerHTML = `
    <div class="modal-scrim" onclick="if(event.target===this)closePdf()"><div class="modal">
      <div class="modal-head"><h3>Remove ${esc(sp.name)}?</h3>
        <button class="icon-btn" onclick="closePdf()">✕</button></div>
      <div class="modal-body">
        <p class="muted" style="margin-bottom:14px">${owned.length} section${owned.length === 1 ? '' : 's'} in the register came from this file${
          files ? `, carrying ${files} uploaded PDF${files === 1 ? '' : 's'}` : ''}.</p>
        <button class="choice-btn" onclick="closePdf();removeSpec('${specId}', false)">
          <b>Remove the file, keep the sections</b>
          <span>Statuses, uploads and notes stay. The sections lose their page references until you import the spec again.</span>
        </button>
        <button class="choice-btn danger" onclick="closePdf();removeSpec('${specId}', true)">
          <b>Remove the file and its ${owned.length} section${owned.length === 1 ? '' : 's'}</b>
          <span>Deletes ${files ? `the ${files} uploaded PDF${files === 1 ? '' : 's'} and ` : ''}everything logged against them.</span>
        </button>
      </div>
      <div class="modal-foot"><button class="btn" onclick="closePdf()">Cancel</button></div>
    </div></div>`;
}

async function removeSpec(specId, dropSections) {
  const sp = specById(specId);
  if (!sp) return;
  beginJobEdit();
  const owned = sectionsFromSpec(specId);
  stickyToast(`Removing ${sp.name}…`);
  let keptSections = [];
  if (dropSections) {
    for (const s of owned) {
      for (const d of (s.submittals || []).concat(s.responses || [])) await deleteStoredFile(d.fileId);
    }
    const gone = new Set(owned.map(s => s.key));
    job.sections = job.sections.filter(s => !gone.has(s.key));
  } else {
    for (const s of owned) { s.specId = null; s.startPage = null; s.endPage = null; }
    keptSections = owned;
  }
  await deleteStoredFile(sp.fileId);
  job.specs = job.specs.filter(x => x.id !== specId);
  closeDrawer();
  renderJob();
  try {
    if (dropSections) await deleteSectionDocs(job.id, owned.map(s => s.key));
    else await saveSections(keptSections);
    await saveJobMeta();
  } catch (e) { toast(writeError(e), true); return; }
  finally { endJobEdit(); }
  toast(dropSections ? `Removed ${sp.name} and ${owned.length} section${owned.length === 1 ? '' : 's'}`
                     : `Removed ${sp.name}`);
}

/* ═══════════════════════════════════════════════════════════════════════════
   9. SPEC IMPORT
   ═══════════════════════════════════════════════════════════════════════════ */
/* Specs often arrive split — Division 22 in one PDF, Division 23 in another.
   Several files can be picked at once and are reviewed one after the other. */
let importQueue = [];
let importTotal = 0;

function promptImportSpec() {
  if (!job) return;
  const inp = document.createElement('input');
  inp.type = 'file';
  inp.accept = 'application/pdf,.pdf';
  inp.multiple = true;
  inp.onchange = () => {
    importQueue = Array.from(inp.files);
    importTotal = importQueue.length;
    nextImport();
  };
  inp.click();
}

function nextImport() {
  const file = importQueue.shift();
  if (file) importSpec(file);
  else { importTotal = 0; closePdf(); }
}

function cancelImport() {
  importQueue = []; importTotal = 0; pendingImport = null;
  closePdf();
}

function queueLabel() {
  if (importTotal < 2) return '';
  return ` · file ${importTotal - importQueue.length} of ${importTotal}`;
}

function importModal(inner) {
  $('modalHost').innerHTML = `<div class="modal-scrim"><div class="modal">${inner}</div></div>`;
}

async function importSpec(file) {
  if (!window.pdfjsLib) { toast('The PDF engine did not load — check the connection and reload', true); return; }
  importModal(`
    <div class="modal-head"><h3>Reading ${esc(file.name)}${queueLabel()}</h3></div>
    <div class="modal-body">
      <div id="impStep" class="muted">Opening the PDF…</div>
      <div class="progress"><div id="impBar"></div></div>
    </div>`);

  const step = (t, pct) => {
    const a = $('impStep'), b = $('impBar');
    if (a) a.textContent = t;
    if (b) b.style.width = Math.round(pct * 100) + '%';
  };
  const yieldUi = () => new Promise(r => setTimeout(r, 0));

  try {
    const buf = await file.arrayBuffer();
    const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
    const pages = [];
    for (let i = 1; i <= pdf.numPages; i++) {
      const pg = await pdf.getPage(i);
      const tc = await pg.getTextContent();
      pages.push({ num: i, lines: pageItemsToLines(tc.items) });
      pg.cleanup();
      if (i % 15 === 0 || i === pdf.numPages) {
        step(`Reading page ${i} of ${pdf.numPages}…`, i / pdf.numPages * 0.9);
        await yieldUi();
      }
    }
    step('Splitting Divisions 22 and 23…', 0.95);
    await yieldUi();

    const result = parseSpec(pages);
    if (!result.sections.length) {
      importModal(`<div class="modal-head"><h3>No Division 22 or 23 sections found</h3></div>
        <div class="modal-body"><p>Nothing in <b>${esc(file.name)}</b> looked like a Division 22 or 23 spec section.</p>
        <p class="muted" style="margin-top:10px">If the PDF is a scan, the text has to be OCR'd first. You can also add sections by hand.</p></div>
        <div class="modal-foot"><button class="btn" onclick="nextImport()">${importQueue.length ? 'Next file' : 'Close'}</button></div>`);
      return;
    }
    showImportReview(file, pages.length, result);
  } catch (e) {
    console.error(e);
    importModal(`<div class="modal-head"><h3>Could not read that PDF</h3></div>
      <div class="modal-body"><p class="muted">${esc(String(e && e.message || e))}</p></div>
      <div class="modal-foot"><button class="btn" onclick="nextImport()">${importQueue.length ? 'Next file' : 'Close'}</button></div>`);
  }
}

let pendingImport = null;
function showImportReview(file, pageCount, result) {
  pendingImport = { file, pageCount, result };
  const existing = new Set(sectionsOf(job).map(s => s.key));
  const fresh = result.sections.filter(s => !existing.has(s.key));
  const dupes = result.sections.filter(s => existing.has(s.key));

  let rows = '';
  for (const d of DIVISIONS) {
    const list = fresh.filter(s => s.division === d);
    if (!list.length) continue;
    rows += `<div class="review-row review-head"><span class="rn">Div ${d}</span>
      <span class="rt">${esc(DIVISION_NAMES[d])} — ${list.length} section${list.length === 1 ? '' : 's'}</span></div>`;
    for (const s of list) {
      rows += `<div class="review-row">
        <input type="checkbox" checked data-key="${esc(s.key)}" data-mode="add">
        <span class="rn">${esc(s.number)}</span>
        <span class="rt">${esc(s.title || '(untitled)')}</span>
        ${s.inBody ? '' : '<span class="flag">Index only</span>'}
      </div>`;
    }
  }
  // Same section in two files — a revised issue or an addendum. Re-pointing keeps
  // the log (status, uploads, notes) and refreshes only what came from the PDF.
  if (dupes.length) {
    rows += `<div class="review-row review-head"><span class="rn">Already in</span>
      <span class="rt">the register — tick to re-point at this file</span></div>`;
    for (const s of dupes) {
      const cur = sectionsOf(job).find(x => x.key === s.key);
      const from = cur && cur.specId ? specById(cur.specId) : null;
      rows += `<div class="review-row">
        <input type="checkbox" data-key="${esc(s.key)}" data-mode="update">
        <span class="rn">${esc(s.number)}</span>
        <span class="rt">${esc(s.title || '(untitled)')}${from ? ' — now from ' + esc(from.name) : ''}</span>
      </div>`;
    }
  }

  const already = specsOf(job).length;
  const dupName = specsOf(job).find(sp => sp.name === file.name);
  importModal(`
    <div class="modal-head"><h3>Found ${result.sections.length} spec section${result.sections.length === 1 ? '' : 's'}${queueLabel()}</h3></div>
    <div class="modal-body">
      <div class="muted">${esc(file.name)} · ${pageCount} pages · ${result.diagnostics.pagesMapped} pages matched to a section${
        result.diagnostics.tocEntries ? ' · table of contents cross-checked' : ''}</div>
      ${already ? `<div class="muted" style="margin-top:5px">Adding alongside ${already} spec file${already === 1 ? '' : 's'} already in this job.</div>` : ''}
      ${dupName ? `<div class="notice" style="margin-top:10px;margin-bottom:0">
        <span>A file named <b>${esc(file.name)}</b> is already in this job. Importing again will store a second copy.</span></div>` : ''}
      <div class="review-list">${rows || '<div class="review-row"><span class="rt muted">Nothing new — every section in this file is already in the register.</span></div>'}</div>
    </div>
    <div class="modal-foot">
      <button class="btn" onclick="cancelImport()">Cancel${importQueue.length ? ' all' : ''}</button>
      <button class="btn primary" onclick="confirmImport()">${
        fresh.length ? `Add ${fresh.length} section${fresh.length === 1 ? '' : 's'}` : 'Add spec file'}${
        importQueue.length ? ' &amp; continue' : ''}</button>
    </div>`);
}

async function confirmImport() {
  if (!pendingImport) return;
  beginJobEdit();
  const { file, pageCount, result } = pendingImport;
  const ticked = Array.from(document.querySelectorAll('.review-row input[type=checkbox]')).filter(c => c.checked);
  const chosen = new Set(ticked.filter(c => c.dataset.mode === 'add').map(c => c.dataset.key));
  const relink = new Set(ticked.filter(c => c.dataset.mode === 'update').map(c => c.dataset.key));

  importModal(`<div class="modal-head"><h3>Uploading ${esc(file.name)}</h3></div>
    <div class="modal-body"><div class="muted" id="upStep">Sending the spec PDF to the shared workspace…</div>
    <div class="progress"><div id="upBar"></div></div></div>`);

  try {
    const specId = uid('spec');
    const fileId = await putFile(file, { jobId: job.id, kind: 'spec' }, pct => {
      const bar = $('upBar'), step = $('upStep');
      if (bar) bar.style.width = Math.round(pct * 100) + '%';
      if (step) step.textContent = `Uploading… ${Math.round(pct * 100)}%`;
    });
    job.specs = job.specs || [];
    job.specs.push({ id: specId, name: file.name, pages: pageCount, size: file.size,
      fileId, added: Date.now() });

    const existing = new Set(sectionsOf(job).map(s => s.key));
    let added = 0, updated = 0;
    for (const s of result.sections) {
      if (relink.has(s.key)) {
        const cur = sectionsOf(job).find(x => x.key === s.key);
        if (cur) {
          cur.specId = specId;
          cur.startPage = s.startPage; cur.endPage = s.endPage; cur.inBody = s.inBody;
          cur.requirements = s.requirements || []; cur.includes = s.includes || [];
          if (!cur.titleEdited) {                       // never clobber a hand-typed title
            cur.title = s.title; cur.rawTitle = s.rawTitle; cur.titleSource = s.titleSource;
          }
          updated++;
        }
        continue;
      }
      if (!chosen.has(s.key) || existing.has(s.key)) continue;
      job.sections.push(newSectionRecord({
        key: s.key, number: s.number, division: s.division, title: s.title, rawTitle: s.rawTitle,
        titleSource: s.titleSource, specId, startPage: s.startPage, endPage: s.endPage,
        inBody: s.inBody, requirements: s.requirements || [], includes: s.includes || []
      }));
      added++;
    }
    sortSections();
    await saveSections(sectionsOf(job).filter(x => x.specId === specId));
    await saveJobMeta();
    if (!sectionsOf(job).some(x => x.division === divFilter)) {
      divFilter = DIVISIONS.find(d => sectionsOf(job).some(x => x.division === d)) || divFilter;
    }
    renderJob();
    const bits = [];
    if (added) bits.push(`${added} section${added === 1 ? '' : 's'} imported`);
    if (updated) bits.push(`${updated} re-pointed at this file`);
    toast(bits.length ? bits.join(' · ') : `${file.name} added`);
    nextImport();                        // review the next queued file, or close
  } catch (e) {
    console.error(e);
    importModal(`<div class="modal-head"><h3>Could not save</h3></div>
      <div class="modal-body"><p>${esc(storageError(e))}</p></div>
      <div class="modal-foot"><button class="btn" onclick="cancelImport()">Close</button></div>`);
  } finally {
    pendingImport = null;
    endJobEdit();
  }
}

/* ═══════════════════════════════════════════════════════════════════════════
   10. CSV EXPORT
   ═══════════════════════════════════════════════════════════════════════════ */
function csvCell(v) {
  const s = String(v == null ? '' : v);
  return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}
function exportCsv() {
  if (!job) return;
  const head = ['Division', 'Section', 'Title', 'Status', 'Vendor', 'Package', 'Sent to GC',
    'Returned', 'Submittal files', 'Response files', 'Spec file', 'Spec pages', 'Notes'];
  const rows = sectionsOf(job).map(s => [
    s.division, s.number, s.title, (ST[s.status || 'not_started'] || {}).label,
    s.vendor || '', s.package || '', s.submittedDate || '', s.returnedDate || '',
    (s.submittals || []).map(d => d.name).join(' | '),
    (s.responses || []).map(d => d.name).join(' | '),
    (s.specId && specById(s.specId) ? specById(s.specId).name : ''),
    s.startPage ? (s.startPage + (s.endPage && s.endPage !== s.startPage ? '-' + s.endPage : '')) : '',
    (s.notes || '').replace(/\s+/g, ' ')
  ]);
  const csv = [head, ...rows].map(r => r.map(csvCell).join(',')).join('\r\n');
  const url = URL.createObjectURL(new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8' }));
  const a = document.createElement('a');
  a.href = url;
  a.download = job.name.replace(/[^\w\- ]+/g, '').trim().replace(/\s+/g, '_') + '_submittal_register.csv';
  a.click();
  setTimeout(() => URL.revokeObjectURL(url), 20000);
}

/* ═══════════════════════════════════════════════════════════════════════════
   11. THEME + BOOT
   ═══════════════════════════════════════════════════════════════════════════ */
function applyTheme(t) {
  document.documentElement.dataset.theme = t;
  localStorage.setItem('sr_theme', t);
}
function toggleTheme() {
  applyTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');
}
applyTheme(localStorage.getItem('sr_theme') ||
  (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if ($('modalHost').innerHTML) closePdf();
    else if (openKey) { closeDrawer(); renderTable(); }
  }
});

(async function boot() {
  go('jobs');
  const ready = await Promise.race([
    fbReady(),
    new Promise(res => setTimeout(() => res(null), 15000))
  ]);
  if (!ready) {
    setSync('error', ' — the Firebase library did not load. Check the connection and reload.');
    renderJobs();
    return;
  }
  FB = ready;
  watchJobs();
})();
</script>
