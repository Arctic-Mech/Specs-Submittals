      <div class="modal-foot"><button class="btn" onclick="closePdf()">Cancel</button></div>
    </div></div>`;
}

async function removeSpec(specId, dropSections) {
  const sp = specById(specId);
  if (!sp) return;
  beginJobEdit();
  const owned = sectionsFromSpec(specId);
  stickyToast(`Removing ${sp.name}…`);
  let keptSections = [];
  if (dropSections) {
    for (const s of owned) {
      for (const d of (s.submittals || []).concat(s.responses || [])) {
        if (!isLink(d)) await deleteStoredDoc(d);
      }
    }
    const gone = new Set(owned.map(s => s.key));
    job.sections = job.sections.filter(s => !gone.has(s.key));
  } else {
    for (const s of owned) { s.specId = null; s.startPage = null; s.endPage = null; }
    keptSections = owned;
  }
  await deleteStoredDoc(sp);
  job.specs = job.specs.filter(x => x.id !== specId);
  closeDrawer();
  renderJob();
  try {
    if (dropSections) await deleteSectionDocs(job.id, owned.map(s => s.key));
    else await saveSections(keptSections);
    await saveJobMeta();
  } catch (e) { toast(writeError(e), true); return; }
  finally { endJobEdit(); }
  toast(dropSections ? `Removed ${sp.name} and ${owned.length} section${owned.length === 1 ? '' : 's'}`
                     : `Removed ${sp.name}`);
}

/* ═══════════════════════════════════════════════════════════════════════════
   9. SPEC IMPORT
   ═══════════════════════════════════════════════════════════════════════════ */
/* Specs often arrive split — Division 22 in one PDF, Division 23 in another.
   Several files can be picked at once and are reviewed one after the other. */
let importQueue = [];
let importTotal = 0;

function promptImportSpec() {
  if (!job) return;
  const inp = document.createElement('input');
  inp.type = 'file';
  inp.accept = 'application/pdf,.pdf';
  inp.multiple = true;
  inp.onchange = () => {
    importQueue = Array.from(inp.files);
    importTotal = importQueue.length;
    nextImport();
  };
  inp.click();
}

function nextImport() {
  const file = importQueue.shift();
  if (file) importSpec(file);
  else { importTotal = 0; closePdf(); }
}

function cancelImport() {
  importQueue = []; importTotal = 0; pendingImport = null;
  closePdf();
}

function queueLabel() {
  if (importTotal < 2) return '';
  return ` · file ${importTotal - importQueue.length} of ${importTotal}`;
}

function importModal(inner) {
  $('modalHost').innerHTML = `<div class="modal-scrim"><div class="modal">${inner}</div></div>`;
}

async function importSpec(file) {
  importModal(`
    <div class="modal-head"><h3>Reading ${esc(file.name)}${queueLabel()}</h3></div>
    <div class="modal-body">
      <div id="impStep" class="muted">Loading the PDF engine…</div>
      <div class="progress"><div id="impBar"></div></div>
    </div>`);
  try {
    await loadPdfJs();
  } catch (e) {
    importModal(`<div class="modal-head"><h3>Could not read that PDF</h3></div>
      <div class="modal-body"><p class="muted">${esc(String(e.message || e))} — check the connection and try again.</p></div>
      <div class="modal-foot"><button class="btn" onclick="cancelImport()">Close</button></div>`);
    return;
  }

  const step = (t, pct) => {
    const a = $('impStep'), b = $('impBar');
    if (a) a.textContent = t;
    if (b) b.style.width = Math.round(pct * 100) + '%';
  };
  const yieldUi = () => new Promise(r => setTimeout(r, 0));

  try {
    const buf = await file.arrayBuffer();
    const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
    const pages = [];
    for (let i = 1; i <= pdf.numPages; i++) {
      const pg = await pdf.getPage(i);
      const tc = await pg.getTextContent();
      pages.push({ num: i, lines: pageItemsToLines(tc.items) });
      pg.cleanup();
      if (i % 15 === 0 || i === pdf.numPages) {
        step(`Reading page ${i} of ${pdf.numPages}…`, i / pdf.numPages * 0.9);
        await yieldUi();
      }
    }
    step('Splitting Divisions 22 and 23…', 0.95);
    await yieldUi();

    const result = parseSpec(pages);
    if (!result.sections.length) {
      importModal(`<div class="modal-head"><h3>No Division 22 or 23 sections found</h3></div>
        <div class="modal-body"><p>Nothing in <b>${esc(file.name)}</b> looked like a Division 22 or 23 spec section.</p>
        <p class="muted" style="margin-top:10px">If the PDF is a scan, the text has to be OCR'd first. You can also add sections by hand.</p></div>
        <div class="modal-foot"><button class="btn" onclick="nextImport()">${importQueue.length ? 'Next file' : 'Close'}</button></div>`);
      return;
    }
    showImportReview(file, pages.length, result);
  } catch (e) {
    console.error(e);
    importModal(`<div class="modal-head"><h3>Could not read that PDF</h3></div>
      <div class="modal-body"><p class="muted">${esc(String(e && e.message || e))}</p></div>
      <div class="modal-foot"><button class="btn" onclick="nextImport()">${importQueue.length ? 'Next file' : 'Close'}</button></div>`);
  }
}

let pendingImport = null;
function showImportReview(file, pageCount, result) {
  pendingImport = { file, pageCount, result };
  const existing = new Set(sectionsOf(job).map(s => s.key));
  const fresh = result.sections.filter(s => !existing.has(s.key));
  const dupes = result.sections.filter(s => existing.has(s.key));

  let rows = '';
  for (const d of DIVISIONS) {
    const list = fresh.filter(s => s.division === d);
    if (!list.length) continue;
    rows += `<div class="review-row review-head"><span class="rn">Div ${d}</span>
      <span class="rt">${esc(DIVISION_NAMES[d])} — ${list.length} section${list.length === 1 ? '' : 's'}</span></div>`;
    for (const s of list) {
      rows += `<div class="review-row">
        <input type="checkbox" checked data-key="${esc(s.key)}" data-mode="add">
        <span class="rn">${esc(s.number)}</span>
        <span class="rt">${esc(s.title || '(untitled)')}</span>
        ${s.inBody ? '' : '<span class="flag">Index only</span>'}
      </div>`;
    }
  }
  // Same section in two files — a revised issue or an addendum. Re-pointing keeps
  // the log (status, uploads, notes) and refreshes only what came from the PDF.
  if (dupes.length) {
    rows += `<div class="review-row review-head"><span class="rn">Already in</span>
      <span class="rt">the register — tick to re-point at this file</span></div>`;
    for (const s of dupes) {
      const cur = sectionsOf(job).find(x => x.key === s.key);
      const from = cur && cur.specId ? specById(cur.specId) : null;
      rows += `<div class="review-row">
        <input type="checkbox" data-key="${esc(s.key)}" data-mode="update">
        <span class="rn">${esc(s.number)}</span>
        <span class="rt">${esc(s.title || '(untitled)')}${from ? ' — now from ' + esc(from.name) : ''}</span>
      </div>`;
    }
  }

  const already = specsOf(job).length;
  const dupName = specsOf(job).find(sp => sp.name === file.name);
  importModal(`
    <div class="modal-head"><h3>Found ${result.sections.length} spec section${result.sections.length === 1 ? '' : 's'}${queueLabel()}</h3></div>
    <div class="modal-body">
      <div class="muted">${esc(file.name)} · ${pageCount} pages · ${result.diagnostics.pagesMapped} pages matched to a section${
        result.diagnostics.tocEntries ? ' · table of contents cross-checked' : ''}</div>
      ${already ? `<div class="muted" style="margin-top:5px">Adding alongside ${already} spec file${already === 1 ? '' : 's'} already in this job.</div>` : ''}
      ${dupName ? `<div class="notice" style="margin-top:10px;margin-bottom:0">
        <span>A file named <b>${esc(file.name)}</b> is already in this job. Importing again will store a second copy.</span></div>` : ''}
      <div class="review-list">${rows || '<div class="review-row"><span class="rt muted">Nothing new — every section in this file is already in the register.</span></div>'}</div>
    </div>
    <div class="modal-foot">
      <button class="btn" onclick="cancelImport()">Cancel${importQueue.length ? ' all' : ''}</button>
      <button class="btn primary" onclick="confirmImport()">${
        fresh.length ? `Add ${fresh.length} section${fresh.length === 1 ? '' : 's'}` : 'Add spec file'}${
        importQueue.length ? ' &amp; continue' : ''}</button>
    </div>`);
}

async function confirmImport() {
  if (!pendingImport) return;
  // The spec PDF is saved into the job's ShareFile folder — load it first.
  if (!jobFolder) { if (!(await ensureJobFolder())) { toast('Load this job’s ShareFile folder to store the spec PDF', true); return; } }
  beginJobEdit();
  const { file, pageCount, result } = pendingImport;
  const ticked = Array.from(document.querySelectorAll('.review-row input[type=checkbox]')).filter(c => c.checked);
  const chosen = new Set(ticked.filter(c => c.dataset.mode === 'add').map(c => c.dataset.key));
  const relink = new Set(ticked.filter(c => c.dataset.mode === 'update').map(c => c.dataset.key));

  importModal(`<div class="modal-head"><h3>Saving ${esc(file.name)}</h3></div>
    <div class="modal-body"><div class="muted" id="upStep">Saving the spec PDF to the ShareFile folder…</div>
    <div class="progress"><div id="upBar"></div></div></div>`);

  try {
    const specId = uid('spec');
    const step = $('upStep'), bar = $('upBar');
    if (bar) bar.style.width = '60%';
    const { dir, file: onDisk } = await putFile(file, 'spec');   // files/Specs/<name>
    if (bar) bar.style.width = '100%';
    if (step) step.textContent = 'Saved. Filing the sections…';
    job.specs = job.specs || [];
    job.specs.push({ id: specId, name: file.name, pages: pageCount, size: file.size,
      dir, file: onDisk, added: Date.now() });

    const existing = new Set(sectionsOf(job).map(s => s.key));
    const relinked = [];
    let added = 0, updated = 0;
    for (const s of result.sections) {
      if (relink.has(s.key)) {
        const cur = sectionsOf(job).find(x => x.key === s.key);
        if (cur) {
          cur.specId = specId;
          cur.startPage = s.startPage; cur.endPage = s.endPage; cur.inBody = s.inBody;
          cur.requirements = s.requirements || []; cur.includes = s.includes || [];
          const fresh = (s.autoTags || []).filter(t => !(cur.autoTags || []).includes(t));
          cur.tags = (cur.tags || []).concat(fresh.filter(t => !(cur.tags || []).includes(t)));
          cur.autoTags = (s.autoTags || []).slice();
          relinked.push(cur);
          if (!cur.titleEdited) {                       // never clobber a hand-typed title
            cur.title = s.title; cur.rawTitle = s.rawTitle; cur.titleSource = s.titleSource;
          }
          updated++;
        }
        continue;
      }
      if (!chosen.has(s.key) || existing.has(s.key)) continue;
      job.sections.push(newSectionRecord({
        key: s.key, number: s.number, division: s.division, title: s.title, rawTitle: s.rawTitle,
        titleSource: s.titleSource, specId, startPage: s.startPage, endPage: s.endPage,
        inBody: s.inBody, requirements: s.requirements || [], includes: s.includes || [],
        tags: (s.tags || []).slice(), autoTags: (s.autoTags || []).slice()
      }));
      added++;
    }
    sortSections();
    const mine = sectionsOf(job).filter(x => x.specId === specId);
    await saveSpecData(job.id, mine.concat(relinked));   // spec text first, then the log rows
    await saveSections(mine);
    await saveJobMeta();
    if (!sectionsOf(job).some(x => x.division === divFilter)) {
      divFilter = DIVISIONS.find(d => sectionsOf(job).some(x => x.division === d)) || divFilter;
    }
    renderJob();
    const bits = [];
    if (added) bits.push(`${added} section${added === 1 ? '' : 's'} imported`);
    if (updated) bits.push(`${updated} re-pointed at this file`);
    noteFolderChanged();
    toast(bits.length ? bits.join(' · ') : `${file.name} added`);
    nextImport();                        // review the next queued file, or close
  } catch (e) {
    console.error(e);
    importModal(`<div class="modal-head"><h3>Could not save</h3></div>
      <div class="modal-body"><p>${esc(storageError(e))}</p></div>
      <div class="modal-foot"><button class="btn" onclick="cancelImport()">Close</button></div>`);
  } finally {
    pendingImport = null;
    endJobEdit();
  }
}

/* ═══════════════════════════════════════════════════════════════════════════
   10. CSV EXPORT
   ═══════════════════════════════════════════════════════════════════════════ */
function csvCell(v) {
  const s = String(v == null ? '' : v);
  return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}
/* US-format dates for the CSV a GC will open in Excel. */
function csvDate(iso) {
  const m = String(iso || '').match(/^(\d{4})-(\d{2})-(\d{2})/);
  return m ? `${+m[2]}/${+m[3]}/${m[1]}` : (iso || '');
}
function csvWindow(w) {
  if (!w || !w.from) return '';
  return (w.to && w.to > w.from) ? `${csvDate(w.from)} – ${csvDate(w.to)}` : csvDate(w.from);
}
/* A clean submittal register — title block, grouped by division, readable dates
   and release notes — suitable to send to a GC. */
function buildCsv() {
  const L = [];
  const push = arr => L.push((arr || []).map(csvCell).join(','));
  const secs = sectionsOf(job).slice().sort(sectionOrder);

  push(['SUBMITTAL REGISTER']);
  push(['Project:', job.name || '']);
  if (job.number) push(['Job No.:', job.number]);
  push(['Divisions:', jobDivisions().map(d => d + (DIVISION_NAMES[d] ? ' — ' + DIVISION_NAMES[d] : '')).join(', ')]);
  push(['Date:', csvDate(today())]);
  push(['Total sections:', String(secs.length)]);
  push([]);

  push(['Spec Section', 'Title', 'Description', 'Manufacturer', 'Vendor / Supplier', 'Submittal No.',
    'Status', 'Date to GC', 'Date Returned', 'Lead Time', 'Anticipated Delivery',
    'Released', 'Delivered']);

  let lastDiv = null;
  for (const s of secs) {
    if (s.division !== lastDiv) {
      lastDiv = s.division;
      push([`DIVISION ${s.division}${DIVISION_NAMES[s.division] ? ' — ' + DIVISION_NAMES[s.division].toUpperCase() : ''}`]);
    }
    const rels = s.releases || [];
    const released = rels.length
      ? rels.map(r => {
          const p = [r.label];
          if (r.date) p.push('released ' + csvDate(r.date));
          if (r.expected) p.push('due ' + csvWindow({ from: r.expected, to: r.expectedTo }));
          if (r.delivered) p.push('delivered');
          return p.join(', ');
        }).join('  |  ')
      : (relOf(s).id === 'ready' ? 'Ready to release' : relOf(s).id === 'na' ? 'N/A' : '');
    const delivered = rels.length
      ? (rels.every(r => r.delivered) ? 'All delivered'
        : rels.some(r => r.delivered) ? `${rels.filter(r => r.delivered).length} of ${rels.length}` : '')
      : '';
    push([
      s.number, s.title || '', s.description || '', s.manufacturer || s.spec || '', s.vendor || '', s.package || '',
      (ST[s.status || 'not_started'] || {}).label,
      csvDate(s.submittedDate), csvDate(s.returnedDate),
      leadLabel(s.leadWeeks) || '',
      csvWindow(expectedWindow(s)),
      released, delivered
    ]);
  }
  return L.join('\r\n');
}
function jobFileBase() {
  return (job.name || 'job').replace(/[^\w\- ]+/g, '').trim().replace(/\s+/g, '_') || 'job';
}
function exportCsv() {
  if (!job) return;
  const url = URL.createObjectURL(new Blob(['﻿' + buildCsv()], { type: 'text/csv;charset=utf-8' }));
  const a = document.createElement('a');
  a.href = url;
  a.download = jobFileBase() + '_submittal_register.csv';
  a.click();
  setTimeout(() => URL.revokeObjectURL(url), 20000);
}

async function ensureJsPDF() {
  const ready = () => window.jspdf && window.jspdf.jsPDF && window.jspdf.jsPDF.API && window.jspdf.jsPDF.API.autoTable;
  if (ready()) return window.jspdf;
  const load = src => new Promise((res, rej) => {
    const s = document.createElement('script'); s.src = src;
    s.onload = res; s.onerror = () => rej(new Error('Could not load the PDF library — check the connection and try again.'));
    document.head.appendChild(s);
  });
  if (!(window.jspdf && window.jspdf.jsPDF)) await load('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
  if (!window.jspdf.jsPDF.API.autoTable) await load('https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js');
  return window.jspdf;
}

  doc.text(String(job.name || ''), x, 56);
  doc.setFont('helvetica', 'normal'); doc.setFontSize(8.5); doc.setTextColor(110, 116, 128);
  const meta = [];
  if (job.number) meta.push('Job No. ' + job.number);

  if (divs) meta.push('Div ' + divs);

  doc.text('ARCTIC MECHANICAL', pageW - M, 34, { align: 'right' });

function exportPdf() {
  if (!job) return;
  stickyToast('Building the PDF register…');
  ensureJsPDF().then(jspdf => {
    const doc = new jspdf.jsPDF({ orientation: 'landscape', unit: 'pt', format: 'letter' });
    const pageW = doc.internal.pageSize.getWidth(), pageH = doc.internal.pageSize.getHeight(), M = 34;
    const secs = sectionsOf(job).slice().sort(sectionOrder);

    const body = [];
    let lastDiv = null;
    for (const s of secs) {
      if (s.division !== lastDiv) {
        lastDiv = s.division;
        body.push([{ content: `DIVISION ${s.division}${DIVISION_NAMES[s.division] ? ' — ' + DIVISION_NAMES[s.division].toUpperCase() : ''}`,
          colSpan: head[0].length, styles: { fillColor: ARCTIC_BLUE, textColor: [255, 255, 255], fontStyle: 'bold', fontSize: 8.5, halign: 'left' } }]);
      }
      const st = ST[s.status || 'not_started'] || {};
      const rels = s.releases || [];
      const released = rels.length
        ? rels.map(r => { const p = [r.label]; if (r.date) p.push('rel ' + csvDate(r.date)); if (r.expected) p.push('due ' + csvWindow({ from: r.expected, to: r.expectedTo })); if (r.delivered) p.push('delivered'); return p.join(', '); }).join('\n')
        : (relOf(s).id === 'ready' ? 'Ready to release' : relOf(s).id === 'na' ? 'N/A' : '');

function exportCoLog() {

    const doc = new jspdf.jsPDF({ orientation: 'landscape', unit: 'pt', format: 'letter' });

    const rows = list.map(c => {

/* Load JSZip on demand (only used by the responses export). */
async function ensureJSZip() {
  if (window.JSZip) return window.JSZip;
  await new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js';
    s.onload = res; s.onerror = () => rej(new Error('Could not load the zip library — check the connection and try again.'));
    document.head.appendChild(s);
  });
  return window.JSZip;
}
/* Zip the most-recent response PDF of every submittal shown in the current
   filtered view — for sending a vendor exactly their returned responses. */
async function exportResponses() {
  if (!job) return;
  const picks = [];
  for (const s of visibleSections()) {
    const resp = (s.responses || []).filter(d => !isLink(d) && d.file);
    if (!resp.length) continue;
    resp.sort((a, b) => (b.uploaded || 0) - (a.uploaded || 0));
    picks.push({ s, doc: resp[0] });
  }
  if (!picks.length) { toast('No response PDFs in the current view to export', true); return; }
  if (!jobFolder) { if (!(await loadJobFolder())) return; }
  stickyToast(`Preparing ${picks.length} response${picks.length === 1 ? '' : 's'}…`);
  let JSZip;
  try { JSZip = await ensureJSZip(); } catch (e) { toast(e.message || 'Could not load the zip library', true); return; }
  const zip = new JSZip();
  let n = 0, missing = 0;
  for (const p of picks) {
    const blob = await readDocBlob(p.doc);
    if (!blob) { missing++; continue; }
    const base = `${p.s.number} ${p.s.title || ''}`.trim().replace(/[\/\\:*?"<>|]+/g, '_').slice(0, 80);
    const fname = sanitizeAnyName(base ? `${base} — ${p.doc.name}` : p.doc.name, p.doc.name);
    let name = fname, k = 2;
    while (zip.file(name)) name = fname.replace(/(\.[^.]+)?$/, ` (${k++})$1`);   // avoid collisions in the zip
    zip.file(name, await blob.arrayBuffer());
    n++;
  }
  if (!n) { toast('Could not read the response PDFs — make the folder available offline in ShareFile', true); return; }
  const out = await zip.generateAsync({ type: 'blob' });
  const url = URL.createObjectURL(out);
  const label = [statusFilter ? ST[statusFilter].label : '', releaseFilter ? RL[releaseFilter].label : '', query.trim()].filter(Boolean).join(' ');
  const a = document.createElement('a');
  a.href = url;
  a.download = sanitizeAnyName(`${jobFileBase()} responses${label ? ' - ' + label : ''} - ${today()}`, 'responses') + '.zip';
  a.click();
  setTimeout(() => URL.revokeObjectURL(url), 20000);
  toast(`Exported ${n} response PDF${n === 1 ? '' : 's'}${missing ? ` (${missing} couldn’t be read)` : ''}`);
}

/* Title-case single-line text fields when you leave them, so names, subjects,
   vendors and descriptions read officially. It runs in the capture phase, before
   the field's own onchange, so the capitalised text is what gets saved. Only the
   first letter of each word is touched (acronyms like VFD and codes like
   GC-RFI-042 keep their case); emails and URLs are left alone. Prose textareas,
   the search boxes and identifier / number / URL fields opt out. */
const NO_CAPS_IDS = new Set([
  'searchBox', 'rfiSearch', 'coSearch', 'tagInput',            // search + tags
  'rfiGc', 'rfiNum', 'coNum', 'coAmt', 'jfNumber', 'jfFolder', 'lkUrl',   // identifiers / numbers / URLs
  'noteInput', 'checkInput', 'rfiCheckInput', 'coCheckInput', 'lkNote'    // freeform prose — notes + action items
]);
function titleCaseWords(str) {
  return String(str).replace(/\S+/g, w => (/[@]|:\/\//.test(w) ? w : w.replace(/\p{L}/u, c => c.toUpperCase())));
}
function autoCapField(el) {
  if (!el || el.tagName !== 'INPUT') return;                    // single-line inputs only, not prose textareas
  if ((el.getAttribute('type') || 'text').toLowerCase() !== 'text') return;
  if (el.classList.contains('no-caps') || NO_CAPS_IDS.has(el.id)) return;
  const v = el.value;
  if (!v) return;
  const t = titleCaseWords(v);
  if (t !== v) el.value = t;
}
document.addEventListener('change', e => autoCapField(e.target), true);
document.addEventListener('input', e => { if (e.target.tagName === 'TEXTAREA' && e.target.classList.contains('autosize')) autosize(e.target); });

/* ═══════════════════════════════════════════════════════════════════════════
   12. PER-JOB SHAREFILE FOLDER (for PDFs)
   The register is in the cloud, but a job's PDFs live in a ShareFile folder you
   load. Each job keeps its own folder:

     <job folder>/job.json        marks which job the folder belongs to
     <job folder>/files/<id>.pdf  each submittal / response / spec PDF

   The folder handle is remembered per machine (IndexedDB). Loading it needs a
   user gesture and a single permission click; after that the job's PDFs open
   and upload straight to the folder. Nothing here touches the cloud register.
   ═══════════════════════════════════════════════════════════════════════════ */
const fsSupported = () => !!(window.showDirectoryPicker);

/* remember which folder went with which job, per machine */
const HANDLE_DB = 'sr_folder_handles';
function handleDb() {
  return new Promise((res, rej) => {
    let r;
    try { r = indexedDB.open(HANDLE_DB, 1); } catch (e) { return rej(e); }
    r.onupgradeneeded = () => { if (!r.result.objectStoreNames.contains('h')) r.result.createObjectStore('h'); };
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
function idbPut(db, key, val) {
  return new Promise((res) => {
    try {
      const tx = db.transaction('h', 'readwrite');
      tx.objectStore('h').put(val, key);
      tx.oncomplete = () => res(true);
      tx.onerror = () => res(false);      // mock handles aren't cloneable — non-fatal
      tx.onabort = () => res(false);
    } catch (e) { res(false); }
  });
}
function idbGet(db, key) {
  return new Promise((res) => {
    try {
      const g = db.transaction('h', 'readonly').objectStore('h').get(key);
      g.onsuccess = () => res(g.result);
      g.onerror = () => res(null);
    } catch (e) { res(null); }
  });
}
async function rememberHandle(jobId, handle) {
  try { const db = await handleDb(); await idbPut(db, 'job:' + jobId, { handle, name: (job && job.name) || '' }); }
  catch (e) { /* remembering is an optimisation, never required */ }
}
async function recallHandle(jobId) {
  try { const db = await handleDb(); const v = await idbGet(db, 'job:' + jobId);
    return v && v.handle ? v.handle : null; }
  catch (e) { return null; }
}
async function forgetHandle(jobId) {
  try { const db = await handleDb(); db.transaction('h', 'readwrite').objectStore('h').delete('job:' + jobId); } catch (e) {}
}

async function ensureRW(handle) {
  const opts = { mode: 'readwrite' };
  try {
    if ((await handle.queryPermission(opts)) === 'granted') return true;
    return (await handle.requestPermission(opts)) === 'granted';
  } catch (e) { return true; }          // shims without the permission API
}

/* The app's own files in the ShareFile folder are named so a coworker browsing
   the folder can see what they are and knows not to delete them. Old cryptic
   names are read for back-compat and migrated away. */
const MARKER_FILE      = 'The Dingus - job link (do not delete).json';
const MARKER_FILE_OLDS = ['ASM Job Tool - job link (do not delete).json', 'job.json'];
const REGISTER_JSON     = 'Submittal Register - data (do not delete).json';
const REGISTER_JSON_OLD = 'register.json';
const REGISTER_CSV      = 'Submittal Register.csv';
const REGISTER_CSV_OLD  = 'register.csv';
const FOLDER_README     = 'READ ME - do not delete.txt';
const LAUNCHER_FILE     = 'Open The Dingus.html';   // double-click in ShareFile to open the tool at this job (stays at the folder root)
const LINK_DIR          = 'Dingus data (do not delete)';   // the marker + register backup + READ ME live here, out of the way
const LINK_DIR_OLDS     = ['link to this folder'];         // earlier names — migrated into LINK_DIR on load
/* The internal subfolders a user should NOT pick when pairing (the browser can't
   step up to the parent, so pairing one of these can never reach the job's files). */
function isInternalFolderPick(name) {
  const n = String(name || '').trim().toLowerCase();
  return n === 'files' || n === LINK_DIR.toLowerCase() || LINK_DIR_OLDS.some(o => o.toLowerCase() === n);
}
async function linkDirHandle(handle) { return (handle || jobFolder).getDirectoryHandle(LINK_DIR, { create: true }); }
/* Move a bookkeeping file from `srcHandle` into the link folder (used to migrate
   existing folders). No-op if it isn't there. */
async function moveToLink(srcHandle, ld, srcName, destName) {
  let srcFh; try { srcFh = await srcHandle.getFileHandle(srcName); } catch (e) { return; }   // not present → nothing to move
  try {
    let hasDest = true; try { await ld.getFileHandle(destName); } catch (e) { hasDest = false; }
    if (!hasDest) { const blob = await srcFh.getFile(); const df = await ld.getFileHandle(destName, { create: true }); const w = await df.createWritable(); await w.write(blob); await w.close(); }
    await srcHandle.removeEntry(srcName);
  } catch (e) {}
}

async function fileText(handle, name) {
  try { return await (await (await handle.getFileHandle(name)).getFile()).text(); } catch (e) { return null; }
}
/* Write only when the content differs, so opening a folder doesn't churn
   ShareFile with identical re-syncs. */
async function writeIfChanged(handle, name, text, type) {
  if ((await fileText(handle, name)) === text) return;
  const fh = await handle.getFileHandle(name, { create: true });
  const w = await fh.createWritable();
  await w.write(new Blob([text], { type: type || 'text/plain' }));
  await w.close();
}

/* the marker file that ties a folder to a job — now in "link to this folder/",
   with a fallback to the folder root for the old layout. */
async function readJobMarker(handle) {
  const places = [];
  for (const dir of [LINK_DIR, ...LINK_DIR_OLDS]) { try { places.push(await handle.getDirectoryHandle(dir)); } catch (e) {} }
  places.push(handle);
  for (const h of places) for (const name of [MARKER_FILE, ...MARKER_FILE_OLDS]) {
    try { const t = await (await (await h.getFileHandle(name)).getFile()).text(); if (t && t.trim()) return JSON.parse(t); } catch (e) {}
  }
  return null;
}
async function writeJobMarker(handle, j) {
  try {
    const payload = JSON.stringify({
      tool: 'The Dingus', id: j.id, name: j.name,
      note: 'This file links this ShareFile folder to a job in The Dingus. Please do not delete or rename it, or the tool will lose track of this folder.'
    }, null, 2);
    await writeIfChanged(handle, MARKER_FILE, payload, 'application/json');
    for (const old of MARKER_FILE_OLDS) { try { await handle.removeEntry(old); } catch (e) {} }   // retire old names
  } catch (e) { /* non-fatal */ }
}
/* A double-clickable launcher in the folder that opens The Dingus at this job. A
   .url shortcut is blocked by the browser's file API, so this is a tiny HTML
   redirect to the hosted app. */
function launcherHtml(jobId) {
  const base = location.origin + location.pathname;
  const url = base + (jobId ? '?job=' + encodeURIComponent(jobId) : '');
  const u = JSON.stringify(url);
  return '<!doctype html><meta charset="utf-8"><title>Open The Dingus</title>' +
    '<meta http-equiv="refresh" content="0; url=' + url.replace(/"/g, '&quot;') + '">' +
    '<scr' + 'ipt>location.replace(' + u + ')<\/scr' + 'ipt>' +
    '<body style="font-family:system-ui;padding:2rem;font-size:15px">Opening The Dingus… ' +
    '<a href="' + url.replace(/"/g, '&quot;') + '">click here</a> if it doesn’t open.';
}
async function writeLauncher(handle, j) { try { await writeIfChanged(handle, LAUNCHER_FILE, launcherHtml(j && j.id), 'text/html'); } catch (e) {} }
function folderReadmeText() {
  return [
    'THE DINGUS — PLEASE DON’T DELETE OR RENAME ANYTHING IN THIS FOLDER',
    '==================================================================',
    '',
    'This ShareFile folder belongs to a job in The Dingus',
    '(arctic-mech.github.io/Specs-Submittals). It holds this job’s submittal, RFI',
    'and change-order PDFs, plus the data that ties them to the register.',
    '',
    'What’s in here:',
    '  • "' + LAUNCHER_FILE + '"',
    '        double-click this to open The Dingus at this job.',
    '  • the "' + LINK_DIR + '" folder — the tool’s bookkeeping (do not delete):',
    '        "' + MARKER_FILE + '"  links this folder to the job in the tool.',
    '        "' + REGISTER_JSON + '"  a backup copy of the register data.',
    '        "' + REGISTER_CSV + '"  the register as a spreadsheet you can open or send.',
    '        "' + FOLDER_README + '"  this file.',
    '  • the "files" folder — every PDF, sorted into subfolders:',
    '        files/Submittals/<status>/        current submittals & responses, by status',
    '        files/Submittals/All Submittals/<section>/   its current PDF + an "Archive" folder of past ones, all named by status',
    '        files/Submittals/Archive/         superseded / replaced PDFs (old revisions)',
    '        files/RFIs/<RFI# - subject>/       one folder per RFI, each with a "Question" and "Answered" subfolder',
    '        files/Change Orders/<CO# - desc>/  one folder per change order — its PDFs + an "Emails" subfolder',
    '        files/Emails/<category>/          saved emails & attachments',
    '',
    'When a PDF is replaced by a newer revision, the old one is renamed with an',

  ].join('\r\n');

async function writeFolderReadme(handle) { try { await writeIfChanged(handle, FOLDER_README, folderReadmeText()); } catch (e) {} }
/* Pull the tool's bookkeeping (marker, register backup + CSV, READ ME) — under
   either their old cryptic names or their current names, and whether at the folder
   root or not — into "link to this folder/". Runs on every folder load, so existing
   folders reorganise themselves. The launcher shortcut stays at the root. */
async function migrateOldFolderFiles(handle) {
  const ld = await linkDirHandle(handle);
  // Pull the contents of any earlier-named link folder ("link to this folder") into
  // the current one, then remove the old folder.
  for (const oldName of LINK_DIR_OLDS) {
    let oldLd; try { oldLd = await handle.getDirectoryHandle(oldName); } catch (e) { continue; }
    const names = []; try { for await (const e of oldLd.values()) if (e.kind === 'file') names.push(e.name); } catch (e) {}
    for (const n of names) await moveToLink(oldLd, ld, n, n);
    try { await handle.removeEntry(oldName, { recursive: true }); } catch (e) {}
  }
  // Pull any root-level bookkeeping (old cryptic + current names) into the link folder.
  for (const old of MARKER_FILE_OLDS) await moveToLink(handle, ld, old, MARKER_FILE);
  await moveToLink(handle, ld, MARKER_FILE, MARKER_FILE);
  await moveToLink(handle, ld, REGISTER_JSON_OLD, REGISTER_JSON);
  await moveToLink(handle, ld, REGISTER_JSON, REGISTER_JSON);
  await moveToLink(handle, ld, REGISTER_CSV_OLD, REGISTER_CSV);
  await moveToLink(handle, ld, REGISTER_CSV, REGISTER_CSV);
  await moveToLink(handle, ld, FOLDER_README, FOLDER_README);
  for (const nested of [LINK_DIR, ...LINK_DIR_OLDS]) { try { await ld.removeEntry(nested, { recursive: true }); } catch (e) {} }   // clear a stray nested link folder from a mis-pick
}
/* Keep the folder self-explanatory and self-healing: reorganise the bookkeeping
   into "link to this folder/", (re)create the marker + READ ME there, and keep the
   launcher shortcut at the root. Runs on every folder load. */
async function ensureFolderDocs(handle) {
  if (!job) return;
  await migrateOldFolderFiles(handle);          // move any root-level bookkeeping into "link to this folder/"
  const ld = await linkDirHandle(handle);
  await writeJobMarker(ld, job);                // marker + register backup + READ ME live in the link folder
  await writeLauncher(handle, job);            // the double-click shortcut stays at the root
  await writeFolderReadme(ld);
}

/* On opening a job, load its folder silently if the grant already stands;
   otherwise leave it unloaded and let the folder bar prompt for one click. */
async function markFolderLoaded(handle) {
  if (isInternalFolderPick(handle && handle.name)) {   // wrong folder was remembered — an internal subfolder, not the job root
    if (job) await forgetHandle(job.id);

async function buildRegisterSnapshot() {

    specDataFor(s.key).catch(() => ({ requirements: [], includes: [] }))));

    { requirements: specTexts[i].requirements || [], includes: specTexts[i].includes || [] }));

/* Which status folder a document belongs in — its own status, else a default by

  if (!curFile || curDir === wantDir) return null;    // already in place / nothing on disk
  let blob = null;

    const srcDir = curDir ? await walkDir(filesRoot, curDir) : filesRoot;   // legacy flat file when no dir
    blob = await (await srcDir.getFileHandle(curFile)).getFile();

  const targetDir = await walkDirCreate(filesRoot, wantDir);

/* Move every doc's file to its parent-folder home, in place. Copies first,

   rolls the copies back if the persist fails — so an interrupted run never

  for (const s of sectionsOf(job)) for (const kind of ['submittals', 'responses'])
    for (const d of (s[kind] || [])) { if (!isLink(d)) { if (isArchived(d)) d.archived = true; await plan(d, docWantDir(d, kind), () => secs.add(s)); } }
  for (const sp of (job.specs || [])) { if (!isLink(sp)) await plan(sp, statusDirName('spec'), () => { specChanged = true; }); }
  for (const r of rfis) for (const d of (r.docs || [])) { if (!isLink(d)) await plan(d, rfiDocDir(r, d.kind), () => rfiSet.add(r)); }
  for (const c of cos) for (const d of (c.docs || [])) { if (!isLink(d)) await plan(d, coDocDir(c), () => coSet.add(c)); }
  for (const c of cos) for (const d of (c.emails || [])) { if (!isLink(d)) await plan(d, coEmailDir(c), () => coSet.add(c)); }
  for (const cat of tracking) for (const d of (cat.files || [])) { if (!isLink(d)) await plan(d, EMAIL_DIR + '/' + sanitizeAnyName(cat.name, 'Uncategorised'), () => catSet.add(cat)); }

  if (!moves.length) return 0;   // nothing actually movable (e.g. an orphaned record whose file is gone) → no toast, no churn
  stickyToast('Organising the ShareFile folder…');   // only announce once there's real work to commit

  for (const m of moves) { m.doc.dir = m.newDir; m.doc.file = m.newFile; delete m.doc.fileId; }

    if (secs.size) await saveSections([...secs]);

    for (const c of coSet) await FB.setDoc(coRef(job.id, c.id), clean(c));
    for (const cat of catSet) await FB.setDoc(trackingRef(job.id, cat.id), clean(cat));

    }

    try {
      const oldParent = m.oldDir ? await walkDir(filesRoot, m.oldDir) : filesRoot;
      await oldParent.removeEntry(m.oldFile);
    } catch (e) {}
    if (blobUrlCache.has(m.doc.id)) { URL.revokeObjectURL(blobUrlCache.get(m.doc.id)); blobUrlCache.delete(m.doc.id); }
  }

}
/* Where each old flat folder's leftovers belong now. */
const OLD_FLAT_TARGET = {

  'Partial Approval':    'Submittals/Partial Approval',
  'Approved':            'Submittals/Approved',
  'Revise and Resubmit': 'Submittals/Revise and Resubmit',
  'Waiting on Vendor':   'Submittals/Waiting on Vendor',
  'Not Required':        'Submittals/Not Required',
  'Specs':               'Submittals/Specs',
  'RFI Questions':       'RFIs/Questions',
  'RFI Answers':         'RFIs/Answers'

/* Consolidate any files still sitting in a pre-nesting top-level folder into the
   matching nested folder (dropping exact-duplicate leftovers), then remove the
   empty old folder. Returns how many stray files were handled. */
async function cleanupEmptyOldDirs(filesRoot) {
  let touched = 0;
  for (const name of OLD_FLAT_DIRS) {
    let dh;
    try { dh = await filesRoot.getDirectoryHandle(name); } catch (e) { continue; }   // not present
    const targetRel = OLD_FLAT_TARGET[name];
    const names = [];
    try { for await (const e of dh.values()) if (e.kind === 'file') names.push(e.name); } catch (e) {}
    for (const fn of names) {
      try {
        const srcBlob = await (await dh.getFileHandle(fn)).getFile();
        const targetDh = await walkDirCreate(filesRoot, targetRel);
        let dup = false;                          // same file already filed in the nested folder?
        try { const tf = await (await targetDh.getFileHandle(fn)).getFile(); if (tf.size === srcBlob.size) dup = true; } catch (e) {}
        if (!dup) {
          const want = await uniqueFileName(targetDh, fn);
          const fh = await targetDh.getFileHandle(want, { create: true });
          const w = await fh.createWritable(); await w.write(srcBlob); await w.close();
        }
        await dh.removeEntry(fn);
        touched++;
      } catch (e) {}
    }
    try {
      let empty = true; for await (const _ of dh.values()) { empty = false; break; }
      if (empty) await filesRoot.removeEntry(name, { recursive: false });
    } catch (e) {}
  }
  return touched;
}

/* Mirror every section that has a PDF into files/Submittals/All Submittals/<section>/:
   the current (most recent, non-archived) PDF sits at the top of the section folder,
   named by its status (e.g. "Approved - Valve.pdf"), and a nested "Archive" subfolder
   holds a labelled copy of every superseded PDF for that section (e.g.
   "Revise and Resubmit - Valve.pdf"). All double-stored copies. Idempotent; only
   writes what's missing, prunes what no longer belongs, and coalesces concurrent
   calls so nothing is dropped. */

  let i = 2, cand; do { cand = `${stem} (${i})${ext}`; i++; } while (used.has(cand));
  used.add(cand); return cand;
}

async function reconcileDir(dh, want) {   // want: Map(fileName -> doc). Write missing, delete strangers.
  const present = new Set(); const stale = [];

  for (const [name, doc] of want) {

async function syncAllSubmittals() {
  if (!jobFolder) return;
  if (_syncingAll) { _syncAgain = true; return; }   // a run is in flight → ask it to run once more
  _syncingAll = true;
  try {
    do {
      _syncAgain = false;
      const filesRoot = await jobFolder.getDirectoryHandle('files', { create: true });
      const allDh = await walkDirCreate(filesRoot, ALL_SUBMITTALS_DIR);
      const wanted = new Map();                  // folderName -> { cur, curName, arch: Map(name->doc) }
      for (const s of sectionsOf(job)) {
        const all = [...(s.submittals || []), ...(s.responses || [])].filter(d => !isLink(d) && d.file);
        if (!all.length) continue;
        const byNewest = (a, b) => (b.uploaded || 0) - (a.uploaded || 0);
        const live = all.filter(d => !isArchived(d)).sort(byNewest);
        const arch = all.filter(d => isArchived(d)).sort(byNewest);
        const cur = live[0] || null;               // the current PDF (may be null if all revisions were superseded)
        const used = new Set();
        const curName = cur ? uniqueInSet(mirrorName(cur, s), used) : null;
        const archWant = new Map();
        for (const d of arch) archWant.set(uniqueInSet(mirrorName(d, s), used), d);
        const folderName = sanitizeAnyName(`${s.number} ${s.title || ''}`.trim().slice(0, 90), s.number);
        wanted.set(folderName, { cur, curName, arch: archWant });
      }

          const secDh = await allDh.getDirectoryHandle(folderName, { create: true });
          const topWant = new Map(); if (cur && curName) topWant.set(curName, cur);

            await reconcileDir(archDh, arch);

          for await (const e of secDh.values()) {             // drop any stray subfolder that isn't Archive
            if (e.kind === 'directory' && e.name !== ARCHIVE_NAME) { try { await secDh.removeEntry(e.name, { recursive: true }); } catch (e2) {} }
          }

        for await (const e of allDh.values()) {

        }

    } while (_syncAgain);

  finally { _syncingAll = false; }
}

      || (s.submittals || []).some(misarchived) || (s.responses || []).some(misarchived)) return true;
  if ((job.specs || []).some(old)) return true;
  for (const r of rfis) if ((r.docs || []).some(d => !isLink(d) && d.dir && (old(d) || d.dir !== rfiDocDir(r, d.kind)))) return true;
  for (const c of cos) if ((c.docs || []).some(d => !isLink(d) && d.dir && d.dir !== coDocDir(c))
      || (c.emails || []).some(d => !isLink(d) && d.dir && d.dir !== coEmailDir(c))) return true;
  return false;                                  // tracking email ('Emails/<category>') dirs were never flat
}
let _organizing = false;
/* When a folder loads (or its records arrive) with the old flat layout, quietly
   reorganise it into the parent folders. Idempotent and re-entrancy-guarded. */
async function maybeAutoOrganize() {
  if (!jobFolder || _organizing) return;
  _organizing = true;
  try {
    const filesRoot = await jobFolder.getDirectoryHandle('files', { create: true });
    let n = 0;
    if (needsOrganize()) n = await refileAll(filesRoot);   // refileAll shows the "Organising…" sticky only if it has real work
    const stray = await cleanupEmptyOldDirs(filesRoot);   // also catches leftovers even when records are fine
    await syncRfiFolders();                               // per-RFI folders (+ Question/Answered) after any moves
    await syncCoFolders();                                // per-CO folders after any moves
    await reconcileLedgers();                             // vendor-quote / PO folders
    await reconcileContracts();                           // contract folders
    if (n) toast(`Organised ${n} file${n === 1 ? '' : 's'} into folders`);
    if (n || stray) {
      if (openKey) renderDrawer();
      renderTable();
      await noteFolderChanged();
    }
  } catch (e) { console.error(e); }
  finally { _organizing = false; }
}

/* ── auto-save to the ShareFile folder + a "last saved" indicator ──
   Replaces the old manual Save button. Whenever the register changes (a local edit
   or another user's change) and the folder is loaded, the snapshot + CSV are
   re-written and the PDFs re-filed — debounced so bursts coalesce. The header shows
   when it last saved; clicking it saves now. */
let folderSaveAt = 0, folderSaveState = 'idle';   // 'idle' | 'saving' | 'saved' | 'error'
let _lastSavedSig = null, _folderSaveTimer = null, _saveTicker = null;
/* A cheap in-memory signature of everything the folder copy captures. */
function registerSig() {
  try { return JSON.stringify([job && job.name, job && job.number, job && job.specs, sectionsOf(job), rfis, cos, tracking]); }
  catch (e) { return 'sig' + Date.now(); }
}
function relTime(ts) {
  if (!ts) return '';
  const s = Math.max(0, Math.round((Date.now() - ts) / 1000));
  if (s < 45) return 'just now';
  const m = Math.round(s / 60); if (m < 60) return m + ' min ago';
  const h = Math.round(m / 60); if (h < 24) return h + ' hr' + (h === 1 ? '' : 's') + ' ago';
  const d = Math.round(h / 24); return d + ' day' + (d === 1 ? '' : 's') + ' ago';
}
/* The exact clock time a save was made (e.g. "9/3 2:47:03 PM"). */
function fmtClock(ts) {
  if (!ts) return '';
  const d = new Date(ts);
  return d.toLocaleDateString([], { month: 'numeric', day: 'numeric' }) + ' ' + d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
}
function renderSaveStatus() {
  const el = $('folderSaveStatus'); if (!el) return;
  if (!job || !jobFolder) { el.hidden = true; return; }
  el.hidden = false;
  if (folderSaveState === 'saving') { el.className = 'save-status saving'; el.innerHTML = '<span class="ss-dot"></span>Saving…'; el.title = 'Saving the register + backup to the ShareFile folder'; return; }
  if (folderSaveState === 'error') { el.className = 'save-status err'; el.innerHTML = '<span class="ss-dot"></span>Save failed — retry'; el.title = 'Could not save to the folder. Click to try again.'; return; }
  el.className = 'save-status';
  el.innerHTML = '<span class="ss-dot"></span>' + (folderSaveAt ? 'Saved ' + fmtClock(folderSaveAt) : 'Not saved to folder yet');
  el.title = (folderSaveAt ? 'Register + backup last written to the ShareFile folder at ' + new Date(folderSaveAt).toLocaleString() + '.\n' : '') + 'Saves automatically when the register changes — click to save now.';
}
function startSaveTicker() { clearInterval(_saveTicker); _saveTicker = setInterval(() => { if (job && jobFolder && folderSaveState !== 'saving') renderSaveStatus(); }, 30000); }
function scheduleFolderSave() {
  if (!job || !jobFolder) return;
  clearTimeout(_folderSaveTimer);
  _folderSaveTimer = setTimeout(() => {
    if (!job || !jobFolder) return;
    if (saveToFolder._busy) { scheduleFolderSave(); return; }   // a save is running — retry after it
    if (registerSig() !== _lastSavedSig) saveToFolder(true);
  }, 12000);
}
function saveNow() { clearTimeout(_folderSaveTimer); saveToFolder(false); }   // clicking the indicator forces an immediate save
async function saveToFolder(auto) {
  if (!job) return;
  if (saveToFolder._busy) { if (!auto) toast('A save is already in progress…', true); return; }
  if (!jobFolder) { if (auto) return; if (!(await ensureJobFolder())) return; }
  saveToFolder._busy = true;
  folderSaveState = 'saving'; renderSaveStatus();
  if (!auto) stickyToast('Saving to the ShareFile folder…');
  try {
    const filesRoot = await jobFolder.getDirectoryHandle('files', { create: true });

    // Re-file everything into its parent folder (safe copy → persist → delete),
    // then tidy away the empty old flat folders.
    const moved = await refileAll(filesRoot);
    await cleanupEmptyOldDirs(filesRoot);
    await syncRfiFolders();                         // per-RFI folders (+ Question/Answered), tidy renamed/empty ones
    await syncCoFolders();                          // per-CO folders, tidy renamed/empty ones
    await reconcileLedgers();                       // vendor-quote / PO folders
    await reconcileContracts();                     // contract folders
    await syncAllSubmittals();                     // refresh the All Submittals mirror

    // Write the snapshot + CSV (obvious names), and keep the marker + READ ME
    // current. Records and files are already consistent, so a failure here only
    // means the snapshot is stale, not that data is lost.
    const ld = await linkDirHandle(jobFolder);
    const snap = await buildRegisterSnapshot();
    await writeFolderFile(REGISTER_JSON, JSON.stringify(snap, null, 2), 'application/json', ld);
    await writeFolderFile(REGISTER_CSV, '﻿' + buildCsv(), 'text/csv;charset=utf-8', ld);
    await ensureFolderDocs(jobFolder);

    folderSaveAt = Date.now(); folderSaveState = 'saved'; _lastSavedSig = registerSig();
    try { localStorage.setItem('sr_saved_' + job.id, String(folderSaveAt)); } catch (e) {}
    if (moved) { if (openKey) renderDrawer(); renderTable(); }
    await noteFolderChanged();
    renderSaveStatus();
    if (!auto) toast(`Saved to the ShareFile folder — "${REGISTER_CSV}" written${moved ? `, ${moved} file${moved === 1 ? '' : 's'} re-filed` : ''}`);
  } catch (e) {
    console.error(e);
    folderSaveState = 'error'; renderSaveStatus();
    if (!auto) toast('Could not save to the folder: ' + (e.message || e), true);
  } finally {
    saveToFolder._busy = false;
  }
}

/* The Firebase bootstrap lives in a type="module" script, which runs after the
   classic script is parsed. Wait for it before asking it to connect. */
async function ensureFirebase() {
  for (let i = 0; i < 300 && !window.__initFirebase; i++) await new Promise(r => setTimeout(r, 10));
  if (!window.__initFirebase) throw new Error('the register bootstrap did not load');
  return window.__initFirebase();
}

async function boot() {
  go('jobs');
  let ready = null;
  try {
    ready = await Promise.race([
      ensureFirebase(),
      new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), 15000))
    ]);
  } catch (e) {
    jobsLoaded = true;
    setSync('error', ' — the register could not load. Check the connection and reload.');
    renderJobs();
    return;
  }
  FB = ready;
  watchJobs();
}

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();
</script>
</body>
