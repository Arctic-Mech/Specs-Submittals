// ===== parts/07i_ui_keynav.js =====
// ============================================================
// Keyboard navigation for the data grids — the Excel muscle memory
// ============================================================
// Enter / Shift+Enter  move down / up the same column
// Down / Up arrow      same, EXCEPT on a <select> or a datalist cell, where the
//                      arrows belong to the control itself
// Ctrl+D               fill down from the nearest cell above in the column
// Escape               put the cell back the way it was when you entered it
// Tab                  left alone — the browser already moves right
//
// Left/Right arrows are deliberately NOT bound: every cell here is a live input,
// so those have to keep moving the caret inside the text.

// Column position of a cell, counting colspans (some rows merge cells).
function gridColOf(td) {
  let col = 0;
  for (const child of td.parentElement.children) {
    if (child === td) return col;
    col += child.colSpan || 1;
  }
  return col;
}
function gridCellAt(tr, col) {
  let at = 0;
  for (const child of tr.children) {
    const span = child.colSpan || 1;
    if (col >= at && col < at + span) return child;
    at += span;
  }
  return null;
}
const GRID_CTRL = 'input:not([type=hidden]):not([type=checkbox]):not([disabled]), select:not([disabled])';

// The editable cell `step` rows away in the same column, or null.
// Stops at subtotal/total rows and header rows, and never leaves this table —
// the next table may be inside a collapsed group where focus would vanish.
function gridNeighbour(node, step) {
  const td = node.closest('td');
  if (!td) return null;
  const tr = td.parentElement;
  const table = tr.closest('table.grid');
  if (!table) return null;
  const col = gridColOf(td);
  const rows = [...table.rows];
  for (let i = rows.indexOf(tr) + step; i >= 0 && i < rows.length; i += step) {
    const row = rows[i];
    if (row.classList.contains('subtotal') || row.classList.contains('grand')) break;
    if (row.querySelector('th')) break;
    const cell = gridCellAt(row, col);
    if (!cell) continue;
    const ctrl = cell.querySelector(GRID_CTRL);
    if (ctrl) return ctrl;
  }
  return null;
}

// Scroll a cell clear of the sticky top bar and sticky table header.
function gridEnsureVisible(node) {
  if (!node || !node.getBoundingClientRect) return;
  const bar = document.getElementById('topbar');
  const th = node.closest('table') && node.closest('table').querySelector('th');
  const top = (bar ? bar.getBoundingClientRect().bottom : 0) + (th ? th.getBoundingClientRect().height : 0) + 8;
  const r = node.getBoundingClientRect();
  if (r.top < top) window.scrollBy(0, r.top - top);
  else if (r.bottom > window.innerHeight - 8) window.scrollBy(0, r.bottom - window.innerHeight + 8);
}

// Move focus to `dest`. Focusing it blurs the current cell, which commits that
// edit and may queue a re-render; rerender() reads document.activeElement inside
// its timeout, i.e. after this, so it restores focus to the NEW cell by data-path.
// The follow-up below only repairs the rare case where that lookup misses.
let gridNavSeq = 0;
function gridFocus(dest) {
  if (!dest) return;
  // Each move gets a ticket. A busy page can delay the follow-up below past the
  // next keystroke, and an old follow-up must never drag focus back from where
  // the user has since moved to.
  const seq = ++gridNavSeq;
  const path = dest.dataset ? dest.dataset.path : null;
  dest.focus();
  if (dest.select) { try { dest.select(); } catch (e) { } }
  setTimeout(() => {
    if (seq !== gridNavSeq) return;              // superseded by a newer move
    let node = dest;
    if (path && !document.body.contains(node)) node = document.querySelector('[data-path="' + CSS.escape(path) + '"]');
    if (node && document.activeElement !== node) {
      node.focus();
      if (node.select) { try { node.select(); } catch (e) { } }
    }
    gridEnsureVisible(node);
  }, 0);
}

// Copy the value from the cell above into this one, through the normal change
// path so the model write, the recalc and the undo step all happen as usual.
function gridFillDown(node) {
  const src = gridNeighbour(node, -1);
  const dstPath = node.dataset ? node.dataset.path : null;
  if (!src || !src.dataset.path || !dstPath) { toast('Nothing above to fill down from', true); return; }
  // copy the stored value, never the displayed text — money and percentages are
  // formatted on the way out and would be corrupted by copying what you see
  pathSet(app.bid, dstPath, pathGet(app.bid, src.dataset.path));
  const dstExpr = node.dataset.exprPath, srcExpr = src.dataset.exprPath;
  if (dstExpr) pathSet(app.bid, dstExpr, srcExpr ? pathGet(app.bid, srcExpr) : null);
  app.touch();
  rerender();
}

function installGridNav() {
  // remember each cell's value on the way in, so Escape can put it back
  document.addEventListener('focusin', (e) => {
    const t = e.target;
    if (t && t.closest && t.closest('table.grid') && 'value' in t) t.dataset.entryValue = t.value;
  });

  document.addEventListener('keydown', (e) => {
    if (e.isComposing || e.keyCode === 229 || e.defaultPrevented) return;
    let t = e.target;
    if (!t || !t.closest) return;
    if (t.tagName === 'TEXTAREA') return;            // notes fields: Enter makes a new line
    if (!t.closest('table.grid')) return;            // form fields and the import compare table
    // A big page can still be re-rendering from the previous keystroke, which leaves
    // this node detached. Re-find the live cell by its path so fast typing never
    // moves relative to a stale table.
    if (!document.body.contains(t) && t.dataset && t.dataset.path) {
      const live = document.querySelector('[data-path="' + CSS.escape(t.dataset.path) + '"]');
      if (!live) return;
      t = live;
    }

    const key = e.key;
    if ((e.ctrlKey || e.metaKey) && (key === 'd' || key === 'D')) {
      e.preventDefault();                            // also stops the browser's Add Bookmark
      gridFillDown(t);
      return;
    }
    if (e.ctrlKey || e.metaKey || e.altKey) return;  // leave every other shortcut alone

    if (key === 'Enter') {
      e.preventDefault();
      gridFocus(gridNeighbour(t, e.shiftKey ? -1 : 1));
      return;
    }
    if (key === 'ArrowDown' || key === 'ArrowUp') {
      // these belong to the control on a dropdown or a datalist cell
      if (t.tagName === 'SELECT' || t.hasAttribute('list')) return;
      e.preventDefault();
      gridFocus(gridNeighbour(t, key === 'ArrowDown' ? 1 : -1));
      return;
    }
    if (key === 'Escape' && t.dataset && t.dataset.entryValue !== undefined) {
      // restoring the original text means no change event fires on the way out
      t.value = t.dataset.entryValue;
      if (t.select) { try { t.select(); } catch (err) { } }
    }
  });
}

// ===== parts/08_io.js =====
// ============================================================
// IO: export (PDF pages / ZIP), import (.json/.pdf/.zip), diff modal
// ============================================================

// Every exportable page registers here: key -> {label, landscape, render(doc, bid, computed, settings)}
const PDF_PAGES = {}; // filled by ui modules

function bidFileBase(bid) {
  // Mirrors VBA SaveWorkBook convention: "<EstNo> <JobName> Rev <N>"
  const est = (bid.info.estNo || 'NoEst').trim();
  const job = (bid.info.jobName || 'Untitled').trim();
  const clean = (s) => s.replace(/[\\/:*?"<>|]+/g, '-');
  return clean(est + ' ' + job + ' Rev ' + (bid.meta.rev ?? 0));
}

function exportBidJson(bid) {
  return JSON.stringify({
    format: 'arctic-bid',
    schema: bid.schema,
    exportedAt: new Date().toISOString(),
    appVersion: APP_VERSION,
    bid: bid,
  }, null, 1);
}

function downloadBytes(name, bytes, mime) {
  const blob = new Blob([bytes], { type: mime || 'application/octet-stream' });
  const url = URL.createObjectURL(blob);
  const a = el('a', { href: url, download: name });
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}

async function logoJpegBytes() {
  // Convert embedded base64 PNG logo to JPEG bytes for the PDF (DCTDecode)
  if (logoJpegBytes.cache) return logoJpegBytes.cache;
  const img = new Image();
  await new Promise((res, rej) => { img.onload = res; img.onerror = rej; img.src = 'data:image/png;base64,' + ASSETS.wordmark; });
  const c = document.createElement('canvas');
  c.width = img.naturalWidth; c.height = img.naturalHeight;
  const g = c.getContext('2d');
  g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height);
  g.drawImage(img, 0, 0);
  const dataUrl = c.toDataURL('image/jpeg', 0.92);
  const bin = atob(dataUrl.split(',')[1]);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  logoJpegBytes.cache = { bytes, w: c.width, h: c.height };
  return logoJpegBytes.cache;
}

// Standard page header/footer for every PDF page
async function pdfChrome(doc, bid, pageTitle) {
  const logo = await logoJpegBytes();
  doc.addJpeg('wm', logo.bytes, logo.w, logo.h);
  const w = doc.pw;
  const lw = 90, lh = lw * logo.h / logo.w;
  doc.image('wm', 36, 24, lw, lh);
  doc.text(w - 36, 26, pageTitle, { size: 13, bold: true, align: 'right' });
  doc.text(w - 36, 42, (bid.info.estNo || '') + '  ·  ' + (bid.info.jobName || '') + '  ·  Rev ' + bid.meta.rev, { size: 8.5, align: 'right', color: [.33, .36, .45] });
  doc.text(w - 36, 53, 'Bid date: ' + (bid.info.bidDate ? fmt.date(bid.info.bidDate) : '—') + '   Printed: ' + fmt.dateTime(new Date().toISOString()), { size: 7.5, align: 'right', color: [.45, .48, .55] });
  doc.line(36, 62, w - 36, 62, { width: 1, color: [.11, .18, .62] });
  return 74; // content start y
}

// Page numbers, stamped once the total is known. Pages that carry their own
// numbering (the Proposal form) opt out via page.noFooter.
function stampFooters(doc, bid) {
  const n = doc.pages.length;
  if (n < 2) return;
  doc.pages.forEach((p, i) => {
    if (p.noFooter) return;
    doc.onPage(i, () => {
      const w = doc.pw;
      doc.text(w / 2, doc.ph - 26, 'Page ' + (i + 1) + ' of ' + n, { size: 7.5, align: 'center', color: [.45, .48, .55] });
      doc.text(36, doc.ph - 26, (bid.info.estNo || '') + (bid.info.jobName ? '  ·  ' + bid.info.jobName : '') + '  ·  Rev ' + bid.meta.rev,
        { size: 7.5, color: [.45, .48, .55] });
    });
  });
}

async function buildPagePdf(keys, bid, computed, settings) {
  const doc = new PdfDoc();
  for (const key of keys) {
    const page = PDF_PAGES[key];
    if (!page) continue;
    await page.render(doc, bid, computed, settings);
  }
  stampFooters(doc, bid);
  doc.attach('bid.json', exportBidJson(bid));
  return doc.build();
}

async function exportPdf(keys, singleName) {
  try { app.saveNow(); } catch (e) { /* storage full — export from memory anyway */ }
  const pr = progressStart('Building PDF');
  await pr.step(0.3, 'Drawing ' + keys.length + ' page' + (keys.length === 1 ? '' : 's'));
  const bytes = await buildPagePdf(keys, app.bid, app.computed, app.settings);
  await pr.step(1, 'Saving');
  pr.done();
  const base = bidFileBase(app.bid);
  const name = singleName ? base + ' - ' + singleName + '.pdf' : base + '.pdf';
  downloadBytes(name, bytes, 'application/pdf');
  toast('Exported ' + name);
}

async function exportZip(keys) {
  try { app.saveNow(); } catch (e) { /* storage full — export from memory anyway */ }
  const pr = progressStart('Building ZIP');
  const base = bidFileBase(app.bid);
  const files = [];
  files.push({ name: base + '/bid.json', bytes: new TextEncoder().encode(exportBidJson(app.bid)) });
  let n = 0;
  for (const key of keys) {
    const page = PDF_PAGES[key];
    if (!page) continue;
    await pr.step(++n / (keys.length + 1), page.label);
    const bytes = await buildPagePdf([key], app.bid, app.computed, app.settings);
    files.push({ name: base + '/' + base + ' - ' + page.label + '.pdf', bytes });
  }
  await pr.step(1, 'Zipping ' + files.length + ' files');
  const zip = zipCreate(files);
  pr.done();
  downloadBytes(base + '.zip', zip, 'application/zip');
  toast('Exported ' + base + '.zip (' + files.length + ' files)');
}

// ---------- import ----------
async function readImportedFile(file, pr) {
  const step = async (f, l) => { if (pr) await pr.step(f, l); };
  await step(0.05, 'Reading ' + file.name);
  const buf = new Uint8Array(await file.arrayBuffer());
  const name = file.name.toLowerCase();
  const tryJson = (bytes) => {
    try {
      const obj = JSON.parse(new TextDecoder('utf-8').decode(bytes));
      if (obj && obj.format === 'arctic-bid' && obj.bid) return obj.bid;
      if (obj && obj.meta && obj.info && obj.takeoff) return obj; // bare bid
    } catch (e) { }
    return null;
  };
  if (name.endsWith('.json')) return tryJson(buf);
  if (name.endsWith('.pdf') || (buf[0] === 0x25 && buf[1] === 0x50)) { // %P
    await step(0.4, 'Looking for the bid data inside the PDF');
    const obj = pdfExtractJson(buf);
    if (obj && obj.format === 'arctic-bid' && obj.bid) return obj.bid;
    if (obj && obj.meta && obj.info) return obj;
    return null;
  }
  if (name.endsWith('.zip') || name.endsWith('.xlsm') || name.endsWith('.xlsx') || (buf[0] === 0x50 && buf[1] === 0x4B)) {
    await step(0.2, 'Unpacking ' + file.name);
    const entries = await zipRead(buf);
    // Excel workbook (original spreadsheet or one we exported) — parse the cells
    if (entries.find(e => e.name === 'xl/workbook.xml')) {
      await step(0.45, 'Reading the workbook cells');
      const parsed = await importXlsmFile(buf, pr);
      return parsed;
    }
    await step(0.55, 'Looking for the bid data');
    // Prefer bid.json, else first PDF with an embedded bid
    const j = entries.find(e => e.name.toLowerCase().endsWith('bid.json'));
    if (j) { const b = tryJson(j.bytes); if (b) return b; }
    for (const e of entries) {
      if (e.name.toLowerCase().endsWith('.pdf')) {
        const obj = pdfExtractJson(e.bytes);
        if (obj && obj.format === 'arctic-bid' && obj.bid) return obj.bid;
      }
    }
    return null;
  }
  return tryJson(buf);
}

async function handleImportFiles(files) {
  // The top-bar Import button is wired before boot() knows whether the company file
  // is here, so it can be pressed on the setup screen. Importing a bid means pricing
  // it, and there is nothing to price it with yet — say that instead of failing deep
  // inside the engine on a rate that is not there.
  if (!COMPANY) {
    toast('Load the Arctic company file first — this computer has no rates to price a bid with yet.', true);
    router.render();
    return;
  }
  for (const f of files) {
    const pr = progressStart('Importing ' + f.name);
    let incoming = null;
    try { incoming = await readImportedFile(f, pr); }
    catch (e) { console.error(e); pr.done(); toast('Could not read "' + f.name + '": ' + e.message, true); continue; }
    if (!incoming) { pr.done(); toast('Could not read a bid from "' + f.name + '". Use a file exported by this tool (.pdf, .zip, .json or .xlsm).', true); continue; }
    await pr.step(0.9, 'Checking against what is already saved');
    incoming = migrateBid(incoming);
    // find existing bid with same identity (est # first, then exact id)
    const ix = store.index();
    const match = ix.find(x => x.id === incoming.meta.id) ||
      ix.find(x => incoming.info.estNo && x.estNo === incoming.info.estNo);
    if (!match) {
      incoming.meta.id = incoming.meta.id || uid();
      store.saveBid(incoming);
      await pr.step(1, 'Done');
      pr.done();
      openBid(incoming.meta.id);
      toast('Imported new bid ' + (incoming.info.estNo || '') + ' — Rev ' + incoming.meta.rev);
      continue;
    }
    const existing = store.loadBid(match.id);
    pr.done();
    showDiffModal(existing, incoming, f.name);
  }
}

// ---------- diff modal ----------
// Ignore volatile identity fields and reference lists; rate tables inside the
// snapshot DO diff (labor-rate changes between revs are real changes).
const DIFF_IGNORE = [/^meta\.savedAt$/, /^meta\.id$/, /^meta\.lastTotal$/, /^settingsSnapshot\.ref\./, /^settingsSnapshot\.booking\./, /^xlsmSpaces\./];

function labelForPath(path) {
  for (const [re, fn] of DIFF_LABELS) {
    const m = path.match(re);
    if (m) return fn(m);
  }
  return path;
}
function pageForPath(path) {
  const seg = path.split(/[.[]/)[0];
  return DIFF_PAGE_NAMES[seg] || 'Other';
}
function fmtDiffVal(v) {
  if (v === undefined) return '—';
  if (v === true) return 'Yes';
  if (v === false) return 'No';
  if (typeof v === 'number') return Math.abs(v) >= 1000 ? fmt.num(v, 2) : String(Math.round(v * 10000) / 10000);
  return String(v) === '' ? '(blank)' : String(v);
}

// Every difference is its own accept/deny decision. Structural differences are the
// exception: when the two bids disagree on how many rows or groups a list has, the
// indices no longer line up, so that whole list is one all-or-nothing decision —
// applying half of it would corrupt the bid.
function arrayPrefixes(path) {
  const out = [];
  const re = /\[(\d+)\]/g;
  let m;
  while ((m = re.exec(path))) out.push(path.slice(0, m.index));
  return out;
}

function diffUnits(existing, incoming, changes) {
  const lenOf = (bid, p) => { const v = pathGet(bid, p); return Array.isArray(v) ? v.length : null; };
  const units = new Map();
  for (const c of changes) {
    let key = null;
    const asLen = /\.length$/.test(c.path) ? c.path.replace(/\.length$/, '') : null;
    if (asLen && lenOf(existing, asLen) !== lenOf(incoming, asLen)) key = asLen;
    if (!key) {
      for (const pre of arrayPrefixes(c.path)) {          // outermost list that changed shape
        if (lenOf(existing, pre) !== lenOf(incoming, pre)) { key = pre; break; }
      }
    }
    if (key) {
      if (!units.has(key)) {
        const a = lenOf(existing, key), b = lenOf(incoming, key);
        const rows = (n) => n === null ? '—' : n + (n === 1 ? ' row' : ' rows');
        units.set(key, {
          key, path: key, kind: 'list', count: 0,
          from: rows(a), to: rows(b),
          value: deepClone(pathGet(incoming, key) ?? []),
          label: labelForPath(key + '.length'), page: pageForPath(key),
        });
      }
      units.get(key).count++;
    } else {
      units.set(c.path, {
        key: c.path, path: c.path, kind: c.kind, count: 1,
        from: c.from, to: c.to,
        value: c.kind === 'removed' ? null : c.to,
        label: labelForPath(c.path), page: pageForPath(c.path),
      });
    }
  }
  return [...units.values()].sort((a, b) => a.path < b.path ? -1 : 1);
}

function applyDiffUnits(existing, units, accepted) {
  const merged = deepClone(existing);
  for (const u of units) {
    if (!accepted.has(u.key)) continue;
    pathSet(merged, u.path, u.kind === 'list' ? deepClone(u.value) : u.value);
  }
  return migrateBid(merged);
}

function showDiffModal(existing, incoming, sourceName) {
  const changes = diffBids(existing, incoming, DIFF_IGNORE);
  const units = diffUnits(existing, incoming, changes);
  const accepted = new Set(units.map(u => u.key));      // default: take the file
  const byPage = {};
  for (const u of units) (byPage[u.page] = byPage[u.page] || []).push(u);

  const back = el('div', { class: 'modal-back' });
  const revLine = (b, tag) => `${tag}: Rev ${b.meta.rev} — saved ${fmt.dateTime(b.meta.savedAt)}${b.info.estNo ? ' — ' + b.info.estNo : ''}`;
  const body = el('div', { class: 'body' });
  body.append(el('p', {}, el('b', {}, existing.info.jobName || existing.info.estNo || 'This bid'), ' already exists on this computer.'));
  body.append(el('p', { class: 'hint' }, revLine(existing, 'On this computer'), el('br'), revLine(incoming, 'File "' + sourceName + '"')));
  const revIn = Number(incoming.meta.rev) || 0, revEx = Number(existing.meta.rev) || 0;
  if (revIn < revEx) {
    body.append(el('p', {}, el('span', { class: 'badge red' }, 'Older revision'), ' The file is Rev ' + revIn + ' but you already have Rev ' + revEx + ' — taking everything would roll the bid back.'));
  } else if (revIn > revEx) {
    body.append(el('p', {}, el('span', { class: 'badge green' }, 'Newer revision'), ' The file is Rev ' + revIn + '; you have Rev ' + revEx + '.'));
  }

  const applyBtn = el('button', { class: 'btn' }, 'Apply');
  const countLbl = el('span', { class: 'hint' });
  const boxes = new Map();                              // unit key -> checkbox (rendered ones)
  const refresh = () => {
    const n = accepted.size, m = units.length;
    countLbl.textContent = n + ' of ' + m + ' accepted';
    applyBtn.textContent = n === 0 ? 'Keep mine (nothing accepted)'
      : n === m ? 'Accept all ' + m + ' changes' : 'Apply the ' + n + ' accepted change' + (n === 1 ? '' : 's');
    for (const [k, cb] of boxes) cb.checked = accepted.has(k);
  };
  const setAll = (on) => {
    accepted.clear();
    if (on) for (const u of units) accepted.add(u.key);
    refresh();
  };

  if (!changes.length) {
    body.append(el('p', {}, el('span', { class: 'badge green' }, 'No differences'), ' The file matches what you already have.'));
  } else {
    body.append(el('p', {}, el('span', { class: 'badge yellow' }, units.length + ' difference' + (units.length > 1 ? 's' : '')),
      ' Tick the ones you want from the file. Left is what you have, right is the file.'));
    body.append(el('div', { class: 'formrow', style: 'align-items:center;margin-bottom:8px' },
      el('button', { class: 'btn sm sec', onclick: () => setAll(true) }, 'Accept all'),
      el('button', { class: 'btn sm sec', onclick: () => setAll(false) }, 'Deny all'),
      countLbl));

    for (const [page, list] of Object.entries(byPage)) {
      const g = el('div', { class: 'diff-group' });
      const pageCb = el('input', { type: 'checkbox', checked: '' });
      pageCb.addEventListener('change', () => {
        for (const u of list) { if (pageCb.checked) accepted.add(u.key); else accepted.delete(u.key); }
        refresh();
      });
      g.append(el('h4', {}, el('label', { class: 'ck' }, pageCb, page + ' (' + list.length + ')')));
      const t = el('table', { class: 'diff' });
      t.append(el('tr', {}, el('th', { style: 'width:26px' }, '✓'), el('th', {}, 'Field'), el('th', {}, 'You have'), el('th', {}, 'File has')));
      const addRow = (u) => {
        const cb = el('input', { type: 'checkbox' });
        cb.checked = accepted.has(u.key);
        cb.addEventListener('change', () => {
          if (cb.checked) accepted.add(u.key); else accepted.delete(u.key);
          refresh();
        });
        boxes.set(u.key, cb);
        const name = u.kind === 'list'
          ? el('td', {}, u.label, el('br'), el('span', { class: 'hint' }, 'list changed shape — ' + u.count + ' field change' + (u.count === 1 ? '' : 's') + ', taken together'))
          : el('td', {}, u.label);
        t.append(el('tr', { class: 'k-' + u.kind }, el('td', {}, cb), name,
          el('td', { class: u.kind !== 'added' ? 'old' : '' }, fmtDiffVal(u.from)),
          el('td', { class: u.kind !== 'removed' ? 'new' : '' }, fmtDiffVal(u.to))));
      };
      const CAP = 300;
      list.slice(0, CAP).forEach(addRow);
      if (list.length > CAP) {
        const moreRow = el('tr', {}, el('td', { colspan: 4 },
          el('button', {
            class: 'btn sm sec', onclick: (e) => {
              e.preventDefault();
              list.slice(CAP).forEach(addRow);
              moreRow.remove();
            }
          }, 'Show the other ' + (list.length - CAP) + ' — they are already counted above')));
        t.append(moreRow);
      }
      g.append(el('div', { class: 'tablewrap' }, t));
      body.append(g);
    }
    refresh();
  }

  const close = () => back.remove();
  applyBtn.addEventListener('click', () => {
    const replaced = JSON.stringify(existing);            // so Undo can put it back
    const n = accepted.size;
    if (!changes.length || n === units.length) {
      incoming.meta.id = existing.meta.id;
      store.saveBid(incoming); openBid(incoming.meta.id); close();
      app.undoStack.push({ json: replaced, label: 'import of ' + sourceName });
      app.syncUndoButtons();
      toast(changes.length ? 'Took everything from the file (Rev ' + incoming.meta.rev + ') — Undo puts your version back'
        : 'Reloaded from the file');
      return;
    }
    if (n === 0) { close(); toast('Kept your version — nothing changed'); return; }
    const merged = applyDiffUnits(existing, units, accepted);
    merged.meta.id = existing.meta.id;
    store.saveBid(merged); openBid(merged.meta.id); close();
    app.undoStack.push({ json: replaced, label: 'import of ' + sourceName + ' (' + n + ' change' + (n === 1 ? '' : 's') + ')' });
    app.syncUndoButtons();
    toast('Applied ' + n + ' of ' + units.length + ' changes — Undo puts your version back');
  });

  const foot = el('div', { class: 'foot' },
    el('button', { class: 'btn sec', onclick: close }, 'Cancel — keep mine'),
    el('button', {
      class: 'btn sec', onclick: () => {
        incoming.meta.id = uid();
        incoming.info.jobName = (incoming.info.jobName || 'Untitled') + ' (imported copy)';
        store.saveBid(incoming); openBid(incoming.meta.id); close();
        toast('Saved as a separate copy');
      }
    }, 'Keep both (save as copy)'),
    applyBtn);
  const modal = el('div', { class: 'modal' }, el('h3', {}, 'Import — choose what to take'), body, foot);
  back.append(modal);
  back.addEventListener('click', (e) => { if (e.target === back) close(); });
  document.body.append(back);
}

// Generic table drawer with pagination. cols: [{w, label, align}], rows: arrays of strings
// rowsOpts entries may be {cells:[...], style:'sub'|'grand'|'head'|'note'}
async function pdfTable(doc, bid, title, cols, rows, opts = {}) {
  const landscape = !!opts.landscape;
  doc.addPage(landscape);
  let y = await pdfChrome(doc, bid, title);
  const x0 = 36;
  const totalW = doc.pw - 72;
  const scale = totalW / cols.reduce((a, c) => a + c.w, 0);
  const widths = cols.map(c => c.w * scale);
  const rowH = opts.rowH || 13;
  const drawHead = () => {
    doc.rect(x0, y, totalW, rowH + 2, { fill: [0.9, 0.92, 0.96], stroke: [0.6, 0.63, 0.7], width: 0.4 });
    let x = x0;
    cols.forEach((c, i) => {
      doc.text(c.align === 'right' ? x + widths[i] - 3 : x + 3, y + 3, c.label, { size: 7.5, bold: true, align: c.align === 'right' ? 'right' : 'left' });
      x += widths[i];
    });
    y += rowH + 2;
  };
  const drawRow = (row, noteSuffix) => {
    const cells = Array.isArray(row) ? row : row.cells;
    const style = Array.isArray(row) ? '' : (row.style || '');
    if (style === 'sub') doc.rect(x0, y, totalW, rowH, { fill: [0.87, 0.9, 0.96], stroke: false });
    if (style === 'grand') doc.rect(x0, y, totalW, rowH, { fill: [0.79, 0.83, 0.93], stroke: false });
    if (style === 'head') doc.rect(x0, y, totalW, rowH, { fill: [0.94, 0.95, 0.98], stroke: false });
    const size = opts.fontSize || 7.5;
    const bold = style === 'sub' || style === 'grand' || style === 'head';
    if (row.span) {
      // full-width banner row (group headers): never chopped into a narrow first column
      const txt = cells.filter(Boolean).join('   ') + (noteSuffix || '');
      doc.text(x0 + 3, y + 2.5, pdfFit(txt, totalW - 6, size, bold), { size, bold });
    } else {
      let x = x0;
      cells.forEach((cell, i) => {
        const c = cols[i];
        const txt = String(cell ?? '');
        // Available width = this column plus any immediately following empty ones,
        // so nothing is truncated needlessly — but a value can never overlap a
        // neighbour that actually has text in it.
        let avail = widths[i];
        if (c.align !== 'right') {
          for (let j = i + 1; j < cols.length && !String(cells[j] ?? '').trim(); j++) avail += widths[j];
        }
        if (txt) doc.text(c.align === 'right' ? x + widths[i] - 3 : x + 3, y + 2.5,
          pdfFit(txt, avail - 6, size, bold),
          { size, bold, align: c.align === 'right' ? 'right' : 'left' });
        x += widths[i];
      });
    }
    doc.line(x0, y + rowH, x0 + totalW, y + rowH, { width: 0.25, color: [0.85, 0.86, 0.9] });
    y += rowH;
  };

  drawHead();
  let lastHead = null;                       // repeated after a break so continuations aren't orphaned
  for (const row of rows) {
    const style = Array.isArray(row) ? '' : (row.style || '');
    if (y > doc.ph - 46) {
      doc.addPage(landscape);
      y = await pdfChrome(doc, bid, title + ' (cont.)');
      drawHead();
      if (lastHead && lastHead !== row) drawRow(lastHead, '  (continued)');
    }
    if (style === 'head') lastHead = row;
    drawRow(row);
  }
  return y;
}

// ---------------- Proposal: the classic printed form ----------------
// Reproduces the workbook's own printed Proposal sheet. Every coordinate below is
// the position measured off that printed sheet (a 612x792 page whose content runs
// x 2.5..609.7), mapped through X()/Y() into a 10pt page margin so no border ever
// lands in a printer's unprintable edge. Keep the raw numbers: they are the spec.
const PROP_G = {
  boxes: [                                  // [topY, bottomY] of each double-ruled box
    [21.7, 179.9],                          // letterhead + field grid
    [184.9, 502.5],                         // scope / exclusions
    [507.0, 644.3],                         // WE PROPOSE
    [648.1, 706.9],                         // acceptance
  ],
  rowTops: [95.4, 116.4, 138.1, 159.9],     // the four field-grid rows
  scopeTop: 186.6, scopeBottom: 502.5,      // usable interior of the scope box (B17 sits right under the rule)
  exclAnchor: 453.6,                        // where "Exclusions:" sits on the blank form
  scopeIndent: 12.8, scopeRight: 557,        // the scope cell's own left/right
  exListX: 79.4, exListRight: 598.6,        // D39:S42 — the exclusions run sits right of the label
};

PDF_PAGES.proposal = {
  label: 'Proposal', landscape: false,
  async render(doc, bid, c, S) {
    doc.addPage(false);
    const P = S.ref.proposal;
    const G = PROP_G;

    // ---- target-sheet coordinates -> page coordinates ----
    const SX = 588 / 607.2;                            // 2.5..609.7  ->  12..600
    const DY = 6;
    const X = (v) => 12 + (v - 2.5) * SX;
    const Y = (v) => v + DY;
    // text() takes the top of the text box; the measured numbers are Arial ascender
    // tops, hence the small per-size correction.
    // Text is drawn at size*SX so a string occupies the same fraction of the form as
    // it does on the printed sheet; every width below is therefore in sheet units.
    const T = (x, y, str, size, opts = {}) => doc.text(X(x), Y(y) + 0.105 * size, String(str ?? ''), { size: size * SX, ...opts });
    const Tc = (x1, x2, y, str, size, opts = {}) => doc.text((X(x1) + X(x2)) / 2, Y(y) + 0.105 * size, String(str ?? ''), { size: size * SX, align: 'center', ...opts });
    const rule = (y, x1 = 2.5, x2 = 609.7, width = 0.7) => doc.line(X(x1), Y(y), X(x2), Y(y), { width });
    const vrule = (x, y1, y2, width = 0.7) => doc.line(X(x), Y(y1), X(x), Y(y2), { width });
    const ul = (y, x1, x2) => doc.line(X(x1), Y(y), X(x2), Y(y), { width: 0.6 });
    // Excel's "double" border: two hairlines, 1.7pt apart, all the way round
    const boxDouble = (yTop, yBot) => {
      const x0 = X(0.4), x1 = X(611.8), h = (yBot + 2.2) - yTop;
      doc.rect(x0, Y(yTop), x1 - x0, h, { width: 0.7 });
      doc.rect(x0 + 1.7, Y(yTop) + 1.7, x1 - x0 - 3.4, h - 3.4, { width: 0.5 });
    };
    const wrap = (txt, size, bold, maxW, firstW) => {
      const out = [];
      for (const para of String(txt ?? '').split(/\n+/)) {
        const words = para.split(/\s+/).filter(Boolean);
        if (!words.length) { out.push(''); continue; }
        let line = '';
        for (const word of words) {
          const lim = out.length === 0 && firstW ? firstW : maxW;
          const test = line ? line + ' ' + word : word;
          if (line && textWidth(test, size, bold) > lim) { out.push(line); line = word; }
          else line = test;
        }
        if (line) out.push(line);
      }
      return out;
    };

    // ================= frame =================
    for (const [a, b] of G.boxes) boxDouble(a, b);
    rule(94.6);                                      // under the ATTN / BID # line
    for (const y of [115.6, 137.3, 159.0]) rule(y);   // field-grid row separators
    vrule(239.6, 95.4, 179.9);                        // main left/right divider
    vrule(378.7, 95.4, 116.4); vrule(387.1, 95.4, 116.4);   // PHONE | spacer | DATE
    vrule(159.0, 159.9, 179.9); vrule(424.6, 159.9, 179.9); // ARCHITECT | DATE OF PLANS | FAX
    rule(553.8);                                      // under "Payment to be made as follows:"

    // ================= title + letterhead =================
    Tc(2.5, 609.7, 1.7, 'Proposal', 17.6, { bold: true, italic: true });
    const lh = P.letterhead || [];

// ===== parts/12_xlsm.js =====
// ============================================================
// Spreadsheet export/import — the ORIGINAL .xlsm as template.
// Export: inject this bid's inputs into a genuine copy of the workbook
// (macros, formatting, formulas, protection all untouched); Excel
// recalculates on open. Import: read those same cells back — works for
// files we exported AND for original workbooks never touched by the site.
// ============================================================

// ---------- template access ----------
const XLSM_SHEET_FILE = {
  'Booking CSV': 'sheet1', 'Pivot': 'sheet2', 'QP SM Audit Trail': 'sheet3', 'SM Audit Trail': 'sheet4',
  'Phase Codes': 'sheet5', 'SM Schedule': 'sheet6', 'Work Recovery': 'sheet7', 'EMO': 'sheet8',
  'Permits': 'sheet9', 'OCIP': 'sheet10', 'Bond': 'sheet11', 'Breakdown': 'sheet12', 'Takeoff Notes': 'sheet13',
  'SM Import': 'sheet14', 'Crew Mix': 'sheet15', 'TakeOff': 'sheet16', 'MCAA RECAP': 'sheet17',
  'Proposal': 'sheet18', 'Price Breakdown': 'sheet19', 'Booking Report': 'sheet20', 'Macros': 'sheet21',
};

let _templateParts = null;   // [{name, bytes}] in original order
async function templateParts() {
  if (_templateParts) return _templateParts;
  if (!TEMPLATE_BYTES) throw new Error('the estimate workbook is not loaded — reload the company file from Company Settings');
  _templateParts = await zipRead(TEMPLATE_BYTES);
  return _templateParts;
}

// ---------- XML cell surgery (mirror of the validated Python xlsx_edit) ----------
function xmlEscape(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
function xmlUnescape(s) {
  return String(s).replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"').replace(/&#(\d+);/g, (m, d) => String.fromCharCode(+d)).replace(/&amp;/g, '&');
}
function colToNum(col) { let n = 0; for (const ch of col) n = n * 26 + ch.charCodeAt(0) - 64; return n; }
function splitAddr(a) { const m = /^([A-Z]+)(\d+)$/.exec(a); return [m[1], +m[2]]; }

function xlsmFindCell(xml, addr) {
  let re = new RegExp('<c r="' + addr + '"([^>]*?)/>');
  let m = re.exec(xml);
  if (!m) {
    re = new RegExp('<c r="' + addr + '"([^>]*?)>[\\s\\S]*?</c>');
    m = re.exec(xml);
  }
  if (!m) return null;
  const st = /s="(\d+)"/.exec(m[1]);
  return { start: m.index, end: m.index + m[0].length, style: st ? st[1] : null, node: m[0] };
}
function xlsmMakeCell(addr, value, style, isBool) {
  const s = style ? ' s="' + style + '"' : '';
  if (value === null || value === undefined || value === '') return '<c r="' + addr + '"' + s + '/>';
  if (value && typeof value === 'object' && value.f) {
    // user-typed formula (e.g. "=20916+28200"); Excel computes it on open (fullCalcOnLoad)
    return '<c r="' + addr + '"' + s + '><f>' + xmlEscape(value.f.replace(/^=/, '')) + '</f></c>';
  }
  if (isBool || typeof value === 'boolean') return '<c r="' + addr + '"' + s + ' t="b"><v>' + (value ? 1 : 0) + '</v></c>';
  if (typeof value === 'number') return '<c r="' + addr + '"' + s + '><v>' + value + '</v></c>';
  return '<c r="' + addr + '"' + s + ' t="inlineStr"><is><t xml:space="preserve">' + xmlEscape(value) + '</t></is></c>';
}
function xlsmGetFormula(xml, addr) {
  const found = xlsmFindCell(xml, addr);
  return found ? xlsmNodeFormula(found.node) : null;
}
function xlsmNodeFormula(node) {
  if (!node) return null;
  const m = /<f[^>]*>([\s\S]*?)<\/f>/.exec(node);
  return m ? xmlUnescape(m[1]) : null;
}
// One pass over a sheet builds addr -> cell node. Reading a workbook touches tens
// of thousands of cells; scanning the whole sheet per cell made that quadratic
// (21s for this workbook) and froze the tab.
function xlsmIndexCells(xml) {
  const map = new Map();
  const re = /<c r="([A-Z]+\d+)"(?:[^>]*?\/>|[^>]*?>[\s\S]*?<\/c>)/g;
  let m;
  while ((m = re.exec(xml))) map.set(m[1], m[0]);
  return map;
}
function xlsmSetCell(xml, addr, value, isBool) {
  const [col, row] = splitAddr(addr);
  const found = xlsmFindCell(xml, addr);
  const node = xlsmMakeCell(addr, value, found ? found.style : null, isBool);
  if (found) return xml.slice(0, found.start) + node + xml.slice(found.end);
  // cell absent: insert into row (create row if needed)
  const rowRe = new RegExp('<row r="' + row + '"([^>]*?)(/>|>)');
  const rm = rowRe.exec(xml);
  if (!rm) {
    const newrow = '<row r="' + row + '">' + node + '</row>';
    let insertPos = xml.indexOf('</sheetData>');
    const rowIter = /<row r="(\d+)"/g;
    let rmatch;
    while ((rmatch = rowIter.exec(xml))) {
      if (+rmatch[1] > row) { insertPos = rmatch.index; break; }
    }
    return xml.slice(0, insertPos) + newrow + xml.slice(insertPos);
  }
  if (rm[2] === '/>') {
    const rowtag = rm[0].slice(0, -2) + '>';
    return xml.slice(0, rm.index) + rowtag + node + '</row>' + xml.slice(rm.index + rm[0].length);
  }
  const rowStart = rm.index + rm[0].length;
  const rowEnd = xml.indexOf('</row>', rowStart);
  const body = xml.slice(rowStart, rowEnd);
  const target = colToNum(col);
  let insertAt = body.length;
  const cellIter = /<c r="([A-Z]+)\d+"/g;
  let cm;
  while ((cm = cellIter.exec(body))) {
    if (colToNum(cm[1]) > target) { insertAt = cm.index; break; }
  }
  return xml.slice(0, rowStart) + body.slice(0, insertAt) + node + body.slice(insertAt) + xml.slice(rowEnd);
}
function xlsmGetCell(xml, addr, shared) {
  const found = xlsmFindCell(xml, addr);
  return found ? xlsmNodeValue(found.node, shared) : null;
}
function xlsmNodeValue(node, shared) {
  if (!node) return null;
  const t = /\bt="([^"]+)"/.exec(node);
  const typ = t ? t[1] : null;
  if (typ === 'inlineStr') {
    const m = /<t[^>]*>([\s\S]*?)<\/t>/.exec(node);
    return m ? xmlUnescape(m[1]) : null;
  }
  const v = /<v>([\s\S]*?)<\/v>/.exec(node);
  if (!v) return null;
  const raw = v[1];
  if (typ === 's') return shared[+raw];
  if (typ === 'b') return raw === '1';
  if (typ === 'str') return xmlUnescape(raw);
  const f = Number(raw);
  return isFinite(f) ? f : xmlUnescape(raw);
}
function xlsmSharedStrings(parts) {
  const p = parts.find(x => x.name === 'xl/sharedStrings.xml');
  if (!p) return [];
  const xml = new TextDecoder().decode(p.bytes);
  const out = [];
  const si = /<si>([\s\S]*?)<\/si>/g;
  let m;
  while ((m = si.exec(xml))) {
    let text = '';
    const tIter = /<t[^>]*>([\s\S]*?)<\/t>/g;
    let tm;
    while ((tm = tIter.exec(m[1]))) text += xmlUnescape(tm[1]);
    out.push(text);
  }
  return out;
}

// ---------- workbook wrapper ----------
class XlsmDoc {
  constructor(parts) {
    this.order = parts.map(p => p.name);
    this.parts = new Map(parts.map(p => [p.name, p.bytes]));
    this.shared = xlsmSharedStrings(parts);
    this.xml = {};
  }
  _path(t) { return 'xl/worksheets/' + XLSM_SHEET_FILE[t] + '.xml'; }
  sheet(t) {
    if (!(t in this.xml)) this.xml[t] = new TextDecoder().decode(this.parts.get(this._path(t)));
    return this.xml[t];
  }
  _index(t) {
    this._flush(t);
    if (!this.idx) this.idx = {};
    if (!this.idx[t]) this.idx[t] = xlsmIndexCells(this.sheet(t));
    return this.idx[t];
  }
  // Writes are buffered and applied in ONE rebuild per sheet. Injecting a bid sets
  // ~22,000 cells; doing each as its own scan-and-splice of a 1MB string took 26s
  // and froze the tab.
  set(t, addr, value, isBool) {
    if (!this.pend) this.pend = {};
    (this.pend[t] = this.pend[t] || new Map()).set(addr, { value, isBool });
  }
  _flush(t) {
    const w = this.pend && this.pend[t];
    if (!w || !w.size) return;
    delete this.pend[t];
    if (this.idx) delete this.idx[t];
    const xml = this.sheet(t);
    const pos = new Map();
    const re = /<c r="([A-Z]+\d+)"(?:[^>]*?\/>|[^>]*?>[\s\S]*?<\/c>)/g;
    let m;
    while ((m = re.exec(xml))) pos.set(m[1], { start: m.index, end: re.lastIndex, node: m[0] });
    const edits = [], missing = [];
    for (const [addr, v] of w) {
      const hit = pos.get(addr);
      if (hit) {
        const st = /s="(\d+)"/.exec(hit.node.slice(0, hit.node.indexOf('>')));
        edits.push({ start: hit.start, end: hit.end, text: xlsmMakeCell(addr, v.value, st ? st[1] : null, v.isBool) });
      } else if (v.value !== null && v.value !== undefined && v.value !== '') {
        missing.push([addr, v]);                 // cell absent from the template: rare
      }                                          // blanking an absent cell is a no-op
    }
    edits.sort((a, b) => a.start - b.start);
    let out = '', cur = 0;
    for (const e of edits) { out += xml.slice(cur, e.start) + e.text; cur = e.end; }
    this.xml[t] = out + xml.slice(cur);
    for (const [addr, v] of missing) this.xml[t] = xlsmSetCell(this.xml[t], addr, v.value, v.isBool);
  }
  flushAll() { for (const t of Object.keys(this.pend || {})) this._flush(t); }
  get(t, addr) { return xlsmNodeValue(this._index(t).get(addr), this.shared); }
  getF(t, addr) { return xlsmNodeFormula(this._index(t).get(addr)); }
  forceRecalc() {
    let wb = new TextDecoder().decode(this.parts.get('xl/workbook.xml'));
    wb = wb.replace(/<calcPr[^>]*\/>/, '<calcPr calcId="191028" fullCalcOnLoad="1"/>');
    this.parts.set('xl/workbook.xml', new TextEncoder().encode(wb));
    this.parts.delete('xl/calcChain.xml');
    let ct = new TextDecoder().decode(this.parts.get('[Content_Types].xml'));
    ct = ct.replace('<Override PartName="/xl/calcChain.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.calcChain+xml"/>', '');
    this.parts.set('[Content_Types].xml', new TextEncoder().encode(ct));
  }
  async build() {
    this.flushAll();
    const enc = new TextEncoder();
    for (const [t, xml] of Object.entries(this.xml)) this.parts.set(this._path(t), enc.encode(xml));
    const files = this.order.filter(n => this.parts.has(n)).map(n => ({ name: n, bytes: this.parts.get(n) }));
    return await zipCreateDeflate(files);
  }
}

// DEFLATE-capable zip writer (falls back to STORE without CompressionStream)
async function zipCreateDeflate(files) {
  if (typeof CompressionStream === 'undefined') return zipCreate(files);
  const out = [];
  for (const f of files) {
    const cs = new CompressionStream('deflate-raw');
    const buf = await new Response(new Blob([f.bytes]).stream().pipeThrough(cs)).arrayBuffer();
    out.push({ name: f.name, bytes: f.bytes, comp: new Uint8Array(buf) });
  }
  const enc = new TextEncoder();
  const chunks = [];
  const central = [];
  let offset = 0;
  const push = (b) => { chunks.push(b); offset += b.length; };
  const u16 = (v) => new Uint8Array([v & 255, (v >> 8) & 255]);
  const u32 = (v) => new Uint8Array([v & 255, (v >> 8) & 255, (v >> 16) & 255, (v >>> 24) & 255]);
  for (const f of out) {
    const nameB = enc.encode(f.name);
    const crc = crc32(f.bytes);
    const local = offset;
    push(new Uint8Array([0x50, 0x4B, 0x03, 0x04])); push(u16(20)); push(u16(0x0800)); push(u16(8));
    push(u16(0)); push(u16(0x5821)); push(u32(crc)); push(u32(f.comp.length)); push(u32(f.bytes.length));
    push(u16(nameB.length)); push(u16(0)); push(nameB); push(f.comp);
    central.push({ nameB, crc, csize: f.comp.length, usize: f.bytes.length, local });
  }
  const cdStart = offset;
  for (const c of central) {
    push(new Uint8Array([0x50, 0x4B, 0x01, 0x02])); push(u16(20)); push(u16(20)); push(u16(0x0800)); push(u16(8));
    push(u16(0)); push(u16(0x5821)); push(u32(c.crc)); push(u32(c.csize)); push(u32(c.usize));
    push(u16(c.nameB.length)); push(u16(0)); push(u16(0)); push(u16(0)); push(u16(0)); push(u32(0)); push(u32(c.local)); push(c.nameB);
  }
  const cdSize = offset - cdStart;
  push(new Uint8Array([0x50, 0x4B, 0x05, 0x06])); push(u16(0)); push(u16(0)); push(u16(central.length)); push(u16(central.length));
  push(u32(cdSize)); push(u32(cdStart)); push(u16(0));
  const total = chunks.reduce((n, c) => n + c.length, 0);
  const outB = new Uint8Array(total);
  let o = 0;
  for (const c of chunks) { outB.set(c, o); o += c.length; }
  return outB;
}

// ---------- inject (bid -> workbook) — mirror of validated inject.py ----------
const XLSM_NUM = (v) => {
  if (v === null || v === undefined || v === '') return null;
  if (typeof v === 'string' && v.trim() === '') return null;
  const n = Number(v); return isFinite(n) ? n : null;
};
// Every user-input cell the export clears before injecting the bid.
function* xlsmBlankCells() {
  for (const [title, cells] of Object.entries(COMPANY.xlsmBlank)) {
    for (const addr of cells) yield [title, addr];
  }
  for (const tg of COMPANY.takeoffGroupRows) {
    yield ['TakeOff', 'F' + tg.headerRow];
    yield ['TakeOff', 'K' + tg.headerRow];
    yield ['TakeOff', 'D' + (tg.headerRow + 2)];
    for (let row = tg.itemsStart; row <= tg.itemsEnd; row++) {
      for (const col of ['A', 'B', 'C', 'D', 'E', 'F', 'G', 'I', 'J', 'L', 'N', 'P', 'Q', 'R']) yield ['TakeOff', col + row];
    }
  }
  yield ['TakeOff', 'F9'];
  for (let rr = 9; rr <= 80; rr++) for (const col of ['A', 'B', 'C', 'D', 'E', 'F', 'G', 'I', 'K']) yield ['SM Import', col + rr];
  for (const row of [4, 6, 8, 10, 12]) { yield ['Work Recovery', 'D' + row]; yield ['Work Recovery', 'F' + row]; }
  // per-bid custom phase-code slots from the template job
  for (const addr of COMPANY.phaseCustomSlots) yield ['Phase Codes', addr];
  // proposal quick-list marks — both picker columns drive the D39 concat formula
  for (let rr = 17; rr <= 34; rr++) { yield ['Proposal', 'W' + rr]; yield ['Proposal', 'Z' + rr]; }
}
// The workbook's D39 exclusions formula tests Z18:Z34 and skips Z17, so its
// first second-picker item is unselectable in Excel. Insert the missing term
// right after the W/X run. Called ONLY when that item is picked, so every other
// export keeps the original formula exactly.
function xlsmPatchD39(doc) {
  const f = doc.getF('Proposal', 'D39');
  if (!f || /Z17=/.test(f)) return;
  const m = /IF\(Z18="","",", "&AA18\)/.exec(f);
  if (!m) return;                                  // unrecognised template: leave it alone
  const patched = f.slice(0, m.index) + 'IF(Z17="","",", "&AA17)&' + f.slice(m.index);
  doc.set('Proposal', 'D39', { f: '=' + patched });
}

function xlsmBlankAll(doc) {
  for (const [title, addr] of xlsmBlankCells()) doc.set(title, addr, null);
}

function excelSerial(dateStr) {
  if (!dateStr) return null;
  const d = new Date(dateStr + 'T00:00:00Z');
  if (isNaN(d)) return null;
  return Math.round((d.getTime() - Date.UTC(1899, 11, 30)) / 86400000);
}
function fromExcelSerial(n) {
  if (n == null || !isFinite(n)) return '';
  const d = new Date(Date.UTC(1899, 11, 30) + n * 86400000);
  return d.toISOString().slice(0, 10);
}

  doc.set(B, 'D6', info.state || null);
  doc.set(B, 'E6', info.zip || null);
  doc.set(B, 'C10', bid.booking.certifiedPayroll === 'Yes' ? 1 : 2);
  doc.set(B, 'B16', bid.booking.bookingType === 'Original' ? 1 : 2);
  doc.set(B, 'G8', bid.booking.contract || null);
  const divCols = { 1: 'B', 2: 'C', 3: 'D', 4: 'E', 5: 'F', 6: 'G', 7: 'H', 8: 'I' };
  for (const [code, descr] of Object.entries(bid.phaseCustom || {})) {
    const m = /^(\d)-(\d\d)$/.exec(code);
    if (!m || !descr) continue;
    doc.set('Phase Codes', divCols[m[1]] + (3 + +m[2]), descr);
  }
  // stray whitespace-only strings carried from an imported workbook (see xlsmReadBid)
  for (const [t, cells] of Object.entries(bid.xlsmSpaces || {})) {
    for (const [a, v] of Object.entries(cells)) if (doc.get(t, a) == null) doc.set(t, a, v);
  }
}

async function exportXlsm() {
  try { app.saveNow(); } catch (e) { }
  const pr = progressStart('Building spreadsheet');
  try {
    await pr.step(0.15, 'Opening the workbook template');
    const parts = await templateParts();
    const doc = new XlsmDoc(parts.map(p => ({ name: p.name, bytes: p.bytes })));
    await pr.step(0.4, 'Filling in this bid');
    xlsmInject(doc, app.bid);
    doc.forceRecalc();
    await pr.step(0.65, 'Writing the sheets');
    const bytes = await doc.build();
    await pr.step(1, 'Saving');
    downloadBytes(bidFileBase(app.bid) + '.xlsm', bytes, 'application/vnd.ms-excel.sheet.macroEnabled.12');
    toast('Exported ' + bidFileBase(app.bid) + '.xlsm — opens in Excel exactly like the original workbook');
  } finally { pr.done(); }
}

// ---------- read (workbook -> bid) — mirror of validated read_bid.py ----------
function xlsmReadBid(doc) {
  const g = (t, a) => doc.get(t, a);
  const s = (v) => v == null ? '' : String(v);
  const n = (v) => (v == null || v === '' || typeof v === 'boolean' || (typeof v === 'string' && v.trim() === '')) ? null : (isFinite(Number(v)) ? Number(v) : null);
  const S = 'MCAA RECAP';
  const bid = makeNewBid(effectiveSettings());
  bid.info.estNo = s(g(S, 'B7'));
  bid.info.jobName = s(g(S, 'H6'));
  bid.info.location = s(g(S, 'H7'));
  bid.info.projectType = s(g(S, 'N5')) || 'Commercial';
  bid.info.projectSqFt = n(g(S, 'N6'));
  bid.info.materialLbs = n(g(S, 'N7'));
  bid.info.jobNumber = s(g('Booking Report', 'F2'));
  bid.info.address = s(g('Booking Report', 'C5'));
  bid.info.city = s(g('Booking Report', 'C6'));
  bid.info.state = s(g('Booking Report', 'D6'));
  bid.info.zip = s(g('Booking Report', 'E6'));
  const r = bid.recap;
  r.scheduleType = s(g(S, 'C17')) || "5 8's";
  r.lop58 = n(g(S, 'O21')) || 0;
  for (let i = 0; i < 5; i++) {
    r.mods.plumb[i] = n(g(S, 'B' + (12 + i))) || 0;
    r.mods.pipe[i] = n(g(S, 'C' + (12 + i))) || 0;
    r.mods.sm[i] = n(g(S, 'D' + (12 + i))) || 0;
    r.mods.shop[i] = n(g(S, 'I' + (12 + i))) || 0;
  }
  r.mods.shop[5] = n(g(S, 'I17')) || 0;
  r.archHrsInSM = n(g(S, 'D27')) || 0;
  r.ocipToggle = s(g(S, 'B26')) || 'No OCIP';
  r.subs[0].qp = s(g(S, 'I36'));
  r.subs[0].value = n(g(S, 'J36'));
  for (let k = 1; k < 9; k++) {
    r.subs[k] = { name: s(g(S, 'B' + (36 + k))), fixedCode: null, desc: '', qp: s(g(S, 'I' + (36 + k))), value: n(g(S, 'J' + (36 + k))) };
  }
  for (let i = 0; i < 5; i++) r.supPct[i] = n(g(S, 'E' + (48 + i))) || 0;
  r.miscContingency = n(g(S, 'H65'));
  r.bondRequired = s(g(S, 'A66')) || 'No';
  r.taxType = s(g(S, 'E68')) || 'Oregon CAT Tax';
  r.addDeduct = n(g(S, 'I69'));
  r.subMarkup = n(g(S, 'G60')) || 0;
  r.equipMarkup = n(g(S, 'G61')) || 0;
  r.ohp = n(g(S, 'G62')) || 0;
  for (const [key, row] of [['plumbing', 77], ['hvac', 78], ['medGas', 79], ['boiler', 80], ['specialInsp', 81]]) {
    r.permitsManual[key] = n(g(S, 'J' + row));
  }
  r.trucking = { hrs: n(g(S, 'E81')), loads: n(g(S, 'F81')), rate: null };
  r.gc.safetyPct = n(g(S, 'G78')) || 0;
  r.gc.smallToolsPct = n(g(S, 'G79')) || 0;
  r.gc.freightPct = n(g(S, 'G80')) || 0;
  r.gc.miscPct = n(g(S, 'G106')) || 0;
  COMPANY.gcRows.forEach((gr, i) => {
    const row = 82 + i;
    const entry = {};
    if (gr.key === 'cadOperator') {
      const q = n(g(S, 'D102')), d = n(g(S, 'E102'));
      if (q != null) entry.qty = q;
      if (d != null) entry.dur = d;
    } else {
      const q = n(g(S, 'F' + row));
      if (q != null) entry.qty = q;
    }
    const rate = n(g(S, 'G' + row));
    if (rate != null && gr.rateFrom !== 'journeyman' && !doc.getF(S, 'G' + row)) entry.rate = rate;
    if (Object.keys(entry).length) r.gc.rows[gr.key] = entry;
    if (gr.editableLabel) {
      const lbl = s(g(S, 'B' + row));
      if (lbl && lbl !== gr.label) r.gc.labels[gr.key] = lbl;
    }
  });
  r.equipment = [];
  r.equipmentNames = [];
  for (let i = 0; i < 16; i++) {
    const row = 114 + i;
    r.equipment.push({ qty: n(g(S, 'G' + row)), dur: n(g(S, 'H' + row)), rate: n(g(S, 'I' + row)) });
    r.equipmentNames.push(row >= 127 ? s(g(S, 'B' + row)) : '');
  }
  r.storedTotal = n(g(S, 'N70'));

  const C = 'Crew Mix';
  const qtyArr = (start, count) => Array.from({ length: count }, (_, i) => n(g(C, 'C' + (start + i))));  // null = blank, 0 = explicit
  bid.crewMix.smField.qty = qtyArr(11, 9);
  bid.crewMix.smShop.qty = qtyArr(74, 9);
  bid.crewMix.plumberFitter.qty = qtyArr(137, 8);
  bid.crewMix.smField.pfST = n(g(C, 'H9'));
  bid.crewMix.smShop.pfST = doc.getF(C, 'H72') ? null : n(g(C, 'H72'));   // formula = inherits H9
  bid.crewMix.plumberFitter.pfST = n(g(C, 'H135'));
  bid.crewMix.smShop.burdenST = n(g(C, 'I85'));

  const T = 'TakeOff';
  bid.takeoff.caeType = s(g(T, 'F9'));
  const groups = [];
  for (const tg of COMPANY.takeoffGroupRows) {
    const name = s(g(T, 'D' + (tg.headerRow + 2)));
    const typ = s(g(T, 'F' + tg.headerRow));
    const exc = g(T, 'K' + tg.headerRow) === true;
    const items = [];
    for (let row = tg.itemsStart; row <= tg.itemsEnd; row++) {
      const nv = (a) => { const v = n(g(T, a + row)); return v == null ? '' : v; };
      const lf = doc.getF(T, 'L' + row);   // typed arithmetic like 20916+28200 — keep it
      const it = {
        matPhase: s(g(T, 'A' + row)), shopPhase: s(g(T, 'B' + row)), fieldPhase: s(g(T, 'C' + row)),
        desc: s(g(T, 'D' + row)), qty: nv('E'), fUnit: nv('F'), fMult: nv('G'),
        sUnit: nv('I'), sMult: nv('J'), mUnit: nv('L'),
        notes: s(g(T, 'N' + row)), emo: s(g(T, 'P' + row)), ot: s(g(T, 'Q' + row)), shift: s(g(T, 'R' + row)),
      };
      if (lf && /^[-+*/().\d\s]+$/.test(lf)) {
        it.mUnitExpr = '=' + lf;
        if (it.mUnit === '') { const ev = evalExpr(it.mUnitExpr); if (ev != null) it.mUnit = ev; }
      }
      it.rowOffset = row - tg.itemsStart;            // preserve original row position
      items.push(it);
    }
    const emptyIt = (it) => !(it.matPhase || it.shopPhase || it.fieldPhase || it.desc || it.notes ||
      it.emo || it.ot || it.shift || it.qty !== '' || it.fUnit !== '' || it.sUnit !== '' || it.mUnit !== '');
    // drop blank spacer rows entirely; rowOffset keeps every kept item at its original position
    for (let k = items.length - 1; k >= 0; k--) if (emptyIt(items[k])) items.splice(k, 1);
    if (name || typ || items.length || exc) groups.push({ id: tg.id, name, type: typ, exclude: exc, items });
  }
  bid.takeoff.groups = groups.length ? groups : bid.takeoff.groups;

  bid.smImport.rows = [];
  for (let rr = 9; rr <= 80; rr++) {
    const row = {
      floor: s(g('SM Import', 'A' + rr)), service: s(g('SM Import', 'B' + rr)),
      type: s(g('SM Import', 'C' + rr)), material: s(g('SM Import', 'D' + rr)), cutType: s(g('SM Import', 'E' + rr)),
      qty: n(g('SM Import', 'F' + rr)) ?? '', fieldHoursRaw: n(g('SM Import', 'G' + rr)) ?? '',
      shopHoursRaw: n(g('SM Import', 'I' + rr)) ?? '', materialCost: n(g('SM Import', 'K' + rr)) ?? '',
      fieldPct: '', shopPct: '',
    };
    const lp = n(g('SM Import', 'L' + rr)), np = n(g('SM Import', 'N' + rr));
    if (lp != null && lp !== 1) row.fieldPct = lp;
    if (np != null && np !== 1) row.shopPct = np;
    if (row.type || row.material || row.qty !== '' || row.fieldHoursRaw !== '' || row.materialCost !== '') bid.smImport.rows.push(row);
  }

  for (const [key, row] of [['smField', 4], ['smShop', 6], ['arch', 8], ['plumber', 10], ['fitter', 12]]) {
    const e = {};
    const rate = n(g('Work Recovery', 'D' + row)), mx = n(g('Work Recovery', 'F' + row));
    if (rate != null) e.rate = rate;
    if (mx != null) e.maxHrs = mx;
    bid.workRecovery[key] = e;
  }

  const selBack = { 1: 'portland', 2: 'hillsboro', 3: 'clackamas', 4: 'custom', 5: 'none', 6: 'tualatin', 0: 'none' };
  const sel = n(g('Permits', 'R1'));
  bid.permitCalc.selection = selBack[sel ?? 5] || 'none';
  bid.permitCalc.custom.tiers = bid.permitCalc.custom.tiers.map((t, i) => {
    const rr = 25 + i;
    return {
      min: i === 0 ? 0 : (n(g('Permits', 'K' + rr)) ?? t.min),
      max: n(g('Permits', 'L' + rr)) ?? t.max,
      fee: n(g('Permits', 'M' + rr)) ?? t.fee,
      inc: n(g('Permits', 'N' + rr)) ?? t.inc,
    };
  });
  bid.permitCalc.custom.planReviewPct = n(g('Permits', 'P33')) ?? 0.65;
  bid.permitCalc.custom.markupPct = n(g('Permits', 'P35')) ?? 0.05;

  // Takeoff Notes back
  bid.notes = [];
  for (let rr = 7; rr <= 46; rr++) {
    const nt = {
      num: rr - 6, service: s(g('Takeoff Notes', 'C' + rr)), desc: s(g('Takeoff Notes', 'D' + rr)),
      impact: g('Takeoff Notes', 'E' + rr) ? 'Y' : (g('Takeoff Notes', 'F' + rr) ? 'N' : ''),
      est: n(g('Takeoff Notes', 'G' + rr)), strategy: s(g('Takeoff Notes', 'H' + rr)), rfi: s(g('Takeoff Notes', 'I' + rr)),
    };
    if (nt.desc || nt.strategy || nt.est != null) bid.notes.push(nt);
  }
  if (!bid.notes.length) bid.notes = Array(10).fill(0).map((_, i) => ({ num: i + 1, service: '', desc: '', impact: '', est: null, strategy: '', rfi: '' }));

  const cp = g('Booking Report', 'C10');
  bid.booking.certifiedPayroll = cp === 1 ? 'Yes' : 'No';
  const bt = g('Booking Report', 'B16');
  bid.booking.bookingType = bt === 2 ? 'Change' : 'Original';
  bid.booking.contract = s(g('Booking Report', 'G8')) || 'Lump Sum';

  // MCAA notes cells
  bid.recap.mcaaNotes = {
    misc: s(g(S, 'L65')), bond: s(g(S, 'L66')), tax: s(g(S, 'L68')), gcMisc: s(g(S, 'L106')),
  };

  // Proposal scope + quick-list marks
  const scope = s(g('Proposal', 'B17'));
  if (scope) bid.proposal.scope = scope;
  bid.proposal.exclusionsPicked = [];
  (COMPANY.proposal.exclusionPicker || []).forEach((name, idx) => {
    if (g('Proposal', 'W' + (17 + idx))) bid.proposal.exclusionsPicked.push(name);
  });
  bid.proposal.inclusionsPicked = [];
  (COMPANY.proposal.inclusionOptions || []).forEach((name, idx) => {
    if (g('Proposal', 'Z' + (17 + idx))) bid.proposal.inclusionsPicked.push(name);
  });

  // OCIP form state
  bid.ocipForm.applicantType = n(g('OCIP', 'Y18')) || 1;
  bid.ocipForm.contractWith = n(g('OCIP', 'Y50')) || 3;
  bid.ocipForm.subcontractWork = n(g('OCIP', 'Y54')) || 1;
  bid.ocipForm.bidType = n(g('OCIP', 'Y123')) || 1;
  bid.ocipForm.contractType = n(g('OCIP', 'Y130')) || 2;
  bid.ocipForm.combinedRate = n(g('OCIP', 'Y157')) || 1;
  const pkgNo = s(g('OCIP', 'M8'));
  bid.ocipForm.bidPackageNo = pkgNo === 'XXXXXXXXXX' ? '' : pkgNo;

  // SM Schedule tasks
  const pmTxt = s(g('SM Schedule', 'A2'));
  bid.schedule.pm = pmTxt.replace(/^PROJECT MANAGER:\s*/i, '');
  const altS = n(g('SM Schedule', 'M1'));
  bid.schedule.altStart = altS != null ? fromExcelSerial(altS) : null;
  bid.schedule.packages = [];
  for (let pi = 0; pi < 19; pi++) {
    const base = 4 + pi * 11;
    const pkgName = s(g('SM Schedule', 'C' + base));
    const tasks = [];
    for (let ti = 0; ti < 10; ti++) {
      const row = base + 1 + ti;
      const t = {
        desc: s(g('SM Schedule', 'C' + row)), manpower: n(g('SM Schedule', 'D' + row)),
        start: n(g('SM Schedule', 'E' + row)) != null ? fromExcelSerial(n(g('SM Schedule', 'E' + row))) : '',
        finish: n(g('SM Schedule', 'F' + row)) != null ? fromExcelSerial(n(g('SM Schedule', 'F' + row))) : '',
        status: s(g('SM Schedule', 'G' + row)).trim(),
        actualFinish: n(g('SM Schedule', 'H' + row)) != null ? fromExcelSerial(n(g('SM Schedule', 'H' + row))) : '',
        notes: s(g('SM Schedule', 'I' + row)),
      };
      if (t.start || t.finish || t.manpower != null || (t.desc && !/^Task [A-J]$/.test(t.desc))) tasks.push(t);
    }
    if (tasks.length) bid.schedule.packages.push({ name: pkgName || 'Package ' + (pi + 1), tasks });
  }

  // custom phase-code descriptions: any description differing from company standard
  const divCols = { 1: 'B', 2: 'C', 3: 'D', 4: 'E', 5: 'F', 6: 'G', 7: 'H', 8: 'I' };
  for (const d of COMPANY.phaseCodes.divisions) {
    for (let code = 1; code <= 99; code++) {
      const cc = String(code).padStart(2, '0');
      const std = (d.descriptions[cc] || {}).d || '';
      const cur = s(g('Phase Codes', divCols[d.div] + (3 + code)));
      if (cur && cur !== std) bid.phaseCustom[d.div + '-' + cc] = cur;
    }
  }

  // Cells holding only whitespace (someone typed a space in the workbook): keep them
  // so a re-export reproduces the imported file exactly.
  bid.xlsmSpaces = {};
  for (const [t, a] of xlsmBlankCells()) {
    const v = g(t, a);
    if (typeof v === 'string' && v !== '' && v.trim() === '') {
      (bid.xlsmSpaces[t] = bid.xlsmSpaces[t] || {})[a] = v;
    }
  }
  return bid;
}

async function importXlsmFile(bytes, pr) {
  const entries = await zipRead(bytes);
  if (!entries.find(e => e.name === 'xl/workbook.xml')) throw new Error('Not an Excel workbook');
  const doc = new XlsmDoc(entries);
  // sanity: must be the Arctic estimate template (sheet17 = MCAA RECAP with the recap title)
  if (!doc.parts.has('xl/worksheets/sheet17.xml')) throw new Error('This workbook does not look like the Arctic estimate template');
  if (pr) await pr.step(0.6, 'Reading recap, takeoff, crew and booking cells');
  return xlsmReadBid(doc);
}

function openBid(id) {
  const bid = store.loadBid(id);
  if (!bid) { toast('Could not load that bid', true); return; }
  app.bid = migrateBid(bid);
  app.dirty = false;
  app.baseSavedAt = bid.meta.savedAt || null;
  localStorage.setItem(store.KEY_ACTIVE, id);
  app.resetHistory();
  app.recalc();
  router.go('recap');
  router.render();
}

  const S = effectiveSettings();
  const bid = makeNewBid(S);

  store.saveBid(bid);
  openBid(bid.meta.id);

}

    list.append(btns);
    list.append(xlsmBtns);
    v.append(el('div', { class: 'card' }, el('h2', {}, 'Import'), el('div', { class: 'pad' },
      el('p', {}, 'Load a bid from a file that was exported here (older or newer revision). You will see exactly what is different before anything is overwritten.'),
      el('button', { class: 'btn sec', onclick: () => $('#fileImport').click() }, '⬆ Import bid (.pdf / .zip / .json)'))));
  },
};

// ---------- boot ----------
async function boot() {
  $('#logoImg').src = 'data:image/png;base64,' + ASSETS.wordmark;
  // Excel-like: focusing a bound numeric cell selects its content
  document.addEventListener('focusin', (e) => {
    const t = e.target;
    if (t && t.dataset && t.dataset.path && t.select && t.classList.contains('num')) {
      setTimeout(() => { try { t.select(); } catch (err) { } }, 0);
    }
  });
  $('#verLabel').textContent = 'v' + APP_VERSION + ' — replaces REV_1 estimate workbook';
  // tab icon: swap the placeholder monogram for the company seal (bytes already embedded)
  const favi = document.querySelector('link[rel=icon]');
  if (favi && typeof ASSETS !== 'undefined' && ASSETS.seal) favi.href = 'data:image/jpeg;base64,' + ASSETS.seal;
  $('#btnSave').addEventListener('click', () => { app.saveNow(true); toast('Saved'); });
  installGridNav();            // Enter/arrows move between grid cells, Ctrl+D fills down
  $('#btnUndo').addEventListener('click', () => app.undo());
  $('#btnRedo').addEventListener('click', () => app.redo());
  document.addEventListener('keydown', (e) => {
    if (!(e.ctrlKey || e.metaKey) || e.altKey) return;
    const k = e.key.toLowerCase();
    if (k === 'z' && !e.shiftKey) { e.preventDefault(); app.undo(); }
    else if ((k === 'z' && e.shiftKey) || k === 'y') { e.preventDefault(); app.redo(); }
  });
  $('#fileImport').addEventListener('change', async (e) => {
    await handleImportFiles(Array.from(e.target.files));
    e.target.value = '';
  });
  // The rates and the workbook are not in this page — they come from the company
  // file. Without it there is nothing to price a bid with, so ask for it first.
  let companyRec = null;
  try { companyRec = await companyRestore(); } catch (e) { console.warn('company file:', e.message); }
  if (!COMPANY) {
    $('#bidName').innerHTML = '<b>Setup needed</b>Load the Arctic company file';
    $('#pageTitle').textContent = 'Setup';
    renderCompanySetup(() => location.reload());
    return;
  }

  // restore last open bid
  const activeId = localStorage.getItem(store.KEY_ACTIVE);
  if (activeId && store.loadBid(activeId)) {
    const stored = store.loadBid(activeId);
    app.bid = migrateBid(stored);
    app.dirty = false;
    app.baseSavedAt = stored.meta.savedAt || null;
    app.resetHistory();
    app.recalc();
  }
  if (!location.hash) location.replace('#/home');
  router.render();
}
document.addEventListener('DOMContentLoaded', boot);

</script>

<!-- ============================================================
     DINGUS HOST BRIDGE  (added by Specs-Submittals; not part of upstream arctic-mech/bids)
     When this estimator is opened from The Dingus with ?dingus=<token>, it loads the
     handed-off estimate spreadsheet as the active bid and writes the edited spreadsheet
     back so The Dingus can file it. Same-origin localStorage + BroadcastChannel are the
     channel. With no ?dingus param this whole block is inert — the page is the normal tool.
     ============================================================ -->
<script>
(function () {
  'use strict';
  var HANDOFF_KEY = 'dingus.est.handoff';
  var RESULT_KEY  = function (estId) { return 'dingus.est.result.' + estId; };
  var params = new URLSearchParams(location.search);
  if (!params.has('dingus')) return;                 // not launched from The Dingus → normal tool
  var token = params.get('dingus');

  function b64FromBytes(bytes) {                     // chunked (avoids call-stack overflow on big files)
    var bin = '', CH = 0x8000;
    for (var i = 0; i < bytes.length; i += CH) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + CH));
    return btoa(bin);
  }
  function bytesFromB64(b64) {
    var bin = atob(b64), out = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }
  function readHandoff() {
    try { var h = JSON.parse(localStorage.getItem(HANDOFF_KEY) || 'null'); return (h && h.token === token) ? h : null; }
    catch (e) { return null; }
  }
  // Build the .xlsm bytes for the current bid (same steps exportXlsm() uses, minus the download).
  async function buildXlsmBytes() {
    var parts = await templateParts();
    var doc = new XlsmDoc(parts.map(function (p) { return { name: p.name, bytes: p.bytes }; }));
    xlsmInject(doc, app.bid);
    doc.forceRecalc();
    return await doc.build();
  }
  var HELLO = null, banner = null, lastResultTs = 0;
  function writeResult(reason) {
    if (!HELLO || !app.bid || (app.bid.meta && app.bid.meta.dingusEstId !== HELLO.estId)) return Promise.resolve(false);
    return buildXlsmBytes().then(function (bytes) {
      var total = (app.computed && app.computed.recap) ? app.computed.recap.totalBid : (app.bid.meta.lastTotal || 0);
      var payload = { estId: HELLO.estId, jobId: HELLO.jobId, name: HELLO.name, total: total, xlsmB64: b64FromBytes(bytes), ts: Date.now(), reason: reason || '' };
      try { localStorage.setItem(RESULT_KEY(HELLO.estId), JSON.stringify(payload)); } catch (e) { toast('Could not hand the estimate back — browser storage is full.', true); return false; }
      lastResultTs = payload.ts;
      try { var bc = new BroadcastChannel('dingus-estimator'); bc.postMessage({ type: 'saved', estId: HELLO.estId, ts: payload.ts }); bc.close(); } catch (e) {}
      return true;
    }).catch(function (e) { console.error('dingus writeResult:', e); return false; });
  }
  function showBanner() {
    if (banner) return;
    banner = el('div', { class: 'dingus-bar', style: 'position:sticky;top:0;z-index:50;display:flex;gap:10px;align-items:center;justify-content:space-between;padding:8px 14px;background:#0b5;color:#fff;font:600 13px system-ui' },
      el('span', {}, 'Editing “' + (HELLO.name || 'estimate') + '” from The Dingus — changes save back automatically.'),
      el('button', { class: 'btn sm', style: 'background:#fff;color:#0a4', onclick: doneAndReturn }, '✓ Done — back to The Dingus'));
    document.body.insertBefore(banner, document.body.firstChild);
  }
  async function doneAndReturn() {
    try { app.saveNow(true); } catch (e) {}
    await writeResult('done');
    toast('Saved back to The Dingus.');
    setTimeout(function () {
      try { window.close(); } catch (e) {}
      if (HELLO && HELLO.returnUrl && !window.closed) location.href = HELLO.returnUrl;
    }, 250);
  }
  // Persist a result whenever the user leaves the tab, so The Dingus (which reconciles on
  // focus) always sees the latest even if they never click the button.
  window.addEventListener('pagehide', function () { writeResult('pagehide'); });
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'hidden') writeResult('hidden'); });
  // Debounced mirror on every edit: pigg-back on the app's own save timer cadence.
  var _mirrorTimer = null;
  function scheduleMirror() { clearTimeout(_mirrorTimer); _mirrorTimer = setTimeout(function () { writeResult('autosave'); }, 1500); }

  async function activate() {
    // wait for the app to finish booting + the company file to be present
    for (var i = 0; i < 200 && (typeof app === 'undefined' || typeof COMPANY === 'undefined'); i++) await new Promise(function (r) { setTimeout(r, 50); });
    if (typeof COMPANY === 'undefined' || !COMPANY) {           // needs the one-time company file first
      var t = setInterval(function () { if (typeof COMPANY !== 'undefined' && COMPANY) { clearInterval(t); activate(); } }, 500);
      return;
    }
    var h = readHandoff();
    if (!h) { toast('Could not find the estimate handed over from The Dingus — open it again from there.', true); return; }
    HELLO = h;
    try {
      var pr = (typeof progressStart === 'function') ? progressStart('Opening estimate from The Dingus') : null;
      if (pr) await pr.step(0.3, 'Reading the spreadsheet');
      var bid;
      if (h.xlsmB64) { bid = await importXlsmFile(bytesFromB64(h.xlsmB64), pr); }
      else { bid = makeNewBid(effectiveSettings()); }
      // Stable id so reopening the same Dingus estimate reuses one bid instead of piling up copies.
      bid.meta.id = 'dingus-' + h.estId;
      bid.meta.dingusEstId = h.estId; bid.meta.dingusJobId = h.jobId;
      if (h.name && !bid.info.jobName) bid.info.jobName = h.name;
      store.saveBid(bid);
      if (pr) pr.done();
      openBid(bid.meta.id);
      showBanner();
      // hook the app's touch()/save cadence to mirror results back
      var origTouch = app.touch.bind(app);
      app.touch = function () { origTouch(); scheduleMirror(); };
      writeResult('opened');
      toast('Loaded “' + (h.name || bid.info.jobName || 'estimate') + '” from The Dingus.');
    } catch (e) { console.error('dingus activate:', e); toast('Could not open the estimate: ' + (e.message || e), true); }
  }
  if (document.readyState === 'complete') activate();
  else window.addEventListener('load', activate);
})();
</script>
