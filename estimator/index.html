// ===== parts/05_engine.js =====
// ============================================================
// Calculation engine — faithful port of the workbook formulas.
// calcBid(bid, S) -> computed. Pure function; UI renders from it.
// Order mirrors the workbook dependency chain:
//   crew rates -> takeoff -> indirect sheets -> MCAA recap -> outputs
// ============================================================

// Excel ROUND / ROUNDUP round away from zero; guard fp noise via toPrecision.
function xr(x, d = 2) {
  if (!isFinite(x)) return 0;
  const m = Math.pow(10, d);
  return Math.sign(x) * Math.round(Number((Math.abs(x) * m).toPrecision(12))) / m;
}
function xru(x, d = 0) {
  if (!isFinite(x)) return 0;
  const m = Math.pow(10, d);
  return Math.sign(x) * Math.ceil(Number((Math.abs(x) * m).toPrecision(12))) / m;
}
const N = (v) => { const n = Number(v); return isFinite(n) ? n : 0; }; // blank/text -> 0 like Excel SUM
const sum = (arr) => arr.reduce((a, b) => a + N(b), 0);

// Schedule-blended rate (MCAA E21/F22/G23 formula) — shared by TakeOff and Recap
function blendRate(scheduleType, st, ot) {
  switch (scheduleType) {
    case "5 8's": return st;
    case "5 10's": return (4 * st + ot) / 5;
    case "6 10's": return (4 * st + 2 * ot) / 6;
    case "60 60 50": return (12 * st + 5 * ot) / 17;
    default: return st;
  }
}

// ---------------- Crew Mix ----------------
// S.crew.sections.{smField,smShop,plumberFitter}: wage tables & burden constants (settings)
// bid.crewMix.{smField,smShop,plumberFitter}: qty per class + overridable period factors / shop burden
function ptiTotal(pti) {
  // WC% = gross × EMR × OGSERP × DCBS × OCCPAP (Crew Mix M12/M75/M138)
  const wc = pti.wc.gross * pti.wc.emr * pti.wc.ogserp * pti.wc.dcbs * pti.wc.occpap;
  return { wc, total: pti.futa + pti.sui + pti.sdi + pti.ss + pti.medic + wc + pti.countyTax + pti.gl + pti.tri + pti.fmla + pti.orSickLeave };
}

function calcCrewSection(secS, secB, kind) {
  const { total: pti } = ptiTotal(secS.pti);
  const otM = 1.5, dtM = 2.0;
  const pfST = secB.pfST ?? secS.periodFactor;
  const pfOT = secB.pfOT ?? pfST;               // H30/H51 etc. default-chain to master
  const pfDT = secB.pfDT ?? pfST;
  const roundPti = kind !== 'smShop';            // shop PT&I unrounded (quirk)
  const tiers = {};
  for (const [tier, mult, adder, pf] of [
    ['st', 1, 0, pfST],
    ['ot', otM, secS.otAdder, pfOT],
    ['dt', dtM, secS.dtAdder, pfDT],
  ]) {
    let totalQty = 0, totalDollars = 0, weighted = 0;
    const rows = secS.classes.map((cl, i) => {
      const qty = N(secB.qty[i]);
      const wage = xr(cl.wage * mult, 10);       // D32 = D11*1.5 exact
      const subtotal = wage + cl.fringe + adder;
      let ptiD = wage * pti;
      if (roundPti) ptiD = xr(ptiD, 2);
      const total = xr((subtotal + ptiD) * qty * (1 + pf), 2);
      const perHr = xr((subtotal + ptiD) * (1 + pf), 2);
      totalQty += qty; totalDollars += total; weighted += cl.weight * qty;
      return { classification: cl.name, qty, wage, fringe: cl.fringe, subtotal, pti: ptiD, total, perHr };
    });
    const avgHourly = totalQty === 0 ? 0 : totalDollars / totalQty;
    let crewRate = xr(avgHourly, 2);
    let burden = 0;
    if (kind === 'smShop') {
      burden = tier === 'st' ? (secB.burdenST ?? secS.shopBurden)
        : tier === 'ot' ? (secB.burdenOT ?? secB.burdenST ?? secS.shopBurden)
          : (secB.burdenDT ?? secB.burdenOT ?? secB.burdenST ?? secS.shopBurden);
      crewRate = xr(avgHourly + N(burden), 2);   // I86 = ROUND(I84+I85,2)
    }
    tiers[tier] = { rows, totalQty, totalDollars, avgHourly, crewRate, ratio: totalQty ? weighted / totalQty : 0, burden, pf };
  }
  return { tiers, ptiPct: pti };
}

function calcCrew(bid, S) {
  const cs = S.crew.sections;
  const cb = bid.crewMix;
  const smField = calcCrewSection(cs.smField, cb.smField, 'smField');
  const smShop = calcCrewSection(cs.smShop, cb.smShop, 'smShop');
  const pf = calcCrewSection(cs.plumberFitter, cb.plumberFitter, 'plumberFitter');

  // Shift-premium adders ($/hr). SM: Journeyman wage (class idx 3) × pct.
  const jnyWage = cs.smField.classes[3].wage;
  const smAdds = {
    swing: jnyWage * cs.smField.premium.swingPct,
    grave: jnyWage * cs.smField.premium.gravePct,
    special: jnyWage * cs.smField.premium.specialPct,
  };
  // Plumber/Fitter: avg base wage of crew × pct (D145, G146)
  const pfQty = cb.plumberFitter.qty;
  const pfTotQty = sum(pfQty);
  const pfAvgBase = pfTotQty ? xr(sum(cs.plumberFitter.classes.map((c, i) => N(pfQty[i]) * c.wage)) / pfTotQty, 2) : 0;
  const pfSwing = xr(pfAvgBase * cs.plumberFitter.premium.swingGravePct, 2);

  // OCIP deduct (Crew Mix N27): -(D13 + 4·D14 + D15)/6 × (WC + county + GL)
  const f = cs.smField, fp = ptiTotal(f.pti);
  const ocipDeductSM = -((f.classes[2].wage + 4 * f.classes[3].wage + f.classes[4].wage) / 6) * (fp.wc + f.pti.countyTax + f.pti.gl);
  const p = cs.plumberFitter, pp = ptiTotal(p.pti);
  // N153 quirk: weights 4× Foreman (idx 2) + 1× Journeyman (idx 3) + 1× 4th-yr (idx 4) — replicate as-is
  const ocipDeductPF = -((p.classes[3].wage + 4 * p.classes[2].wage + p.classes[4].wage) / 6) * (pp.wc + p.pti.countyTax + p.pti.gl);

  return {
    smField, smShop, plumberFitter: pf,
    rates: {
      smFieldStraight: smField.tiers.st.crewRate, smFieldOT: smField.tiers.ot.crewRate, smFieldDT: smField.tiers.dt.crewRate,
      smShopStraight: smShop.tiers.st.crewRate, smShopOT: smShop.tiers.ot.crewRate, smShopDT: smShop.tiers.dt.crewRate,
      pfStraight: pf.tiers.st.crewRate, pfOT: pf.tiers.ot.crewRate, pfDT: pf.tiers.dt.crewRate,
      smSwing: smAdds.swing, smGrave: smAdds.grave, smSpecial: smAdds.special,
      pfSwing, pfAvgBase,
      swingLOP: cs.plumberFitter.premium.swingLOP, graveLOP: cs.plumberFitter.premium.graveLOP,
    },
    ocipDeductSM, ocipDeductPF,
    perClassRates: { // 'Crew Mix'!I12/I13/I14/I16/I19/I138 referenced by MCAA
      smGenForeman: smField.tiers.st.rows[1].perHr,  // I12
      smForeman: smField.tiers.st.rows[2].perHr,     // I13
      journeyman: smField.tiers.st.rows[3].perHr,    // I14
      appr3: smField.tiers.st.rows[5].perHr,         // I16
      classified: smField.tiers.st.rows[8].perHr,    // I19
      pfGenForeman: pf.tiers.st.rows[1].perHr,       // I138
    },
  };
}

// ---------------- SM Import -> CAE items ----------------
function matchCae(map, row) {
  // map: {type?, typeAny?, material?, materialAny?, cutType?}
  if (map.type && row.type !== map.type) return false;
  if (map.typeAny && !map.typeAny.includes(row.type)) return false;
  if (map.material && row.material !== map.material) return false;
  if (map.materialAny && !map.materialAny.includes(row.material)) return false;
  if (map.cutType && row.cutType !== map.cutType) return false;
  if (map.cutTypeAny && !map.cutTypeAny.includes(row.cutType)) return false;
  return true;
}

function calcSmImport(bid, S) {
  // SM Import sheet: H = G × (L% or 1), J = I × (N% or 1); difficulty label from %.
  const diff = (p) => p === '' || p === null || p === undefined ? '' : (N(p) === 0 || N(p) === 1 ? 'Standard' : N(p) < 1 ? 'Easy' : 'Hard');
  const rows = bid.smImport.rows.map(r => {
    const fPct = r.fieldPct, sPct = r.shopPct;
    const fRaw = N(r.fieldHoursRaw), sRaw = N(r.shopHoursRaw);
    return {
      ...r,
      qty: N(r.qty), materialCost: N(r.materialCost),
      fieldHours: fRaw * (fPct === '' || fPct === null || fPct === undefined || N(fPct) === 0 ? 1 : N(fPct)),
      shopHours: sRaw * (sPct === '' || sPct === null || sPct === undefined || N(sPct) === 0 ? 1 : N(sPct)),
      fieldDifficulty: diff(fPct), shopDifficulty: diff(sPct),
    };
  });
  const totals = {
    qty: sum(rows.map(r => r.qty)),
    fieldHours: sum(rows.map(r => r.fieldHours)),
    shopHours: sum(rows.map(r => r.shopHours)),
    materialCost: sum(rows.map(r => r.materialCost)),
  };
  return { rows, totals };
}

function buildCaeItems(smi, S) {
  const items = [];
  const used = { qty: 0, fh: 0, sh: 0, mat: 0 };
  for (const m of S.ref.caeMap) {
    const rowsQ = smi.rows.filter(r => matchCae(m.qtyCrit || m.crit, r));
    const rowsH = smi.rows.filter(r => matchCae(m.hoursCrit || m.crit, r));
    const it = {
      matPhase: m.matPhase, shopPhase: m.shopPhase, fieldPhase: m.fieldPhase,
      desc: m.label,
      qty: sum(rowsQ.map(r => r.qty)),
      fieldHours: sum(rowsH.map(r => r.fieldHours)),
      shopHours: sum(rowsH.map(r => r.shopHours)),
      material: sum(rowsQ.map(r => r.materialCost)),
    };
    used.qty += it.qty; used.fh += it.fieldHours; used.sh += it.shopHours; used.mat += it.material;
    items.push(it);
  }
  // Row 34 Miscellaneous remainder
  items.push({
    matPhase: '2-07', shopPhase: '2-07', fieldPhase: '3-07', desc: 'Miscellaneous',
    qty: smi.totals.qty - used.qty,
    fieldHours: smi.totals.fieldHours - used.fh,
    shopHours: smi.totals.shopHours - used.sh,
    material: Math.abs(smi.totals.materialCost - used.mat),
  });
  return items;
}

// ---------------- TakeOff ----------------
function calcTakeoff(bid, S, crew, smi) {
  const R = crew.rates;
  // TakeOff rate rows U2:AF4. Quirk: the SM field STRAIGHT cost rate is the
  // SCHEDULE-BLENDED rate (TakeOff!U2 = CrewRate_SMField = MCAA!G23), with the
  // OT/DT adds measured against that blended base (V2 = SMField_Overtime - CrewRate_SMField).
  // Plumb/Pipe use the un-blended straight rate as their base (TakeOff!U3 = CrewRate_PlumbFitter_Straight).
  const sched = bid.recap && bid.recap.scheduleType;
  const smFieldBlended = blendRate(sched, R.smFieldStraight, R.smFieldOT);
  const fieldRates = {
    'Sheet Metal Takeoff': { str: smFieldBlended, ot: R.smFieldOT - smFieldBlended, dt: R.smFieldDT - smFieldBlended, swing: R.smSwing, grave: R.smGrave, special: R.smSpecial },
    'Plumb Takeoff': { str: R.pfStraight, ot: R.pfOT - R.pfStraight, dt: R.pfDT - R.pfStraight, swing: R.pfSwing, grave: R.pfSwing, special: R.pfSwing },
    'Pipe Takeoff': { str: R.pfStraight, ot: R.pfOT - R.pfStraight, dt: R.pfDT - R.pfStraight, swing: R.pfSwing, grave: R.pfSwing, special: R.pfSwing },
  };
  const shopRates = { str: R.smShopStraight, ot: R.smShopOT - R.smShopStraight, dt: R.smShopDT - R.smShopStraight, swing: R.smSwing, grave: R.smGrave, special: R.smSpecial };

  const caeItemsSrc = buildCaeItems(smi, S);
  const groups = [];
  const allRows = [];

  const doItem = (item, payType, exclude, isCae) => {
    const E = N(item.qty), F = N(item.fUnit), G = item.fMult, I = N(item.sUnit), J = item.sMult, L = N(item.mUnit);
    const Rr = item.shift || '', Q = item.ot || '';
    const s = payType === 'Sheet Metal Takeoff' ? '' : (Rr === '' ? '' : 'LOP');
    let lop = 1;
    if (s === 'LOP' && Rr === 'SWING') lop *= 1 + R.swingLOP;
    if (s === 'LOP' && Rr === 'GRAVE') lop *= 1 + R.graveLOP;
    if (s === 'LOP' && Rr === 'SPECIAL') lop *= 1 + R.swingLOP;
    let H, K, M;
    if (isCae) { // CAE rows carry precomputed hour/cost sums; no exclude/multipliers
      H = N(item.fieldHours); K = N(item.shopHours); M = N(item.material);
    } else {
      H = exclude ? 0 : E * F * (G === '' || G === null || G === undefined ? 1 : N(G)) * lop;
      K = exclude ? 0 : E * I * (J === '' || J === null || J === undefined ? 1 : N(J));
      M = exclude ? 0 : E * L;
    }
    const fr = fieldRates[payType] || fieldRates['Sheet Metal Takeoff'];
    const U = xr(H * fr.str, 2);
    const V = xr(Q === 'OT' ? H * fr.ot : 0, 2);
    const W = xr(Q === 'DBLT' ? H * fr.dt : 0, 2);
    const X = Rr === 'SWING' ? xr(xr(H * fr.swing, 2), 2) : 0;
    const Y = Rr === 'GRAVE' ? xr(xr(H * fr.grave, 2), 2) : 0;
    const Z = Rr === 'SPECIAL' ? xr(xr(H * fr.special, 2), 2) : 0;
    const AA = xr(K * shopRates.str, 2);
    const AB = xr(Q === 'OT' ? K * shopRates.ot : 0, 2);
    const AC = xr(Q === 'DBLT' ? K * shopRates.dt : 0, 2);
    const AD = xr(Rr === 'SWING' ? K * shopRates.swing : 0, 2);
    const AE = xr(Rr === 'GRAVE' ? K * shopRates.grave : 0, 2);
    const AF = xr(Rr === 'SPECIAL' ? K * shopRates.special : 0, 2);
    const AG = U + V + W + X + Y + Z;
    const AH = AA + AB + AC + AD + AE + AF;
    return {
      H, K, M, payType, s,
      U, V, W, X, Y, Z, AA, AB, AC, AD, AE, AF,
      AG, AH, AI: AG + AH, AJ: M + AG + AH, AL: V + W + X + Y + Z, AM: AB + AC + AD + AE + AF,
    };
  };

  // CAE group first
  {
    const payType = bid.takeoff.caeType || 'Sheet Metal Takeoff';
    const rows = caeItemsSrc.map(it => {
      const c = doItem(it, payType, false, true);
      return { src: it, calc: c, matPhase: it.matPhase, shopPhase: it.shopPhase, fieldPhase: it.fieldPhase, desc: it.desc, qty: it.qty };
    });
    rows.forEach(r => allRows.push({ ...r.calc, matPhase: r.matPhase, shopPhase: r.shopPhase, fieldPhase: r.fieldPhase, emo: '', ot: '', shift: '' }));
    groups.push({
      id: 'CAE', name: 'CAE', exclude: false, payType, rows,
      subH: sum(rows.map(r => r.calc.H)), subK: sum(rows.map(r => r.calc.K)), subM: sum(rows.map(r => r.calc.M)),
    });
  }

  for (const g of bid.takeoff.groups) {
    const payType = g.type || 'Sheet Metal Takeoff';
    const exclude = g.exclude === true;
    const rows = g.items.map(it => {
      const c = doItem(it, payType, exclude, false);
      return { src: it, calc: c };
    });
    rows.forEach((r, i) => allRows.push({ ...r.calc, matPhase: g.items[i].matPhase || '', shopPhase: g.items[i].shopPhase || '', fieldPhase: g.items[i].fieldPhase || '', emo: g.items[i].emo || '', ot: g.items[i].ot || '', shift: g.items[i].shift || '' }));
    groups.push({
      id: g.id, name: g.name, exclude, payType, rows,
      subH: sum(rows.map(r => r.calc.H)), subK: sum(rows.map(r => r.calc.K)), subM: sum(rows.map(r => r.calc.M)),
    });
  }

  const t = {
    H7: sum(groups.map(g => g.subH)), K7: sum(groups.map(g => g.subK)), M7: sum(groups.map(g => g.subM)),
    U7: sum(allRows.map(r => r.U)), V7: sum(allRows.map(r => r.V)), W7: sum(allRows.map(r => r.W)),
    X7: sum(allRows.map(r => r.X)), Y7: sum(allRows.map(r => r.Y)), Z7: sum(allRows.map(r => r.Z)),
    AA7: sum(allRows.map(r => r.AA)), AB7: sum(allRows.map(r => r.AB)), AC7: sum(allRows.map(r => r.AC)),
    AD7: sum(allRows.map(r => r.AD)), AE7: sum(allRows.map(r => r.AE)), AF7: sum(allRows.map(r => r.AF)),
    AG7: sum(allRows.map(r => r.AG)), AH7: sum(allRows.map(r => r.AH)), AI7: sum(allRows.map(r => r.AI)),
    AJ7: sum(allRows.map(r => r.AJ)), AL7: sum(allRows.map(r => r.AL)), AM7: sum(allRows.map(r => r.AM)),
  };

  // SUMIF helpers used by MCAA / Crew Mix / Booking / EMO
  const byPay = (pt, col) => sum(allRows.filter(r => r.payType === pt).map(r => r[col]));
  const sumifs = {
    fieldHrsPlumb: byPay('Plumb Takeoff', 'H'),
    fieldHrsPipe: byPay('Pipe Takeoff', 'H'),
    fieldHrsSM: byPay('Sheet Metal Takeoff', 'H'),
    matPlumb: byPay('Plumb Takeoff', 'M'),
    matPipe: byPay('Pipe Takeoff', 'M'),
    premiumFieldPlumb: byPay('Plumb Takeoff', 'AL'),
    premiumFieldPipe: byPay('Pipe Takeoff', 'AL'),
    premiumFieldSM: byPay('Sheet Metal Takeoff', 'AL'),
    premiumShopHalf: t.AM7 / 2,                          // MCAA J24 quirk (=SUM(AM:AM)/2)
    emoMaterial: sum(allRows.filter(r => r.emo === 'Yes').map(r => r.M)),  // EMO!A6
  };

  // Crew Mix hour roll-up (Total_* named ranges: straight = total − OT − DT)
  const crewHours = (() => {
    const mk = (pt, col, totalOverride) => {
      const ot = sum(allRows.filter(r => (pt ? r.payType === pt : true) && r.ot === 'OT').map(r => r[col]));
      const dt = sum(allRows.filter(r => (pt ? r.payType === pt : true) && r.ot === 'DBLT').map(r => r[col]));
      const total = totalOverride !== undefined ? totalOverride : byPay(pt, col);
      return { st: total - ot - dt, ot, dt };
    };
    return {
      smField: mk('Sheet Metal Takeoff', 'H'),
      smShop: mk(null, 'K', t.K7),
      plumb: mk('Plumb Takeoff', 'H'),
      pipe: mk('Pipe Takeoff', 'H'),
    };
  })();
  return { groups, allRows, totals: t, sumifs, crewHours };
}

// ===== parts/05b_engine_recap.js =====
// ============================================================
// Engine part 2: EMO, Bond, Work Recovery, MCAA RECAP waterfall
// ============================================================

// ---------------- EMO (Equipment Markup Override) ----------------
function calcEmo(bid, takeoff) {
  const base = takeoff.sumifs.emoMaterial;               // EMO!A6 = Σ TakeOff material flagged P="Yes"
  const original = xr(base * N(bid.recap.ohp), 2);       // E6
  const revised = xr(base * N(bid.recap.equipMarkup), 2);// E12
  return { base, original, revised, delta: Math.abs(original - revised), added: original - revised < 0 };
}

// ---------------- Bond (tier table) ----------------
function calcBond(S, sellBeforeBond) {
  const B = S.bond.brackets, C = S.bond.rates;
  const C2 = sellBeforeBond;
  const cum = [B[0], B[0] + B[1], B[0] + B[1] + B[2], B[0] + B[1] + B[2] + B[3]];
  const e = [
    xru(C2 <= B[0] ? C2 / 1000 * C[0] : B[0] / 1000 * C[0], 0),
    xru(C2 <= cum[0] ? 0 : (C2 <= cum[1] ? (C2 - cum[0]) / 1000 * C[1] : B[1] / 1000 * C[1]), 0),
    xru(C2 <= cum[1] ? 0 : (C2 <= cum[2] ? (C2 - cum[1]) / 1000 * C[2] : B[2] / 1000 * C[2]), 0),
    xru(C2 <= cum[2] ? 0 : (C2 <= cum[3] ? (C2 - cum[2]) / 1000 * C[3] : B[3] / 1000 * C[3]), 0),
    xru(C2 <= cum[3] ? 0 : (C2 - cum[3]) / 1000 * C[4], 0),
  ];
  // Bond!C10 = ROUNDUP(('Crew Mix'!I7 - I5)/30, 0): the SM Field labor-rate period
  const s = S.crew.sections.smField;
  const months = s.periodStart && s.periodEnd ? xru((new Date(s.periodEnd) - new Date(s.periodStart)) / (86400000 * 30), 0) : 0;
  return { sellBeforeBond: C2, tiers: e, total: sum(e), months };
}

// ---------------- Work Recovery ----------------
function calcWorkRecovery(bid, wrHours) {
  const wr = bid.workRecovery || {};
  const mk = (key, label, hours) => {
    const inp = wr[key] || {};
    const rate = N(inp.rate), maxH = N(inp.maxHrs);
    return { key, label, hours, rate, maxHrs: maxH, used: maxH > hours ? xr(rate * hours, 0) : xr(rate * maxH, 0) };
  };
  const rows = [
    mk('smField', 'SM Field', wrHours.smFieldWR),
    mk('smShop', 'SM Shop', wrHours.smShopWR),
    mk('arch', 'Arch Field', wrHours.archWR),
    mk('plumber', 'Plumber', wrHours.plumbWR),
    mk('fitter', 'Fitter', wrHours.pipeWR),
  ];
  const g = Object.fromEntries(rows.map(r => [r.key, r.used]));
  return {
    rows, total: sum(rows.map(r => r.used)),
    smRange: g.smField + g.smShop,      // WorkRecovery_SM  = H4:H6
    arch: g.arch,                        // WorkRecovery_Arch = H8
    pipeRange: g.plumber + g.fitter,     // WorkRecovery_Pipe = H10:H12
  };
}

// ---------------- MCAA RECAP ----------------
// hooks: { ocip(ctx) -> {deductTotal, deductGLOnly, ...}, permits(H63) -> {total, ...} }
function calcRecap(bid, S, crew, takeoff, hooks) {
  const r = bid.recap;
  const lop = { "5 8's": N(r.lop58), "5 10's": S.recap.lop510, "6 10's": S.recap.lop610, "60 60 50": S.recap.lop606050 }[r.scheduleType] ?? 0;

  // ---- Hour columns E(Plumb) F(Pipe) G(SM Field) H(SM Shop): rows 11..18 ----
  const mkCol = (base, mods, roundMods) => {
    const rows = mods.map(p => roundMods ? xr(base * N(p), 2) : base * N(p));
    const lopHrs = base * lop;
    return { base, rows, lopHrs, total: base + sum(rows) + lopHrs };
  };
  const colE = mkCol(takeoff.sumifs.fieldHrsPlumb, r.mods.plumb, false);
  const colF = mkCol(takeoff.sumifs.fieldHrsPipe, r.mods.pipe, false);
  const colG = mkCol(takeoff.sumifs.fieldHrsSM, r.mods.sm, true);   // G12..G16 = ROUND(G11*D,2)
  const shopRows = r.mods.shop.map(p => N(takeoff.totals.K7) * N(p));
  const colH = { base: N(takeoff.totals.K7), rows: shopRows, lopHrs: 0, total: N(takeoff.totals.K7) + sum(shopRows) };
  const totalFieldHours = colE.total + colF.total + colG.total + colH.total;   // SUM(E18:H18)

  // ---- Work Recovery (reads the hour block) ----
  const wrHours = {
    smFieldWR: colG.total - N(r.archHrsInSM) - colG.rows[0],  // G18 - D27 - G12
    smShopWR: colH.total,                                     // H18
    archWR: N(r.archHrsInSM),                                 // D27
    plumbWR: colE.total - colE.rows[0],                       // E18 - E12
    pipeWR: colF.total - colF.rows[0],                        // F18 - F12
  };
  const workRecovery = calcWorkRecovery(bid, wrHours);

  // ---- Blended rates by schedule (E21/F22/G23/H24) ----
  const blend = (st, ot) => {
    switch (r.scheduleType) {
      case "5 8's": return st;
      case "5 10's": return (4 * st + ot) / 5;
      case "6 10's": return (4 * st + 2 * ot) / 6;
      case "60 60 50": return (12 * st + 5 * ot) / 17;
      default: return st;
    }
  };
  const ratePlumb = blend(crew.rates.pfStraight, crew.rates.pfOT);
  const ratePipe = ratePlumb;
  const rateSMField = blend(crew.rates.smFieldStraight, crew.rates.smFieldOT);
  const rateSMShop = crew.rates.smShopStraight;

  // ---- Labor value (pre-OCIP) ----
  const I21 = ratePlumb * colE.total;
  const I22 = ratePipe * colF.total;
  const I23 = colG.total * rateSMField;
  const I24 = colH.total * rateSMShop;
  const I25 = I21 + I22 + I23 + I24;
  const J21 = takeoff.sumifs.premiumFieldPlumb;
  const J22 = takeoff.sumifs.premiumFieldPipe;
  const J23 = takeoff.sumifs.premiumFieldSM;
  const J24 = takeoff.sumifs.premiumShopHalf;               // =SUM(TakeOff!AM:AM)/2 (as-is quirk)
  const J25 = J21 + J22 + J23 + J24;

  // ---- Supervision rows 48-52 (needed by OCIP; independent of dollars below) ----
  const cr = crew.perClassRates;
  const F48 = xr(totalFieldHours * N(r.supPct[0]), 2);
  const F49 = xr(N(r.supPct[1]) * colE.total, 2);
  const F50 = xr(N(r.supPct[2]) * colF.total, 2);
  const F51 = xr(N(r.supPct[3]) * colG.total, 2);
  const F52 = xr(N(r.supPct[4]) * colG.total, 2);
  const G48 = cr.smGenForeman, G49 = cr.pfGenForeman, G50 = cr.pfGenForeman, G51 = cr.smForeman, G52 = cr.smForeman;
  const H48 = xru(F48 * G48, 2), H49 = xru(F49 * G49, 2), H50 = xru(F50 * G50, 2), H51 = xru(F51 * G51, 2);
  const H52 = F52 * G52;                                    // no ROUNDUP (quirk)

  // ---- OCIP (reads hours, labor values, supervision, arch hrs) ----
  const ocip = hooks.ocip({
    archHrs: N(r.archHrsInSM), E18: colE.total, F18: colF.total, G18: colG.total, H18: colH.total,
    I21, I22, I23, F48, F49, F50, F51, F52, H48, H49, H50, H51, H52,
  });
  const C27 = r.ocipToggle === 'OCIP' ? -N(ocip.deductTotal)
    : r.ocipToggle === 'OCIP GL Only' ? -N(ocip.deductGLOnly) : 0;
  const J27 = I25 + J25 + C27;                              // Total Labor Cost

  // ---- Material ----
  const D29 = takeoff.sumifs.matPlumb;
  const G29 = takeoff.sumifs.matPipe;
  const J29 = takeoff.totals.M7 - D29 - G29;
  const J31 = D29 + G29 + J29;                              // Total Material Cost

  // ---- EMO ----
  const emo = calcEmo(bid, takeoff);

  // ---- Subcontract rows 36-44 ----
  const subRows = r.subs.map((s, i) => ({
    ...s, value: N(s.value),
    phaseCode: i === 0 ? '7-03' : (s.name ? lookupSubPhaseCode(S, s.name) : ''),
  }));
  const J45 = sum(subRows.map(s => s.value));

  // ---- GC / indirect block rows 78-106 ----
  const truckRate = r.trucking.rate ?? cr.appr3;            // G81 default ='Crew Mix'!I16
  const gcH = {
    safety: xr(J31 * N(r.gc.safetyPct), 2),                 // H78
    smallTools: xr(I25 * N(r.gc.smallToolsPct), 2),         // H79 (% of labor value I25)
    freight: xr(J27 * N(r.gc.freightPct), 2),               // H80
    trucking: xr(N(r.trucking.loads) * N(r.trucking.hrs) * N(truckRate), 2), // H81
  };
  const gcRows = S.ref.gcRows.map(rowDef => {
    const inp = r.gc.rows[rowDef.key] || {};
    let qty = N(inp.qty), rate;
    if (rowDef.key === 'cadOperator') qty = N(inp.qty) * N(inp.dur);          // F102 = D102*E102
    if (rowDef.rateFrom === 'journeyman') rate = cr.journeyman;               // G97 locked
    else if (rowDef.rateDefault === 'classified') rate = inp.rate ?? cr.classified;
    else if (rowDef.rateDefault === 'smGenForeman') rate = inp.rate ?? cr.smGenForeman;
    else rate = inp.rate ?? 0;
    const label = (r.gc.labels && r.gc.labels[rowDef.key]) || rowDef.label;
    return { key: rowDef.key, label, qty, rate: N(rate), total: xr(qty * N(rate), 2) };
  });
  gcH.misc = xr(N(r.gc.miscPct) * (J27 + J31), 2);          // H106
  const H107 = gcH.safety + gcH.smallTools + gcH.freight + gcH.trucking + sum(gcRows.map(x => x.total)) + gcH.misc;

  // ---- Equipment rentals rows 114-129 ----
  const equipRows = r.equipment.map((e2, i) => {
    const rate = e2.rate ?? S.recap.equipmentRates[i] ?? 0;
    const label = (bid.recap.equipmentNames && bid.recap.equipmentNames[i]) || S.ref.equipmentLabels[i] || 'Equipment';
    return { label, qty: N(e2.qty), dur: N(e2.dur), rate: N(rate), total: xr(N(e2.qty) * N(e2.dur) * N(rate), 2) };
  });
  const J130 = sum(equipRows.map(x => x.total));

  const H53 = J130, H54 = H107;
  const J55 = H48 + H49 + H50 + H51 + H52 + H53 + H54;

  // ---- Waterfall ----
  const H59 = J55 + J45 + J27 + J31;
  const H60 = xru(N(r.subMarkup) * J45, 0);
  const H61 = emo.revised;
  const H62 = xru(N(r.ohp) * (H59 - J45) - emo.original, 0);
  const H63 = H59 + H60 + H61 + H62;
  // Market Recovery: B57/D57/F57 are each ABS(SUM(...))*-1, so H64 = -Σ|recovery|
  const H64 = -Math.abs(workRecovery.pipeRange) - Math.abs(workRecovery.arch) - Math.abs(workRecovery.smRange);
  const H65 = N(r.miscContingency);

  // ---- Permits (calculator reads H63) + manual rows ----
  const permits = hooks.permits(H63);
  const pm = r.permitsManual;
  const permitRows = [N(pm.plumbing), N(pm.hvac), N(pm.medGas), N(pm.boiler), N(pm.specialInsp)];
  const J82 = N(permits.total);
  const J83 = sum(permitRows) + J82;
  const H67 = J83;

  const bond = calcBond(S, H63 + H64 + H65 + H67);
  const H66 = r.bondRequired === 'Yes' ? bond.total : 0;
  const I68 = (r.taxType === 'Oregon CAT Tax' ? 0.004 : r.taxType === 'Washington B&O Tax' ? 0.00484 : 0) + 0.0015;
  const H68 = (H63 + H64 + H65 + H66 + H67) * I68;
  const sub68 = H63 + H64 + H65 + H66 + H67 + H68;
  const H69 = (xru(sub68 / 5, 0) * 5) - sub68 + N(r.addDeduct);
  const H70 = sub68 + H69;

  return {
    lopPct: lop, hoursPlumb: colE, hoursPipe: colF, hoursSM: colG, hoursShop: colH, totalFieldHours,
    ratePlumb, ratePipe, rateSMField, rateSMShop,
    I21, I22, I23, I24, I25, J21, J22, J23, J24, J25, C27, J27, D29, G29, J29, J31,
    subRows, J45,
    permitRows, J82, J83,
    gcH, gcRows, H107, equipRows, J130,
    supervision: { F48, F49, F50, F51, F52, G48, G49, G50, G51, G52, H48, H49, H50, H51, H52 },
    H53, H54, J55, H59, H60, H61, H62, H63, H64, H65, H66, H67, H68, I68, H69, H70,
    emo, bond, workRecovery, wrHours,
    totalBid: H70,
    archWarning: N(r.archHrsInSM) > colG.total,
    pctSubEquip: (H53 + H54) === 0 ? 1 : (H53 + H54) / H59,   // I54 = IF(SUM(H53:H54)=0,1,.../H59)
    pctMarkupOfBid: H62 === 0 ? 0 : (H60 + H61 + H62) / H70,
    pctLaborMU: (colE.base + colF.base + colG.base + colH.base) === 0 ? 0 : (H60 + H61 + H62) / J27,
    dollarsPerSqFt: N(bid.info.projectSqFt) ? H70 / N(bid.info.projectSqFt) : null,
    fieldLbsPerHr: N(bid.info.materialLbs) && (colE.total + colF.total + colG.total) ? N(bid.info.materialLbs) / (colE.total + colF.total + colG.total) : null,
    shopLbsPerHr: N(bid.info.materialLbs) && colH.total ? N(bid.info.materialLbs) / colH.total : null,
  };
}

function lookupSubPhaseCode(S, name) {
  const hit = S.ref.codesSubcontractor.find(x => x.name === name);
  return hit ? '7-' + hit.code : '';
}

// ---------------- OCIP ----------------
// ctx: hour totals + labor values + supervision rows from the recap hour pass
function calcOcip(bid, S, crew, ctx) {
  const o = S.ocip;
  const PF = o.payrollFraction;                       // 0.6 bare-payroll fraction
  const emr = S.crew.sections.smField.pti.wc.emr;     // 'Crew Mix'!Q11
  const dcbs = S.crew.sections.smField.pti.wc.dcbs;   // 'Crew Mix'!W11
  const arch = N(ctx.archHrs);
  const G18 = ctx.G18;
  const R42 = arch === 0 ? 0 : arch / (G18 || 1);
  const R44 = arch === 0 ? 1 : (G18 - arch) / (G18 || 1);

  // On-site payroll estimates per WC class
  const N42 = ctx.I23 === 0 ? 0 : xr((ctx.I23 * PF + ctx.H52 * PF + ctx.H51 * PF) * R42, 0);   // Arch
  const N43 = ctx.H48 * 0.25 * PF;                                                              // Exec supervisor (25% onsite)
  const N44 = (ctx.I22 + ctx.I23) === 0 ? 0 : xr((ctx.I23 * PF + ctx.H52 * PF) * R44 + ctx.I22 * PF + ctx.H50 * PF, 0); // HVAC
  const N45 = xr((ctx.I21 + ctx.H49) * PF, 2);                                                  // Plumbing

  const payrolls = [N42, N43, N44, N45];
  const wcRows = o.wcClasses.map((cl, i) => ({ ...cl, payroll: payrolls[i], premium: payrolls[i] * cl.rate }));
  const K144 = sum(payrolls);
  const O145 = xr(sum(wcRows.map(r => r.premium)), 2);
  const O147 = xr(O145 * emr, 2);
  const O149 = O147 * o.otherFactors;                 // 0.89
  const O150 = O149 * (dcbs - 1);                     // "Oregon Tax" (negative)
  const O151 = O149 + O150;                           // Total WC cost

  const O161 = o.glPremisesRate * K144 / 1000;
  const O163 = o.glProductsRate * K144 / 1000;
  const O167 = O161 + O163 + N(o.glExcess);
  const O169 = O167;                                  // Total Liability Premium
  const O174 = O151 + O169;                           // GRAND TOTAL (OCIP_Deduct_Total)

  // Estimated man-hours per class (display)
  const hrs = [
    G18 === 0 ? 0 : xr((G18 + ctx.F52) * (arch / (G18 || 1)), 0),
    ctx.F48 * 0.25,
    (ctx.F18 + G18) === 0 ? 0 : xr((G18 + ctx.F52) * ((G18 - arch) / (G18 || 1)), 0) + (ctx.F18 + ctx.F50),
    ctx.E18 + ctx.F49,
  ];
  return {
    payrolls, wcRows, hours: hrs, totalPayroll: K144,
    estPremium: O145, modifiedPremium: O147, afterFactors: O149, oregonTax: O150,
    totalWC: O151, glPremises: O161, glProducts: O163, totalGL: O167,
    deductGLOnly: O169, deductTotal: O174,
  };
}

// ---------------- Permits ----------------
function permitTierFee(CV, tier) {
  const { min, max, fee, inc } = tier;
  if (CV < min) return 0;
  const top = CV >= max ? max : CV;
  return xru((top - min) / inc, 0) * fee;
}
function permitBlock(CV, tiers, planReviewPct, markupPct) {
  const fees = tiers.map(t => permitTierFee(CV, t));
  const subtotal = sum(fees);
  const planReview = xru(subtotal * planReviewPct, 2);
  const markup = xru((subtotal + planReview) * markupPct, 2);
  return { fees, subtotal, planReview, markup, total: subtotal + planReview + markup };
}
function calcPermits(bid, S, constructionValue) {
  const blocks = {};
  for (const j of S.permits.jurisdictions) {
    blocks[j.id] = { name: j.name, ...permitBlock(constructionValue, j.tiers, j.planReviewPct, j.markupPct) };
  }
  const cu = bid.permitCalc.custom;
  blocks.custom = { name: 'Custom', ...permitBlock(constructionValue, cu.tiers, N(cu.planReviewPct), N(cu.markupPct)) };
  const sel = bid.permitCalc.selection;   // 'none'|'portland'|'hillsboro'|'clackamas'|'custom'|'tualatin'
  const total = sel && blocks[sel] ? blocks[sel].total : 0;
  return { constructionValue, blocks, selection: sel, total };
}

// ---------------- calcBid master ----------------
function calcBid(bid, S) {
  const crew = calcCrew(bid, S);
  const smImport = calcSmImport(bid, S);
  const takeoff = calcTakeoff(bid, S, crew, smImport);

  let ocip = null, permits = null;
  const hooks = {
    ocip: (ctx) => { ocip = calcOcip(bid, S, crew, ctx); return ocip; },
    permits: (H63) => { permits = calcPermits(bid, S, H63); return permits; },
  };
  const recap = calcRecap(bid, S, crew, takeoff, hooks);
  const priceBreakdown = (typeof calcPriceBreakdown === 'function') ? calcPriceBreakdown(bid, S, crew, takeoff, recap) : null;
  const booking = (typeof calcBooking === 'function') ? calcBooking(bid, S, crew, takeoff, recap) : null;
  const proposal = (typeof calcProposal === 'function') ? calcProposal(bid, S, recap) : null;
  return { crew, smImport, takeoff, recap, ocip, permits, priceBreakdown, booking, proposal, crewHours: takeoff.crewHours };
}

// ============================================================
// Engine part 4: mini formula evaluator (Booking specials),
// Booking Report, Price Breakdown, Proposal
// ============================================================

// ---- Mini evaluator for the Booking Report's special formulas ----
// Supports: numbers, + - * / ( ), 'Sheet'!A1 refs, local A# refs, named ranges,
// SUM(...), ABS(x), SUMIF(rangeA, crit, rangeB), SUMIFS(baseCol, pcCol, crit).
// ctx = { cell(sheet,addr)->num, cellRange(sheet,a,b)->[{key?,val}], local(addr)->string,
//         named(name)->num, sumifs(baseName, code)->num, sumifPairs(sheet, aRange, hRange)->[{code,val}] }
function xlEval(formula, ctx) {
  const src = formula.replace(/^=/, '');
  let i = 0;
  const peek = () => src[i];
  const eof = () => i >= src.length;
  function skipWs() { while (!eof() && src[i] === ' ') i++; }
  function parseExpr() {
    let v = parseTerm();
    for (; ;) {
      skipWs();
      if (peek() === '+') { i++; v += parseTerm(); }
      else if (peek() === '-') { i++; v -= parseTerm(); }
      else return v;
    }
  }
  function parseTerm() {
    let v = parseFactor();
    for (; ;) {
      skipWs();
      if (peek() === '*') { i++; v *= parseFactor(); }
      else if (peek() === '/') { i++; v /= parseFactor(); }
      else return v;
    }
  }
  function parseFactor() {
    skipWs();
    if (peek() === '(') { i++; const v = parseExpr(); skipWs(); if (peek() === ')') i++; return v; }
    if (peek() === '-') { i++; return -parseFactor(); }
    if (peek() === "'") { // 'Sheet Name'!A1 or range
      const m = /^'([^']+)'!\$?([A-Z]+)\$?(\d+)(?::\$?([A-Z]+)\$?(\d+))?/.exec(src.slice(i));
      if (!m) throw new Error('bad sheet ref @' + i + ' in ' + formula);
      i += m[0].length;
      if (m[4]) throw new Error('naked range outside function: ' + m[0]);
      return N(ctx.cell(m[1], m[2] + m[3]));
    }
    const num = /^\d+(?:\.\d+)?/.exec(src.slice(i));
    if (num && !/^[A-Z]/.test(src.slice(i))) { i += num[0].length; return Number(num[0]); }
    const fn = /^(SUMIFS|SUMIF|SUM|ABS|ROUND)\(/.exec(src.slice(i));
    if (fn) {
      i += fn[0].length;
      const args = parseArgs();
      return applyFn(fn[1], args);
    }
    const ident = /^\$?[A-Za-z_][A-Za-z0-9_.]*\$?\d*(?::\$?[A-Z]+\$?\d+)?/.exec(src.slice(i));
    if (ident) {
      const raw = ident[0];
      i += raw.length;
      const cellm = /^\$?([A-Z]{1,3})\$?(\d+)$/.exec(raw);
      if (cellm) return ctx.local(cellm[1] + cellm[2]);         // local cell ref (phase code)
      return N(ctx.named(raw.replace(/\$/g, '')));
    }
    throw new Error('parse error @' + i + ' in ' + formula);
  }
  // parse raw argument spans (handles nested parens); returns array of raw strings
  function parseArgs() {
    const args = [];
    let depth = 0, start = i;
    for (; ; i++) {
      if (eof()) throw new Error('unterminated args in ' + formula);
      const c = src[i];
      if (c === '(') depth++;
      else if (c === ')') {
        if (depth === 0) { args.push(src.slice(start, i)); i++; break; }
        depth--;
      } else if (c === ',' && depth === 0) { args.push(src.slice(start, i)); start = i + 1; }
    }
    return args.map(a => a.trim());
  }
  function evalSub(str) { return xlEval('=' + str, ctx); }
  function rangeRef(str) {
    let m = /^'([^']+)'!\$?([A-Z]+)\$?(\d+):\$?([A-Z]+)\$?(\d+)$/.exec(str);
    if (m) return { sheet: m[1], a: m[2] + m[3], b: m[4] + m[5] };
    m = /^\$?([A-Z]+)\$?(\d+):\$?([A-Z]+)\$?(\d+)$/.exec(str);
    if (m) return { sheet: null, a: m[1] + m[2], b: m[3] + m[4] };
    return null;
  }
  function applyFn(name, args) {
    if (name === 'ABS') return Math.abs(evalSub(args[0]));
    if (name === 'ROUND') return xr(evalSub(args[0]), Number(args[1] ?? 0));
    if (name === 'SUM') {
      let t = 0;
      for (const a of args) {
        const r = rangeRef(a);
        if (r) { for (const p of ctx.cellRange(r.sheet, r.a, r.b)) t += N(p.val); }
        else t += evalSub(a);
      }
      return t;
    }
    if (name === 'SUMIF') {
      const rA = rangeRef(args[0]), rB = rangeRef(args[2]);
      const crit = /^\$?[A-Z]{1,3}\$?\d+$/.test(args[1]) ? ctx.local(args[1].replace(/\$/g, '')) : args[1].replace(/^"|"$/g, '');
      const codes = ctx.cellRange(rA.sheet, rA.a, rA.b);
      const vals = ctx.cellRange(rB.sheet, rB.a, rB.b);
      let t = 0;
      for (let k = 0; k < codes.length; k++) if (String(codes[k].val) === String(crit)) t += N(vals[k] && vals[k].val);
      return t;
    }
    if (name === 'SUMIFS') return N(ctx.sumifs(args[0], ctx.local(args[2].replace(/\$/g, ''))));
    throw new Error('fn ' + name);
  }
  const out = parseExpr();
  skipWs();
  if (!eof()) throw new Error('trailing input @' + i + ' in ' + formula);
  return out;
}

// ---- context for Booking evaluation ----
function makeBookingCtx(bid, S, crew, takeoff, recap, ownCode, baseKind) {
  const r = recap;
  // MCAA addressable cells used by the specials
  const cells = {};
  const put = (addr, v) => { cells[addr] = v; };
  const hcols = { E: r.hoursPlumb, F: r.hoursPipe, G: r.hoursSM, H: r.hoursShop };
  for (const [col, c] of Object.entries(hcols)) {
    for (let k = 0; k < 5; k++) put(col + (12 + k), c.rows[k]);
    put(col + '17', col === 'H' ? c.rows[5] : c.lopHrs);
    put(col + '18', c.total);
  }
  put('E21', r.ratePlumb); put('F22', r.ratePipe); put('G23', r.rateSMField); put('H24', r.rateSMShop);
  put('C27', r.C27);
  const sv = r.supervision;
  ['48', '49', '50', '51', '52'].forEach((n, k) => {
    put('F' + n, [sv.F48, sv.F49, sv.F50, sv.F51, sv.F52][k]);
    put('H' + n, [sv.H48, sv.H49, sv.H50, sv.H51, sv.H52][k]);
  });
  put('H65', r.H65); put('H66', r.H66); put('H67', r.H67);
  // GC amounts H78..H106 (+ hours F97/F98/F102)
  put('H78', r.gcH.safety); put('H79', r.gcH.smallTools); put('H80', r.gcH.freight); put('H81', r.gcH.trucking);
  const gcByKey = Object.fromEntries(r.gcRows.map(x => [x.key, x]));
  const gcOrder = ['tempPower', 'tempWater', 'phones', 'jobSafety', 'jobTruck', 'fuel', 'parking', 'siteTrailer', 'siteStorage',
    'miscRow', 'subsArch', 'subsService', 'subsSM', 'subsPM', 'adminAssist', 'jobOrientation', 'asstPM', 'thirdPartyTesting',
    'laborer', 'safetySupplies2', 'cadOperator', 'gcExtra1', 'gcExtra2', 'gcExtra3'];
  gcOrder.forEach((key, k) => {
    const row = 82 + k;
    put('H' + row, gcByKey[key] ? gcByKey[key].total : 0);
    put('F' + row, gcByKey[key] ? gcByKey[key].qty : 0);
  });
  put('H106', r.gcH.misc);
  // GC user rows 101..105 phase codes (A101:A105) — code from label lookup in Codes_GC
  const codeOfGC = (label) => {
    if (!label) return '';
    const hit = S.ref.codesGC.find(x => x.name === label);
    return hit ? '1-' + hit.code : '';
  };
  const gcCodeRows = [
    { addr: 101, code: codeOfGC((bid.recap.gc.labels && bid.recap.gc.labels.safetySupplies2) || 'Safety Supplies'), val: gcByKey.safetySupplies2.total },
    { addr: 102, code: codeOfGC('CAD Operator'), val: gcByKey.cadOperator.total },
    { addr: 103, code: codeOfGC(bid.recap.gc.labels && bid.recap.gc.labels.gcExtra1), val: gcByKey.gcExtra1.total },
    { addr: 104, code: codeOfGC(bid.recap.gc.labels && bid.recap.gc.labels.gcExtra2), val: gcByKey.gcExtra2.total },
    { addr: 105, code: codeOfGC(bid.recap.gc.labels && bid.recap.gc.labels.gcExtra3), val: gcByKey.gcExtra3.total },
  ];
  gcCodeRows.forEach(g => { put('A' + g.addr, g.code); });
  // subs rows 36..44
  r.subRows.forEach((s, k) => { put('A' + (36 + k), s.phaseCode || ''); put('J' + (36 + k), s.value); });
  // equipment rows 114..129
  r.equipRows.forEach((e, k) => {
    const row = 114 + k;
    let code = S.ref.equipmentCodes[k] || '';
    if (!code && bid.recap.equipmentNames && bid.recap.equipmentNames[k]) {
      const hit = S.ref.codesSubcontractor.find(x => x.name === bid.recap.equipmentNames[k]);
      code = hit ? '7-' + hit.code : '';
    }
    put('A' + row, code); put('J' + row, e.total);
  });

  const wrCells = { H4: r.workRecovery.rows[0].used, H6: r.workRecovery.rows[1].used, H8: r.workRecovery.rows[2].used, H10: r.workRecovery.rows[3].used, H12: r.workRecovery.rows[4].used };

  const named = {
    CrewRate_Plumb: r.ratePlumb, CrewRate_Pipe: r.ratePipe, CrewRate_SMField: r.rateSMField, CrewRate_SMShop: r.rateSMShop,
    Trucking_Hrs: N(bid.recap.trucking.hrs), Trucking_Loads: N(bid.recap.trucking.loads), Trucking_Total: r.gcH.trucking,
    WorkRecovery_Arch: r.workRecovery.arch, CAT_TAX: r.H68, Info_Market_Recovery: r.H64, Info_Total_Bid: r.H70,
  };

  const bases = {
    SM_FieldLaborColumn: (code) => sum(takeoff.allRows.filter(x => x.fieldPhase === code).map(x => x.H)),
    SM_ShopLaborColumn: (code) => sum(takeoff.allRows.filter(x => x.shopPhase === code).map(x => x.K)),
    SM_MaterialColumn: (code) => sum(takeoff.allRows.filter(x => x.matPhase === code).map(x => x.M)),
    Takeoff_Total_Field_Labor_Cost: (code) => sum(takeoff.allRows.filter(x => x.fieldPhase === code).map(x => x.AG)),
    Takeoff_Total_Shop_Labor_Cost: (code) => sum(takeoff.allRows.filter(x => x.shopPhase === code).map(x => x.AH)),
    Takeoff_Total_Straight_Field_Labor_Cost: (code) => sum(takeoff.allRows.filter(x => x.fieldPhase === code).map(x => x.U)),
  };

  return {
    cell(sheet, addr) {
      if (sheet === 'MCAA RECAP') { const v = cells[addr]; return v === undefined ? 0 : v; }
      if (sheet === 'Work Recovery') return wrCells[addr] ?? 0;
      throw new Error('unknown sheet ' + sheet);
    },
    cellRange(sheet, a, b) {
      const colA = a.replace(/\d+/, ''), colB = b.replace(/\d+/, '');
      const r0 = parseInt(a.replace(/\D+/g, '')), r1 = parseInt(b.replace(/\D+/g, ''));
      const colNum = (c) => c.split('').reduce((n, ch) => n * 26 + ch.charCodeAt(0) - 64, 0);
      const colName = (n) => { let s = ''; while (n > 0) { s = String.fromCharCode(65 + (n - 1) % 26) + s; n = Math.floor((n - 1) / 26); } return s; };
      const outArr = [];
      for (let cn = colNum(colA); cn <= colNum(colB); cn++) {
        for (let rr = r0; rr <= r1; rr++) {
          const addr = colName(cn) + rr;
          if (sheet === 'MCAA RECAP') outArr.push({ val: cells[addr] ?? 0 });
          else if (sheet === 'Work Recovery') outArr.push({ val: wrCells[addr] ?? 0 });
          else throw new Error('range sheet ' + sheet);
        }
      }
      return outArr;
    },
    local(addr) { return ownCode; },   // every local $A ref is the row's own phase code
    named(nm) { if (nm in named) return named[nm]; throw new Error('named ' + nm); },
    sumifs(base, code) { const f = bases[base]; if (!f) throw new Error('base ' + base); return f(code); },
  };
}

// ---- Booking Report ----
function calcBooking(bid, S, crew, takeoff, recap) {
  const bookS = S.booking;
  const divisions = [];
  const to = takeoff;
  for (const dv of bookS.divisions) {
    const pcDiv = S.ref.phaseCodes.divisions.find(x => x.div === dv.div);
    const rows = [];
    for (let i = 1; i <= 99; i++) {
      const code = dv.div + '-' + String(i).padStart(2, '0');
      const info = (pcDiv.descriptions[String(i).padStart(2, '0')]) || { d: '' };
      const custom = (bid.phaseCustom && bid.phaseCustom[code]) || '';
      const desc = custom || info.d;
      const spec = bookS.specials[dv.div + '|' + code];
      let hours, labor, material;
      if (dv.kind === 'shop') {
        hours = sum(to.allRows.filter(x => x.shopPhase === code).map(x => x.K));
        labor = sum(to.allRows.filter(x => x.shopPhase === code).map(x => x.AH));
      } else {
        hours = sum(to.allRows.filter(x => x.fieldPhase === code).map(x => x.H));
        labor = sum(to.allRows.filter(x => x.fieldPhase === code).map(x => x.AG));
      }
      material = sum(to.allRows.filter(x => x.matPhase === code).map(x => x.M));
      if (spec) {
        const ctx = makeBookingCtx(bid, S, crew, takeoff, recap, code, dv.kind);
        if (spec.D) hours = xlEval(spec.D, ctx);
        if (spec.E) labor = xlEval(spec.E, ctx);
        if (spec.F) material = xlEval(spec.F, ctx);
      }
      const gCode = (bid.booking.codes && bid.booking.codes[code]) ?? (bookS.gDefaults[code] || '');
      rows.push({ code, desc, hours, labor, material, gCode, total: hours + labor + material });
    }
    const totHours = sum(rows.map(x => x.hours)), totLabor = sum(rows.map(x => x.labor)), totMat = sum(rows.map(x => x.material));
    divisions.push({ div: dv.div, name: pcDiv.name, kind: dv.kind, rows, totHours, totLabor, totMat });
  }
  // status block (Booking Report Y13:Y16, M10..M18, K8)
  const booked = sum(divisions.map(d => d.totLabor + d.totMat));                       // Y14
  const Y15 = recap.H60 + recap.H61 + recap.H62 + recap.H68 + recap.H69;               // markups + tax + leveler
  const Y16 = recap.H70 - booked - Y15;
  const totHours = sum(divisions.map(d => d.totHours));                                // M15 basis
  const sv = recap.supervision;
  const gcByKey = Object.fromEntries(recap.gcRows.map(x => [x.key, x]));
  const hourTarget = xr(recap.hoursPlumb.total + recap.hoursPipe.total + recap.hoursSM.total + recap.hoursShop.total
    + sv.F48 + sv.F49 + sv.F50 + sv.F51 + sv.F52
    + N(bid.recap.trucking.hrs) * N(bid.recap.trucking.loads)
    + (gcByKey.jobOrientation ? gcByKey.jobOrientation.qty : 0)
    + (gcByKey.asstPM ? gcByKey.asstPM.qty : 0), 2)
    + (gcByKey.cadOperator ? gcByKey.cadOperator.qty : 0);                             // M18
  return {
    divisions,
    bookedTotal: booked, tail: Y15, unassigned: Y16,
    complete: Y16 > -2 && Y16 < 2,                                                     // M10
    totalHours: totHours,
    hourTarget,
    missingHours: xr(hourTarget - xr(totHours, 2), 2),                                 // M13
  };
}

// ---- Price Breakdown ----
function calcPriceBreakdown(bid, S, crew, takeoff, recap) {
  const items = takeoff.groups.map((g, gi) => {
    const rows = g.rows.map(x => x.calc);
    const fieldCost = sum(rows.map(x => x.AG));
    const shopCost = sum(rows.map(x => x.AH));
    return {
      idx: gi, name: g.name || (gi === 0 ? 'CAE if not moved to sections' : ''),
      fieldHours: g.subH, shopHours: g.subK, material: g.subM,
      fieldCost, shopCost, subTotal: fieldCost + shopCost + g.subM,
      notes: (bid.priceBreakdown.notes || {})[gi === 0 ? 'CAE' : String(g.id)] || '',
    };
  });
  const directs = sum(items.map(x => x.subTotal));
  const fee = recap.H60 + recap.H61 + recap.H62 + recap.H69;
  const gcs = recap.H70 - directs - fee;
  for (const it of items) {
    it.gcAlloc = directs ? it.subTotal / directs * gcs : 0;
    it.feeAlloc = directs ? it.subTotal / directs * fee : 0;
    it.sellTotal = it.subTotal + it.gcAlloc + it.feeAlloc;
  }
  const laborFactor = takeoff.totals.H7 ? (recap.hoursPlumb.total + recap.hoursPipe.total + recap.hoursSM.total
    - recap.hoursPlumb.base - recap.hoursPipe.base - recap.hoursSM.base) / takeoff.totals.H7 : 0;
  return { items, directs, fee, gcs, totalSell: recap.H70, laborFactor };
}

// ---- Proposal ----
function calcProposal(bid, S, recap) {
  const amount = xr(recap.H70, 2);
  // Both pickers feed ONE exclusions line, in the sheet's own order:
  // the W/X block first, then the Z/AA block (D39 concatenates them that way).
  const picked = [...(bid.proposal.exclusionsPicked || []), ...(bid.proposal.inclusionsPicked || [])];
  return {
    amount, amountWords: spellNumber(amount),
    exclusionLine: picked.join(', '),
  };
}

// ============================================================

// Safe arithmetic for typed expressions like "=80730+250" or "=(80980*0.0057)"
function evalExpr(s) {
  const body = String(s).replace(/^=/, '').replace(/[$,\s]/g, '');
  if (!/^[-+*/().\d%]+$/.test(body) || !/\d/.test(body)) return null;
  try {
    const v = Function('"use strict";return (' + body.replace(/%/g, '/100') + ')')();
    return (typeof v === 'number' && isFinite(v)) ? v : null;
  } catch (e) { return null; }
}

// Focus-preserving deferred re-render: lets Tab/click move focus first, then
// re-renders and restores focus to the field the user landed on (by data-path).
let rerenderPending = false;
function rerender() {
  // Coalesce: several inputs can ask for a re-render in the same tick, and each
  // one is a full page rebuild that restores focus to wherever the cursor was at
  // ITS moment — which makes focus fight itself while the user keeps typing.
  // One render per tick, using the latest focus, is both correct and faster.
  if (rerenderPending) return;
  rerenderPending = true;
  setTimeout(() => {
    rerenderPending = false;
    const active = document.activeElement;
    const fp = active && active.dataset ? active.dataset.path : null;
    const pos = active && active.selectionStart != null ? active.selectionStart : null;
    router.render();
    if (fp) {
      const again = document.querySelector('[data-path="' + CSS.escape(fp) + '"]');
      if (again) {
        again.focus();
        try { if (pos != null && again.setSelectionRange) again.setSelectionRange(pos, pos); } catch (e) { }
      }
    }
  }, 0);
}

// Grow an input so its whole value stays readable instead of being clipped by the
// box. The widest value in a column sets that column's width; when the columns
// together need more room than the window, the grid scrolls sideways (like Excel).
// Anything past the cap keeps its full text in a hover tooltip.
function autoWidth(i, min, max) {
  i.dataset.minch = min; i.dataset.maxch = max;
  const len = String(i.value ?? '').length;
  i.style.minWidth = Math.max(min, Math.min(max, len + 1)) + 'ch';   // first guess, refined by fitInputs()
  return i;
}

// Second pass, run after a page renders: measures each value in the font the input
// actually got, so capital-heavy text ("Multomah Cty Tax (.15%...") is sized from
// real glyph widths rather than an average-character guess.
function fitInputs(root) {
  const ctx = fitInputs.ctx || (fitInputs.ctx = document.createElement('canvas').getContext('2d'));
  for (const i of root.querySelectorAll('input[data-minch]')) {
    const v = String(i.value ?? '');
    if (!v) continue;
    const cs = getComputedStyle(i);
    ctx.font = cs.fontStyle + ' ' + cs.fontWeight + ' ' + cs.fontSize + ' ' + cs.fontFamily;
    const ch = ctx.measureText('0').width || 7;
    const pad = parseFloat(cs.paddingLeft) + parseFloat(cs.paddingRight) + 6;   // borders + caret
    const need = ctx.measureText(v).width + pad;
    const lo = Number(i.dataset.minch) * ch, hi = Number(i.dataset.maxch) * ch;
    i.style.minWidth = Math.round(Math.min(hi, Math.max(lo, need))) + 'px';
    if (need > hi) i.title = v;                    // past the cap: full text on hover
    else if (i.title === v) i.title = '';
  }
}

// Numeric input bound to a bid path. opts: {pct, dec, int, allowNull(default true->null when empty), placeholder, title}
function numIn(path, opts = {}) {
  const cur = pathGet(app.bid, path);
  const show = (v) => {
    if (v === null || v === undefined || v === '') return '';
    if (opts.pct) return fmt.num(v * 100, opts.dec ?? 1);
    return fmt.num(v, opts.dec ?? (opts.int ? 0 : 2));
  };
  const i = el('input', {
    class: 'num', inputmode: 'decimal', value: show(cur),
    placeholder: opts.placeholder || '', title: opts.title || null, 'data-path': path,
  });
  autoWidth(i, opts.minCh ?? 6, opts.maxCh ?? 16);
  i.addEventListener('change', () => {
    let raw = i.value.trim();
    let v = null;
    if (raw !== '') {
      v = raw.startsWith('=') ? evalExpr(raw) : fmt.parseNum(raw);
      if (v === null) { toast('Could not read "' + raw + '" as a number', true); i.value = show(pathGet(app.bid, path)); return; }
      if (opts.pct) v = v / 100;
      if (opts.int) v = Math.round(v);
    }
    if (v === null && opts.zeroWhenEmpty) v = 0;
    pathSet(app.bid, path, v);
    // keep the typed arithmetic itself when the field supports it (exports back into the cell as a formula)
    if (opts.exprPath) pathSet(app.bid, opts.exprPath, raw.startsWith('=') && v !== null ? raw : null);
    app.touch();
    i.value = show(v);
    autoWidth(i, opts.minCh ?? 6, opts.maxCh ?? 16);
    if (opts.after) opts.after();
  });
  if (opts.exprPath) {
    i.dataset.exprPath = opts.exprPath;       // so fill-down can copy the typed formula too
    const ex = pathGet(app.bid, opts.exprPath);
    if (ex) i.title = 'Typed as ' + ex;
  }
  return i;
}

function textIn(path, opts = {}) {
  const i = el('input', { type: 'text', value: pathGet(app.bid, path) ?? '', placeholder: opts.placeholder || '', list: opts.list || null, 'data-path': path });
  autoWidth(i, opts.minCh ?? 12, opts.maxCh ?? 46);
  i.addEventListener('change', () => {
    pathSet(app.bid, path, i.value); app.touch();
    autoWidth(i, opts.minCh ?? 12, opts.maxCh ?? 46);
    if (opts.after) opts.after();
  });
  return i;
}

function selIn(path, options, opts = {}) {
  const cur = pathGet(app.bid, path) ?? '';
  const s = el('select', { 'data-path': path },
    (opts.blank ? [el('option', { value: '' }, opts.blankLabel || '—')] : []),
    options.map(o => {
      const [v, label] = Array.isArray(o) ? o : [o, o];
      const opt = el('option', { value: v }, label);
      if (String(v) === String(cur)) opt.selected = true;
      return opt;
    }));
  s.addEventListener('change', () => {
    // opts.num: options whose values are codes (the OCIP form answers) stay numbers
    pathSet(app.bid, path, opts.num ? Number(s.value) : s.value);
    app.touch();
    if (opts.after) opts.after(); else if (opts.rerender !== false) rerender();
  });
  return s;
}

function ckIn(path, label, opts = {}) {
  const c = el('input', { type: 'checkbox' });
  c.checked = pathGet(app.bid, path) === true;
  c.addEventListener('change', () => { pathSet(app.bid, path, c.checked); app.touch(); if (opts.after) opts.after(); else rerender(); });
  return el('label', { class: 'ck' }, c, label);
}

// read-only computed cell
function calcCell(v, kind, opts = {}) {
  const text = kind === 'money' ? fmt.money(v, opts.dec ?? 2)
    : kind === 'pct' ? fmt.pct(v, opts.dec ?? 1)
      : kind === 'hrs' ? fmt.hrs(v)
        : kind === 'int' ? fmt.int(v) : String(v ?? '');
  return el('td', { class: 'num calc', title: opts.title || null }, text);
}
function th(...labels) { return el('tr', {}, labels.map(l => el('th', typeof l === 'object' && l.num ? { class: 'num' } : {}, typeof l === 'object' ? l.t : l))); }
function tdIn(input, cls) { return el('td', { class: cls || '' }, input); }
function tdTxt(t, cls) { return el('td', { class: cls || '' }, t); }

// datalist registry for phase codes etc.
const DATALISTS = {};
function ensureDatalist(id, values) {
  if (DATALISTS[id]) return id;
  const dl = el('datalist', { id });
  for (const v of values) dl.append(el('option', { value: v }));
  document.body.append(dl);
  DATALISTS[id] = true;
  return id;
}

router.routes.takeoff = {

function renderTakeoffGroup(bid, S, to, g, gi) {
  const cg = to.groups[gi + 1]; // +1: CAE occupies index 0
  const base = 'takeoff.groups[' + gi + ']';
  const head = el('summary', {},
    el('span', { class: 'caret' }, '▶'),
    el('b', {}, (gi + 1) + '.'),
    (() => { const i = textIn(base + '.name', { placeholder: '(group name)', minCh: 26, maxCh: 52, after: () => { app.touch(); } }); i.addEventListener('click', e => e.preventDefault()); return i; })(),
    selIn(base + '.type', S.ref.takeoffTypes, { rerender: true }),
    ckIn(base + '.exclude', 'Exclude'),
    g.exclude ? el('span', { class: 'excl-note' }, 'EXCLUDED — zeroed in totals') : null,
    el('span', { class: 'sums' }, fmt.hrs(cg.subH) + ' fld · ' + fmt.hrs(cg.subK) + ' shop · ' + fmt.money(cg.subM)));

  const t = el('table', { class: 'grid' });
  t.append(th('Mat Ph', 'Shop Ph', 'Field Ph', 'Description', { t: 'Qty', num: 1 }, { t: 'Fld Unit', num: 1 }, { t: 'Fld ×', num: 1 },
    { t: 'Fld Hrs', num: 1 }, { t: 'Shp Unit', num: 1 }, { t: 'Shp ×', num: 1 }, { t: 'Shp Hrs', num: 1 },
    { t: 'Mat Unit $', num: 1 }, { t: 'Material $', num: 1 }, 'Notes', 'EMO', 'OT', 'Shift', ''));
  g.items.forEach((it, ii) => {
    const p = base + '.items[' + ii + ']';
    const cr = cg.rows[ii].calc;
    const mk = (path, opts) => tdIn(numIn(path, { ...opts, after: rerender }));
    const phaseIn = (path, dl) => {
      const i = el('input', { type: 'text', value: pathGet(app.bid, path) ?? '', list: dl, style: 'width:64px', 'data-path': path });
      i.addEventListener('change', () => { pathSet(app.bid, path, i.value); app.touch(); });
      return tdIn(i);
    };
    t.append(el('tr', {},
      phaseIn(p + '.matPhase', 'dlMat'),
      phaseIn(p + '.shopPhase', 'dlShop'),
      phaseIn(p + '.fieldPhase', 'dlField'),
      tdIn((() => { const i = textIn(p + '.desc'); if (it.plug) i.style.color = '#c00'; return i; })()),
      mk(p + '.qty', {}), mk(p + '.fUnit', {}), mk(p + '.fMult', { placeholder: '1' }),
      calcCell(cr.H, 'hrs'),
      mk(p + '.sUnit', {}), mk(p + '.sMult', { placeholder: '1' }),
      calcCell(cr.K, 'hrs'),
      mk(p + '.mUnit', { exprPath: p + '.mUnitExpr' }),
      calcCell(cr.M, 'money'),
      tdIn(textIn(p + '.notes')),
      tdIn(selIn(p + '.emo', ['Yes'], { blank: true, rerender: true })),
      tdIn(selIn(p + '.ot', ['OT', 'DBLT'], { blank: true, rerender: true })),
      tdIn(selIn(p + '.shift', ['SWING', 'GRAVE', 'SPECIAL'], { blank: true, rerender: true })),
      el('td', {}, el('button', {
        class: 'btn sm danger', title: 'Delete row', onclick: () => {
          if (it.desc || it.qty || it.mUnit) { if (!confirm('Delete row "' + (it.desc || '') + '"?')) return; }
          g.items.splice(ii, 1); app.touch(); router.render();
        }
      }, '×'))));
  });
  const foot = el('div', { class: 'pad formrow' },
    el('button', { class: 'btn sm sec', onclick: () => { g.items.push(newTakeoffItem()); app.touch(); router.render(); } }, '+ Row'),
    el('button', { class: 'btn sm sec', onclick: () => { g.items.push(...Array(5).fill(0).map(newTakeoffItem)); app.touch(); router.render(); } }, '+ 5 Rows'),
    el('span', { style: 'flex:1' }),
    el('button', {
      class: 'btn sm danger', onclick: () => {
        if (!confirm('Delete group "' + (g.name || ('#' + (gi + 1))) + '" and all its rows?')) return;
        bid.takeoff.groups.splice(gi, 1); app.touch(); router.render();
      }
    }, 'Delete group'));
  const details = el('details', { class: 'togroup' + (g.exclude ? ' excluded' : '') }, head, wrap(t), foot);
  details.open = TAKEOFF_OPEN.has(gi);
  details.addEventListener('toggle', () => { if (details.open) TAKEOFF_OPEN.add(gi); else TAKEOFF_OPEN.delete(gi); });
  return details;
}

// Relocate CAE: port of the Copy_CAEn VBA — values into a group, qty=1, unit=total; SM Import cleared.
function relocateCae() {
  const bid = app.bid;
  const cae = app.computed.takeoff.groups[0];
  if (!cae.rows.some(r => r.calc.H || r.calc.K || r.calc.M || r.qty)) { toast('CAE group is empty — nothing to relocate', true); return; }
  const name = prompt('Name for the new takeoff group (section name):', 'CAE Import');
  if (name === null) return;
  const items = cae.rows
    .filter(r => r.qty || r.calc.H || r.calc.K || r.calc.M)
    .map(r => ({
      ...newTakeoffItem(),
      matPhase: r.matPhase, shopPhase: r.shopPhase, fieldPhase: r.fieldPhase, desc: r.desc,
      qty: 1, fUnit: r.calc.H, sUnit: r.calc.K, mUnit: r.calc.M,
    }));
  bid.takeoff.groups.push({ id: bid.takeoff.groups.length + 1, name, type: bid.takeoff.caeType || '', exclude: false, items });
  bid.smImport.rows = [];   // Remove_CAE_NoQuestion equivalent
  app.touch(); router.render();
  toast('CAE relocated into group "' + name + '" — SM Import cleared');
}

// Read a takeoff export into SM Import rows. .csv/.txt go straight to the paste
// parser; .xlsx is unpacked with the same OOXML helpers the spreadsheet export
// uses, so there is no extra library.
// The macros opened these files with Origin:=437 — the old DOS code page — so a
// degree, diameter or fraction symbol in a Description is not UTF-8. Read as UTF-8
// first (that is what a modern export writes) and fall back only if it comes out
// broken. Browsers have no cp437 decoder, hence the table.
const CP437_HIGH =
  'ÇüéâäàåçêëèïîìÄÅÉæÆôöòûùÿÖÜ¢£¥₧ƒáíóúñÑªº¿⌐¬½¼¡«»' +
  '░▒▓│┤╡╢╖╕╣║╗╝╜╛┐└┴┬├─┼╞╟╚╔╩╦╠═╬╧╨╤╥╙╘╒╓╫╪┘┌█▄▌▐▀' +
  'αßΓπΣσµτΦΘΩδ∞φε∩≡±≥≤⌠⌡÷≈°∙·√ⁿ²■ ';
function decodeExportText(buf) {
  const utf = new TextDecoder('utf-8').decode(buf);
  if (!utf.includes('�')) return utf;
  let out = '';
  for (let i = 0; i < buf.length; i++) out += buf[i] < 128 ? String.fromCharCode(buf[i]) : CP437_HIGH[buf[i] - 128];
  return out;
}

async function readSmImportFile(f) {
  const buf = new Uint8Array(await f.arrayBuffer());
  const isZip = buf[0] === 0x50 && buf[1] === 0x4B;
  if (!isZip) return parseTakeoffExport(decodeExportText(buf));

  const entries = await zipRead(buf);
  if (!entries.find(e => e.name === 'xl/workbook.xml')) throw new Error('not a spreadsheet or a text export');
  if (entries.find(e => e.name === 'xl/worksheets/sheet17.xml') && entries.find(e => e.name === 'xl/vbaProject.bin')) {
    throw new Error('that is the estimate workbook — import it from Home to load the whole bid');
  }
  const dec = (n) => { const p = entries.find(e => e.name === n); return p ? new TextDecoder().decode(p.bytes) : ''; };

  // first sheet in the workbook's own order: workbook.xml -> rels -> part name
  const first = /<sheet\b[^>]*r:id="([^"]+)"/.exec(dec('xl/workbook.xml'));
  let part = 'xl/worksheets/sheet1.xml';
  if (first) {
    const rel = new RegExp('<Relationship[^>]*Id="' + first[1] + '"[^>]*Target="([^"]+)"').exec(dec('xl/_rels/workbook.xml.rels'));
    if (rel) part = rel[1].replace(/^\/?(xl\/)?/, 'xl/');
  }
  const xml = dec(part);
  if (!xml) throw new Error('could not find the first worksheet');

  const shared = xlsmSharedStrings(entries);
  const cells = xlsmIndexCells(xml);
  const rows = new Map();
  for (const [addr, node] of cells) {
    const m = /^([A-Z]+)(\d+)$/.exec(addr);
    if (!m) continue;
    const v = xlsmNodeValue(node, shared);
    if (v === null || v === '') continue;
    let col = 0;
    for (const ch of m[1]) col = col * 26 + ch.charCodeAt(0) - 64;
    const r = +m[2];
    if (!rows.has(r)) rows.set(r, []);
    rows.get(r)[col - 1] = v;
  }
  const lines = [...rows.keys()].sort((a, b) => a - b)
    .map(r => { const cols = rows.get(r); for (let i = 0; i < cols.length; i++) if (cols[i] === undefined) cols[i] = ''; return cols.join('\t'); });
  return parseTakeoffExport(lines.join('\n'));
}

// ---- raw takeoff exports -------------------------------------------------
// The old macros read C:\MAP-Software\EST\Exports\FESTR.txt (TSI) and
// FESTR_QP.txt (QuickPen), pasted them into an audit-trail sheet, pivoted, and
// pasted the pivot output into SM Import. These do the pivot's work directly.
// Layouts and rules: docs/specs/sm-import-schedule.md §3-§5.

// split a delimited line, honouring "quoted, fields"
function splitDelimited(line, delim) {
  const out = [];
  let cur = '', q = false;
  for (let i = 0; i < line.length; i++) {
    const ch = line[i];
    if (q) {
      if (ch === '"') { if (line[i + 1] === '"') { cur += '"'; i++; } else q = false; }
      else cur += ch;
    } else if (ch === '"') q = true;
    else if (ch === delim) { out.push(cur); cur = ''; }
    else cur += ch;
  }
  out.push(cur);
  return out.map(v => v.trim());
}
const TSI_COLS = 30, QP_COLS = 15;                     // the two exports' fixed widths

// The macro let Excel split on tab AND comma at once (Tab:=True, Comma:=True). Doing
// that literally would tear a tab-separated row apart at a comma inside a Description,
// so pick the delimiter that actually yields one of the two known widths instead.
function splitExportRows(text) {
  const lines = String(text).split(/\r?\n/).filter(l => l.trim() !== '');
  if (!lines.length) return [];
  const known = (n) => n === TSI_COLS || n === QP_COLS;
  const t = splitDelimited(lines[0], '\t').length, c = splitDelimited(lines[0], ',').length;
  let delim = '\t';
  if (known(c) && !known(t)) delim = ',';
  else if (!known(t) && !known(c) && c > t) delim = ',';
  return lines.map(l => splitDelimited(l, delim));
}

const TSI_HEAD = ['drawing', 'section', 'zone', 'service', 'service type'];
const QP_HEAD = ['floor', 'service type', 'material', 'shape', 'cut type'];
// TrailingMinusNumbers:=True in the macro — "123-" is negative in these files.
const num = (v) => {
  let s = String(v ?? '').trim();
  if (/^[\d.,]+-$/.test(s)) s = '-' + s.slice(0, -1);
  const n = fmt.parseNum(s);
  return n === null ? 0 : n;
};

// Which export is this? The header row names it, so a renamed file still works. If
// the header is missing the file is still usable: the two exports are a fixed width
// apart, and QuickPen's Labor Type column is a short known list.
function takeoffExportKind(rows) {
  const h = ((rows && rows[0]) || []).map(v => String(v).toLowerCase().trim());
  const starts = (want) => want.every((w, i) => h[i] === w);
  if (starts(TSI_HEAD)) return { kind: 'tsi', header: true };
  if (starts(QP_HEAD)) return { kind: 'qp', header: true };
  const sample = (rows || []).slice(0, 50);
  const width = Math.max(0, ...sample.map(r => r.length));
  const laborish = sample.some(r => /^(field|shop|n\/?a|equipment)$/i.test(String(r[5] ?? '').trim()));
  if (laborish && width >= QP_COLS - 3) return { kind: 'qp', header: false };
  if (width >= TSI_COLS - 4) return { kind: 'tsi', header: false };
  return null;
}

function parseTakeoffExport(text) {
  const rows = splitExportRows(text);
  const found = takeoffExportKind(rows);
  if (!found) {
    // A wide table we cannot place is almost certainly the wrong file. Importing it
    // anyway would quietly add junk rows, so say what we were looking for instead.
    if ((rows[0] || []).length >= 10) {
      throw new Error('this does not look like a takeoff export. It should be FESTR.txt (EST) or ' +
        'FESTR_QP.txt (QuickPen) from C:\\MAP-Software\\EST\\Exports — the How To page shows where to find it');
    }
    return parseSmImportPaste(text);                   // already-summarised rows, or a paste
  }
  const body = found.header ? rows.slice(1) : rows;
  return found.kind === 'tsi' ? aggregateTsiExport(body) : aggregateQpExport(body);
}

// The pivots sorted on their row fields and the macro pasted that order into SM
// Import. Match it so an imported list can be read down beside the old spreadsheet's.
function sortGroups(groups, order) {
  return [...groups].sort((a, b) => {
    for (const i of order) {
      const c = String(a.key[i]).localeCompare(String(b.key[i]), undefined, { numeric: true, sensitivity: 'base' });
      if (c) return c;
    }
    return 0;
  });
}
// Delete_Blank: the macro wiped the pivot's "(blank)" labels before using them. They
// come from the source range running one row past the data (see the OFFSET names).
const unblank = (v) => (/^\(blank\)$/i.test(v) ? '' : v);
const allBlank = (key) => key.every(v => v === '');

// TSI / EST "All Material" pivot: group Section / Service / Service Type / Material /
// Cut Type and sum Qty, Install Hours, Fab Hours, Total Material Cost.
//
// Three of those four are CALCULATED fields defined in the pivot cache, not columns
// in the file (xl/pivotCache/pivotCacheDefinition2.xml, verbatim):
//     Install Hours       = 'Install time' / 60      <- the export writes MINUTES
//     Fab Hours           = 'Fab time'    / 60
//     Total Material Cost = 'M-Rate' - 'Ext Wrap Cost'
// Miss the /60 and every imported hour is 60x too big. (Fab Hours is plain
// Fab time/60 — it does NOT add Insul Fab time, which has its own unused field.)
const TSI_MINUTES_PER_HOUR = 60;
function aggregateTsiExport(body) {
  const C = { section: 1, service: 3, serviceType: 4, qty: 7, cutType: 9, material: 12,
    mRate: 14, fabTime: 15, installTime: 16, extWrapCost: 23 };
  const groups = new Map();
  for (const r of body) {
    if (!r || r.length < 13) continue;
    const clean = (v) => unblank(String(v ?? '').replace(/Spiral Straight/g, 'Decoiled Straight').trim());  // the macro's replacement
    const key = [clean(r[C.section]), clean(r[C.service]), clean(r[C.serviceType]), clean(r[C.material]), clean(r[C.cutType])];
    if (allBlank(key)) continue;                       // the trailing blank row
    const k = key.join('\u0000');
    if (!groups.has(k)) groups.set(k, { key, qty: 0, field: 0, shop: 0, mat: 0 });
    const g = groups.get(k);
    g.qty += num(r[C.qty]);
    g.field += num(r[C.installTime]) / TSI_MINUTES_PER_HOUR;
    g.shop += num(r[C.fabTime]) / TSI_MINUTES_PER_HOUR;
    g.mat += num(r[C.mRate]) - num(r[C.extWrapCost]);
  }
  return sortGroups(groups.values(), [0, 1, 2, 3, 4]).map(g => ({
    floor: g.key[0], service: g.key[1], type: g.key[2], material: g.key[3], cutType: g.key[4],
    qty: g.qty, fieldHoursRaw: g.field, shopHoursRaw: g.shop, materialCost: g.mat,
    fieldPct: '', shopPct: '',
  }));
}

// QuickPen "QP All" pivot: group Floor / Service Type / Material / Shape / Cut Type,
// with the macro's filters — Qty and field hours from Labor Type "Field" rows only,
// shop hours from "Shop" rows, material cost from everything except blank / N/A, and
// Cut Type "Wrap" left out (it feeds the separate wrap pivot). Labor Hours here are
// already hours; only the TSI export is in minutes.
//
// Import_QP also cleans the raw rows first, in this order — the order matters,
// because the rename feeds the swap:
//   1. 3003H14Aluminum -> Alum                (whole cell)
//   2. Flex Connector  -> Canvas Connector    (whole cell)
//   3. rows whose Cut Type is Hanger or Canvas Connector: the macro cuts that cell
//      and inserts it one column left, which nets out as SWAPPING Shape and Cut Type.
//      QuickPen writes those two the wrong way round. Confirmed against the
//      workbook's own pivot cache: Hanger and Canvas Connector appear under Shape,
//      and shape words (Rectangular Duct, Round Duct, Air Device) appear under Cut
//      Type — which only happens if they were swapped.
//   4. a blank Material becomes N/A, so the row still groups instead of vanishing.
function qpCleanRow(raw) {
  const r = raw.map(v => {
    const s = String(v ?? '').trim();
    if (/^3003H14Aluminum$/i.test(s)) return 'Alum';
    if (/^Flex Connector$/i.test(s)) return 'Canvas Connector';
    return s;
  });
  if (/^(hanger|canvas connector)$/i.test(r[4] || '')) { const t = r[3]; r[3] = r[4]; r[4] = t; }
  if (r[2] === '' || r[2] === '0') r[2] = 'N/A';
  return r;
}
function aggregateQpExport(body) {
  const C = { floor: 0, serviceType: 1, material: 2, shape: 3, cutType: 4, laborType: 5, materialCost: 6, hours: 9, qty: 14 };
  const groups = new Map();
  for (const raw of body) {
    if (!raw || raw.length < 10) continue;
    const r = qpCleanRow(raw);
    const clean = (v) => unblank(String(v ?? '').trim());
    const cut = clean(r[C.cutType]);
    if (/^wrap$/i.test(cut)) continue;
    const labor = String(r[C.laborType] ?? '').trim();
    const key = [clean(r[C.floor]), clean(r[C.serviceType]), clean(r[C.shape]), clean(r[C.material]), cut];
    if (allBlank(key)) continue;                       // the trailing blank row
    const k = key.join('\u0000');
    if (!groups.has(k)) groups.set(k, { key, qty: 0, field: 0, shop: 0, mat: 0 });
    const g = groups.get(k);
    if (/^field$/i.test(labor)) { g.qty += num(r[C.qty]); g.field += num(r[C.hours]); }
    else if (/^shop$/i.test(labor)) g.shop += num(r[C.hours]);
    if (labor !== '' && !/^n\/?a$/i.test(labor)) g.mat += num(r[C.materialCost]);
  }
  // pivot row-field order is Floor, Service Type, Material, Shape, Cut Type
  return sortGroups(groups.values(), [0, 1, 3, 2, 4]).map(g => ({
    floor: g.key[0], service: g.key[1], type: g.key[2], material: g.key[3], cutType: g.key[4],
    qty: g.qty, fieldHoursRaw: g.field, shopHoursRaw: g.shop, materialCost: g.mat,
    fieldPct: '', shopPct: '',
  }));
}

function parseSmImportPaste(text) {
  const out = [];
  for (const line of text.split(/\r?\n/)) {
    if (!line.trim()) continue;
    const cells = line.includes('\t') ? line.split('\t') : line.split(',');
    if (cells.length < 3) continue;
    const [floor, service, type, material, cutType, qty, fh, sh, mat] = cells.map(s => s.trim());
    if ((type || '').toLowerCase() === 'type') continue; // header row
    out.push({
      floor: floor || '', service: service || '', type: type || '', material: material || '', cutType: cutType || '',
      qty: fmt.parseNum(qty) ?? '', fieldHoursRaw: fmt.parseNum(fh) ?? '', shopHoursRaw: fmt.parseNum(sh) ?? '',
      materialCost: fmt.parseNum(mat) ?? '', fieldPct: '', shopPct: '',
    });
  }
  return out;
}

function renderPhaseCustomCard(bid) {
  const t = el('table', { class: 'grid' });
  t.append(th('Phase code', 'Custom description (this bid only)', ''));
  const entries = Object.entries(bid.phaseCustom || {}).sort();
  for (const [code, desc] of entries) {

function exportTimeSheetCsv() {
  // The old TimeSheet macro exported Phase Codes B4:H102 (divisions 1-7) to the time-sheet template.
  const S = app.settings;
  const lines = ['Code,' + S.ref.phaseCodes.divisions.filter(d => d.div <= 7).map(d => d.name.replace(/,/g, ' ')).join(',')];
  for (let code = 1; code <= 99; code++) {
    const cc = String(code).padStart(2, '0');
    const row = [cc];
    for (const d of S.ref.phaseCodes.divisions.filter(d => d.div <= 7)) {
      const custom = (app.bid.phaseCustom || {})[d.div + '-' + cc];
      const std = (d.descriptions[cc] || {}).d || '';
      row.push((custom || std).replace(/,/g, ' '));
    }
    if (row.slice(1).some(x => x)) lines.push(row.join(','));
  }
  downloadBytes('Time Sheet.csv', new TextEncoder().encode(lines.join('\r\n')), 'text/csv');
  toast('Time Sheet phase-code matrix exported');
}

function exportBookingCsv() {
  const bid = app.bid, c = app.computed;
  const today = new Date();
  const mmddyy = (d, four) => String(d.getMonth() + 1).padStart(2, '0') + String(d.getDate()).padStart(2, '0') + (four ? d.getFullYear() : String(d.getFullYear()).slice(2));
  const lines = [];
  lines.push(';,' + (bid.booking.bookingType === 'Original' ? 'Original' : 'Change'));
  lines.push(';,Certified Payrole ' + (bid.booking.certifiedPayroll === 'Yes' ? 'Yes' : 'No'));
  lines.push('');
  lines.push(';Job Header');
  lines.push(['*', bid.info.jobNumber || '', bid.info.jobName || '', bid.info.address || '', bid.info.city || '', bid.info.state || '', bid.info.zip || '', mmddyy(today, false)].join(','));
  for (const d of c.booking.divisions) {
    for (const row of d.rows) {
      if (!(row.hours || row.labor || row.material)) continue;
      lines.push(['P', row.code, (row.desc || '').replace(/,/g, ' '), '', mmddyy(today, true), '', '', '', '1'].join(','));
      lines.push(['C', row.code, '', '1', mmddyy(today, true), row.hours.toFixed(2), '', (row.labor + row.material).toFixed(2)].join(','));
    }
  }
  const name = ((bid.info.jobNumber || bid.info.estNo || 'Job') + ' ' + (bid.info.jobName || '')).trim() + ' Booking Export.csv';
  downloadBytes(name.replace(/[\\/:*?"<>|]+/g, '-'), new TextEncoder().encode(lines.join('\r\n')), 'text/csv');
  toast('Booking CSV exported — one P + C record per booked phase');
}

function firstMondayOfMonth(d) {
  const seventh = new Date(d.getFullYear(), d.getMonth(), 7);
  const dow = (seventh.getDay() + 6) % 7; // Monday=0
  return new Date(d.getFullYear(), d.getMonth(), 7 - dow);
}

// A settings row: {path (into settings object), label, kind: 'money'|'pct'|'num'|'text', dec}
function settingRows() {
  const rows = [];
  const C = COMPANY;
  for (const [secKey, sec] of Object.entries(C.crew.sections)) {
    const g = 'Crew rates — ' + sec.label;
    sec.classes.forEach((cl, i) => {
      rows.push({ group: g, path: `crew.sections.${secKey}.classes[${i}].wage`, label: cl.name + ' — base wage $/hr', kind: 'money' });
      rows.push({ group: g, path: `crew.sections.${secKey}.classes[${i}].fringe`, label: cl.name + ' — fringe $/hr', kind: 'money' });
    });
    rows.push({ group: g, path: `crew.sections.${secKey}.periodFactor`, label: 'Period factor (escalation %)', kind: 'pct', dec: 1 });
    if (sec.shopBurden !== undefined) rows.push({ group: g, path: `crew.sections.${secKey}.shopBurden`, label: 'Shop burden $/hr', kind: 'money' });
    if (sec.otAdder !== undefined) rows.push({ group: g, path: `crew.sections.${secKey}.otAdder`, label: 'OT/DT subtotal adder $/hr', kind: 'money' });
    const p = `crew.sections.${secKey}.pti`;
    const gg = 'Payroll tax & insurance — ' + sec.label;
    for (const [k, lbl] of [['futa', 'FUTA'], ['sui', 'SUI'], ['sdi', 'SDI'], ['ss', 'Social Security'], ['medic', 'Medicare'], ['countyTax', 'County tax'], ['gl', 'General liability'], ['tri', 'TRI'], ['fmla', 'FMLA'], ['orSickLeave', 'OR sick leave']]) {
      rows.push({ group: gg, path: `${p}.${k}`, label: lbl + ' %', kind: 'pct', dec: 4 });
    }
    rows.push({ group: gg, path: `${p}.wc.gross`, label: "Workers' comp gross rate %", kind: 'pct', dec: 2 });
    rows.push({ group: gg, path: `${p}.wc.emr`, label: 'EMR (experience modifier)', kind: 'num', dec: 2 });
    rows.push({ group: gg, path: `${p}.wc.ogserp`, label: 'OGSERP factor', kind: 'num', dec: 2 });
    rows.push({ group: gg, path: `${p}.wc.dcbs`, label: 'DCBS premium assessment', kind: 'num', dec: 3 });

  const gl = 'Recap constants';

  rows.push({ group: gl, path: 'recap.lop610', label: "Loss of production % — 6 10's", kind: 'pct', dec: 0 });

  rows.push({ group: gl, path: 'recap.taxRates.washingtonBO', label: 'Washington B&O tax rate', kind: 'pct', dec: 3 });
  rows.push({ group: gl, path: 'recap.taxRates.multnomahAdder', label: 'Multnomah County adder (always applied)', kind: 'pct', dec: 2 });
  COMPANY.recap.equipmentRates.forEach((v, i) => {
    if (COMPANY.equipmentLabels[i]) rows.push({ group: 'Equipment default rates', path: `recap.equipmentRates[${i}]`, label: COMPANY.equipmentLabels[i], kind: 'money' });
  });
  COMPANY.bond.brackets.forEach((b, i) => {
    rows.push({ group: 'Bond brackets', path: `bond.brackets[${i}]`, label: 'Bracket ' + (i + 1) + ' width $', kind: 'num', dec: 0 });

  rows.push({ group: go, path: 'ocip.glProductsRate', label: 'GL products/completed per $1,000', kind: 'money' });
  COMPANY.permits.jurisdictions.forEach((j, ji) => {
    const gp = 'Permit tiers — ' + j.name;
    j.tiers.forEach((t, ti) => {
      rows.push({ group: gp, path: `permits.jurisdictions[${ji}].tiers[${ti}].fee`, label: `Tier ${ti + 1} (${fmt.int(t.min)}–${fmt.int(t.max)}) fee`, kind: 'money' });

    rows.push({ group: gp, path: `permits.jurisdictions[${ji}].markupPct`, label: 'Markup %', kind: 'pct', dec: 0 });
  });
  return rows;
}
