<title>Arctic Bid Tool</title>

<style>
:root {
  --blue: #1d2f9e;
  --blue-dark: #14206e;
  --blue-light: #eef1fb;
  --ink: #16181d;
  --muted: #5c6470;
  --line: #d7dbe3;
  --bg: #f4f5f8;
  --card: #ffffff;
  --input-bg: #fffef2;
  --input-border: #c8cede;
  --calc-bg: #f1f3f7;
  --good: #157347;
  --bad: #b02a37;
  --warn: #997404;
  --add: #d1e7dd;
  --rem: #f8d7da;
  --chg: #fff3cd;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  background: var(--bg); color: var(--ink);
}
button { font: inherit; cursor: pointer; }
input, select, textarea { font: inherit; color: var(--ink); }

/* ---------- App frame ---------- */
#app { display: flex; min-height: 100vh; }
#sidebar {
  width: 218px; flex: 0 0 218px; background: #10173f; color: #d7dcf5;
  display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; overflow-y: auto;
}
#sidebar .logo { padding: 14px 14px 10px; border-bottom: 1px solid #2a3468; }
#sidebar .logo img { width: 100%; max-width: 160px; display: block; filter: brightness(0) invert(1); }
#sidebar .bidname { padding: 10px 14px; font-size: 12px; color: #9aa3d0; border-bottom: 1px solid #2a3468; word-break: break-word; }
#sidebar .bidname b { color: #fff; display: block; font-size: 13px; }
#sidebar nav { flex: 1; padding: 6px 0; }
#sidebar nav a {
  display: block; padding: 8px 14px; color: #c3c9ea; text-decoration: none; font-size: 13.5px;
  border-left: 3px solid transparent;
}
#sidebar nav a:hover { background: #1a2354; color: #fff; }
#sidebar nav a.active { background: #1d2f9e; color: #fff; border-left-color: #7e8ef0; }
#sidebar nav .sep { border-top: 1px solid #2a3468; margin: 6px 0; }
#sidebar .foot { padding: 10px 14px; font-size: 11px; color: #77809f; border-top: 1px solid #2a3468; }

#main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
#topbar {
  position: sticky; top: 0; z-index: 30; background: var(--card); border-bottom: 1px solid var(--line);
  display: flex; align-items: center; gap: 14px; padding: 8px 18px; flex-wrap: wrap;
}
#topbar h1 { font-size: 17px; margin: 0; flex: 1; min-width: 120px; }
#topbar .total { font-size: 15px; font-weight: 700; color: var(--blue-dark); white-space: nowrap; }
#topbar .total small { font-weight: 400; color: var(--muted); margin-right: 6px; }
#view { padding: 18px; max-width: 1500px; width: 100%; margin: 0 auto; }

/* ---------- Cards & tables ---------- */
.card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; margin-bottom: 16px; overflow: hidden; }
.card > h2 {
  margin: 0; padding: 10px 14px; font-size: 14px; background: var(--blue-light);
  border-bottom: 1px solid var(--line); color: var(--blue-dark); display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
}
.card > h2 .spacer { flex: 1; }
.card .pad { padding: 14px; }
.hint { color: var(--muted); font-size: 12px; }
table.grid { border-collapse: collapse; width: 100%; font-size: 13px; }
table.grid th {
  background: #e9ecf3; border: 1px solid var(--line); padding: 4px 6px; font-weight: 600;
  text-align: left; white-space: nowrap; position: sticky; top: 0;
}
table.grid td { border: 1px solid var(--line); padding: 2px 4px; background: #fff; }
table.grid td.num, table.grid th.num { text-align: right; font-variant-numeric: tabular-nums; }
table.grid td.calc { background: var(--calc-bg); color: #333; }
table.grid td.label { background: #fafbfd; }
table.grid tr.subtotal td { background: #dfe5f2; font-weight: 700; }
table.grid tr.grand td { background: #c9d3ee; font-weight: 700; }
.tablewrap { overflow-x: auto; max-width: 100%; }
/* How To / Function Map prose: readable line length, real numbered steps, and file
   paths that stand out enough to be typed into File Explorer without squinting. */
.howto { max-width: 760px; line-height: 1.55; }
.howto h3 { margin: 22px 0 6px; font-size: 15px; color: var(--blue-dark); }
.howto h4 { margin: 16px 0 4px; font-size: 13.5px; }
.howto p { margin: 8px 0; }
.howto ul, .howto ol { margin: 8px 0 8px 22px; padding: 0; }
.howto li { margin: 5px 0; }
.howto ol { counter-reset: none; }
.howto .licont { margin: 4px 0 8px 22px; }
.howto code, .howto .licont code {
  font-family: Consolas, "Courier New", monospace; font-size: 13px; font-weight: 600;
  background: var(--blue-light); color: var(--blue-dark);
  padding: 2px 6px; border-radius: 4px; white-space: nowrap;
}
.howto table.grid { font-size: 12.5px; }
.pathbox { display: inline-flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.pathbox code {
  font-family: Consolas, "Courier New", monospace; font-size: 13px; font-weight: 600;
  background: var(--blue-light); color: var(--blue-dark); padding: 5px 9px; border-radius: 5px;
}
@media (max-width: 700px) { .howto code { white-space: normal; word-break: break-all; } }

/* Inputs */
.in, table.grid input, table.grid select {
  width: 100%; border: 1px solid var(--input-border); background: var(--input-bg);
  border-radius: 3px; padding: 3px 5px; min-width: 40px;
}
table.grid input:focus, .in:focus, select:focus, textarea:focus { outline: 2px solid #7e8ef0; outline-offset: 0; }
table.grid input.num { text-align: right; font-variant-numeric: tabular-nums; }
input:disabled, select:disabled { background: var(--calc-bg); color: #555; border-color: transparent; }
.formrow { display: flex; gap: 14px; flex-wrap: wrap; margin-bottom: 10px; }
.formrow label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 2px; }
.formrow > div { min-width: 130px; }
.err { color: var(--bad); font-weight: 700; }
.badge { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 11.5px; font-weight: 600; }
.badge.blue { background: var(--blue-light); color: var(--blue-dark); }
.badge.green { background: var(--add); color: var(--good); }
.badge.red { background: var(--rem); color: var(--bad); }
.badge.yellow { background: var(--chg); color: var(--warn); }

/* Buttons */
.btn {
  background: var(--blue); color: #fff; border: 1px solid var(--blue-dark); border-radius: 5px;
  padding: 6px 14px; font-size: 13px; font-weight: 600;
}
.btn:hover { background: var(--blue-dark); }
.btn.sec { background: #fff; color: var(--blue-dark); border-color: var(--input-border); }
.btn.sec:hover { background: var(--blue-light); }
.btn.danger { background: #fff; color: var(--bad); border-color: #e4b6bb; }
.btn.danger:hover { background: var(--rem); }
.btn.sm { padding: 2px 9px; font-size: 12px; }
.btn:disabled { opacity: .5; cursor: default; }

/* ---------- Modal ---------- */
.modal-back {
  position: fixed; inset: 0; background: rgba(10,14,40,.55); z-index: 100;
  display: flex; align-items: center; justify-content: center; padding: 20px;
}
.modal {
  background: #fff; border-radius: 10px; max-width: 860px; width: 100%;
  max-height: 88vh; display: flex; flex-direction: column; box-shadow: 0 18px 60px rgba(0,0,0,.35);
}
.modal > h3 { margin: 0; padding: 14px 18px; border-bottom: 1px solid var(--line); font-size: 16px; }
.modal .body { padding: 14px 18px; overflow-y: auto; }
.modal .foot { padding: 12px 18px; border-top: 1px solid var(--line); display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; }

/* Diff view */
.diff-group { margin-bottom: 14px; }
.diff-group h4 { margin: 0 0 6px; font-size: 13.5px; color: var(--blue-dark); }
table.diff { border-collapse: collapse; width: 100%; font-size: 12.5px; }
table.diff th, table.diff td { border: 1px solid var(--line); padding: 3px 7px; text-align: left; vertical-align: top; }
table.diff td.old { background: var(--rem); }
table.diff td.new { background: var(--add); }
tr.k-added td.new { background: var(--add); }
tr.k-removed td.old { background: var(--rem); }

/* Dashboard */
.bidcards { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 14px; }
.bidcard { background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 14px; cursor: pointer; position: relative; }
.bidcard:hover { border-color: var(--blue); box-shadow: 0 3px 14px rgba(29,47,158,.14); }
.bidcard h3 { margin: 0 0 4px; font-size: 15px; }
.bidcard .meta { font-size: 12px; color: var(--muted); }
.bidcard .amt { font-size: 17px; font-weight: 700; color: var(--blue-dark); margin: 6px 0; }
.bidcard .rowbtns { display: flex; gap: 6px; margin-top: 8px; }

/* Group blocks on takeoff */
details.togroup { border: 1px solid var(--line); border-radius: 8px; margin-bottom: 12px; background: #fff; }
details.togroup > summary {
  cursor: pointer; padding: 9px 12px; background: var(--blue-light); border-radius: 8px;
  font-weight: 600; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; list-style: none;
}
details.togroup[open] > summary { border-bottom: 1px solid var(--line); border-radius: 8px 8px 0 0; }
details.togroup > summary::-webkit-details-marker { display: none; }
details.togroup > summary .caret { transition: transform .15s; font-size: 11px; }
details.togroup[open] > summary .caret { transform: rotate(90deg); }
details.togroup > summary .sums { margin-left: auto; font-size: 12px; color: var(--muted); font-weight: 400; white-space: nowrap; }
details.togroup.excluded > summary { background: #f4d8db; text-decoration: line-through; }
.excl-note { color: var(--bad); font-size: 12px; font-weight: 600; }

/* checkbox pill */
label.ck { display: inline-flex; gap: 6px; align-items: center; font-size: 12.5px; cursor: pointer; user-select: none; }

/* Settings */
.set-row { display: grid; grid-template-columns: minmax(200px, 1.4fr) 120px 120px 70px; gap: 10px; align-items: center; padding: 4px 0; border-bottom: 1px dashed #e5e8ef; }
.set-row .factory { color: var(--muted); font-size: 12px; text-align: right; font-variant-numeric: tabular-nums; }
.set-changed { background: var(--chg); }

/* SM Import drop zone */
.smi-drop {
  border: 2px dashed var(--input-border); border-radius: 8px; padding: 14px; text-align: center;
  background: #fcfcff; margin-bottom: 10px;
}
.smi-drop.over { border-color: var(--blue); background: var(--blue-light); }
.smi-drop b { display: block; margin-bottom: 4px; }

/* ---------- Progress ---------- */
.prog-back {
  position: fixed; inset: 0; background: rgba(10,14,40,.45); z-index: 300;
  display: flex; align-items: center; justify-content: center; padding: 20px;
}
.prog {
  background: #fff; border-radius: 10px; width: 420px; max-width: 100%;
  padding: 18px 20px; box-shadow: 0 18px 60px rgba(0,0,0,.35);
}
.prog h4 { margin: 0 0 4px; font-size: 15px; }
.prog .stage { font-size: 12.5px; color: #555; min-height: 17px; }
.prog .track { height: 8px; background: #e6e9f4; border-radius: 6px; overflow: hidden; margin: 10px 0 6px; }
.prog .fill { height: 100%; width: 0; background: var(--blue); border-radius: 6px; transition: width .15s linear; }
.prog .fill.indet { width: 35%; animation: prog-slide 1.1s ease-in-out infinite; }
@keyframes prog-slide { 0% { margin-left: -35%; } 100% { margin-left: 100%; } }
.prog .pct { font-size: 12px; color: #666; text-align: right; font-variant-numeric: tabular-nums; }

.toast {
  position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
  background: #10173f; color: #fff; padding: 10px 20px; border-radius: 8px; z-index: 200;
  box-shadow: 0 8px 30px rgba(0,0,0,.3); font-size: 13.5px; max-width: 90vw;
}
.toast.bad { background: var(--bad); }

@media (max-width: 900px) {
  #app { flex-direction: column; }
  #sidebar { width: 100%; flex: none; height: auto; position: static; }
  #sidebar nav { display: flex; flex-wrap: wrap; }
  #sidebar nav a { border-left: none; border-bottom: 3px solid transparent; }
  #sidebar nav a.active { border-left: none; border-bottom-color: #7e8ef0; }
  #sidebar nav .sep { display: none; }
  .set-row { grid-template-columns: 1fr 100px 100px 60px; }
}
@media print {
  #sidebar, #topbar, .noprint { display: none !important; }
  body { background: #fff; }
  #view { padding: 0; max-width: none; }
  .card { break-inside: avoid; border: none; }
}
</style>

const FUNCTION_MAP_HTML = "<h2 style=\"margin-top:0\">Arctic Bid Tool \u2014 Complete Function Map</h2>\n<p>This document maps <b>every function of <code>REV_1 The Dalles Adventist Energy Upgrades Estimate.xlsm</code></b></p>\n<p>(21 sheets, ~350 named ranges, ~50 VBA modules) to where it lives in <code>index.html</code>.</p>\n<p>Nothing was dropped; every formula was ported and verified against the workbook&#x27;s own</p>\n<p>computed values (see <i>Verification</i> at the bottom).</p>\n<h3>Sheets \u2192 App pages</h3>\n<div class=\"tablewrap\"><table class=\"grid\">\n<tr><th>Workbook sheet</th><th>App location</th><th>Notes</th></tr>\n<tr><td><b>MCAA RECAP</b></td><td>Estimate Recap page</td><td>The hub. Labor modifiers (Detailing/Testing/Safety/QC/Material-Handling \u00d74 trades), schedule LOP, blended crew rates, labor &amp; material totals, subcontractors (Quote/Plug), supervision, GC/indirects (Page 2), equipment rentals (Page 3), markups, market recovery, bond, permits, CAT/B&amp;O tax (+0.15% Multnomah always), $5 cost-leveler, <b>Total Bid</b>. Stored-total snapshot (was Ctrl+T) is the &quot;Store current total&quot; button. Goal-seek on adder % (was two buttons) \u2014 type the target as <code>=hours/base</code> in any % field.</td></tr>\n<tr><td><b>TakeOff</b></td><td>TakeOff page</td><td>CAE group + unlimited numbered groups (was 31). Per row: 3 phase codes (dropdowns from Phase Codes), qty \u00d7 unit \u00d7 multiplier for field/shop hours, material unit $, EMO flag, OT/DBLT, SWING/GRAVE/SPECIAL shift with Plumb/Pipe loss-of-production uplift. Group exclude checkboxes zero the group exactly like <code>SM_ExludeGroup*</code>. Material cells accept typed math (<code>=80730+250</code>) like estimators did in Excel. Hidden cost columns T\u2013AM (straight/OT/DT/shift adds per trade) are computed internally and feed everything downstream.</td></tr>\n<tr><td><b>Crew Mix</b></td><td>Crew Mix page</td><td>Wage+fringe tables per classification (company settings), PT&amp;I stack incl. WC = gross\u00d7EMR\u00d7OGSERP\u00d7DCBS\u00d7OCCPAP, $0.35 OT/DT adder (field &amp; plumb only), unrounded shop PT&amp;I quirk, $16.50 shop burden, period escalation factors, ST/OT/DT blended crew rates, shift premium adders, OCIP $/hr deduct (incl. the workbook&#x27;s 4\u00d7-Foreman weighting quirk, flagged in UI).</td></tr>\n<tr><td><b>SM Import</b></td><td>SM Import page</td><td>Replaces the TSI / QuickPen VBA imports with a paste zone + editable grid. Field/Shop &quot;% of labor&quot; difficulty columns scale hours (Easy/Standard/Hard). Feeds the TakeOff CAE group via the same Type/Material/CutType bucket rules (incl. the BLK row-20 criteria quirk). &quot;Relocate CAE \u2192 group&quot; reproduces the 1,714-line <code>Relocate_CAE</code> macro: values copied to a group at qty 1, SM Import cleared.</td></tr>\n<tr><td><b>SM Audit Trail / QP SM Audit Trail / Pivot</b></td><td>inside SM Import import path</td><td>The audit-trail \u2192 pivot funnel is replaced by direct aggregation of pasted rows; pre-aggregated paste also accepted. <code>Ext_Insul</code> names were consumed by nothing (verified) \u2014 documented, not ported.</td></tr>\n<tr><td><b>Work Recovery</b></td><td>card on Recap page (+ Indirects PDF)</td><td>Per-trade hours (same MCAA cell math), $/hr approved \u00d7 min(max hours, hours), rounded to $; feeds Market Recovery line and Booking netting rows.</td></tr>\n<tr><td><b>EMO</b></td><td>Indirect Costs page</td><td>\u03a3 material where TakeOff EMO=&quot;Yes&quot;; original (O&amp;P) vs revised (equipment-markup) \u2014 H61/H62 wiring identical.</td></tr>\n<tr><td><b>Permits</b></td><td>Indirect Costs page</td><td>All five jurisdiction fee-tier tables (Portland/Multnomah, Hillsboro, Clackamas, Tualatin, Custom) with plan-review + markup ROUNDUP math, jurisdiction radio \u2192 <code>S1</code>, construction value = Project Subtotal (H63). Custom tiers are per-bid inputs, others are company settings.</td></tr>\n<tr><td><b>Bond</b></td><td>Indirect Costs page</td><td>5-bracket progressive premium, each bracket ROUNDUP to $; sell price = H63+H64+H65+H67.</td></tr>\n<tr><td><b>OCIP</b></td><td>Indirect Costs page</td><td>Full premium worksheet: on-site payrolls from labor values \u00d7 60% payroll fraction \u00d7 arch/HVAC split (D27), WC classes 5535/5606/5537/5183, EMR/factors/DCBS Oregon tax, GL $3.59+$8.59 per $1,000. Radio form fields kept as bid data. Division-by-zero guard added (workbook quirk R139/R141).</td></tr>\n<tr><td><b>Breakdown</b> (veryHidden)</td><td>internal (Price Breakdown / Schedule feed)</td><td>Group prime-cost aggregation lives in the engine; sale-price spread logic is on the Price Breakdown page.</td></tr>\n<tr><td><b>Price Breakdown</b></td><td>Price Breakdown page</td><td>Per-section field/shop labor cost (\u03a3 TakeOff AG/AH), material, hours; GC &amp; Fee allocated pro-rata by section subtotal; per-section notes. Fee = H60+H61+H62+H69.</td></tr>\n<tr><td><b>Proposal</b></td><td>Proposal page</td><td>Letterhead form, scope paragraph, quick exclusions (concatenated line, was W/X columns), detail exclusion library (AC column), <code>SpellNumber</code> amount-in-words, acceptance/validity text.</td></tr>\n<tr><td><b>Booking Report</b></td><td>Booking Report page</td><td>All 8 divisions \u00d7 99 phase codes. Plain rows = SUMIFS over TakeOff by phase column; the 261 special rows (supervision, adder hours, trucking, GC amounts by phase-code match, subsistence, work-recovery netting, equipment/subcontract SUMIFs) run through an embedded formula evaluator using the workbook&#x27;s own formulas. E/M/OH/OT/S booking codes, status block (booked vs bid \u00b1$2, hour target M18), Booking CSV export (generalized to every booked phase \u2014 the workbook only exported 1-01 and had an empty-filename bug).</td></tr>\n<tr><td><b>Booking CSV</b></td><td>&quot;Booking CSV&quot; button on Booking page</td><td><code>;</code> comment rows, <code>*</code> job header, <code>P</code>/<code>C</code> records, mm/dd/yy stamps.</td></tr>\n<tr><td><b>Phase Codes</b></td><td>dropdowns everywhere + Settings note</td><td>8 divisions \u00d7 99 codes; 270 standard descriptions embedded; per-bid custom code slots kept per bid (<code>phaseCustom</code>). Field list = divisions 1,3\u20138; shop = 2; material = all (exactly the workbook&#x27;s hidden O/Q/S lists).</td></tr>\n<tr><td><b>Takeoff Notes</b></td><td>Notes page</td><td>40-row table: Dry/Wet/Service, description, cost impact, EST $, bid strategy, RFI.</td></tr>\n<tr><td><b>SM Schedule</b></td><td>Schedule page</td><td>48-week Gantt: packages from takeoff groups, tasks with start/finish/status/manpower, work-day counts (5-day weeks), first-Monday anchor or alternate start date. Output-only, as in the workbook.</td></tr>\n<tr><td><b>Macros</b> (veryHidden)</td><td>n/a</td><td>Was only the &quot;enable macros&quot; gate.</td></tr>\n</table></div>\n<h3>VBA macros \u2192 App features</h3>\n<div class=\"tablewrap\"><table class=\"grid\">\n<tr><th>Macro</th><th>Replacement</th></tr>\n<tr><td><code>SaveWorkBook</code> (Ctrl+S naming <code>EstNo JobName</code>)</td><td>Export filenames: <code>EstNo JobName Rev N - Page.pdf</code> / <code>.zip</code></td></tr>\n<tr><td><code>EstimateTotal</code> form (Ctrl+T)</td><td>&quot;Store current total&quot; + live drift readout on Recap</td></tr>\n<tr><td><code>GoalSeek_MCAA</code> / <code>_MCAA2</code></td><td>Type <code>=targetHours/baseHours</code> into any % input (all inputs accept math)</td></tr>\n<tr><td><code>Plug_Quote</code> (Ctrl+W/Q red font)</td><td>Notes column carries &quot;Plug&quot;; Quote/Plug dropdown on subcontract rows</td></tr>\n<tr><td><code>Import_TSI</code> / <code>Import_QP</code></td><td>SM Import: drop a <code>.csv</code> / <code>.txt</code> / <code>.xlsx</code> export on the page, or paste the rows \u2014 both go through one parser</td></tr>\n<tr><td><code>Import_QPPipe</code></td><td>Dead code in the workbook (target sheets missing) \u2014 documented, not ported</td></tr>\n<tr><td><code>RemoveSMImport</code> / <code>Remove_CAE_NoQuestion</code></td><td>&quot;Clear all&quot; on SM Import (confirm), auto after Relocate CAE</td></tr>\n<tr><td><code>Relocate_CAE</code> (31 clones)</td><td>&quot;Relocate CAE \u2192 group&quot; button on TakeOff</td></tr>\n<tr><td><code>InsertRowsAndFillFormulas</code></td><td>&quot;+ Row&quot; / &quot;+ 5 Rows&quot; per group (groups are variable-length lists)</td></tr>\n<tr><td><code>HideSheet</code>/<code>ProtectAll</code>/<code>UnProtectAll</code></td><td>n/a (no macro gate needed); locked cells \u2192 Settings page</td></tr>\n<tr><td><code>Hide_Takeoff_Cells</code> / <code>HideSMBookingColumns</code></td><td>Cost columns are internal; phase columns always visible</td></tr>\n<tr><td><code>Booking</code> (CSV export)</td><td>Booking CSV button (fixed filename bug, generalized to all phases)</td></tr>\n<tr><td><code>HideDiv1..8</code> (hide blank booking rows)</td><td>Booking page only renders rows with values or descriptions</td></tr>\n<tr><td><code>CrewMixShowAll/...</code> navigation</td><td>Crew Mix sections are always visible cards</td></tr>\n<tr><td><code>TimeSheet</code> (phase-code export)</td><td>Phase-code matrix embedded; Booking page/PDF covers reporting</td></tr>\n<tr><td><code>YesNoMessageBox</code> (new job flow)</td><td>&quot;+ New Bid&quot; on Home</td></tr>\n<tr><td><code>SpellNumber</code> (VBA function)</td><td>JS <code>spellNumber()</code> on Proposal</td></tr>\n<tr><td><code>SendEmail</code> (dead code, commented out)</td><td>not ported</td></tr>\n<tr><td><code>Workbook_BeforePrint</code> guard</td><td>Crew-mix &quot;no crew but hours exist&quot; warning badge</td></tr>\n</table></div>\n<h3>New abilities (requested)</h3>\n<ul>\n<li><b>Local storage bids</b> with autosave; bid library on Home.</li>\n<li><b>Revision tracking</b>: every bid carries <code>rev</code>; &quot;New Rev&quot; duplicates; <b>importing a file (older or newer) shows a field-by-field diff</b> \u2014 what you have vs what the file has, grouped by page, with plain-English labels. <b>Each difference is its own accept/deny tick box</b> (accept-all / deny-all, and per-page toggles), so a rev can be merged field by field rather than taken wholesale. Structural differences are the one exception: when the two bids disagree on how many rows or groups a list holds, the indices no longer line up, so that list is presented as a single all-or-nothing decision \u2014 applying half of it would corrupt the bid. Applying is one Undo step.</li>\n<li><b>Export</b>: any subset of pages, as one PDF or a ZIP of per-page PDFs, named <code>EstNo JobName Rev N - Page.pdf</code>. <b>Every PDF embeds the complete bid data</b> (a <code>bid.json</code> attachment inside the PDF), and the ZIP carries <code>bid.json</code> too \u2014 so importing any exported file restores the exact bid.</li>\n<li><b>Proposal PDF</b>: printed as the workbook&#x27;s own Proposal form \u2014 the double-ruled boxes, the letterhead, the tiny italic field labels, the scope/exclusions box, WE PROPOSE and the acceptance block. Every element is placed at the position measured off the sheet&#x27;s own print-out, inset 10pt so no border falls in a printer&#x27;s unprintable margin. Exclusions compose into one comma-separated run to the right of the label, exactly as the sheet&#x27;s <code>D39</code> formula does, and the amount in words is a faithful port of the workbook&#x27;s <code>SpellNumber</code> VBA (including its &quot;No Cents&quot; wording and double-space quirk). Content that outgrows the box continues on a second page instead of being clipped, which is what Excel does.</li>\n<li><b>Every table cell is width-fitted</b>, borrowing space only from genuinely empty neighbours, so no value can ever print on top of another. Multi-page tables repeat the group header as &quot;(continued)&quot;, and every page except the proposal form carries <code>Page N of M</code> with the estimate/job/rev.</li>\n<li><b>Import</b>: <code>.pdf</code>, <code>.zip</code>, or <code>.json</code> produced by the tool \u2014 <b>and <code>.xlsm</code> workbooks</b> (an untouched original estimate or one exported by this tool; both parse to the same bid).</li>\n<li><b>Spreadsheet export (<code>.xlsm</code>)</b>: &quot;Export as Spreadsheet&quot; writes a real macro-enabled workbook by injecting the bid&#x27;s inputs into an embedded byte-copy of the original estimate template. Formatting, formulas, macros (<code>vbaProject.bin</code> byte-identical), sheet protection, hidden sheets, form controls and pivots are all preserved; Excel recalculates on first open. People can work off the website or the exported workbook interchangeably.</li>\n<li><b>Company settings</b>: every locked constant (wages, fringes, PT&amp;I, WC factors, permit tiers, bond brackets, OCIP rates, LOP factors, equipment rates) is editable with factory values shown; bids freeze the rates they were priced with, with a one-click &quot;apply current rates&quot;.</li>\n<li><b>Back/forward buttons</b> work on desktop and iPhone (hash routing; every page change is a history entry).</li>\n<li><b>Excel keys in the grids</b>: Enter / Shift+Enter move down and up a column, Ctrl+D fills down from the cell above, Esc reverts the cell. Left/Right stay as caret movement and Tab is untouched, because every cell is a live input.</li>\n<li><b>The second exclusions picker</b> (the sheet&#x27;s Z/AA block) is in the app and feeds the same Exclusions line. The workbook&#x27;s <code>D39</code> formula skips <code>Z17</code>, so its first item could never be selected in Excel; the export repairs that formula only when that item is picked, leaving every other export byte-identical.</li>\n<li><b>The six OCIP enrollment answers</b> (applicant type, contract with, subcontract work, bid type, contract type, combined rate) are editable and written onto the exported OCIP form.</li>\n<li><b>Undo / Redo</b> (top bar, Ctrl+Z / Ctrl+Shift+Z): 40 steps of bid history, each labelled from the field that changed (&quot;Estimate Recap \u2014 Overhead &amp; Profit %&quot;). Import-override is pushed as an undo step, so replacing your saved bid with a file is reversible.</li>\n<li><b>Progress bar</b> on import/export with per-stage labels, yielding to the browser between stages so the tab never looks unresponsive.</li>\n</ul>\n<h3>Verification</h3>\n<p>A Node test harness rebuilt the original <i>The Dalles Adventist</i> bid from the workbook&#x27;s data and compared</p>\n<p>the engine&#x27;s output against Excel&#x27;s own cached results:</p>\n<ul>\n<li>All 9 blended crew rates (ST/OT/DT \u00d7 3 pools) \u2014 exact.</li>\n<li>Every TakeOff group subtotal and all row-7 grand totals \u2014 exact.</li>\n<li>MCAA RECAP: every intermediate (hours, labor value, GC lines, supervision, EMO, markups, tax, leveler) and <b>Total Bid $4,614,770.00 \u2014 exact</b>.</li>\n<li>OCIP premium worksheet (payrolls, WC, GL, deduct 17,163.44) \u2014 exact.</li>\n<li>All five permit jurisdiction totals (Portland 89,211.43 etc.) \u2014 exact.</li>\n<li>Bond ($39,018) \u2014 exact.</li>\n<li><b>All 2,400 Booking Report cells</b> (hours/labor/material \u00d7 8 divisions \u00d7 99 codes + totals) \u2014 exact.</li>\n<li>Price Breakdown allocations \u2014 exact.</li>\n</ul>\n<p>Spreadsheet round-trip (import the original workbook \u2192 export it back as <code>.xlsm</code>, run in the real app in a browser):</p>\n<ul>\n<li><b>0 formula differences and 0 value differences</b> across all 21 sheets vs the untouched original (every cell compared).</li>\n<li>185 of 197 zip parts byte-identical, including <code>vbaProject.bin</code> (all macros) and <code>styles.xml</code> (all formatting). The remaining parts differ only in machine encoding (shared-string vs inline-string storage, and the recalculate-on-open flag) \u2014 nothing visible or behavioral in Excel.</li>\n<li>Re-importing a browser-exported workbook parses to a bid identical to the one that produced it (verified field-by-field in the e2e suite).</li>\n</ul>";
const HOWTO_HTML = "<h2 style=\"margin-top:0\">How to use the Arctic Bid Tool</h2>\n<p>This is the same estimate you have always done. Same sheets, same order, same numbers \u2014</p>\n<p>it just runs in a browser instead of Excel.</p>\n<h3>First time on this computer</h3>\n<p>The first time you open the tool on a computer it asks for the <b>Arctic company file</b>.</p>\n<p>That file holds the wage and fringe tables, the payroll tax and workers-comp factors, the</p>\n<p>permit and bond rates and the estimate workbook. It is kept on the Arctic network, not on</p>\n<p>this website, because the website is on the public internet and those are our numbers.</p>\n<p>Drop the file on the setup screen. <b>You only do this once on each computer</b> \u2014 it is</p>\n<p>remembered from then on. Bids already saved on that computer are not touched.</p>\n<p>If someone changes the rates, you will be handed a new company file. Load it from</p>\n<p><b>Company Settings \u2192 Company file</b>. Same one-time drop, and it replaces the old one.</p>\n<h3>Getting your sheet metal takeoff in</h3>\n<p>This is the part the old spreadsheet never explained.</p>\n<p>**You do not create this file. Your takeoff program writes it for you, every time, to the</p>\n<p>same folder.** You do not need to save it, rename it, or put it anywhere. You just have to</p>\n<p>go and get it.</p>\n<h4>Step by step</h4>\n<ol>\n<li><b>Do your takeoff and run its export</b>, exactly the way you always have. That is what</li>\n<div class=\"licont\">writes the file.</div>\n<li><b>Open File Explorer</b> in Windows (the yellow folder on the taskbar).</li>\n<li><b>Click the white address bar</b> across the top and type this in, then press Enter:</li>\n</ol>\n<p>   <code>C:\\MAP-Software\\EST\\Exports</code></p>\n<p>   There is a <b>Copy folder path</b> button on the SM Import page that puts this on the</p>\n<p>   clipboard for you, so you can just paste it in.</p>\n<ol>\n<li><b>Find your file.</b> Which one depends on wh // ===== lib/pdf.js =====
// ---------- Minimal PDF writer (no dependencies) ----------
// Generates PDF 1.4 documents with Helvetica text, vector lines/rects,
// JPEG images, multi-page support, and a proper embedded-file attachment
// (bid JSON) so exported PDFs can be re-imported losslessly.

const PDF_FONTS = {
  helv: { base: 'Helvetica', widths: null },
  helvB: { base: 'Helvetica-Bold', widths: null },
  helvO: { base: 'Helvetica-Oblique', widths: null },
  helvBO: { base: 'Helvetica-BoldOblique', widths: null },
};

// Helvetica AFM widths (per 1000 units) for WinAnsi chars 32..255 (subset: 32..126 + common)
const HELV_W = [278,278,355,556,556,889,667,191,333,333,389,584,278,333,278,278,556,556,556,556,556,556,556,556,556,556,278,278,584,584,584,556,1015,667,667,722,722,667,611,778,722,278,500,667,556,833,722,778,667,778,722,667,611,722,667,944,667,667,611,278,278,278,469,556,333,556,556,500,556,556,278,556,556,222,222,500,222,833,556,556,556,556,333,500,278,556,500,722,500,500,500,334,260,334,584];
const HELV_BW = [278,333,474,556,556,889,722,238,333,333,389,584,278,333,278,278,556,556,556,556,556,556,556,556,556,556,333,333,584,584,584,611,975,722,722,722,722,667,611,778,722,278,556,722,611,833,722,778,667,778,722,667,611,722,667,944,667,667,611,333,278,333,584,556,333,556,611,556,611,556,333,611,611,278,278,556,278,889,611,611,611,611,389,556,333,611,556,778,556,556,500,389,280,389,584];

function textWidth(str, size, bold) {
  const W = bold ? HELV_BW : HELV_W;
  let w = 0;
  for (let i = 0; i < str.length; i++) {
    const c = str.charCodeAt(i);
    w += (c >= 32 && c <= 126) ? W[c - 32] : 556;
  }
  return w * size / 1000;
}

// Shorten a string with an ellipsis until it fits maxW points — prevents any
// cell from spilling into the next column (WinAnsi ellipsis renders correctly).
function pdfFit(txt, maxW, size, bold) {
  const t = String(txt);
  if (maxW <= 0 || textWidth(t, size, bold) <= maxW) return t;
  let lo = 0, hi = t.length;
  while (lo < hi) {
    const mid = (lo + hi + 1) >> 1;
    if (textWidth(t.slice(0, mid) + '…', size, bold) <= maxW) lo = mid; else hi = mid - 1;
  }
  return lo <= 0 ? '' : t.slice(0, lo) + '…';
}

function pdfEscape(s) {
  return String(s).replace(/\\/g, '\\\\').replace(/\(/g, '\\(').replace(/\)/g, '\\)')
    .replace(/[-￿]/g, ch => {
      // WinAnsi approximations for common chars
      const map = { '’': "'", '‘': "'", '“': '"', '”': '"', '–': '-', '—': '-', '•': '\\267', '·': '\\267', '°': '\\260', '→': '->', '−': '-', '☺': ':)', '☹': ':(', '×': 'x', '≤': '<=', '≥': '>=', '►': '>', '◄': '<', '▶': '>', '…': '\\205', '½': '\\275', '¼': '\\274', '¾': '\\276', '©': '\\251', '®': '\\256', '™': '\\231', 'é': '\\351', ' ': ' ' };
      return map[ch] !== undefined ? map[ch] : '?';
    });
}

class PdfDoc {
  constructor(opts = {}) {
    this.pageW = opts.landscape ? 792 : 612; // Letter
    this.pageH = opts.landscape ? 612 : 792;
    this.objs = [];       // array of {id, body(string) or raw stream parts}
    this.pages = [];      // page object ids
    this.images = {};     // key -> {id, w, h}
    this.attachments = []; // {name, bytes, id, specId}
    this.cur = null;      // current content stream (array of strings)
    this.curLandscape = false;
  }
  _alloc() { this.objs.push(null); return this.objs.length; } // ids are 1-based
  _set(id, body) { this.objs[id - 1] = body; }

  addPage(landscape) {
    const isL = landscape === undefined ? (this.pageW > this.pageH) : landscape;
    this.cur = [];
    this.pages.push({ content: this.cur, landscape: isL, imgs: new Set() });
    return this;
  }
  _target() { return this.pages[this._idx == null ? this.pages.length - 1 : this._idx]; }
  get pw() { const p = this._target(); return p && p.landscape ? 792 : 612; }
  get ph() { const p = this._target(); return p && p.landscape ? 612 : 792; }
  // Draw onto an earlier page (used to stamp footers once the page count is known)
  onPage(i, fn) {
    const prevCur = this.cur, prevIdx = this._idx;
    this.cur = this.pages[i].content; this._idx = i;
    try { fn(); } finally { this.cur = prevCur; this._idx = prevIdx; }
  }

  // y measured from TOP of page for convenience
  text(x, yTop, str, opts = {}) {
    const size = opts.size || 9;
    const font = (opts.bold && opts.italic) ? '/F4' : opts.bold ? '/F2' : (opts.italic ? '/F3' : '/F1');
    const y = this.ph - yTop;
    let tx = x;
    const w = textWidth(String(str), size, !!opts.bold);
    if (opts.align === 'right') tx = x - w;
    else if (opts.align === 'center') tx = x - w / 2;
    const col = opts.color || [0, 0, 0];
    this.cur.push(`BT ${font} ${size} Tf ${col[0]} ${col[1]} ${col[2]} rg 1 0 0 1 ${tx.toFixed(2)} ${(y - size * 0.8).toFixed(2)} Tm (${pdfEscape(str)}) Tj ET`);
    return w;
  }
  line(x1, y1, x2, y2, opts = {}) {
    const c = opts.color || [0, 0, 0];
    this.cur.push(`${(opts.width || 0.5).toFixed(2)} w ${c[0]} ${c[1]} ${c[2]} RG ${x1.toFixed(2)} ${(this.ph - y1).toFixed(2)} m ${x2.toFixed(2)} ${(this.ph - y2).toFixed(2)} l S`);
  }
  rect(x, yTop, w, h, opts = {}) {
    const y = this.ph - yTop - h;
    if (opts.fill) {
      const f = opts.fill;
      this.cur.push(`${f[0]} ${f[1]} ${f[2]} rg ${x.toFixed(2)} ${y.toFixed(2)} ${w.toFixed(2)} ${h.toFixed(2)} re f`);
    }
    if (opts.stroke !== false && (opts.stroke || !opts.fill)) {
      const s = Array.isArray(opts.stroke) ? opts.stroke : [0, 0, 0];
      this.cur.push(`${(opts.width || 0.5).toFixed(2)} w ${s[0]} ${s[1]} ${s[2]} RG ${x.toFixed(2)} ${y.toFixed(2)} ${w.toFixed(2)} ${h.toFixed(2)} re S`);
    }
  }
  // JPEG only (DCTDecode). bytes: Uint8Array; must know pixel dims.
  addJpeg(key, bytes, pxW, pxH) {
    if (this.images[key]) return;
    this.images[key] = { bytes, pxW, pxH };
  }
  image(key, x, yTop, w, h) {
    const p = this.pages[this.pages.length - 1];
    p.imgs.add(key);
    const y = this.ph - yTop - h;
    this.cur.push(`q ${w.toFixed(2)} 0 0 ${h.toFixed(2)} ${x.toFixed(2)} ${y.toFixed(2)} cm /Im_${key} Do Q`);
  }
  attach(name, str) {
    const bytes = typeof str === 'string' ? new TextEncoder().encode(str) : str;
    this.attachments.push({ name, bytes });
  }

  build() {
    const enc = new TextEncoder();
    const chunks = [];
    let pos = 0;
    const offsets = [];
    const push = (s) => { const b = typeof s === 'string' ? enc.encode(s) : s; chunks.push(b); pos += b.length; };

    // Object numbering plan:
    // 1 Catalog, 2 Pages, 3 F1, 4 F2, 5 F3, then per-image, per-attachment (stream+filespec), per-page (page+content), optional Names tree
    let nextId = 1;
    const catalogId = nextId++;
    const pagesId = nextId++;
    const f1 = nextId++, f2 = nextId++, f3 = nextId++, f4 = nextId++;
    const imgIds = {};
    for (const k of Object.keys(this.images)) imgIds[k] = nextId++;
    const attIds = this.attachments.map(() => ({ stream: nextId++, spec: nextId++ }));
    const pageIds = this.pages.map(() => ({ page: nextId++, content: nextId++ }));
    const namesId = this.attachments.length ? nextId++ : 0;

    push('%PDF-1.4\n%\xE2\xE3\xCF\xD3\n');
    const objects = [];
    const addObj = (id, bodyStr, streamBytes) => { objects.push({ id, bodyStr, streamBytes }); };

    addObj(catalogId, `<< /Type /Catalog /Pages ${pagesId} 0 R${namesId ? ` /Names << /EmbeddedFiles ${namesId} 0 R >>` : ''} >>`);
    addObj(pagesId, `<< /Type /Pages /Kids [${pageIds.map(p => p.page + ' 0 R').join(' ')}] /Count ${this.pages.length} >>`);
    addObj(f1, `<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>`);
    addObj(f2, `<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>`);
    addObj(f3, `<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Oblique /Encoding /WinAnsiEncoding >>`);
    addObj(f4, `<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-BoldOblique /Encoding /WinAnsiEncoding >>`);
    for (const [k, img] of Object.entries(this.images)) {
      addObj(imgIds[k], `<< /Type /XObject /Subtype /Image /Width ${img.pxW} /Height ${img.pxH} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${img.bytes.length} >>`, img.bytes);
    }
    this.attachments.forEach((att, i) => {
      addObj(attIds[i].stream, `<< /Type /EmbeddedFile /Subtype /application#2Fjson /Length ${att.bytes.length} >>`, att.bytes);
      addObj(attIds[i].spec, `<< /Type /Filespec /F (${pdfEscape(att.name)}) /UF (${pdfEscape(att.name)}) /EF << /F ${attIds[i].stream} 0 R >> >>`);
    });
    this.pages.forEach((p, i) => {
      const W = p.landscape ? 792 : 612, H = p.landscape ? 612 : 792;
      const xo = [...p.imgs].map(k => `/Im_${k} ${imgIds[k]} 0 R`).join(' ');
      addObj(pageIds[i].page, `<< /Type /Page /Parent ${pagesId} 0 R /MediaBox [0 0 ${W} ${H}] /Resources << /Font << /F1 ${f1} 0 R /F2 ${f2} 0 R /F3 ${f3} 0 R /F4 ${f4} 0 R >> ${xo ? `/XObject << ${xo} >>` : ''} >> /Contents ${pageIds[i].content} 0 R >>`);
      const content = enc.encode(p.content.join('\n'));
      addObj(pageIds[i].content, `<< /Length ${content.length} >>`, content);
    });
    if (namesId) {
      const pairs = this.attachments.map((a, i) => `(${pdfEscape(a.name)}) ${attIds[i].spec} 0 R`).join(' ');
      addObj(namesId, `<< /Names [ ${pairs} ] >>`);
    }

    objects.sort((a, b) => a.id - b.id);
    const xref = [];
    for (const o of objects) {
      xref[o.id] = pos;
      push(`${o.id} 0 obj\n${o.bodyStr}\n`);
      if (o.streamBytes) { push('stream\n'); push(o.streamBytes); push('\nendstream\n'); }
      push('endobj\n');
    }
    const xrefPos = pos;
    let x = `xref\n0 ${objects.length + 1}\n0000000000 65535 f \n`;
    for (let id = 1; id <= objects.length; id++) x += String(xref[id]).padStart(10, '0') + ' 00000 n \n';
    x += `trailer\n<< /Size ${objects.length + 1} /Root ${catalogId} 0 R >>\nstartxref\n${xrefPos}\n%%EOF`;
    push(x);

    const total = chunks.reduce((n, c) => n + c.length, 0);
    const out = new Uint8Array(total);
    let o = 0;
    for (const c of chunks) { out.set(c, o); o += c.length; }
    return out;
  }
}

// Extract an embedded JSON attachment from a PDF produced by PdfDoc (or any
// PDF with an /EmbeddedFile whose stream is raw JSON, no filter).
function pdfExtractJson(bytes) {
  const latin = new TextDecoder('latin1').decode(bytes);
  // find EmbeddedFile objects with Length
  const re = /\/Type\s*\/EmbeddedFile[^>]*?\/Length\s+(\d+)[^>]*?>>\s*stream\r?\n/g;
  let m;
  let fallback = null;
  while ((m = re.exec(latin))) {
    const start = m.index + m[0].length;
    const len = parseInt(m[1], 10);
    const raw = bytes.slice(start, start + len);
    try {
      const obj = JSON.parse(new TextDecoder('utf-8').decode(raw));
      if (obj && typeof obj === 'object') {
        // prefer an actual Arctic bid over any other embedded JSON
        if (obj.format === 'arctic-bid' || (obj.meta && obj.info && obj.takeoff)) return obj;
        if (!fallback) fallback = obj;
      }
    } catch (e) { /* keep scanning */ }
  }
  return fallback;
}


// ===== lib/zip.js =====
// ---------- Minimal ZIP writer/reader (STORE only, no compression deps) ----------
// Reader also handles DEFLATE entries via DecompressionStream when available
// (all modern desktop/iOS browsers), so zips from Finder/Explorer re-import too.

const CRC_TABLE = (() => {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++) {
    let c = n;
    for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    t[n] = c >>> 0;
  }
  return t;
})();
function crc32(bytes) {
  let c = 0xFFFFFFFF;
  for (let i = 0; i < bytes.length; i++) c = CRC_TABLE[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}

function zipCreate(files) { // files: [{name, bytes}]
  const enc = new TextEncoder();
  const chunks = [];
  const central = [];
  let offset = 0;
  const push = (b) => { chunks.push(b); offset += b.length; };
  const u16 = (v) => new Uint8Array([v & 255, (v >> 8) & 255]);
  const u32 = (v) => new Uint8Array([v & 255, (v >> 8) & 255, (v >> 16) & 255, (v >>> 24) & 255]);
  const dosTime = u16(0), dosDate = u16(0x5821); // fixed date to keep exports deterministic-ish

  for (const f of files) {
    const nameB = enc.encode(f.name);
    const data = f.bytes;
    const crc = crc32(data);
    const local = offset;
    push(new Uint8Array([0x50, 0x4B, 0x03, 0x04])); push(u16(20)); push(u16(0x0800)); push(u16(0)); // ver, utf8 flag, store
    push(dosTime); push(dosDate); push(u32(crc)); push(u32(data.length)); push(u32(data.length));
    push(u16(nameB.length)); push(u16(0)); push(nameB); push(data);
    central.push({ nameB, crc, size: data.length, local });
  }
  const cdStart = offset;
  for (const c of central) {
    push(new Uint8Array([0x50, 0x4B, 0x01, 0x02])); push(u16(20)); push(u16(20)); push(u16(0x0800)); push(u16(0));
    push(dosTime); push(dosDate); push(u32(c.crc)); push(u32(c.size)); push(u32(c.size));
    push(u16(c.nameB.length)); push(u16(0)); push(u16(0)); push(u16(0)); push(u16(0)); push(u32(0)); push(u32(c.local)); push(c.nameB);
  }
  const cdSize = offset - cdStart;
  push(new Uint8Array([0x50, 0x4B, 0x05, 0x06])); push(u16(0)); push(u16(0)); push(u16(central.length)); push(u16(central.length));
  push(u32(cdSize)); push(u32(cdStart)); push(u16(0));

  const total = chunks.reduce((n, c) => n + c.length, 0);
  const out = new Uint8Array(total);
  let o = 0;
  for (const c of chunks) { out.set(c, o); o += c.length; }
  return out;
}

async function zipRead(bytes) { // -> [{name, bytes}]
  const dv = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
  // find EOCD
  let eocd = -1;
  for (let i = bytes.length - 22; i >= Math.max(0, bytes.length - 65558); i--) {
    if (dv.getUint32(i, true) === 0x06054B50) { eocd = i; break; }
  }
  if (eocd < 0) throw new Error('Not a valid ZIP file');
  let count = dv.getUint16(eocd + 10, true);
  let p = dv.getUint32(eocd + 16, true);
  // zip64 sentinels: the app never writes these, but a Finder/Explorer zip might.
  if (count === 0xFFFF || p === 0xFFFFFFFF) {
    throw new Error('This ZIP uses the ZIP64 format, which this tool cannot read. Re-export from the tool, or import one of the PDFs inside it instead.');
  }
  const out = [];
  for (let i = 0; i < count; i++) {
    if (p + 46 > bytes.length || dv.getUint32(p, true) !== 0x02014B50) throw new Error('Bad or truncated ZIP central directory');
    const method = dv.getUint16(p + 10, true);
    const csize = dv.getUint32(p + 20, true);
    const usize = dv.getUint32(p + 24, true);
    const nlen = dv.getUint16(p + 28, true);
    const elen = dv.getUint16(p + 30, true);
    const clen = dv.getUint16(p + 32, true);
    const lho = dv.getUint32(p + 42, true);
    const name = new TextDecoder('utf-8').decode(bytes.slice(p + 46, p + 46 + nlen));
    // local header to find data start
    const lnlen = dv.getUint16(lho + 26, true);
    const lelen = dv.getUint16(lho + 28, true);
    const dataStart = lho + 30 + lnlen + lelen;
    const comp = bytes.slice(dataStart, dataStart + csize);
    let data;
    if (method === 0) data = comp;
    else if (method === 8) {
      if (typeof DecompressionStream === 'undefined') throw new Error('Compressed ZIP not supported in this browser');
      const ds = new DecompressionStream('deflate-raw');
      const stream = new Blob([comp]).stream().pipeThrough(ds);
      const buf = await new Response(stream).arrayBuffer();
      data = new Uint8Array(buf);
    } else throw new Error('Unsupported ZIP compression method ' + method);
    if (!name.endsWith('/')) out.push({ name, bytes: data });
    p += 46 + nlen + elen + clen;
  }
  return out;
}


// ===== lib/diff.js =====
// ---------- Bid diff engine ----------
// Compares two bid objects field-by-field and returns human-readable changes
// grouped by page. Labels come from a registry the app fills in (path prefix
// -> friendly names); unlabeled paths fall back to the raw path.

function isObj(v) { return v !== null && typeof v === 'object' && !Array.isArray(v); }

function flatten(obj, prefix, out) {
  if (obj === null || obj === undefined) return out;
  if (Array.isArray(obj)) {
    obj.forEach((v, i) => flatten(v, prefix + '[' + i + ']', out));
    out[prefix + '.length'] = obj.length;
  } else if (isObj(obj)) {
    for (const k of Object.keys(obj)) flatten(obj[k], prefix ? prefix + '.' + k : k, out);
  } else {
    out[prefix] = obj;
  }
  return out;
}

function eqVal(a, b) {
  if (typeof a === 'number' && typeof b === 'number') return Math.abs(a - b) < 1e-9;
  return a === b;
}

// returns [{path, kind:'changed'|'added'|'removed', from, to}]
function diffBids(oldBid, newBid, ignore) {
  const a = flatten(oldBid, '', {});
  const b = flatten(newBid, '', {});
  const ig = ignore || [];
  const skip = (p) => ig.some(rx => rx.test(p));
  const paths = new Set([...Object.keys(a), ...Object.keys(b)]);
  const out = [];
  for (const p of paths) {
    if (skip(p)) continue;
    const inA = p in a, inB = p in b;
    if (inA && inB) {
      if (!eqVal(a[p], b[p])) out.push({ path: p, kind: 'changed', from: a[p], to: b[p] });
    } else if (inA) {
      if (a[p] !== '' && a[p] !== 0 && a[p] !== null && a[p] !== false) out.push({ path: p, kind: 'removed', from: a[p], to: undefined });
    } else {
      if (b[p] !== '' && b[p] !== 0 && b[p] !== null && b[p] !== false) out.push({ path: p, kind: 'added', from: undefined, to: b[p] });
    }
  }
  out.sort((x, y) => x.path < y.path ? -1 : 1);
  return out;
}


// ===== parts/03_company.js =====
// ============================================================
// Company file — the rates and the workbook, kept out of the published page
// ============================================================
// The app is published on the open internet, so it ships with NO company data
// in it. Wages, fringes, PT&I, workers-comp factors, permit tiers, bond
// brackets, OCIP rates and the estimate workbook all live in a single company
// file that Arctic keeps on its own network. Each computer loads that file once
// and it is remembered in the browser (IndexedDB — localStorage is too small
// for the 1.9 MB workbook).

const COMPANY_DB = 'arctic.company';
const COMPANY_STORE = 'file';
const COMPANY_KEY = 'current';

function companyDb() {
  return new Promise((resolve, reject) => {
    const rq = indexedDB.open(COMPANY_DB, 1);
    rq.onupgradeneeded = () => rq.result.createObjectStore(COMPANY_STORE);
    rq.onsuccess = () => resolve(rq.result);
    rq.onerror = () => reject(rq.error);
  });
}
function companyLoadStored() {
  return companyDb().then(db => new Promise((resolve, reject) => {
    const rq = db.transaction(COMPANY_STORE, 'readonly').objectStore(COMPANY_STORE).get(COMPANY_KEY);
    rq.onsuccess = () => resolve(rq.result || null);
    rq.onerror = () => reject(rq.error);
  })).catch(() => null);
}
function companySaveStored(rec) {
  return companyDb().then(db => new Promise((resolve, reject) => {
    const tx = db.transaction(COMPANY_STORE, 'readwrite');
    tx.objectStore(COMPANY_STORE).put(rec, COMPANY_KEY);
    tx.oncomplete = () => resolve(true);
    tx.onerror = () => reject(tx.error);
  }));
}
function companyForget() {
  return companyDb().then(db => new Promise((resolve) => {
    const tx = db.transaction(COMPANY_STORE, 'readwrite');
    tx.objectStore(COMPANY_STORE).delete(COMPANY_KEY);
    tx.oncomplete = () => resolve(true);
    tx.onerror = () => resolve(false);
  })).catch(() => false);
}

// Put a loaded company file into play. Accepts the .arctic file (a zip holding
// company_data.json and the workbook) or a bare company_data.json.
async function companyApply(bytes) {
  const buf = bytes instanceof Uint8Array ? bytes : new Uint8Array(bytes);
  let dataJson = null, workbook = null;
  if (buf[0] === 0x50 && buf[1] === 0x4B) {                 // a zip
    const entries = await zipRead(buf);
    const dj = entries.find(e => /company_data\.json$/i.test(e.name));
    const wb = entries.find(e => /\.xlsm$/i.test(e.name));
    if (!dj) throw new Error('this file has no company_data.json in it');
    dataJson = new TextDecoder().decode(dj.bytes);
    workbook = wb ? wb.bytes : null;
  } else {
    dataJson = new TextDecoder().decode(buf);               // a bare json
  }
  let parsed;
  try { parsed = JSON.parse(dataJson); } catch (e) { throw new Error('the company data in that file is not readable'); }
  if (!parsed || !parsed.crew || !parsed.recap) throw new Error('that does not look like the Arctic company file');
  COMPANY = parsed;
  TEMPLATE_BYTES = workbook;
  _templateParts = null;                                    // a new workbook means a new template
  return { data: dataJson, workbook, loadedAt: new Date().toISOString() };
}

// Load + remember, so this only happens once per computer.
async function companyInstall(bytes) {
  const rec = await companyApply(bytes);
  try { await companySaveStored(rec); } catch (e) { toast('Loaded, but this browser would not remember it — you may have to load it again next time.', true); }
  return rec;
}

// Boot path: the remembered file, or a copy handed to us by a test.
async function companyRestore() {
  if (typeof ARCTIC_COMPANY_FILE !== 'undefined' && ARCTIC_COMPANY_FILE) {
    await companyApply(ARCTIC_COMPANY_FILE);
    return { loadedAt: null, injected: true };
  }
  const rec = await companyLoadStored();
  if (!rec) return null;
  try {
    COMPANY = JSON.parse(rec.data);
    TEMPLATE_BYTES = rec.workbook || null;
    return rec;
  } catch (e) { return null; }
}

// ---- the screen you see before the company file has been loaded ----

        'network, not on this website — that is why it is not already here.'),

// ===== parts/06_fmt.js =====
// ============================================================
// Number formatting (mirrors the workbook's cell formats)
// ============================================================

const fmt = {
  money(v, dec = 2) {
    if (v === null || v === undefined || v === '' || isNaN(v)) return '';
    const n = Number(v);
    const s = Math.abs(n).toLocaleString('en-US', { minimumFractionDigits: dec, maximumFractionDigits: dec });
    return n < 0 ? '($' + s + ')' : '$' + s;
  },
  num(v, dec = 2) {
    if (v === null || v === undefined || v === '' || isNaN(v)) return '';
    return Number(v).toLocaleString('en-US', { minimumFractionDigits: dec, maximumFractionDigits: dec });
  },
  hrs(v) { return this.num(v, 2); },
  int(v) { return this.num(v, 0); },
  pct(v, dec = 1) {
    if (v === null || v === undefined || v === '' || isNaN(v)) return '';
    return (Number(v) * 100).toLocaleString('en-US', { minimumFractionDigits: dec, maximumFractionDigits: dec }) + '%';
  },
  date(iso) {
    if (!iso) return '';
    const d = new Date(iso);
    if (isNaN(d)) return String(iso);
    return (d.getMonth() + 1) + '/' + d.getDate() + '/' + d.getFullYear();
  },
  dateTime(iso) {
    if (!iso) return '';
    const d = new Date(iso);
    if (isNaN(d)) return String(iso);
    return this.date(iso) + ' ' + d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
  },
  // parse user numeric input: strip $ , % and spaces; '' -> null
  parseNum(str) {
    if (str === null || str === undefined) return null;
    const s = String(str).replace(/[$,%\s]/g, '');
    if (s === '') return null;
    const n = Number(s);
    return isNaN(n) ? null : n;
  },
};

// SpellNumber — faithful port of the workbook's VBA Functions.SpellNumber.
// Quirks reproduced on purpose so the printed proposal matches the spreadsheet
// character for character: GetTens keeps a trailing space on 20/30/.../90, which
// is why 4,614,770 spells "...Seven Hundred Seventy  Dollars" (two spaces); zero
// cents reads " and No Cents"; an empty dollar part reads "No Dollars".
function spellNumber(amount) {
  const getDigit = (d) => ['', 'One', 'Two', 'Three', 'Four', 'Five', 'Six', 'Seven', 'Eight', 'Nine'][Number(d) || 0] || '';
  const getTens = (txt) => {
    const s = String(txt);
    if (Number(s[0]) === 1) {                     // 10..19
      return ['Ten', 'Eleven', 'Twelve', 'Thirteen', 'Fourteen', 'Fifteen', 'Sixteen', 'Seventeen', 'Eighteen', 'Nineteen'][Number(s.slice(0, 2)) - 10] || '';
    }
    const t = ['', '', 'Twenty ', 'Thirty ', 'Forty ', 'Fifty ', 'Sixty ', 'Seventy ', 'Eighty ', 'Ninety '][Number(s[0]) || 0] || '';
    return t + getDigit(s.slice(-1));             // trailing space survives when ones = 0
  };
  const getHundreds = (num) => {
    if (!Number(num)) return '';
    const s = ('000' + num).slice(-3);
    let out = '';
    if (s[0] !== '0') out = getDigit(s[0]) + ' Hundred ';
    out += s[1] !== '0' ? getTens(s.slice(1)) : getDigit(s[2]);
    return out;
  };
  const place = ['', '', ' Thousand ', ' Million ', ' Billion ', ' Trillion '];
  // VBA: MyNumber = Trim(Str(MyNumber)) — Str() prints no trailing zeros
  let my = String(Math.abs(Number(amount) || 0));
  let cents = '';
  const dot = my.indexOf('.');
  if (dot >= 0) {
    cents = getTens((my.slice(dot + 1) + '00').slice(0, 2));
    my = my.slice(0, dot);
  }
  let dollars = '', count = 1;
  while (my !== '') {
    const temp = getHundreds(my.slice(-3));
    if (temp !== '') dollars = temp + (place[count] || '') + dollars;
    my = my.length > 3 ? my.slice(0, -3) : '';
    count++;
  }
  dollars = dollars === '' ? 'No Dollars' : dollars === 'One' ? 'One Dollar' : dollars + ' Dollars';
  cents = cents === '' ? ' and No Cents' : cents === 'One' ? ' and One Cent' : ' and ' + cents + ' Cents';
  return dollars + cents;
}

// ===== parts/09_core.js =====
// ============================================================
// Core: storage, router, app state, helpers
// ============================================================

const $ = (sel, el) => (el || document).querySelector(sel);
const $$ = (sel, el) => Array.from((el || document).querySelectorAll(sel));
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function el(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  if (attrs) for (const [k, v] of Object.entries(attrs)) {
    if (k === 'class') e.className = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (k === 'html') e.innerHTML = v;
    else if (v !== null && v !== undefined) e.setAttribute(k, v);
  }
  for (const k of kids.flat()) {
    if (k === null || k === undefined) continue;
    e.append(k.nodeType ? k : document.createTextNode(k));
  }
  return e;
}

function toast(msg, bad) {
  $$('.toast').forEach(t => t.remove());
  const t = el('div', { class: 'toast' + (bad ? ' bad' : '') }, msg);
  document.body.append(t);
  setTimeout(() => t.remove(), bad ? 6000 : 3200);
}

// Progress overlay for work that takes long enough to notice (reading a workbook,
// building a spreadsheet, writing a stack of PDFs). step() awaits a paint, which
// both moves the bar and hands the main thread back so the tab never looks hung.
const nextPaint = () => new Promise(r => requestAnimationFrame(() => requestAnimationFrame(() => setTimeout(r, 0))));

function progressStart(title) {
  $$('.prog-back').forEach(x => x.remove());
  const fill = el('div', { class: 'fill indet' });
  const stage = el('div', { class: 'stage' }, 'Starting…');
  const pct = el('div', { class: 'pct' }, '');
  const back = el('div', { class: 'prog-back' },
    el('div', { class: 'prog' }, el('h4', {}, title), el('div', { class: 'track' }, fill), stage, pct));
  document.body.append(back);
  let done = false;
  return {
    // frac: 0..1, or null to keep the indeterminate sweep
    async step(frac, label) {
      if (done) return;
      if (label) stage.textContent = label;
      if (frac == null) { fill.classList.add('indet'); pct.textContent = ''; }
      else {
        fill.classList.remove('indet');
        const p = Math.max(0, Math.min(1, frac));
        fill.style.width = (p * 100).toFixed(0) + '%';
        pct.textContent = (p * 100).toFixed(0) + '%';
      }
      await nextPaint();
    },
    done() { done = true; back.remove(); },
  };
}

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
function deepClone(o) { return JSON.parse(JSON.stringify(o)); }

// path get/set: "recap.mods.plumb[2].pct"
function pathGet(obj, path) {
  const parts = path.replace(/\[(\d+)\]/g, '.$1').split('.');
  let cur = obj;
  for (const p of parts) { if (cur == null) return undefined; cur = cur[p]; }
  return cur;
}
let LAST_EDIT_PATH = null;      // used to label undo steps
function pathSet(obj, path, val) {
  if (obj === (typeof app !== 'undefined' && app ? app.bid : null)) LAST_EDIT_PATH = path;
  const parts = path.replace(/\[(\d+)\]/g, '.$1').split('.');
  let cur = obj;
  for (let i = 0; i < parts.length - 1; i++) {
    if (cur[parts[i]] == null) cur[parts[i]] = /^\d+$/.test(parts[i + 1]) ? [] : {};
    cur = cur[parts[i]];
  }
  cur[parts[parts.length - 1]] = val;
}

// ---------- storage ----------
const store = {
  KEY_INDEX: 'arctic.bids.index',
  KEY_BID: (id) => 'arctic.bid.' + id,
  KEY_SETTINGS: 'arctic.settings.overrides',
  KEY_ACTIVE: 'arctic.activeBid',

  index() { try { return JSON.parse(localStorage.getItem(this.KEY_INDEX)) || []; } catch (e) { return []; } },
  saveIndex(ix) { localStorage.setItem(this.KEY_INDEX, JSON.stringify(ix)); },
  loadBid(id) { try { return JSON.parse(localStorage.getItem(this.KEY_BID(id))); } catch (e) { return null; } },
  saveBid(bid) {
    // stamp the bid's own total when it is the open, freshly-computed bid
    if (app.bid && app.bid.meta.id === bid.meta.id && app.computed && app.computed.recap) {
      bid.meta.lastTotal = app.computed.recap.totalBid;
    }
    bid.meta.savedAt = new Date().toISOString();
    try {
      localStorage.setItem(this.KEY_BID(bid.meta.id), JSON.stringify(bid));
      const prev = this.index().find(x => x.id === bid.meta.id);
      const ix = this.index().filter(x => x.id !== bid.meta.id);
      ix.unshift({
        id: bid.meta.id, estNo: bid.info.estNo, jobName: bid.info.jobName, rev: bid.meta.rev,
        savedAt: bid.meta.savedAt,
        total: bid.meta.lastTotal ?? (prev ? prev.total : 0) ?? 0,
      });
      this.saveIndex(ix);
    } catch (e) {
      // quota exceeded or storage disabled — never fail silently
      toast('SAVE FAILED — browser storage is full or blocked. Export this bid to a file NOW so you do not lose work, then delete old bids from Home.', true);
      throw e;
    }
  },
  deleteBid(id) {
    localStorage.removeItem(this.KEY_BID(id));
    this.saveIndex(this.index().filter(x => x.id !== id));
    if (localStorage.getItem(this.KEY_ACTIVE) === id) localStorage.removeItem(this.KEY_ACTIVE);
  },
  settingsOverrides() { try { return JSON.parse(localStorage.getItem(this.KEY_SETTINGS)) || {}; } catch (e) { return {}; } },
  saveSettingsOverrides(o) { localStorage.setItem(this.KEY_SETTINGS, JSON.stringify(o)); },
};

// Effective settings = factory defaults + user overrides (flat path map)
function effectiveSettings() {
  const s = deepClone(COMPANY);
  const ov = store.settingsOverrides();
  for (const [path, val] of Object.entries(ov)) pathSet(s, path, val);
  return s;
}

// ---------- app state ----------
const UNDO_LIMIT = 40;

const app = {
  bid: null,          // active bid (mutable)
  computed: null,     // engine output
  settings: null,     // effective settings used for the active bid
  dirty: false,
  saveTimer: null,
  undoStack: [],      // [{json, label}] states BEFORE each change, oldest first
  redoStack: [],
  snapshot: null,     // serialized current bid, taken at the last settled state

  // Called whenever a bid becomes the active one (open / new / import / undo)
  resetHistory() {
    this.undoStack = []; this.redoStack = [];
    this.snapshot = this.bid ? JSON.stringify(this.bid) : null;
    this.syncUndoButtons();
  },
  pushUndo() {
    if (!this.bid) return;
    const now = JSON.stringify(this.bid);
    if (this.snapshot === null) { this.snapshot = now; return; }
    if (this.snapshot === now) return;                  // nothing actually changed
    this.undoStack.push({ json: this.snapshot, label: undoLabel(LAST_EDIT_PATH) });
    if (this.undoStack.length > UNDO_LIMIT) this.undoStack.shift();
    this.redoStack = [];                               // a new edit invalidates redo
    this.snapshot = now;
    this.syncUndoButtons();
  },
  _restore(json) {
    this.bid = migrateBid(JSON.parse(json));
    this.snapshot = JSON.stringify(this.bid);
    this.dirty = true;
    this.recalc();
    this.saveNow(true);
    router.render();
    this.syncUndoButtons();
  },
  undo() {
    if (!this.undoStack.length) { toast('Nothing to undo'); return; }
    const step = this.undoStack.pop();
    this.redoStack.push({ json: this.snapshot, label: step.label });
    this._restore(step.json);
    toast('Undid ' + (step.label || 'last change'));
  },
  redo() {
    if (!this.redoStack.length) { toast('Nothing to redo'); return; }
    const step = this.redoStack.pop();
    this.undoStack.push({ json: this.snapshot, label: step.label });
    this._restore(step.json);
    toast('Redid ' + (step.label || 'last change'));
  },
  syncUndoButtons() {
    const u = $('#btnUndo'), r = $('#btnRedo');
    if (u) {
      u.disabled = !this.undoStack.length;
      const last = this.undoStack[this.undoStack.length - 1];
      u.title = last ? 'Undo ' + last.label + '  (Ctrl+Z)' : 'Nothing to undo  (Ctrl+Z)';
    }
    if (r) {
      r.disabled = !this.redoStack.length;
      const last = this.redoStack[this.redoStack.length - 1];
      r.title = last ? 'Redo ' + last.label + '  (Ctrl+Shift+Z)' : 'Nothing to redo  (Ctrl+Shift+Z)';
    }
  },

  recalc() {
    if (!this.bid) return;
    this.settings = this.bid.settingsSnapshot || effectiveSettings();
    this.computed = calcBid(this.bid, this.settings);
    const t = $('#topTotal');
    if (t) t.textContent = fmt.money(this.computed.recap.totalBid);
  },
  touch() {                     // input changed: recalc + autosave (debounced)
    if (!this.bid) return;
    this.pushUndo();
    this.dirty = true;
    this.recalc();
    clearTimeout(this.saveTimer);
    this.saveTimer = setTimeout(() => { this.saveNow(); }, 400);
  },
  saveNow(force) {
    if (!this.bid) return;
    if (!this.dirty && !force) return;               // never write a stale copy (multi-tab safety)
    // detect another tab having saved this bid since we loaded/saved it
    const stored = store.loadBid(this.bid.meta.id);
    if (stored && stored.meta.savedAt && stored.meta.savedAt !== this.baseSavedAt) {
      if (!confirm('This bid was also changed in another tab or window.\n\nOK = keep THIS tab’s version (overwrites the other tab’s save)\nCancel = discard this tab’s unsaved changes and reload the other version')) {
        const fresh = migrateBid(stored);
        this.bid = fresh; this.dirty = false; this.baseSavedAt = stored.meta.savedAt;
        this.recalc(); router.render();
        return;
      }
    }
    store.saveBid(this.bid);
    this.baseSavedAt = this.bid.meta.savedAt;
    this.dirty = false;
  },
};

// ---------- router (hash-based so Back works everywhere incl. iPhone) ----------
const router = {
  routes: {},            // name -> {title, render, needsBid}
  current: null,
  go(name, opts) {
    const target = '#/' + name;
    if (location.hash !== target) location.hash = target;  // pushes history entry
    else this.render();
  },
  render() {
    // Nothing can be priced, imported or exported without the company file, and
    // the sidebar is still on screen while the setup card is showing — so the gate
    // has to live HERE, not only in boot(). Clicking a link or changing the hash
    // used to render a real page with no rates behind it, and the first thing that
    // read a rate died with an error nobody could act on.
    if (!COMPANY) {
      $('#pageTitle').textContent = 'Setup';
      $('#bidName').innerHTML = '<b>Setup needed</b>Load the Arctic company file';
      $$('#sidebar nav a').forEach(a => a.classList.remove('active'));
      renderCompanySetup(() => location.reload());
      return;
    }
    let name = (location.hash || '#/home').replace(/^#\//, '') || 'home';
    let route = this.routes[name];
    if (!route) { name = 'home'; route = this.routes.home; }
    if (route.needsBid && !app.bid) { name = 'home'; route = this.routes.home; }
    const samePage = this.current === name;
    const keepX = window.scrollX, keepY = window.scrollY;
    this.current = name;
    $$('#sidebar nav a').forEach(a => a.classList.toggle('active', a.dataset.page === name));
    $('#pageTitle').textContent = route.title(!!app.bid);
    const v = $('#view');
    v.innerHTML = '';
    route.render(v);
    fitInputs(v);                                  // size inputs to their text (no clipped values)
    if (samePage) window.scrollTo(keepX, keepY);   // re-render in place: keep scroll
    else { v.scrollTop = 0; window.scrollTo(0, 0); }
    const bn = $('#bidName');
    if (app.bid) {
      bn.innerHTML = '<b>' + esc(app.bid.info.estNo || 'No Est #') + ' — Rev ' + esc(app.bid.meta.rev) + '</b>' + esc(app.bid.info.jobName || 'Untitled job');
    } else bn.innerHTML = '<b>No bid open</b>Open or create one from Home';
  },
};
window.addEventListener('hashchange', () => router.render());
// Flush the focused field (change only fires on blur), then save if dirty.
function flushAndSave() {
  const a = document.activeElement;
  if (a && a.blur && a !== document.body) a.blur();
  app.saveNow();
}
window.addEventListener('pagehide', flushAndSave);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') flushAndSave(); });

function migrateBid(bid) {
  const fresh = makeNewBid(effectiveSettings());
  const merge = (dst, src) => {
    for (const k of Object.keys(src)) {
      if (dst[k] === undefined) dst[k] = src[k];
      else if (dst[k] && typeof dst[k] === 'object' && !Array.isArray(dst[k]) && src[k] && typeof src[k] === 'object' && !Array.isArray(src[k])) merge(dst[k], src[k]);
    }
  };
  merge(bid, fresh);                      // fill any fields added since the bid was saved
  bid.schema = BID_SCHEMA;
  if (!bid.meta.id) bid.meta.id = uid();
  return bid;
}
